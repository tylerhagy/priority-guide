<!doctype html>
<meta charset="utf-8">
<title>priority guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#16181d; --dim:#6b7280; --faint:#9aa1ac;
  --line:rgba(16,18,22,.11); --hover:rgba(16,18,22,.05);
  --bg:#f6f7f9; --panel:#fff; --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --ok:#177245; --warn:#9a6700; --none:#8a8f98; --flag:#b8541f; --act:#b3261e;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
#bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
#bar .brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#bar .file{color:var(--dim);white-space:nowrap;max-width:28ch;cursor:pointer;padding:4px 8px;
  border-radius:7px;display:flex;align-items:center;gap:6px}
#bar .file span{overflow:hidden;text-overflow:ellipsis}
#bar .file svg{color:var(--faint);flex:none}
#bar .file:hover svg{color:var(--ink)}
#bar .file:hover{background:var(--hover);color:var(--ink)}
#bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--dim);font-size:12.5px;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--dim);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.on:hover{background:var(--ink);filter:brightness(1.35)}
.btn.primary{background:var(--accent);color:#fff}
.btn.save{display:inline-flex;align-items:center;gap:6px}
.btn.save svg{color:var(--ok)}
.btn.save[disabled]{opacity:1;color:var(--faint)}
.btn.save .dot{width:6px;height:6px;border-radius:99px;background:#fff;opacity:.9;flex:none}
.btn.save .kbd{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.count{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:600;color:var(--flag)}
.count.clear b{color:var(--ok)}
.quiet{color:var(--faint);font-size:12px}
.quiet:hover{color:var(--dim);text-decoration:underline}

/* ---------- banners ---------- */
#banners{position:sticky;top:52px;z-index:5}
.banner{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
.banner.err{background:#fdf1ef;color:#8a2d16}
.banner.warn{background:#fdf8ec;color:#7a5b00}
.banner.info{background:#eef4ff;color:#1b3f8f}
.banner b{font-weight:600}
.banner code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.banner button{margin-left:10px;text-decoration:underline}

/* ---------- layout ---------- */
main{height:calc(100% - 52px);display:flex;overflow:hidden}
#railL{width:214px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px 10px 40px}
#railR{width:296px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#midrow{flex:1;display:flex;min-height:0;min-width:0}

/* ---------- where you are in a long guide ----------
   A column beside the guide, holding the guide itself at a size you can take in
   at a glance. It is a picture, not a diagram: the same shapes in the same
   places, so what you recognise on the page you recognise here. Quiet until you
   look at it, because it is for orienting, not for reading. */
/* The column is margin, not a panel. A guide is wider than it is tall, so a
   true-to-scale picture of one is short — and a full-height rail around a short
   picture reads as an empty container with something stranded at the top. */
#minimap{flex:none;width:124px;position:relative;overflow:hidden;cursor:pointer;
  user-select:none;background:transparent;padding-left:6px}
.mshotwrap{position:absolute;inset:0;overflow:hidden;opacity:.4;
  transition:opacity .14s var(--ease)}
/* The extent of the guide, so the picture reads as one document. */
.mshotwrap:before{content:"";position:absolute;left:6px;right:2px;
  top:var(--paper-top,0);height:var(--paper,0);
  background:var(--panel);border:1px solid var(--line);border-radius:3px}
#minimap:hover .mshotwrap{opacity:.78}
.mshot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
/* Inset to the same edges as the picture, so the band reads as being on the
   document rather than across the column. */
.mview{position:absolute;left:6px;right:2px;background:rgba(37,99,235,.11);
  border-top:1px solid rgba(37,99,235,.45);border-bottom:1px solid rgba(37,99,235,.45);
  pointer-events:none;min-height:10px}
#minimap:hover .mview{background:rgba(37,99,235,.2)}
body.present #minimap,body.is-paired #minimap{display:none}
#stage{flex:1;overflow-y:auto;padding:22px 30px 40px;min-width:0}
.wrap{max-width:760px;margin:0 auto}

/* ---------- page header: which guide, always ---------- */
#pagehead{flex:none;padding:16px 30px 12px;border-bottom:1px solid var(--line);
  background:var(--panel)}
#pagehead .headline{display:flex;align-items:center;gap:8px}
#pagehead h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25;
  padding:2px 6px;margin-left:-6px;border-radius:7px;min-width:2ch}
#pagehead .nav{color:var(--dim);padding:4px;border-radius:8px;display:flex}
#pagehead .nav:hover{background:var(--hover);color:var(--ink)}
#pagehead .nav[disabled]{opacity:.25;pointer-events:none}
#pagehead .count{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;margin-left:2px}
#pagehead h1:hover{background:var(--hover)}
#pagehead h1:focus{outline:none;background:var(--accent-soft)}
#pagehead .sub{margin-top:4px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
#pagehead .sub .who{color:var(--ink)}
#pagehead .sub .dot{color:var(--faint)}
#pagehead .sub .open{color:var(--flag);font-weight:500}

/* ---------- the palette: the one place you drag from ---------- */
#palette{flex:none;display:flex;align-items:center;gap:6px;padding:10px 24px;
  border-top:1px solid var(--line);background:var(--panel);overflow-x:auto}
#palette .lbl{color:var(--faint);font-size:11.5px;white-space:nowrap;margin-right:6px;flex:none}
.ptool{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;
  font-weight:500;white-space:nowrap;cursor:grab;user-select:none;flex:none}
.ptool:hover{color:var(--ink);border-color:var(--dim);background:var(--hover)}
.ptool svg{color:var(--faint)}
.ptool:hover svg{color:var(--ink)}
.ptool.lifting{opacity:.4;cursor:grabbing}

/* Where it will land. */
.cell.dropbefore{box-shadow:inset 0 3px 0 var(--accent)}
.cell.dropafter{box-shadow:inset 0 -3px 0 var(--accent)}
.cell.lifting{opacity:.35}
.cell.tail{min-height:18px}
.tailhint{height:10px}
body.dragging .item{cursor:grabbing}

/* ---------- bottom toolbar: the creator tools ---------- */
body.present #railL,body.present #railR,body.present #palette{display:none}
body.present #pagehead{padding:22px 30px 16px}
body.present #stage{padding:30px 30px 90px}
body.present{font-size:15px}
body.present .sec-title{font-size:15.5px}

/* ---------- left rail: guides ---------- */
.rail-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:0 8px 7px}
.g-item{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--dim);line-height:1.35;position:relative;cursor:pointer}
.g-item:hover{background:var(--hover);color:var(--ink)}
.g-item.on{background:var(--accent-soft);color:var(--ink)}
.g-item .n{font-weight:500;display:block;padding:1px 3px;margin-left:-3px;border-radius:4px}
.g-item .n:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.gmore{position:absolute;right:5px;top:5px;padding-left:12px;
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.g-item.on .gmore{background:linear-gradient(90deg,transparent,#e7edfb 40%)}
.g-item.dragging{opacity:.4}
.g-item.dropat{box-shadow:inset 0 2px 0 var(--accent)}
.g-item.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.g-item .m{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.g-item.on .m{color:var(--dim)}
.g-item .m .o{color:var(--flag);font-weight:600}
.rail-add{margin-top:6px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--faint);font-size:12.5px}
.rail-add:hover{background:var(--hover);color:var(--ink)}

.g-title{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;
  font-size:11px;font-weight:500;white-space:nowrap;background:var(--hover);color:var(--dim)}
.pill.dead{background:rgba(184,84,31,.12);color:var(--flag)}

/* ---------- the guide: three lanes ----------
   The middle is the guide itself — what each thing is called, and what its data
   actually looks like. Notes annotate it from the left, functionality from the
   right, each on a dotted leader to the one row it describes. */
.guide{--lane-l:264px; --stack:340px; --lane-r:270px;
  display:grid;grid-template-columns:var(--lane-l) var(--stack) var(--lane-r);
  margin:0 auto;width:max-content;max-width:100%}
body.present .guide{--lane-l:300px; --stack:400px; --lane-r:320px}

/* Every row is a grid row so an annotation lines up with the one item it
   annotates. The stack reads as one continuous column because each middle cell
   carries the side borders and the ends carry the caps. */
.cell{grid-column:2;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);
  background:var(--panel);padding:0 10px;display:flex;flex-direction:column}
.cell.top{border-top:1.5px solid var(--ink);padding-top:10px}
.cell.bot{border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.cell.gap{height:10px}
.band{background:var(--hover);padding:0 12px;flex:1;display:flex;flex-direction:column}
.band.open{padding-top:9px;border-radius:2px 2px 0 0}
.band.close{padding-bottom:9px;border-radius:0 0 2px 2px}
.band > *{margin-bottom:6px}
.band.close > *:last-child{margin-bottom:0}
.lane{display:flex;align-items:flex-start;min-height:1px;position:relative}
.lane-l{grid-column:1;justify-content:flex-end}
.lane-r{grid-column:3}
.lead{flex:none;width:20px;border-top:1px dotted var(--faint);margin-top:12px}

/* ---------- one row in the stack ---------- */
.item{padding:2px 0;position:relative}
.item .box{cursor:grab;border:1px solid var(--ink);background:var(--panel);border-radius:2px;
  padding:3px 8px;display:flex;align-items:center;gap:7px;min-height:24px}
.boxin{flex:1;min-width:0}
.item.plain .box,.item.linky .box{border-color:transparent;background:transparent;padding-left:2px}
.item.linky .lbl{text-decoration:underline;text-underline-offset:2px}

/* A visual stands for something that will take up room on the screen, so it
   takes up room here. Reading the stack should tell you its shape. */
.item.visual .box{border-style:dashed;color:var(--dim);min-height:74px;padding:12px;gap:11px;
  background:repeating-linear-gradient(-45deg,transparent,transparent 7px,
    rgba(16,18,22,.022) 7px,rgba(16,18,22,.022) 14px)}
.item.visual .kindmark{color:var(--faint)}
.item.visual.chart .box{min-height:86px}
.item.visual .lbl{font-weight:500}
.lbl{flex:1;min-width:0;font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;
  padding:1px 3px;margin-left:-3px;border-radius:4px}
.lbl:hover{background:rgba(16,18,22,.06)}
.lbl:focus{outline:none;background:var(--accent-soft)}
.lbl .unk{color:var(--flag);font-weight:500}
.eg{font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:2px;padding:1px 4px;
  margin-left:-1px;border-radius:4px;overflow-wrap:anywhere}
.eg:hover{background:rgba(16,18,22,.06)}
.eg:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.eg.none{color:var(--faint);font-style:italic}
.eg.unk{color:var(--flag);font-weight:500;font-style:normal}
.item .chev{flex:none;color:var(--dim)}
.rowsel .box{outline:2px solid var(--accent);outline-offset:1px}
.drag .item{opacity:.35}
.over .item{box-shadow:0 -2px 0 var(--accent)}
.over-b .item{box-shadow:0 2px 0 var(--accent)}
.flag{font-size:10.5px;color:var(--flag);line-height:1.4;margin-top:3px;padding-left:2px}

/* ---------- notes, on the left ---------- */
.notes{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:1;min-width:0}
.note{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:3px 7px;font-size:11px;line-height:1.4;color:var(--dim);
  display:flex;gap:6px;align-items:flex-start;max-width:100%}
.note.act{border-color:rgba(179,38,30,.35);background:rgba(179,38,30,.05);color:var(--act)}
.nbody{min-width:0;flex:1;padding-right:2px}
.note .t{min-width:0;padding:0 2px;border-radius:3px}
.note .t:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.note .k{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--act);margin-bottom:1px}
.note .gl{flex:none;color:var(--faint);margin-top:1px}
.note.act .gl{color:var(--act)}
.note{position:relative}
/* Inside the card and out of flow: reachable without crossing a gap, and
   revealing them still cannot reflow the note or the row. */
.note .tools{position:absolute;right:2px;top:2px;display:flex;gap:1px;padding-left:10px;
  opacity:0;pointer-events:none;transition:opacity .1s var(--ease);
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.note.act .tools{background:linear-gradient(90deg,transparent,#fdf3f2 40%)}
.note:hover .tools,.note:focus-within .tools{opacity:1;pointer-events:auto}
.note .tools button{color:var(--faint);font-size:11px;line-height:1;padding:1px 3px;border-radius:4px}
.note .tools button:hover{color:var(--ink);background:var(--hover)}
.note a{color:var(--accent)}
/* In the row's own flow, under it: it can never sit on top of what it belongs to. */
.rowstrip{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;padding-top:5px;
  border-top:1px dashed var(--line)}
.sbtn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
  padding:4px 8px;border-radius:7px;white-space:nowrap;line-height:1}
.sbtn:hover{color:var(--ink);background:rgba(16,18,22,.07)}
.sbtn svg{color:var(--faint)}
.sbtn:hover svg{color:var(--ink)}
.sbtn.kind{color:var(--ink);font-weight:500}
.sbtn .caret{color:var(--faint);font-size:9px}
.sbtn.danger:hover{color:var(--act);background:rgba(179,38,30,.09)}
.sbtn.danger:hover svg{color:var(--act)}

/* ---------- what a lane holds, said once at the top ---------- */
.lanehead{grid-column:2;height:26px}
.lanelbl{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding:0 4px 8px}
.lane-l .lanelbl{text-align:right;width:100%}

/* An empty lane still shows what belongs in it. */
.slot,.fn.asslot{display:inline-flex;align-items:center;gap:0;font-size:10.5px;
  color:var(--faint);padding:3px;border-radius:7px;border:1px dashed var(--line);
  background:transparent;white-space:nowrap;line-height:1;cursor:pointer;opacity:.45;
  transition:opacity .1s var(--ease),color .1s var(--ease),border-color .1s var(--ease)}
.slot svg,.fn.asslot svg{color:var(--faint);flex:none}
.slot span,.fn.asslot span{max-width:0;overflow:hidden;transition:max-width .12s var(--ease),
  margin .12s var(--ease)}
.lane:hover .slot,.lane:hover .fn.asslot,.rowsel .slot,.rowsel .fn.asslot{opacity:1;padding:3px 8px}
.lane:hover .slot span,.lane:hover .fn.asslot span,
.rowsel .slot span,.rowsel .fn.asslot span{max-width:14ch;margin-left:5px}
.slot:hover,.fn.asslot:hover{color:var(--ink);border-color:var(--dim)}
.slot:hover svg,.fn.asslot:hover svg{color:var(--ink)}
.fn.asslot{flex-direction:row;text-align:left}
.lanemore{opacity:0;display:inline-flex;padding:2px 5px;border-radius:6px;color:var(--faint);
  border:1px dashed var(--line);transition:opacity .1s var(--ease)}
.lane-l:hover .lanemore,.rowsel .lanemore{opacity:.8}
.lanemore:hover{opacity:1;color:var(--ink);border-color:var(--dim)}

/* ---------- a divider is a rule and nothing else ---------- */
.item.divider{padding:8px 0}
.item.divider .rule{border-top:1px solid var(--ink);opacity:.35}
.item .kindmark{color:var(--dim);flex:none}
.item.visual .box{align-items:flex-start}

/* ---------- one overflow button, everywhere ---------- */
.more{color:var(--faint);padding:3px;border-radius:6px;display:flex;align-items:center;
  opacity:0;transition:opacity .1s var(--ease)}
.more:hover,.more.open{color:var(--ink);background:rgba(16,18,22,.09)}
.more.open{opacity:1}
.g-item:hover .more,.g-item:focus-within .more,
.cell.sechead:hover .more,.item:hover .more,.rowsel .more{opacity:1}
.secmore{position:absolute;right:10px;top:8px}
.cell.sechead{position:relative}
.menu{width:236px;padding:5px;display:flex;flex-direction:column;gap:1px}
.mitem{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border-radius:8px}
.mitem:hover,.mitem:focus-visible{background:var(--hover);outline:none}
.mitem > div{flex:1;min-width:0}
.mitem svg{color:var(--dim);margin-top:1px;flex:none}
.mitem .n{font-size:12.5px;line-height:1.35}
.mitem .h{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.mitem[disabled]{opacity:.35;pointer-events:none}
.mitem.danger .n{color:var(--act)}
.mitem.danger svg{color:var(--act)}
.mitem.danger:hover{background:rgba(179,38,30,.08)}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- what a block is ---------- */
.pop-h{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);grid-column:1/-1;margin-bottom:1px}
.pop-h + *{margin-top:0}
.kindpop{width:296px}
.kindpop .pop-h{margin:10px 0 5px}
.kindpop .pop-h:first-child{margin-top:0}
.kinds{display:flex;flex-direction:column;gap:1px}
.kindopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px}
.kindopt:hover{background:var(--hover)}
.kindopt.on{background:var(--accent-soft)}
.kindopt > div{flex:1;min-width:0}
.kindopt svg{color:var(--dim);margin-top:1px;flex:none}
.kindopt.on svg{color:var(--accent)}
.kindopt .n{font-size:12.5px;font-weight:500}
.kindopt .b{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.charts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.chartopt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;
  border-radius:8px;font-size:9.5px;color:var(--dim);line-height:1.25;text-align:center;
  min-height:56px;justify-content:center}
.chartopt:hover{background:var(--hover);color:var(--ink)}
.chartopt.on{background:var(--accent-soft);color:var(--accent)}
.chartopt svg{color:currentColor}

/* ---------- choosing what a reference points at ---------- */
.refpop{width:300px}
.refpop input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.refpop .pop-h{margin:11px 0 5px}
.refpop .pop-h:first-child{margin-top:0}
.reflist{max-height:210px;overflow-y:auto;margin-top:5px;display:flex;flex-direction:column;gap:1px}
.refopt{width:100%;text-align:left;padding:6px 8px;border-radius:8px}
.refopt:hover{background:var(--hover)}
.refopt.on{background:var(--accent-soft)}
.refopt .n{font-size:12.5px;font-weight:500}

.ref{position:relative}
.band.guidelevel{background:transparent;padding-top:2px;padding-bottom:2px}

.band.guidelevel .ref{margin:0 0 2px}
.ref.unset{color:var(--faint);border-style:dashed}
.ref[role=button]{cursor:pointer}
.ref[role=button]:hover{border-color:var(--dim);color:var(--ink)}

  padding:1px 4px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.ref:hover .refx{opacity:1}
.refx:hover{color:var(--act);background:rgba(179,38,30,.1)}
/* A brand-new note is a field, not a hairline. */
.note.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);min-width:190px}
.note.fresh .t{min-height:32px}

/* ---------- functionality, on the right ---------- */
.fn{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink);

.fn{cursor:pointer}
.fn:hover{border-color:var(--dim)}
.fn a.tgt:hover{text-decoration:underline}
.fn .l{display:flex;gap:6px;align-items:flex-start}
.fn .l svg{flex:none;color:var(--dim);margin-top:1px}
.fn .l b{font-weight:500}
.fn .tgt{color:var(--accent)}
.fn .tgt.dead{color:var(--flag)}
.fn .req{color:var(--act);font-weight:600}
.fn .caps{color:var(--dim);font-size:11px;letter-spacing:.01em}


/* ---------- functionality popover ---------- */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.14);padding:12px}
.fnpop{width:266px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px 9px;
  align-items:center}
.pop label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint)}
.pop select,.pop input{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.pop .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pop .hint{grid-column:2;font-size:10.5px;color:var(--faint);line-height:1.35}
.pop .foot{grid-column:1/-1;display:flex;justify-content:flex-end;padding-top:2px}
.tog{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:500;color:var(--dim);
  background:var(--hover)}
.tog:hover{color:var(--ink)}
.tog.on{background:var(--ink);color:var(--panel)}
.tog.act.on{background:var(--act)}

/* ---------- sections in the stack ---------- */
.sec-title{font-size:12.5px;font-weight:500;text-align:center;margin:0;padding:2px 6px;
  border-radius:5px}
.sec-title:hover{background:rgba(16,18,22,.06)}
.sec-title:focus{outline:none;background:var(--accent-soft)}
.sec-note{font-size:11px;color:var(--dim);text-align:center;font-style:italic;line-height:1.4;
  padding:2px 6px;border-radius:5px}
.blurb{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}
.sec-note:hover{background:rgba(16,18,22,.06)}
.sec-note:focus{outline:none;background:var(--accent-soft);font-style:normal;color:var(--ink)}
.sec-note.none{color:var(--faint)}
.sub{border-top:1px solid var(--line);margin-top:3px;padding-top:8px}
.sub-t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);text-align:center;padding:1px 4px;border-radius:4px}
.sub-t:focus{outline:none;background:var(--accent-soft)}
.ref{border:1px dashed var(--line);border-radius:2px;padding:7px 10px;font-size:11.5px;
  color:var(--dim);text-align:center;line-height:1.45}
.ref:focus{outline:none;background:var(--accent-soft)}
.raw-table{white-space:pre;overflow-x:auto;font:10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--faint);background:var(--panel);border-radius:4px;padding:6px 8px}


/* ---------- right panel ---------- */
#railR .ptabs{flex:none;display:flex;gap:1px;padding:10px 10px 0;border-bottom:1px solid var(--line)}
/* One line of text per tab, always. A count that wraps under its label lifts
   that label off the baseline the others sit on, and four tabs stop reading as
   one row. It goes beside the word instead, where it is read as part of it. */
#railR .ptabs button{display:flex;align-items:baseline;gap:4px;white-space:nowrap;
  padding:6px 8px;border-radius:7px 7px 0 0;color:var(--dim);font-size:12.5px;
  font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
#railR .ptabs button .n{font-size:10.5px;font-weight:600;color:var(--faint);
  font-variant-numeric:tabular-nums}
#railR .ptabs button:hover{color:var(--ink)}
#railR .ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#railR .ptabs button.on .n{color:var(--dim)}
#railR .pbody{flex:1;overflow-y:auto;padding:14px 14px 40px}
.ctx{margin-bottom:15px}
.ctx-h{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.ctx-h .lb{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint)}
.ctx-h .info{color:var(--faint);display:flex;padding:1px;border-radius:4px}
.ctx-h .info:hover{color:var(--ink);background:var(--hover)}
.ctx-add{margin-left:auto;font-size:11.5px;color:var(--faint);padding:1px 5px;border-radius:5px}
.ctx-add:hover{color:var(--ink);background:var(--hover)}
.means{font-size:11.5px;line-height:1.5;color:var(--dim);background:var(--hover);
  border-radius:7px;padding:7px 9px;margin-bottom:5px}
.ctx-empty{font-size:12.5px;color:var(--faint);font-style:italic;line-height:1.5;padding:3px 0}
.ctx-empty.unknown{color:var(--flag);font-style:normal;font-weight:500}
.gnotes{display:flex;flex-direction:column;gap:4px}
.gnote{position:relative;background:var(--hover);border-radius:8px;padding:6px 24px 6px 9px;
  font-size:12.5px;line-height:1.5}
.gnote .t{border-radius:4px}
.gnote .t:focus{outline:none;background:var(--accent-soft)}
.gnote .x{position:absolute;right:5px;top:4px;color:var(--faint);font-size:13px;line-height:1;
  padding:1px 3px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.gnote:hover .x{opacity:1}
.gnote .x:hover{color:var(--act);background:rgba(179,38,30,.1)}
.ctx dt{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);margin-bottom:2px}
.ctx dd{margin:0;font-size:12.5px;line-height:1.5;padding:3px 6px;margin-left:-6px;border-radius:7px}
.ctx dd:hover{background:var(--hover)}
.ctx dd:focus{outline:none;background:var(--accent-soft)}
.ctx dd.unknown{color:var(--flag);font-weight:500}
.ctx dd.empty{color:var(--faint);font-style:italic}
.ctx dd a{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--hover);
  border-radius:6px;padding:2px 5px 2px 8px;color:var(--ink)}

.chip .x{color:var(--faint);font-size:13px;line-height:1;padding:0 1px}
.chip .x:hover{color:var(--act)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--faint);padding:2px 8px}
.chip.add:hover{color:var(--ink);border-color:var(--dim)}
.chip input{background:transparent;border:0;color:inherit;width:13ch;outline:none;font-size:11.5px}
.chip .nm{border-radius:4px;padding:0 2px;margin:0 -2px}
.chip .nm:focus{outline:none;background:var(--panel);color:var(--ink)}
.addfield{margin-top:8px;font-size:11.5px}
.addfield button{color:var(--faint);margin-right:12px}
.addfield button:hover{color:var(--ink);text-decoration:underline}
.linkrow{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;
  font-size:12.5px;line-height:1.45}
.linkrow:hover{background:var(--hover)}
.linkrow .n{font-weight:500;color:var(--accent)}
.linkrow .m{color:var(--faint);font-size:11.5px;display:block;margin-top:1px}

/* ---------- comments: working material, switchable off ---------- */
#comments{display:inline-flex;align-items:center;gap:5px}

#comments .n:empty{display:none}
.bubble{display:inline-flex;align-items:center;gap:3px;flex:none;padding:1px 4px;border-radius:6px;
  font-size:10px;font-weight:600;color:var(--faint);line-height:1;margin-left:2px}
.bubble svg{color:currentColor}
.bubble:hover{background:rgba(16,18,22,.08);color:var(--ink)}
.bubble.has{color:var(--flag);background:rgba(184,84,31,.12)}
.bubble.done{color:var(--ok)}
.bubble.none{opacity:0}
.item:hover .bubble.none,.rowsel .bubble.none{opacity:.5}
.item:hover .bubble.none:hover{opacity:1}
.thread{width:296px;display:block}
.tlist{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;margin:5px 0 9px}
.tc{display:flex;align-items:flex-start;gap:7px;padding:6px 7px;border-radius:8px;
  background:var(--hover);font-size:12.5px;line-height:1.5}
.tc.done{opacity:.55}
.tc.done .t{text-decoration:line-through}
.tc .t{flex:1;min-width:0;border-radius:4px;padding:0 2px}
.tc .t:focus{outline:none;background:var(--panel)}
.tc .tick{flex:none;color:var(--faint);padding:1px;border-radius:5px;display:flex;margin-top:1px}
.tc .tick:hover{color:var(--ink);background:rgba(16,18,22,.08)}
.tc .tick.on{color:var(--ok)}
.tc .x{flex:none;color:var(--faint);font-size:14px;line-height:1;padding:0 3px;border-radius:4px;
  opacity:0;transition:opacity .1s var(--ease)}
.tc:hover .x{opacity:1}
.tc .x:hover{color:var(--act);background:rgba(179,38,30,.1)}
.tnew{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:12.5px;resize:vertical;min-height:44px;line-height:1.45}
.tnew:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tfoot{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:7px}
.tfoot .hint{font-size:11px;color:var(--faint)}

/* ---------- asked in the app, never by the browser ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(16,18,22,.28);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade .12s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--panel);border-radius:14px;padding:20px;width:400px;max-width:100%;
  box-shadow:0 16px 50px rgba(0,0,0,.22)}

  background:var(--panel);font-size:13.5px;margin-bottom:14px}

.dfoot{display:flex;justify-content:flex-end;gap:8px}
.dfoot .btn{padding:7px 14px;border-radius:9px}
.dfoot .btn:not(.primary):not(.danger){background:var(--hover);color:var(--ink)}
.dfoot .btn.danger{background:var(--act);color:#fff}

/* ---------- what just happened, and how to take it back ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:30;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);
  color:#fff;font-size:12.5px;padding:8px 10px 8px 14px;border-radius:10px;
  box-shadow:0 6px 24px rgba(0,0,0,.24);animation:rise .14s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast.going{opacity:0;transition:opacity .4s var(--ease)}
.toast button{color:#9dc0ff;font-weight:500;padding:2px 4px;border-radius:5px}
.toast button:hover{color:#fff;background:rgba(255,255,255,.14)}
.toast .x{color:rgba(255,255,255,.5);font-size:15px;line-height:1}

/* ---------- capture ---------- */
#cap{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);
  border-top:1px solid var(--line);padding:12px 30px;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
#cap .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
#cap input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
#cap .where{font-size:12px;color:var(--faint);white-space:nowrap}
#cap .tally{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- right rail: sources ---------- */
.src{padding:9px 10px;border-radius:9px;margin-bottom:2px}
.src:hover{background:var(--hover)}
.src .h{font-weight:500;display:flex;align-items:baseline;gap:6px}
.src .h .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto}
.src .t{font-size:12.3px;color:var(--dim);line-height:1.4;margin-top:1px}
.src .u{font-size:11.5px;color:var(--faint);word-break:break-all;margin-top:2px;display:block}
.src.bad .h{color:var(--flag)}
.src .cites{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.5}
.rail-empty{color:var(--faint);font-size:12.5px;padding:6px 10px;line-height:1.5}

.srcform{padding:8px 10px;background:var(--hover);border-radius:9px;margin:4px 0 8px}
.srcform input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);margin-bottom:5px;font-size:12.5px}
.srcform-foot{display:flex;gap:8px;align-items:center;margin-top:2px}
.src .h{align-items:center}
.src .title{font-weight:500;text-align:left}
.src .x{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;padding:0 3px}
.src .x:hover{color:var(--act)}
.src .quiet{margin-top:4px;display:block}

/* ---------- design ---------- */
.dcard{padding:9px 10px;border-radius:9px;margin-bottom:4px;border:1px solid var(--line);
  position:relative;background:var(--panel)}
.dcard:hover{border-color:var(--dim)}
.dcard.lifting{opacity:.4}
.dcard.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.dcard.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.dcard .h{display:flex;align-items:center;gap:6px}
.dcard .grip{color:var(--faint);display:flex;cursor:grab;flex:none;margin-left:-3px}
.dcard:hover .grip{color:var(--dim)}
.dcard .title{font-weight:500;text-align:left;flex:1;min-width:0;padding:1px 3px;
  margin-left:-3px;border-radius:4px;color:var(--ink)}
.dcard .title:hover{background:var(--hover)}
.dcard .title:focus{outline:none;background:var(--accent-soft)}
.dcard .x{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;padding:0 3px;
  border-radius:4px}
.dcard .x:hover{color:var(--act);background:rgba(179,38,30,.1)}
.dcard .u{font-size:11.5px;color:var(--faint);word-break:break-all;display:block;margin-top:2px;
  text-align:left;padding:0}
.dcard .u:hover{color:var(--accent)}
.sidebyside{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;
  color:var(--accent);padding:4px 8px;border-radius:7px;background:var(--accent-soft);
  font-weight:500}
.sidebyside:hover{filter:brightness(.96)}
.sidebyside svg{color:currentColor}

/* ---------- the guide and what it became, on one screen ---------- */
.beside{display:grid;grid-template-columns:minmax(0,564px) minmax(0,1fr);
  gap:14px;height:100%;min-height:0}
.bside{display:flex;flex-direction:column;min-height:0;min-width:0;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
.bhead{flex:none;display:flex;align-items:baseline;gap:9px;padding:9px 13px;
  border-bottom:1px solid var(--line)}
.bhead .n{font-weight:600;font-size:13px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .m{font-size:11.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
.bback{color:var(--dim);padding:2px;border-radius:6px;display:flex;transform:rotate(90deg)}
.bback:hover{color:var(--ink);background:var(--hover)}
.bscroll{flex:1;overflow:auto;min-height:0;padding:14px 10px 24px}
/* Three lanes at full width are wider than half a screen, so the copy beside
   the design is drawn tighter. It is the same guide, read at arm's length. */
/* No cap here: on a window too narrow for the lanes the pane scrolls rather
   than cutting the functionality off the right-hand edge. */
.bscroll .guide{--lane-l:150px; --stack:232px; --lane-r:158px;font-size:12px;max-width:none}
.bscroll .lbl{font-size:11.5px}
.bscroll .eg,.bscroll .note,.bscroll .fn{font-size:10.5px}
.bscroll .sec-title{font-size:11.5px}
.bscroll .sec-note{font-size:10px}
.bscroll .lanelbl{font-size:8.5px}
.bscroll .item.visual .box{min-height:56px}
.bscroll .item.visual.chart .box{min-height:64px}
.bframe{flex:1;border:0;width:100%;min-height:0;background:var(--bg)}
body.is-paired #stage{padding:16px 20px;overflow:hidden}

/* ---------- users ---------- */
.usr{margin:0 0 26px}
.usr-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:4px}
.usr-h .n{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.usr-h .m{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.usr-h .btn{margin-left:auto}
#userbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--accent-soft);
  border-bottom:1px solid var(--line);font-size:12.5px}
#userbar b{font-weight:600}

/* ---------- flow ---------- */
#flow{width:100%;overflow:auto}
#flow svg{display:block}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1}
.node.on rect{stroke:var(--accent);stroke-width:2}
.node:hover rect{fill:var(--hover)}
.node text{font-size:12.5px;font-weight:500;fill:var(--ink)}
.node text.m{font-size:11px;fill:var(--faint);font-weight:400}
.node text.o{font-size:11px;fill:var(--flag);font-weight:600}
.edge{fill:none;stroke:rgba(16,18,22,.26);stroke-width:1.5}
.edge.hot{stroke:var(--accent);stroke-width:2}
.edge.ref{stroke-dasharray:5 4;stroke:rgba(16,18,22,.20)}
.elabel{font-size:10.5px;fill:var(--faint)}

/* ---------- open items ---------- */
.oi{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;
  border-bottom:1px solid var(--line)}
.oi:hover{background:var(--hover)}
.oi .t{font-weight:500}
.oi.act .t{color:var(--act)}
.oi.unk .t{color:var(--flag)}
.oi .w{font-size:12px;color:var(--faint);margin-top:2px}
.done{padding:40px 0;text-align:center;color:var(--ok);font-size:15px;font-weight:500}
.done span{display:block;color:var(--faint);font-size:12.5px;font-weight:400;margin-top:5px}

/* ---------- source view ---------- */
.raw-table{white-space:pre;overflow-x:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--dim);background:var(--hover);border-radius:8px;padding:10px 12px;margin:10px 0}

  background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:18px 20px;
  overflow-x:auto;color:var(--ink)}

/* ---------- empty state ---------- */
.hello{max-width:520px;margin:14vh auto 0;text-align:center}

  border-radius:5px;padding:2px 6px;margin:0 2px}

<div id="banners"></div>
<div id="toasts"></div>
<main>
  <div id="railL"></div>
  <div id="mid">
    <div id="pagehead"></div>
    <div id="midrow">
      <div id="stage"></div>
      <div id="minimap"></div>
    </div>
    <div id="palette"></div>
  </div>
  <div id="railR"></div>
</main>
<div id="cap" hidden>
  <div class="in">
    <span class="where" id="capWhere"></span>
    <input id="capIn" placeholder="What does this screen need?" autocomplete="off" spellcheck="false">
    <span class="tally" id="capTally"></span>
    <button class="btn" id="capDone">Done</button>
  </div>
</div>

<script type="module">
import {
  parseDocument, serializeDocument, verifyRoundTrip,
  guides, findGuide, tablesOf, rowsOf, allRows, countRows,
  openItems, links, backlinks, unreachable, sourceUsage, resolveSource,
  lintRow, addRow, touchRow, moveRow, moveSection, setField,
  addSection, addGuide, addSource, blankGuidesFile,
  parseContentCell, renderContentCell, parseCapabilities, renderCapabilities,
  parseLinkCell, renderLinkCell, parseFormCell, renderFormCell,
  parseNoteCell, renderNoteCell,
  parseUsers, renderUsers, userTypes, renameUserType, handleFor, isWebUrl, refsIn, hasAction,
  moveGuide, placeGuide, removeGuide, setKind, CHART_KINDS, BLOCK_KINDS,
  guideRefs, addGuideRef, setGuideRef, removeGuideRef,
  designLinks, figmaEmbed, isFigma, setSourceTitle,
  commentsFor, commentList, openComments, addComment, setComment, resolveComment,
  removeComment, commentTarget, ensureRid,
  proseOf, setProse,
  LINK_TYPES, FORM_TYPES, CAPABILITIES, GUIDE_FIELDS
} from './parser.js';

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

const FIELD_LABELS = {
  type: 'Type', userGoal: 'User goal', businessGoal: 'Business goal',
  primaryUsers: 'Primary users', notes: 'Notes', sources: 'Sources'
};
// A blank is not the same as ??. Blank means the question does not apply here;
// ?? means nobody has been asked. Neither is ever normalised into the other.
const FIELD_PLACEHOLDER = {
  type: 'Screen', userGoal: 'What is someone trying to get done here?',
  businessGoal: 'Why does the business want this screen to work?',
  primaryUsers: 'Who uses it, and who uses it most?',
  notes: 'Screen-wide context only', sources: 'Cite a source with [handle]'
};

const S = {
  dir: null, files: [], file: null, originalText: '', doc: null,
  readOnly: false, dirty: false,
  guide: null, sel: null, editing: null,
  view: 'guide', present: false, capture: false, captured: 0,
  userFilter: null, shownField: null
};

// ---------------------------------------------------------------- storage
const DB = 'priority-guide';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const t = db.transaction('kv').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result);
      t.onerror = () => res(undefined);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  // Never let a storage failure break the thing the user actually asked for.
  // Remembering the folder is a convenience; opening it is the job.
  try {
    const db = await idb();
    await new Promise((res) => {
      const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => res(); t.onsuccess = () => res();
    });
  } catch { /* not persistable in this context */ }
}
/** Ten-deep backup ring, so a bad save is always recoverable. */
async function backup(name, text) {
  const ring = (await kvGet('backups')) || [];
  ring.unshift({ name, text, at: new Date().toISOString() });
  await kvSet('backups', ring.slice(0, 10));
}

// ---------------------------------------------------------------- undo
/**
 * Deleting is one click, and always recoverable.
 *
 * A confirm box asks a question the answer to which is nearly always yes, and
 * makes the common case cost two clicks to protect against the rare one. Undo
 * inverts that: the common case is instant, and the rare mistake is one click
 * back. It also means nothing in this app needs a browser dialog.
 */
function undoable(label, undo) {
  S.undo = { label, undo, at: Date.now() };
  toast(`${label} deleted`, 'Undo', () => {
    const u = S.undo;
    S.undo = null;
    if (u) u.undo();
    mark(); render();
  });
}

/** A quiet line that says what happened and how to take it back. */
function toast(text, actionLabel, action) {
  const host = $('toasts');
  host.innerHTML = '';
  const t = el('div', 'toast');
  t.appendChild(el('span', null, text));
  if (actionLabel) {
    const b = el('button', null, actionLabel);
    b.onclick = () => { t.remove(); action(); };
    t.appendChild(b);
  }
  const x = el('button', 'x', '×');
  x.title = 'Dismiss';
  x.onclick = () => t.remove();
  t.appendChild(x);
  host.appendChild(t);
  setTimeout(() => { if (t.isConnected) t.classList.add('going'); }, 7000);
  setTimeout(() => t.remove(), 7400);
  return t;
}

// ---------------------------------------------------------------- dialogs
/**
 * The one question the app genuinely has to ask — your copy or the one on
 * disk — asked inside the app, in the app's own language. A browser dialog
 * would be the only thing here that does not look like the rest of it.
 */
function ask({ title, body, choices }) {
  return new Promise((resolve) => {
    const back = el('div', 'scrim');
    const bail = () => {
      back.remove(); S.scrim = null;
      const c = choices.find((x) => x.cancel);
      resolve(c ? c.value : null);
    };
    S.scrim = bail;
    const box = el('div', 'dialog');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('h2', null, title));
    if (body) box.appendChild(el('p', null, body));
    const foot = el('div', 'dfoot');
    choices.forEach((c, i) => {
      const b = el('button', 'btn' + (c.primary ? ' primary' : c.danger ? ' danger' : ''), c.label);
      b.onclick = () => { back.remove(); S.scrim = null; resolve(c.value); };
      foot.appendChild(b);
      if (i === choices.length - 1) setTimeout(() => b.focus(), 0);
    });
    box.appendChild(foot);
    back.appendChild(box);
    back.onmousedown = (e) => { if (e.target === back) bail(); };
    box.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Escape') bail(); };
    document.body.appendChild(back);
  });
}

/** A single line of text, asked in the app rather than by the browser. */
function askText({ title, body, placeholder, value, action }) {
  return new Promise((resolve) => {
    const back = el('div', 'scrim');
    const done = (v) => { back.remove(); S.scrim = null; resolve(v); };
    S.scrim = () => done(null);
    const box = el('div', 'dialog');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('h2', null, title));
    if (body) box.appendChild(el('p', null, body));
    const inp = el('input');
    inp.type = 'text';
    inp.placeholder = placeholder || '';
    inp.value = value || '';
    box.appendChild(inp);
    const foot = el('div', 'dfoot');
    const cancel = el('button', 'btn', 'Cancel');
    const ok = el('button', 'btn primary', action || 'Add');
    cancel.onclick = () => done(null);
    ok.onclick = () => done(inp.value.trim() || null);
    foot.append(cancel, ok);
    box.appendChild(foot);
    back.appendChild(box);
    back.onmousedown = (e) => { if (e.target === back) done(null); };
    box.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter') { e.preventDefault(); done(inp.value.trim() || null); }
    };
    document.body.appendChild(back);
    // After the click that opened it has finished with the button it came from.
    requestAnimationFrame(() => { inp.focus(); inp.select(); });
  });
}

// ---------------------------------------------------------------- banners
function banner(kind, html, sticky) {
  const n = el('div', 'banner ' + kind);
  n.innerHTML = html;
  if (!sticky) {
    const x = el('button', null, 'dismiss');
    x.onclick = () => n.remove();
    n.appendChild(x);
  }
  $('banners').appendChild(n);
  return n;
}
const clearBanners = () => { $('banners').innerHTML = ''; };

// ---------------------------------------------------------------- file access
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.dir = dir;
    await loadFolder();
    await kvSet('folder', dir);   // after, so a storage failure cannot block opening
  } catch (e) {
    if (e.name !== 'AbortError') banner('err', `<b>Could not open that folder.</b> ${esc(e.message)}`);
  }
}

async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

async function loadFolder() {
  clearBanners();
  S.files = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.md')) S.files.push({ name, handle: h });
  }
  S.files.sort((a, b) => a.name.localeCompare(b.name));

  for (const f of S.files) {
    try {
      const text = await (await f.handle.getFile()).text();
      const d = parseDocument(text);
      f.blocks = countRows(d);
      f.guides = guides(d).length;
    } catch { f.blocks = 0; f.guides = 0; }
  }

  const real = S.files.filter((f) => f.blocks > 0);
  if (!S.files.length) {
    banner('warn', '<b>No markdown files here.</b> Point priority guide at a folder holding a guides file.', true);
    render(); return;
  }
  if (real.length === 1) return openFile(real[0]);
  if (!real.length) {
    banner('warn', '<b>No guides here.</b> These files read fine but hold no content blocks.', true);
  }
  render();
}

async function openFile(f) {
  clearBanners();
  const text = await (await f.handle.getFile()).text();
  const rt = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = parseDocument(text);
  S.readOnly = !rt.ok; S.dirty = false; S.sel = null; S.editing = null;
  S.guide = guides(S.doc)[0] || null;
  S.captured = 0;

  if (!rt.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip, `
      + `so priority guide will not write to it. First difference at line <code>${rt.line}</code>.<br>`
      + `in the file <code>${esc(rt.expected)}</code><br>parsed back <code>${esc(rt.produced)}</code>`, true);
  } else if (!S.guide) {
    banner('warn', '<b>No guides in this file.</b> It reads fine, but there are no <code>##</code> guide headings.', true);
  }
  // Two guides with the same name make every route to that name ambiguous.
  const seen = new Set();
  const dupes = [];
  for (const g of guides(S.doc)) {
    const k = g.name.toLowerCase();
    if (seen.has(k)) dupes.push(g.name); else seen.add(k);
  }
  if (dupes.length) {
    banner('warn', `<b>Two guides share a name.</b> Every route to `
      + dupes.map((d) => `<code>${esc(d)}</code>`).join(', ')
      + ' lands on the first one. Rename one of them.', true);
  }
  render();
}

// ---------------------------------------------------------------- save
async function save() {
  if (!S.file || S.readOnly) return;
  // Flush an inline edit that is still focused; leave any open picker alone.
  const a = document.activeElement;
  if (a && a.isContentEditable) a.blur();
  if (!(await ensureWritable(S.file.handle))) {
    banner('err', '<b>Write permission was declined.</b> Chrome needs <b>Edit files</b> for this folder.');
    return;
  }
  const onDisk = await (await S.file.handle.getFile()).text();
  if (onDisk !== S.originalText) {
    const keep = await ask({
      title: 'This file changed on disk',
      body: 'Something else edited it since you opened it — Obsidian, most likely. '
        + 'Keep your version, or throw yours away and take what is on disk?',
      choices: [
        { label: 'Reload from disk', value: false, cancel: true },
        { label: 'Keep mine', value: true, primary: true }
      ]
    });
    if (keep === null) return;
    if (!keep) return openFile(S.file);
  }
  const text = serializeDocument(S.doc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save.</b> The output does not round-trip (line ${rt.line}). Nothing was written.`);
    return;
  }
  await backup(S.file.name, S.originalText);
  const w = await S.file.handle.createWritable();
  await w.write(text); await w.close();

  // Re-parse our own bytes so the model can never drift from the file.
  const keepName = S.guide ? S.guide.name : null;
  const keepSel = S.sel ? renderContentCell(S.sel.content) : null;
  S.originalText = text;
  S.doc = parseDocument(text);
  S.guide = (keepName && findGuide(S.doc, keepName)) || guides(S.doc)[0] || null;
  S.sel = null;
  if (keepSel && S.guide) {
    const hit = rowsOf(S.guide).find((r) => renderContentCell(r.row.content) === keepSel);
    if (hit) S.sel = hit.row;
  }
  S.dirty = false; S.editing = null;
  render();
  const b = banner('info', '<b>Saved.</b>');
  setTimeout(() => b.remove(), 1500);
}

function mark() { S.dirty = true; }

// ---------------------------------------------------------------- helpers
/** Where a row lives, so an edit can mark exactly the right pieces dirty. */
function ctx(row) {
  if (!S.guide) return {};
  for (const { table, section } of tablesOf(S.guide)) {
    if (table.rows.includes(row)) return { table, section };
  }
  return {};
}
function guideOpenCount(g) {
  return openItems(S.doc).filter((i) => i.guide === g.name).length;
}
function isUnknown(v) { return String(v || '').trim() === '??'; }

// ---------------------------------------------------------------- render
function render() {
  document.body.classList.toggle('present', S.present);
  document.body.classList.toggle('is-paired', !!S.beside && S.view === 'guide');
  renderBar();
  renderUserBar();
  renderPageHead();
  renderPalette();
  if (!S.doc) { renderHello(); return; }
  renderRailLeft();
  $('stage').innerHTML = '';
  if (S.view === 'guide' && S.beside) renderBeside();
  else if (S.view === 'guide') renderGuide();
  else if (S.view === 'flow') renderFlow();
  else if (S.view === 'users') renderUsersView();
  else if (S.view === 'open') renderOpen();
  else renderSource();
  renderRailRight();
  renderMinimap();
  $('cap').hidden = !S.capture;
  if (S.capture) {
    const t = tablesOf(S.guide || {}).slice(-1)[0];
    $('capWhere').textContent = t ? `${S.guide.name} · ${t.section.title}` : '';
    $('capTally').textContent = S.captured ? `${S.captured} added` : '';
  }
}

function renderUserBar() {
  const old = document.getElementById('userbar');
  if (old) old.remove();
  if (!S.userFilter) return;
  const b = el('div');
  b.id = 'userbar';
  b.innerHTML = `Showing only what <b>${esc(S.userFilter)}</b> needs.`;
  const clear = el('button', 'quiet', 'show every guide');
  clear.onclick = () => { S.userFilter = null; render(); };
  b.appendChild(clear);
  $('banners').after(b);
}

function renderBar() {
  $('save').style.display = S.doc ? '' : 'none';
  $('tabs').style.display = S.doc && !S.present ? '' : 'none';
  const f = $('file');
  f.innerHTML = '';
  f.appendChild(icon('folder', 13));
  f.appendChild(el('span', null, S.file ? S.file.name : (S.dir ? S.dir.name : '')));
  $('file').style.display = S.dir ? '' : 'none';
  const sv = $('save');
  sv.disabled = !S.dirty || S.readOnly;
  sv.className = 'btn save' + (S.dirty && !S.readOnly ? ' primary' : '');
  sv.innerHTML = '';
  if (S.readOnly) sv.textContent = 'Read-only';
  else if (S.dirty) {
    sv.appendChild(el('span', 'dot'));
    sv.appendChild(el('span', null, 'Save'));
    sv.appendChild(el('span', 'kbd', '⌘S'));
    sv.title = 'Unsaved changes — write them to the file';
  } else {
    sv.appendChild(icon('tick', 12));
    sv.appendChild(el('span', null, 'Saved'));
    sv.title = 'Everything is written to the file';
  }
  const cm = $('comments');
  cm.innerHTML = '';
  cm.appendChild(icon('bubble', 13));
  const openN = S.doc ? openComments(S.doc).length : 0;
  cm.appendChild(el('span', 'n', openN ? String(openN) : ''));
  cm.classList.toggle('on', S.comments);
  cm.title = S.comments ? 'Hide comments (K)' : 'Show comments (K)';
  cm.style.display = S.doc && !S.present ? '' : 'none';

  $('present').classList.toggle('on', S.present);
  $('present').textContent = S.present ? 'Exit' : 'Present';
  $('present').title = S.present ? 'Leave present mode (Esc)' : 'Present (P)';
  $('present').style.display = S.doc ? '' : 'none';

  const tabs = $('tabs');
  tabs.innerHTML = '';
  if (!S.doc) return;
  // In a room, the only things worth showing are the guide and what is still open.
  tabs.style.display = S.present || !S.doc ? 'none' : '';
  $('save').style.display = S.present ? 'none' : '';
  $('file').style.display = S.present || !S.dir ? 'none' : '';
  for (const [k, label] of [['guide', 'Guide'], ['flow', 'Flow'], ['users', 'Users'], ['open', 'Open'], ['source', 'Source']]) {
    const b = el('button', S.view === k ? 'on' : '', label);
    b.onclick = () => { commitEditor(); S.view = k; render(); };
    tabs.appendChild(b);
  }
  const n = openItems(S.doc).length;
  const c = $('open');
  c.className = 'count' + (n ? '' : ' clear');
  // A count that is supposed to reach zero, so it is stated as a countdown and
  // says so when it gets there.
  c.innerHTML = n ? `<b>${n}</b> open` : '<b>0</b> open';
  c.title = n ? 'Action items and unanswered questions across every guide' : 'Nothing left open';
}

function renderHello() {
  $('railL').innerHTML = ''; $('railR').innerHTML = '';
  const w = el('div', 'hello');
  w.innerHTML = `<h1>priority guide</h1>
    <p>What a screen needs, in order, before anything is laid out.<br>
    Open a folder holding a guides markdown file.</p>`;
  const b = el('button', 'btn primary', 'Open a folder');
  b.onclick = pickFolder;
  w.appendChild(b);
  if (S.files.length) {
    const list = el('div');
    list.style.cssText = 'margin-top:26px;text-align:left';
    list.appendChild(el('div', 'rail-h', 'Files in ' + S.dir.name));
    for (const f of S.files) {
      const i = el('button', 'g-item');
      i.innerHTML = `<span class="n">${esc(f.name)}</span><span class="m">${f.guides} guides · ${f.blocks} blocks</span>`;
      i.onclick = () => openFile(f);
      list.appendChild(i);
    }
    w.appendChild(list);
  }
  w.appendChild(el('div', 'keys')).innerHTML =
    '<kbd>P</kbd> present &nbsp; <kbd>C</kbd> capture &nbsp; <kbd>U</kbd> users'
    + ' &nbsp; <kbd>⌥↑</kbd><kbd>⌥↓</kbd> move a block &nbsp; <kbd>⏎</kbd> add below';
  $('stage').innerHTML = '';
  $('stage').appendChild(w);
}

// ---------------------------------------------------------------- the menu
/**
 * One overflow menu, used by the guides rail, a section and a row.
 *
 * The rule it enforces: a click on a thing does the obvious thing to that thing
 * — navigate to a guide, edit the text you clicked. Everything else it can do
 * lives behind ⋯, in the same place, on every kind of object. Nothing important
 * hides behind knowing which pixel is special.
 */
function menuButton(cls, title) {
  const b = el('button', 'more' + (cls ? ' ' + cls : ''));
  b.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">'
    + '<circle cx="3.2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.8" cy="8" r="1.4"/></svg>';
  b.title = title || 'More';
  b.setAttribute('aria-label', title || 'More');
  return b;
}

function openMenu(anchor, items) {
  closePop();
  const m = el('div', 'pop menu');
  for (const it of items) {
    if (it.sep) { m.appendChild(el('div', 'msep')); continue; }
    const b = el('button', 'mitem' + (it.danger ? ' danger' : ''));
    b.appendChild(icon(it.glyph || 'other', 13));
    const t = el('div');
    t.appendChild(el('div', 'n', it.label));
    if (it.hint) t.appendChild(el('div', 'h', it.hint));
    b.appendChild(t);
    b.disabled = !!it.disabled;
    b.onclick = () => { closePop(); it.fn(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  placePop(m, anchor);
  S.pop = m;
  anchor.classList.add('open');
  m.dataset.owner = '1';
  m.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') closePop();
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); m.querySelector('.mitem').focus(); }, 0);
  return m;
}

/** Everything a guide can do, in the one place a user will look for it. */
function guideMenu(anchor, g, i, total) {
  openMenu(anchor, [
    { glyph: 'edit', label: 'Rename', fn: () => {
      S.guide = g; S.renaming = g; render();
      focusSoon('#railL .g-item.on .n');
    } },
    { glyph: 'up', label: 'Move up', disabled: i === 0,
      fn: () => { if (moveGuide(S.doc, g, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move down', disabled: i === total - 1,
      fn: () => { if (moveGuide(S.doc, g, 1)) { mark(); render(); } } },
    { sep: true },
    { glyph: 'trash', label: 'Delete guide', danger: true, fn: () => {
      const back = S.doc.segments.indexOf(g);
      const was = S.guide;
      removeGuide(S.doc, g);
      if (S.guide === g) S.guide = guides(S.doc)[0] || null;
      S.sel = null; mark(); render();
      undoable(`“${g.name}”`, () => {
        S.doc.segments.splice(back, 0, g);
        g.dirty = true; S.guide = was;
      });
    } }
  ]);
}

// ---------------------------------------------------------------- left rail
function renderRailLeft() {
  const r = $('railL');
  r.innerHTML = '';
  // Which guide you are reading is a Guide-view question. Beside the flow map
  // or the open list it is just a second navigation arguing with the first.
  if (S.view !== 'guide') { r.style.display = 'none'; return; }
  r.style.display = '';
  const filtered = S.userFilter
    ? (userTypes(S.doc).find((u) => u.name === S.userFilter) || { guides: [] }).guides.map((x) => x.guide)
    : null;
  r.appendChild(el('div', 'rail-h', filtered ? S.userFilter : 'Guides'));
  const all = guides(S.doc);
  (filtered || all).forEach((g, gi) => {
    const b = el('div', 'g-item' + (g === S.guide ? ' on' : ''));
    b.tabIndex = 0;
    const nm = el('div', 'n');
    nm.textContent = g.name;
    // Renaming happens on purpose, from the menu — never because a click for
    // navigation happened to land on the words.
    if (!S.readOnly && S.renaming === g) {
      editable(nm, g.name, (v) => { S.renaming = null; if (v) { g.name = v; g.dirtyHeading = true; } });
      nm.addEventListener('blur', () => { if (S.renaming === g) { S.renaming = null; render(); } });
    }
    b.appendChild(nm);
    const n = rowsOf(g).length;
    const o = guideOpenCount(g);
    const m = el('div', 'm');
    m.innerHTML = `${n} block${n === 1 ? '' : 's'}` + (o ? ` · <span class="o">${o} open</span>` : '');
    b.appendChild(m);
    const go = () => {
      if (S.renaming) return;
      commitEditor(); S.guide = g; S.sel = null;
      S.shownField = null; S.view = 'guide'; render();
    };
    b.onclick = (e) => { if (e.target.closest('.more,[contenteditable]')) return; go(); };
    b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };

    if (!S.readOnly && !filtered) {
      const more = menuButton('gmore', 'Rename, move or delete this guide');
      more.onclick = (e) => { e.stopPropagation(); guideMenu(more, g, gi, all.length); };
      b.appendChild(more);

      // Reordering is dragging, because that is what a list of things affords.
      b.draggable = true;
      b.ondragstart = (e) => {
        S.dragGuide = g; b.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', g.name);
      };
      b.ondragend = () => {
        S.dragGuide = null;
        document.querySelectorAll('.g-item').forEach((x) => x.classList.remove('dragging', 'dropat', 'dropafter'));
      };
      b.ondragover = (e) => {
        if (!S.dragGuide || S.dragGuide === g) return;
        e.preventDefault();
        const rect = b.getBoundingClientRect();
        const below = e.clientY > rect.top + rect.height / 2;
        b.classList.toggle('dropat', !below);
        b.classList.toggle('dropafter', below);
      };
      b.ondragleave = () => b.classList.remove('dropat', 'dropafter');
      b.ondrop = (e) => {
        e.preventDefault();
        const below = b.classList.contains('dropafter');
        b.classList.remove('dropat', 'dropafter');
        const moving = S.dragGuide;
        if (!moving || moving === g) return;
        const order = guides(S.doc);
        let to = order.indexOf(g) + (below ? 1 : 0);
        if (order.indexOf(moving) < to) to--;
        placeGuide(S.doc, moving, to);
        S.dragGuide = null; mark(); render();
      };
    }
    r.appendChild(b);
  });
  if (filtered) {
    const clear = el('button', 'rail-add', 'Show every guide');
    clear.onclick = () => { S.userFilter = null; render(); };
    r.appendChild(clear);
    return;
  }
  if (S.readOnly) return;
  const add = el('button', 'rail-add', '+  New guide');
  add.onclick = async () => {
    const name = await askText({
      title: 'New guide',
      body: 'Use the name the team uses for the screen, including the mode.',
      placeholder: 'Bookings — Manager view',
      action: 'Create'
    });
    if (!name) return;
    S.guide = addGuide(S.doc, name);
    S.view = 'guide'; S.sel = null; mark(); render();
  };
  r.appendChild(add);
}

// Which dots are filled tells you one-from-a-list from several-from-a-list
// without ever naming a control.
const FILLED = { pick1: [0], pickN: [0, 1] };

function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  svg.style.display = 'block';
  const d = GLYPH[name] || GLYPH.other;
  if (name === 'other' || name === 'pick1' || name === 'pickN') {
    const on = FILLED[name] || [0, 1, 2];
    [4, 8, 12].forEach((cx, i) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', 8); c.setAttribute('r', 1.7);
      if (name !== 'other' && !on.includes(i)) c.setAttribute('fill', 'none');
      else c.setAttribute('fill', 'currentColor');
      svg.appendChild(c);
    });
    return svg;
  }
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  return svg;
}

// ---------------------------------------------------------------- links out
/**
 * A local path cannot be opened from a page served over http, so offering it as
 * a link would hand over something that always fails. Show the path, and copy it
 * on click, which is the thing you actually wanted to do with it.
 */
function outLink(url, label, title) {
  if (isWebUrl(url)) {
    const a = el('a', null, label);
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.title = title || url;
    return a;
  }
  const b = el('button', 'pathlink', label);
  b.title = (title ? title + '\n' : '') + url + '\n\nClick to copy the path — a browser cannot open a local file.';
  b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    navigator.clipboard.writeText(url).then(
      () => { const was = b.textContent; b.textContent = 'path copied'; setTimeout(() => { b.textContent = was; }, 1200); },
      () => banner('warn', '<b>Could not copy.</b> The path is <code>' + esc(url) + '</code>')
    );
  };
  return b;
}

function guideLink(name) {
  return `<a href="#" data-goto="${esc(name)}">${esc(name)}</a>`;
}

/** Turn [handle] into a source link and [[Guide]] into a jump. */
function linkify(text, guide) {
  const frag = document.createDocumentFragment();
  const s = String(text == null ? '' : text);
  const re = /\[\[([^\]]+)\]\]|\[([^\[\]]+)\](?![(:])/g;
  let at = 0; let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > at) frag.appendChild(document.createTextNode(s.slice(at, m.index)));
    at = m.index + m[0].length;
    if (m[1] !== undefined) {
      const a = el('a', null, m[1]);
      a.href = '#'; a.dataset.goto = m[1];
      frag.appendChild(a);
      continue;
    }
    const h = m[2];
    const def = resolveSource(S.doc, guide, h);
    if (!def) {
      const b = el('span', 'pill dead', h + ' — no source by that name');
      frag.appendChild(b);
      continue;
    }
    frag.appendChild(outLink(def.url, def.title || h, def.title));
  }
  if (at < s.length) frag.appendChild(document.createTextNode(s.slice(at)));
  return frag;
}

function setLinked(node, text, guide) {
  node.textContent = '';
  node.appendChild(linkify(text, guide));
  return node;
}

// ---------------------------------------------------------------- inline editing
/**
 * Everything on a guide is edited where it sits. No forms, no Save — you click
 * the thing and type. Escape puts it back.
 */
function editable(node, current, commit, opts = {}) {
  if (S.readOnly) return node;
  node.contentEditable = 'plaintext-only';
  node.spellcheck = false;
  node.tabIndex = 0;
  node.onfocus = () => {
    if (node.dataset.blank === '1') { node.textContent = ''; node.classList.remove('none', 'empty'); }
  };
  node.onblur = () => {
    const v = node.textContent.trim();
    if (v === current) {
      if (node.dataset.ph && !v) {
        node.textContent = node.dataset.ph;
        node.classList.add(node.dataset.phcls || 'none');
        node.dataset.blank = '1';
      }
      return;
    }
    commit(v);
    mark();
    render();
  };
  node.onkeydown = (e) => {
    // Swallowing every keystroke meant Cmd-S did nothing while you were typing,
    // which is exactly when you want it. Only what this editor handles is
    // stopped; every command chord goes through to the app.
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      e.stopPropagation(); e.preventDefault();
      node.textContent = current; node.blur();
    } else if (e.key === 'Enter' && !opts.multiline) {
      e.stopPropagation(); e.preventDefault(); node.blur();
    } else if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete'
      || e.key.startsWith('Arrow') || e.key === 'Tab') {
      e.stopPropagation();
    }
  };
  return node;
}

/** Text that reads as a prompt until someone types in it. */
function blankable(node, value, placeholder, cls) {
  node.dataset.ph = placeholder;
  node.dataset.phcls = cls || 'none';
  if (value) { node.textContent = value; return node; }
  node.dataset.blank = '1';
  node.classList.add(cls || 'none');
  node.textContent = S.readOnly || S.present ? '' : placeholder;
  return node;
}

const focusSoon = (sel) => setTimeout(() => {
  // Rooted at the stage: the minimap holds a copy of the guide, and focus
  // belongs to the real one.
  const n = typeof sel === 'string' ? ($('stage').querySelector(sel) || document.querySelector(sel)) : sel;
  if (!n) return;
  n.focus();
  const r = document.createRange();
  r.selectNodeContents(n);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}, 0);

// ---------------------------------------------------------------- page header
/** Which guide you are on, always, without spending the guide's own width on it. */
/** The guides currently in play: a user's set when one is chosen, else all. */
function guidesInScope() {
  if (!S.userFilter) return guides(S.doc);
  const t = userTypes(S.doc).find((u) => u.name === S.userFilter);
  return t ? t.guides.map((x) => x.guide) : guides(S.doc);
}

function stepGuide(dir) {
  const scope = guidesInScope();
  const at = scope.indexOf(S.guide);
  const next = scope[at + dir];
  if (!next) return false;
  commitEditor();
  S.guide = next; S.sel = null; S.shownField = null;
  render();
  $('stage').scrollTop = 0;
  return true;
}

function navBtn(glyph, dir, enabled, title) {
  const b = el('button', 'nav');
  b.appendChild(icon(glyph, 15));
  b.style.transform = dir < 0 ? 'rotate(90deg)' : 'rotate(-90deg)';
  b.title = title;
  b.disabled = !enabled;
  b.onclick = () => stepGuide(dir);
  return b;
}

function renderPageHead() {
  const h = $('pagehead');
  h.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide') { h.style.display = 'none'; return; }
  h.style.display = '';
  const g = S.guide;

  const scope = guidesInScope();
  const at = scope.indexOf(g);

  const line = el('div', 'headline');
  if (S.present && scope.length > 1) {
    line.appendChild(navBtn('up', -1, at > 0, 'Previous screen'));
  }
  const t = el('h1');
  t.textContent = g.name;
  if (!S.present) editable(t, g.name, (v) => { if (v) { g.name = v; g.dirtyHeading = true; } });
  line.appendChild(t);
  if (S.present && scope.length > 1) {
    line.appendChild(navBtn('down', 1, at < scope.length - 1, 'Next screen'));
    const c = el('span', 'count');
    c.textContent = `${at + 1} of ${scope.length}`;
    line.appendChild(c);
  }
  h.appendChild(line);

  const sub = el('div', 'sub');
  const n = rowsOf(g).length;
  const add = (txt, cls) => {
    if (sub.children.length) sub.appendChild(el('span', 'dot', '·'));
    sub.appendChild(el('span', cls || '', txt));
  };
  add(`${n} block${n === 1 ? '' : 's'}`);
  const open = guideOpenCount(g);
  if (open) add(`${open} open`, 'open');
  h.appendChild(sub);
}

function blankTable() {
  const names = ['Content', 'Real data', 'Do', 'Link', 'Form', 'Note'];
  const keys = ['content', 'realData', 'capabilities', 'link', 'form', 'note'];
  return {
    kind: 'table',
    headerSrc: [`| ${names.join(' | ')} |`],
    dividerSrc: [`| ${names.map(() => '---').join(' | ')} |`],
    cols: { keyAt: keys, byKey: Object.fromEntries(keys.map((k, i) => [k, i])), names },
    rows: [], dirty: true
  };
}

// ---------------------------------------------------------------- minimap
/**
 * Where you are in a long guide.
 *
 * An editor's minimap is a shrunk picture of the text, and this is the same
 * idea: the guide itself, cloned and scaled down, so every block keeps the size
 * and the place it really has. You recognise where you are by shape — a long
 * section, a run of notes down the left, the visual you put halfway — without
 * reading a word. It is a column beside the guide rather than a layer over it,
 * so it covers nothing, and it is quiet until you look at it.
 */
function renderMinimap() {
  const m = $('minimap');
  m.innerHTML = '';
  const stage = $('stage');
  stage.onscroll = null;
  if (!S.doc || !S.guide || S.view !== 'guide' || S.present || S.beside) {
    m.style.display = 'none'; return;
  }
  const guide = stage.querySelector('.guide');
  // A map is for when you cannot hold the guide in your head. Under about a
  // screenful hidden, scrolling is one flick and a map is furniture.
  if (!guide || stage.scrollHeight < stage.clientHeight * 1.75) { m.style.display = 'none'; return; }
  m.style.display = '';

  // The picture is the guide itself, cloned and shrunk. Drawing a second,
  // simplified version would be a second thing to keep true; a clone cannot
  // disagree with what is on the page, and every element keeps the size it
  // really has. cloneNode copies no listeners, so it is inert by construction.
  const wrap = el('div', 'mshotwrap');
  const shot = el('div', 'mshot');
  const copy = guide.cloneNode(true);
  copy.querySelectorAll('[contenteditable]').forEach((n) => n.removeAttribute('contenteditable'));
  copy.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
  // Anything that only exists to be clicked is noise at this size.
  copy.querySelectorAll('.rowstrip,.slot,.lanemore,.more,.bubble,.blk-add,.refx,.sectools')
    .forEach((n) => n.remove());
  // No state classes: a copy is never the thing that is selected, open or held.
  copy.querySelectorAll('.rowsel,.unset,.fresh,.on,.open,.dropbefore,.dropafter,.lifting')
    .forEach((n) => n.classList.remove('rowsel', 'unset', 'fresh', 'on', 'open',
      'dropbefore', 'dropafter', 'lifting'));
  copy.querySelectorAll('[draggable]').forEach((n) => n.removeAttribute('draggable'));
  shot.appendChild(copy);
  wrap.appendChild(shot);
  m.appendChild(wrap);

  const view = el('div', 'mview');
  m.appendChild(view);

  const gw = guide.offsetWidth || 1;
  const scale = (m.clientWidth - 10) / gw;
  shot.style.width = gw + 'px';
  shot.style.transform = `scale(${scale})`;
  // A backdrop the height of the guide, so the picture reads as one document
  // rather than as fragments floating in an empty column.
  wrap.style.setProperty('--paper', (stage.scrollHeight * scale) + 'px');

  // Both the picture and the box are drawn in stage coordinates times the
  // scale, so a thing is as far down the map as it is down the guide.
  const contentH = stage.scrollHeight * scale;
  const fits = contentH <= m.clientHeight;

  const sync = () => {
    const slack = Math.max(0, contentH - m.clientHeight);
    const maxScroll = Math.max(1, stage.scrollHeight - stage.clientHeight);
    // When the picture is taller than the column it slides, the way an editor's
    // does, so the box you are watching never leaves the window.
    const shift = fits ? 0 : slack * (stage.scrollTop / maxScroll);
    shot.style.transform = `translateY(${-shift}px) scale(${scale})`;
    shot.style.left = '8px';
    wrap.style.setProperty('--paper-top', (-shift) + 'px');
    view.style.top = (stage.scrollTop * scale - shift) + 'px';
    view.style.height = Math.max(10, stage.clientHeight * scale) + 'px';
  };
  sync();
  stage.onscroll = sync;

  const goTo = (clientY) => {
    const r = m.getBoundingClientRect();
    const slack = Math.max(0, contentH - m.clientHeight);
    const maxScroll = Math.max(1, stage.scrollHeight - stage.clientHeight);
    const shift = fits ? 0 : slack * (stage.scrollTop / maxScroll);
    const y = (clientY - r.top + shift) / scale;
    stage.scrollTop = y - stage.clientHeight / 2;
    sync();
  };
  m.onmousedown = (e) => {
    e.preventDefault();
    goTo(e.clientY);
    const move = (ev) => goTo(ev.clientY);
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
}

// ---------------------------------------------------------------- the palette
/**
 * Everything a guide can hold, in one place you drag from.
 *
 * Dragging is the only way to add, and the only way to move. That is one
 * gesture for "where does this go", instead of a menu that adds somewhere you
 * cannot see and arrows that move one step at a time.
 */
const PALETTE = [
  { what: 'content', glyph: 'line1', label: 'Content', hint: 'A data point, a control or an action' },
  { what: 'visual', glyph: 'visual', label: 'Visual', hint: 'An image, a map, a photo' },
  { what: 'chart', glyph: 'chartother', label: 'Data visual', hint: 'A chart, a table, a number' },
  { what: 'divider', glyph: 'rule', label: 'Divider', hint: 'A rule, to break a section up' },
  { what: 'subsection', glyph: 'other', label: 'Subsection', hint: 'A split inside a section' },
  { what: 'reference', glyph: 'source', label: 'Reference', hint: 'Point at another guide' },
  { what: 'section', glyph: 'lineN', label: 'Section', hint: 'A new group of content' }
];

function renderPalette() {
  const p = $('palette');
  p.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide' || S.readOnly || S.present) {
    p.style.display = 'none'; return;
  }
  p.style.display = '';
  p.appendChild(el('span', 'lbl', 'Drag onto the guide'));
  for (const it of PALETTE) {
    const b = el('div', 'ptool');
    b.draggable = true;
    b.title = it.hint;
    b.appendChild(icon(it.glyph, 15));
    b.appendChild(el('span', null, it.label));
    b.ondragstart = (e) => {
      S.drag = { kind: 'new', what: it.what };
      b.classList.add('lifting');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', it.label);
    };
    b.ondragend = () => { b.classList.remove('lifting'); endDrag(); };
    p.appendChild(b);
  }
}

function endDrag() {
  S.drag = null;
  document.querySelectorAll('.dropbefore,.dropafter')
    .forEach((n) => n.classList.remove('dropbefore', 'dropafter'));
  document.body.classList.remove('dragging');
}

// ---------------------------------------------------------------- dropping
/**
 * Every cell in the stack is a drop target and knows what it stands for, so a
 * drop always has a place: this row, the top of that section, the end of this
 * one. The line you see is where the thing will land.
 */
function dropZone(cell, spot) {
  cell._spot = spot;
  cell.ondragover = (e) => {
    if (!S.drag) return;
    if (S.drag.kind === 'row' && S.drag.row === spot.row) return;
    e.preventDefault();
