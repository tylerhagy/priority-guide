    box.appendChild(el('h2', null, title));
    if (body) box.appendChild(el('p', null, body));
    const foot = el('div', 'dfoot');
    choices.forEach((c, i) => {
      const b = el('button', 'btn' + (c.primary ? ' primary' : c.danger ? ' danger' : ''), c.label);
      b.onclick = () => { back.remove(); S.scrim = null; resolve(c.value); };
      foot.appendChild(b);
      if (i === choices.length - 1) setTimeout(() => b.focus(), 0);
    });
    box.appendChild(foot);
    back.appendChild(box);
    back.onmousedown = (e) => { if (e.target === back) bail(); };
    box.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Escape') bail(); };
    document.body.appendChild(back);
  });
}

/**
 * Every delete asks first. Undo is a seven-second net and a mis-click is
 * instant, so the net is the second line of defence, not the first.
 */
function confirmDelete(what, body) {
  return ask({
    title: `Delete ${what}?`,
    body: body || 'You can undo this straight afterwards.',
    choices: [
      { label: 'Cancel', value: false, cancel: true },
      { label: 'Delete', value: true, danger: true }
    ]
  });
}

/** A single line of text, asked in the app rather than by the browser. */
function askText({ title, body, placeholder, value, action }) {
  return new Promise((resolve) => {
    const back = el('div', 'scrim');
    const done = (v) => { back.remove(); S.scrim = null; resolve(v); };
    S.scrim = () => done(null);
    const box = el('div', 'dialog');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');
    box.appendChild(el('h2', null, title));
    if (body) box.appendChild(el('p', null, body));
    const inp = el('input');
    inp.type = 'text';
    inp.placeholder = placeholder || '';
    inp.value = value || '';
    box.appendChild(inp);
    const foot = el('div', 'dfoot');
    const cancel = el('button', 'btn', 'Cancel');
    const ok = el('button', 'btn primary', action || 'Add');
    cancel.onclick = () => done(null);
    ok.onclick = () => done(inp.value.trim() || null);
    foot.append(cancel, ok);
    box.appendChild(foot);
    back.appendChild(box);
    back.onmousedown = (e) => { if (e.target === back) done(null); };
    box.onkeydown = (e) => {
      e.stopPropagation();
      if (e.key === 'Escape') done(null);
      if (e.key === 'Enter') { e.preventDefault(); done(inp.value.trim() || null); }
    };
    document.body.appendChild(back);
    // After the click that opened it has finished with the button it came from.
    requestAnimationFrame(() => { inp.focus(); inp.select(); });
  });
}

// ---------------------------------------------------------------- banners
function banner(kind, html, sticky) {
  const n = el('div', 'banner ' + kind);
  n.innerHTML = html;
  if (!sticky) {
    const x = el('button', null, 'dismiss');
    x.onclick = () => n.remove();
    n.appendChild(x);
  }
  $('banners').appendChild(n);
  return n;
}
const clearBanners = () => { $('banners').innerHTML = ''; };

// ---------------------------------------------------------------- file access
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.dir = dir;
    await loadFolder();
    await kvSet('folder', dir);   // after, so a storage failure cannot block opening
  } catch (e) {
    if (e.name !== 'AbortError') banner('err', `<b>Could not open that folder.</b> ${esc(e.message)}`);
  }
}

async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

async function loadFolder() {
  clearBanners();
  S.files = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.md')) S.files.push({ name, handle: h, isFields: isFieldsFileName(name) });
  }
  S.files.sort((a, b) => a.name.localeCompare(b.name));

  for (const f of S.files) {
    try {
      const text = await (await f.handle.getFile()).text();
      const d = parseDocument(text);
      f.blocks = countRows(d);
      f.guides = guides(d).length;
      f.title = d.title || '';
    } catch { f.blocks = 0; f.guides = 0; f.title = ''; }
  }

  const real = S.files.filter((f) => f.blocks > 0 && !f.isFields);
  if (!S.files.length) {
    banner('warn', '<b>No markdown files here.</b> Point priority guide at a folder holding a guides file.', true);
    render(); return;
  }
  if (real.length === 1) return openFile(real[0]);
  if (!real.length) {
    banner('warn', '<b>No guides here.</b> These files read fine but hold no content blocks.', true);
  }
  render();
}

/** What a file is called on screen: its own title (the # heading), else its file name. */
function fileLabel(f) {
  const t = (f === S.file && S.doc && S.doc.title) || f.title || f.name.replace(/\.md$/i, '');
  // Every guides file is headed "Priority Guides — [project]"; the part after the dash is the part that tells two apart.
  return t.replace(/^priority guides?\s*[—–-]\s*/i, '') || t;
}

/** The file menu: every guides file in the folder, the open one ticked, then another folder. */
function fileMenu(anchor) {
  const files = S.files.filter((f) => (f.guides > 0 && !f.isFields) || f === S.file);
  const items = files.map((f) => ({
    glyph: f === S.file ? 'tick' : 'note',
    label: fileLabel(f),
    hint: `${f.name} · ${f.guides} guide${f.guides === 1 ? '' : 's'} · ${f.blocks} blocks`,
    fn: () => switchFile(f),
  }));
  if (items.length) items.push({ sep: true });
  items.push({ glyph: 'folder', label: 'Open a different folder', hint: S.dir ? 'Now: ' + S.dir.name : '', fn: () => switchFile(null) });
  const m = openMenu(anchor, items);
  m.classList.add('files');
  placePop(m, anchor);   // placed again at its real width
}

/** Switch to another file, or to another folder (f = null). Unsaved changes are never dropped silently. */
async function switchFile(f) {
  if (f && f === S.file) return;
  commitEditor();
  if (S.dirty && !S.readOnly) {
    banner('warn', '<b>Save or discard your changes first.</b> Switching would lose them.');
    return;
  }
  if (!f) return pickFolder();
  S.beside = null;
  await openFile(f);
}

async function openFile(f) {
  clearBanners();
  const text = await (await f.handle.getFile()).text();
  const rt = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = parseDocument(text);
  f.title = S.doc.title || '';
  S.readOnly = !rt.ok; S.dirty = false; S.sel = null; S.editing = null;
  S.guide = guides(S.doc)[0] || null;
  S.captured = 0;
  await loadFields();

  if (!rt.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip, `
      + `so priority guide will not write to it. First difference at line <code>${rt.line}</code>.<br>`
      + `in the file <code>${esc(rt.expected)}</code><br>parsed back <code>${esc(rt.produced)}</code>`, true);
  } else if (!S.guide) {
    banner('warn', '<b>No guides in this file.</b> It reads fine, but there are no <code>##</code> guide headings.', true);
  }
  // Two guides with the same name make every route to that name ambiguous.
  const seen = new Set();
  const dupes = [];
  for (const g of guides(S.doc)) {
    const k = g.name.toLowerCase();
    if (seen.has(k)) dupes.push(g.name); else seen.add(k);
  }
  if (dupes.length) {
    banner('warn', `<b>Two guides share a name.</b> Every route to `
      + dupes.map((d) => `<code>${esc(d)}</code>`).join(', ')
      + ' lands on the first one. Rename one of them.', true);
  }
  render();
}

// ---------------------------------------------------------------- fields file
/**
 * The folder's fields file — `Fields — [name].md` — read beside the guides file.
 * It is optional: without one, every guide works exactly as before and the
 * Fields view offers to start one.
 */
async function loadFields() {
  S.ffile = S.files.find((f) => f.isFields) || null;
  S.fdoc = null; S.fOriginal = ''; S.fDirty = false; S.fReadOnly = false;
  if (!S.ffile) return;
  try {
    const text = await (await S.ffile.handle.getFile()).text();
    S.fOriginal = text;
    S.fdoc = parseDocument(text);
    S.fReadOnly = !verifyRoundTrip(text).ok;
    if (S.fReadOnly) banner('warn', `<b>${esc(S.ffile.name)} is read-only.</b> It did not reproduce byte-for-byte, so priority guide will not write to it.`);
  } catch (e) {
    banner('err', `<b>Could not read ${esc(S.ffile.name)}.</b> ${esc(e.message)}`);
  }
}

/** A field edit is an edit like any other: it lights Save, and Save writes both files. */
function markFields() { S.fDirty = true; mark(); }
const fieldsEditable = () => !!S.fdoc && !S.fReadOnly && !S.readOnly && !S.present;

/** Start the folder's fields file, named after the guides file it sits beside. */
async function createFieldsFile() {
  if (!S.dir || S.ffile) return;
  const base = ((S.doc && S.doc.title) || 'Untitled').replace(/^priority guides?\s*[—–-]\s*/i, '').trim() || 'Untitled';
  const name = `Fields — ${base}.md`;
  try {
    if (!(await ensureWritable(S.dir))) { banner('err', '<b>Write permission was declined.</b>'); return; }
    const h = await S.dir.getFileHandle(name, { create: true });
    const w = await h.createWritable();
    await w.write(blankFieldsFile(base)); await w.close();
    S.files.push({ name, handle: h, isFields: true, guides: 0, blocks: 0, title: `Fields — ${base}` });
    S.files.sort((a, b) => a.name.localeCompare(b.name));
    await loadFields();
    toast(`Started ${name}`);
    render();
  } catch (e) {
    banner('err', `<b>Could not create the fields file.</b> ${esc(e.message)}`);
  }
}

async function saveFields() {
  if (!S.ffile || !S.fdoc || S.fReadOnly || !S.fDirty) return true;
  if (!(await ensureWritable(S.ffile.handle))) {
    banner('err', '<b>Write permission was declined</b> for the fields file.');
    return false;
  }
  const onDisk = await (await S.ffile.handle.getFile()).text();
  if (onDisk !== S.fOriginal) {
    const keep = await ask({
      title: 'The fields file changed on disk',
      body: 'Something else edited it since you opened it. Keep your version, or take what is on disk?',
      choices: [
        { label: 'Reload from disk', value: false, cancel: true },
        { label: 'Keep mine', value: true, primary: true }
      ]
    });
    if (keep === null) return false;
    if (!keep) { await loadFields(); return true; }
  }
  const text = serializeDocument(S.fdoc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save the fields file.</b> It does not round-trip (line ${rt.line}). Nothing was written.`);
    return false;
  }
  await backup(S.ffile.name, S.fOriginal);
  const w = await S.ffile.handle.createWritable();
  await w.write(text); await w.close();
  S.fOriginal = text; S.fdoc = parseDocument(text); S.fDirty = false;
  return true;
}

// ---------------------------------------------------------------- save
async function save() {
  if (!S.file || S.readOnly) return;
  // Flush an inline edit that is still focused; leave any open picker alone.
  const a = document.activeElement;
  if (a && a.isContentEditable) a.blur();
  if (!(await ensureWritable(S.file.handle))) {
    banner('err', '<b>Write permission was declined.</b> Chrome needs <b>Edit files</b> for this folder.');
    return;
  }
  const onDisk = await (await S.file.handle.getFile()).text();
  if (onDisk !== S.originalText) {
    const keep = await ask({
      title: 'This file changed on disk',
      body: 'Something else edited it since you opened it — Obsidian, most likely. '
        + 'Keep your version, or throw yours away and take what is on disk?',
      choices: [
        { label: 'Reload from disk', value: false, cancel: true },
        { label: 'Keep mine', value: true, primary: true }
      ]
    });
    if (keep === null) return;
    if (!keep) return openFile(S.file);
  }
  const text = serializeDocument(S.doc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save.</b> The output does not round-trip (line ${rt.line}). Nothing was written.`);
    return;
  }
  await backup(S.file.name, S.originalText);
  const w = await S.file.handle.createWritable();
  await w.write(text); await w.close();

  // Re-parse our own bytes so the model can never drift from the file.
  const keepName = S.guide ? S.guide.name : null;
  const keepSel = S.sel ? renderContentCell(S.sel.content) : null;
  S.originalText = text;
  S.doc = parseDocument(text);
  S.guide = (keepName && findGuide(S.doc, keepName)) || guides(S.doc)[0] || null;
  S.sel = null;
  if (keepSel && S.guide) {
    const hit = rowsOf(S.guide).find((r) => renderContentCell(r.row.content) === keepSel);
    if (hit) S.sel = hit.row;
  }
  if (!(await saveFields())) { render(); return; }
  S.dirty = false; S.editing = null;
  render();
  const b = banner('info', '<b>Saved.</b>');
  setTimeout(() => b.remove(), 1500);
}

/** Throw away every edit since the last save — reopening the file does that for free. */
async function discard() {
  if (!S.file || !S.dirty || S.readOnly) return;
  const a = document.activeElement;
  if (a && a.isContentEditable) a.blur();
  const ok = await ask({
    title: 'Discard your changes?',
    body: 'Every edit since the last save is thrown away. What is on disk is untouched.',
    choices: [
      { label: 'Keep editing', value: false, cancel: true },
      { label: 'Discard', value: true, danger: true }
    ]
  });
  if (!ok) return;
  const was = { doc: S.doc, guide: S.guide, sel: S.sel };
  await openFile(S.file);
  toast('Changes discarded', 'Undo', () => {
    S.doc = was.doc; S.guide = was.guide; S.sel = was.sel;
    mark(); render();
  });
}

function mark() { S.dirty = true; }

// ---------------------------------------------------------------- helpers
/** Where a row lives, so an edit can mark exactly the right pieces dirty. */
function ctx(row) {
  if (!S.guide) return {};
  for (const { table, section } of tablesOf(S.guide)) {
    if (table.rows.includes(row)) return { table, section };
  }
  return {};
}
function guideOpenCount(g) {
  return openItems(S.doc).filter((i) => i.guide === g.name).length;
}
function isUnknown(v) { return String(v || '').trim() === '??'; }

// ---------------------------------------------------------------- render
function render() {
  document.body.classList.toggle('present', S.present);
  document.body.classList.toggle('is-paired', !!S.beside && S.view === 'guide');
  renderBar();
  renderUserBar();
  renderPageHead();
  renderPalette();
  document.body.classList.toggle('nofile', !S.doc);
  if (!S.doc) { renderHello(); renderFlowBar(); return; }
  renderRailLeft();
  renderRailRight();   // first, so the stage is measured at the width it will have
  // A redraw in place — a delete, an undo, a duplicate — keeps you where you
  // were. Only going somewhere else (another guide, view or file) starts at the top.
  const place = `${S.view}\u241f${S.guide ? S.guide.name : ''}\u241f${S.beside ? 1 : 0}\u241f${S.file ? S.file.name : ''}`;
  const keepY = place === S.lastPlace ? $('stage').scrollTop : null;
  S.lastPlace = place;
  $('stage').innerHTML = '';
  if (S.view === 'guide' && S.beside) renderBeside();
  else if (S.view === 'guide') renderGuide();
  else if (S.view === 'flow') renderFlow();
  else if (S.view === 'users') renderUsersView();
  else if (S.view === 'open') renderOpen();
  else if (S.view === 'fields') renderFields();
  else renderSource();
  if (keepY !== null) $('stage').scrollTop = keepY;
  renderMinimap();
  renderFlowBar();
  $('cap').hidden = !S.capture;
  if (S.capture) {
    const t = tablesOf(S.guide || {}).slice(-1)[0];
    $('capWhere').textContent = t ? `${S.guide.name} · ${t.section.title}` : '';
    $('capTally').textContent = S.captured ? `${S.captured} added` : '';
  }
}

function renderUserBar() {
  const old = document.getElementById('userbar');
  if (old) old.remove();
  if (!S.userFilter) return;
  const b = el('div');
  b.id = 'userbar';
  b.innerHTML = `Showing only what <b>${esc(S.userFilter)}</b> needs.`;
  const clear = el('button', 'quiet', 'show every guide');
  clear.onclick = () => { S.userFilter = null; render(); };
  b.appendChild(clear);
  $('banners').after(b);
}

function renderBar() {
  $('tabs').style.display = S.doc && !S.present ? '' : 'none';
  const f = $('file');
  f.innerHTML = '';
  f.appendChild(icon('folder', 13));
  // The name of what you are looking at: the file's own title (its # heading), else its file name.
  const label = S.file ? fileLabel(S.file) : (S.dir ? S.dir.name : '');
  f.appendChild(el('span', S.file ? 'ft' : null, label + (S.file && S.dirty ? ' ·' : '')));
  if (S.dir) f.appendChild(icon('chev', 12));
  f.title = S.file ? `${(S.doc && S.doc.title) || S.file.name}\n${S.file.name} in ${S.dir.name}\n\nSwitch file or folder` : 'Open a different folder';
  document.title = S.file ? `${label} · priority guide` : 'priority guide';
  $('file').style.display = S.dir ? '' : 'none';
  const sv = $('save');
  sv.disabled = !S.dirty || S.readOnly;
  sv.className = 'btn save' + (S.dirty && !S.readOnly ? ' primary' : '');
  sv.innerHTML = '';
  // Saved is the quiet default — the dot on the filename carries that state,
  // so the button itself only shows up when there is something to say.
  if (S.readOnly) {
    sv.style.display = S.doc && !S.present ? '' : 'none';
    sv.textContent = 'Read-only';
  } else if (S.dirty) {
    sv.style.display = S.doc && !S.present ? '' : 'none';
    sv.appendChild(el('span', null, 'Save'));
    sv.appendChild(el('span', 'kbd', '⌘S'));
    sv.title = 'Unsaved changes — write them to the file';
  } else {
    sv.style.display = 'none';
  }
  // Discard sits next to Save because it answers the same fact — there is
  // something unwritten — the other way. Read-only means there is nothing of
  // yours to throw away; it was never written to the model in the first place.
  const dc = $('discard');
  dc.disabled = !S.dirty || S.readOnly;
  dc.style.display = S.dirty && !S.readOnly && S.doc && !S.present ? '' : 'none';
  dc.title = 'Throw away every change since the last save';
  $('present').classList.toggle('on', S.present);
  $('present').textContent = S.present ? 'Exit' : 'Read';
  $('present').title = S.present ? 'Leave reading mode (Esc)' : 'Read (P)';
  $('present').style.display = S.doc ? '' : 'none';

  const tabs = $('tabs');
  tabs.innerHTML = '';
  if (!S.doc) return;
  // In a room, the only things worth showing are the guide and what is still open.
  tabs.style.display = S.present || !S.doc ? 'none' : '';
  $('file').style.display = S.present || !S.dir ? 'none' : '';
  for (const [k, label] of [['guide', 'Guide'], ['flow', 'Flow'], ['users', 'Users'], ['open', 'Open'], ['fields', 'Fields'], ['source', 'Source']]) {
    const b = el('button', S.view === k ? 'on' : '', label);
    b.onclick = () => { commitEditor(); S.view = k; render(); };
    tabs.appendChild(b);
  }
  const n = openItems(S.doc).length;
  const c = $('open');
  c.className = 'count' + (n ? '' : ' clear');
  // A count that is supposed to reach zero, so it is stated as a countdown and
  // says so when it gets there.
  c.innerHTML = n ? `<b>${n}</b> open` : '<b>0</b> open';
  c.title = n ? 'Actions and unanswered questions across every guide' : 'Nothing left open';
}

function renderHello() {
  $('railL').innerHTML = ''; $('railR').innerHTML = '';
  const w = el('div', 'hello');
  w.appendChild(el('h1', null, 'priority guide'));
  w.appendChild(el('p', 'hello-p', 'What a screen needs, in order, before anything is laid out.'));

  // A guides file is one with guides that hold blocks; a fields file, a decisions
  // log or a list of notes reads fine but is not something to open here.
  const guidesFiles = S.files.filter((f) => !f.isFields && f.guides > 0 && f.blocks > 0);
  const others = S.files.filter((f) => !f.isFields && !guidesFiles.includes(f));

  if (!guidesFiles.length) {
    const b = el('button', 'btn primary hello-go', 'Open a folder');
    b.onclick = pickFolder;
    w.appendChild(b);
    w.appendChild(el('p', 'hello-hint', S.dir
      ? `${S.dir.name} has no guides file. Pick the folder that holds one.`
      : 'Pick the folder that holds a guides markdown file.'));
  } else {
    const card = el('div', 'listcard hello-list');
    const h = el('div', 'lc-h');
    h.appendChild(el('span', 'lc-name static', `Guides in ${S.dir.name}`));
    h.appendChild(el('span', 'lc-count', String(guidesFiles.length)));
    card.appendChild(h);
    for (const f of guidesFiles) {
      const r = el('div', 'lc-row hello-row');
      r.setAttribute('role', 'button');
      r.tabIndex = 0;
      const bd = el('span', 'bd');
      bd.appendChild(el('span', 'q', fileLabel(f)));
      bd.appendChild(el('span', 'meta', `${f.guides} guide${f.guides === 1 ? '' : 's'} · ${f.blocks} blocks`));
      if (f.title) bd.appendChild(el('span', 'fname', f.name));
      r.appendChild(bd);
      r.appendChild(el('span', 'go', '›'));
      r.onclick = () => openFile(f);
      r.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openFile(f); } };
      card.appendChild(r);
    }
    w.appendChild(card);
    if (others.length) {
      w.appendChild(el('p', 'hello-hint', `Also here, not guides files: ${others.map((f) => f.name).join(', ')}`));
    }
    const again = el('button', 'quiet hello-again', 'Open a different folder');
    again.onclick = pickFolder;
    w.appendChild(again);
  }
  $('stage').innerHTML = '';
  $('stage').appendChild(w);
}

// ---------------------------------------------------------------- the menu
/**
 * One overflow menu, used by the guides rail, a section and a row.
 *
 * The rule it enforces: a click on a thing does the obvious thing to that thing
 * — navigate to a guide, edit the text you clicked. Everything else it can do
 * lives behind ⋯, in the same place, on every kind of object. Nothing important
 * hides behind knowing which pixel is special.
 */
function menuButton(cls, title) {
  const b = el('button', 'more' + (cls ? ' ' + cls : ''));
  b.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">'
    + '<circle cx="3.2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.8" cy="8" r="1.4"/></svg>';
  b.title = title || 'More';
  b.setAttribute('aria-label', title || 'More');
  return b;
}

function openMenu(anchor, items) {
  closePop();
  const m = el('div', 'pop menu');
  for (const it of items) {
    if (it.sep) { m.appendChild(el('div', 'msep')); continue; }
    const b = el('button', 'mitem' + (it.danger ? ' danger' : ''));
    b.appendChild(icon(it.glyph || 'other', 13));
    const t = el('div');
    t.appendChild(el('div', 'n', it.label));
    if (it.hint) t.appendChild(el('div', 'h', it.hint));
    b.appendChild(t);
    b.disabled = !!it.disabled;
    b.onclick = () => { closePop(); it.fn(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  placePop(m, anchor);
  S.pop = m;
  anchor.classList.add('open');
  m.dataset.owner = '1';
  m.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') closePop();
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); m.querySelector('.mitem').focus(); }, 0);
  return m;
}

/** Everything a guide can do, in the one place a user will look for it. */
function guideMenu(anchor, g, i, total) {
  openMenu(anchor, [
    { glyph: 'edit', label: 'Rename', fn: () => {
      S.guide = g; S.renaming = g; render();
      focusSoon('#railL .g-item.on .n');
    } },
    { glyph: 'copy', label: 'Duplicate', fn: () => {
      const dup = duplicateGuide(S.doc, g);
      S.guide = dup; S.sel = null; mark(); render();
    } },
    { glyph: 'up', label: 'Move up', disabled: i === 0,
      fn: () => { if (moveGuide(S.doc, g, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move down', disabled: i === total - 1,
      fn: () => { if (moveGuide(S.doc, g, 1)) { mark(); render(); } } },
    { sep: true },
    { glyph: 'trash', label: 'Delete guide', danger: true, fn: async () => {
      if (!await confirmDelete(`the guide “${g.name}”`,
        'Every block, note and source citation in it goes too. You can undo this straight afterwards.')) return;
      const back = S.doc.segments.indexOf(g);
      const was = S.guide;
      removeGuide(S.doc, g);
      if (S.guide === g) S.guide = guides(S.doc)[0] || null;
      S.sel = null; mark(); render();
      undoable(`“${g.name}”`, () => {
        S.doc.segments.splice(back, 0, g);
        g.dirty = true; S.guide = was;
      });
    } }
  ]);
}

// ---------------------------------------------------------------- left rail
function renderRailLeft() {
  const r = $('railL');
  r.innerHTML = '';
  // Which guide you are reading is a Guide-view question. Beside the flow map
  // or the open list it is just a second navigation arguing with the first.
  if (S.view !== 'guide') { r.style.display = 'none'; return; }
  r.style.display = '';
  const filtered = S.userFilter
    ? (userTypes(S.doc).find((u) => u.name === S.userFilter) || { guides: [] }).guides.map((x) => x.guide)
    : null;
  r.appendChild(el('div', 'rail-h', filtered ? S.userFilter : 'Guides'));
  const all = guides(S.doc);
  (filtered || all).forEach((g, gi) => {
    const b = el('div', 'g-item' + (g === S.guide ? ' on' : ''));
    b.tabIndex = 0;
    const nm = el('div', 'n');
    nm.textContent = g.name;
    // Renaming happens on purpose, from the menu — never because a click for
    // navigation happened to land on the words.
    if (!S.readOnly && S.renaming === g) {
      editable(nm, g.name, (v) => { S.renaming = null; if (v) { g.name = v; g.dirtyHeading = true; } });
      nm.addEventListener('blur', () => { if (S.renaming === g) { S.renaming = null; render(); } });
    }
    b.appendChild(nm);
    const n = rowsOf(g).length;
    const o = guideOpenCount(g);
    const cN = openCommentCount(S.doc, g);
    const m = el('div', 'm');
    m.innerHTML = `${n} block${n === 1 ? '' : 's'}` + (o ? ` · <span class="o">${o} open</span>` : '');
    b.appendChild(m);
    // A comment is someone waiting on you, so it belongs next to the name
    // rather than only inside the guide it was left on.
    if (cN) {
      const cm = el('div', 'cn');
      cm.appendChild(icon('bubble', 10));
      cm.appendChild(el('span', null, String(cN)));
      cm.title = `${cN} open comment${cN === 1 ? '' : 's'}`;
      b.appendChild(cm);
    }
    const go = () => {
      if (S.renaming) return;
      commitEditor(); S.guide = g; S.sel = null;
      S.shownField = null; S.view = 'guide'; render();
    };
    b.onclick = (e) => { if (e.target.closest('.more,[contenteditable]')) return; go(); };
    b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };

    if (!S.readOnly && !filtered) {
      const more = menuButton('gmore', 'Rename, duplicate, move or delete this guide');
      more.onclick = (e) => { e.stopPropagation(); guideMenu(more, g, gi, all.length); };
      b.appendChild(more);

      // Reordering is dragging, because that is what a list of things affords.
      b.draggable = true;
      b.ondragstart = (e) => {
        S.dragGuide = g; b.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', g.name);
      };
      b.ondragend = () => {
        S.dragGuide = null;
        document.querySelectorAll('.g-item').forEach((x) => x.classList.remove('dragging', 'dropat', 'dropafter'));
      };
      b.ondragover = (e) => {
        if (!S.dragGuide || S.dragGuide === g) return;
        e.preventDefault();
        const rect = b.getBoundingClientRect();
        const below = e.clientY > rect.top + rect.height / 2;
        b.classList.toggle('dropat', !below);
        b.classList.toggle('dropafter', below);
      };
      b.ondragleave = () => b.classList.remove('dropat', 'dropafter');
      b.ondrop = (e) => {
        e.preventDefault();
        const below = b.classList.contains('dropafter');
        b.classList.remove('dropat', 'dropafter');
        const moving = S.dragGuide;
        if (!moving || moving === g) return;
        const order = guides(S.doc);
        let to = order.indexOf(g) + (below ? 1 : 0);
        if (order.indexOf(moving) < to) to--;
        placeGuide(S.doc, moving, to);
        S.dragGuide = null; mark(); render();
      };
    }
    r.appendChild(b);
  });
  if (filtered) {
    const clear = el('button', 'rail-add', 'Show every guide');
    clear.onclick = () => { S.userFilter = null; render(); };
    r.appendChild(clear);
    return;
  }
  if (S.readOnly) return;
  const add = el('button', 'rail-add', '+  New guide');
  add.onclick = async () => {
    const name = await askText({
      title: 'New guide',
      body: 'Use the name the team uses for the screen, including the mode.',
      placeholder: 'Bookings — Manager view',
      action: 'Create'
    });
    if (!name) return;
    S.guide = addGuide(S.doc, name);
    S.view = 'guide'; S.sel = null; mark(); render();
  };
  r.appendChild(add);
}

// Which dots are filled tells you one-from-a-list from several-from-a-list
// without ever naming a control.
const FILLED = { pick1: [0], pickN: [0, 1] };

function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  svg.style.display = 'block';
  const d = GLYPH[name] || GLYPH.other;
  if (name === 'other' || name === 'pick1' || name === 'pickN') {
    const on = FILLED[name] || [0, 1, 2];
    [4, 8, 12].forEach((cx, i) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', 8); c.setAttribute('r', 1.7);
      if (name !== 'other' && !on.includes(i)) c.setAttribute('fill', 'none');
      else c.setAttribute('fill', 'currentColor');
      svg.appendChild(c);
    });
    return svg;
  }
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  return svg;
}

const LINK_GLYPH = {
  download: 'download', upload: 'upload', mailto: 'mailto', modal: 'modal',

// ---------------------------------------------------------------- links out
/**
 * A local path cannot be opened from a page served over http, so offering it as
 * a link would hand over something that always fails. Show the path, and copy it
 * on click, which is the thing you actually wanted to do with it.
 */
function outLink(url, label, title) {
  if (isWebUrl(url)) {
    const a = el('a', null, label);
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.title = title || url;
    return a;
  }
  const b = el('button', 'pathlink', label);
  b.title = (title ? title + '\n' : '') + url + '\n\nClick to copy the path — a browser cannot open a local file.';
  b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    navigator.clipboard.writeText(url).then(
      () => { const was = b.textContent; b.textContent = 'path copied'; setTimeout(() => { b.textContent = was; }, 1200); },
      () => banner('warn', '<b>Could not copy.</b> The path is <code>' + esc(url) + '</code>')
    );
  };
  return b;
}

function guideLink(name) {
  return `<a href="#" data-goto="${esc(name)}">${esc(name)}</a>`;
}

/** Turn [handle] into a source link and [[Guide]] into a jump. */
function linkify(text, guide) {
  const frag = document.createDocumentFragment();
  const s = String(text == null ? '' : text);
  const re = /\[\[([^\]]+)\]\]|\[([^\[\]]+)\](?![(:])/g;
  let at = 0; let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > at) frag.appendChild(document.createTextNode(s.slice(at, m.index)));
    at = m.index + m[0].length;
    if (m[1] !== undefined) {
      const a = el('a', null, m[1]);
      a.href = '#'; a.dataset.goto = m[1];
      frag.appendChild(a);
      continue;
    }
    const h = m[2];
    const def = resolveSource(S.doc, guide, h);
    if (!def) {
      const b = el('span', 'pill dead', h + ' — no source by that name');
      frag.appendChild(b);
      continue;
    }
    frag.appendChild(outLink(def.url, def.title || h, def.title));
  }
  if (at < s.length) frag.appendChild(document.createTextNode(s.slice(at)));
  return frag;
}

function setLinked(node, text, guide) {
  node.textContent = '';
  node.appendChild(linkify(text, guide));
  return node;
}

// ---------------------------------------------------------------- inline editing
/**
 * Everything on a guide is edited where it sits. No forms, no Save — you click
 * the thing and type. Escape puts it back.
 */
function editable(node, current, commit, opts = {}) {
  if (S.readOnly) return node;
  node.contentEditable = 'plaintext-only';
  node.spellcheck = false;
  node.tabIndex = 0;
  node.onfocus = () => {
    if (node.dataset.blank === '1') { node.textContent = ''; node.classList.remove('none', 'empty'); }
  };
  node.onblur = () => {
    const v = node.textContent.trim();
    if (v === current) {
      if (node.dataset.ph && !v) {
        node.textContent = node.dataset.ph;
        node.classList.add(node.dataset.phcls || 'none');
        node.dataset.blank = '1';
      }
      return;
    }
    commit(v);
    mark();
    render();
  };
  node.onkeydown = (e) => {
    // Swallowing every keystroke meant Cmd-S did nothing while you were typing,
    // which is exactly when you want it. Only what this editor handles is
    // stopped; every command chord goes through to the app.
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      e.stopPropagation(); e.preventDefault();
      node.textContent = current; node.blur();
    } else if (e.key === 'Enter' && !opts.multiline) {
      e.stopPropagation(); e.preventDefault(); node.blur();
    } else if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete'
      || e.key.startsWith('Arrow') || e.key === 'Tab') {
      e.stopPropagation();
    }
  };
  return node;
}

/** Text that reads as a prompt until someone types in it. */
function blankable(node, value, placeholder, cls) {
  node.dataset.ph = placeholder;
  node.dataset.phcls = cls || 'none';
  if (value) { node.textContent = value; return node; }
  node.dataset.blank = '1';
  node.classList.add(cls || 'none');
  node.textContent = S.readOnly || S.present ? '' : placeholder;
  return node;
}

const focusSoon = (sel) => setTimeout(() => {
  // Rooted at the stage: the minimap holds a copy of the guide, and focus
  // belongs to the real one.
  const n = typeof sel === 'string' ? ($('stage').querySelector(sel) || document.querySelector(sel)) : sel;
  if (!n) return;
  n.focus();
  const r = document.createRange();
  r.selectNodeContents(n);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}, 0);

// ---------------------------------------------------------------- page header
/** Which guide you are on, always, without spending the guide's own width on it. */
/** The guides currently in play: a user's set when one is chosen, else all. */
function guidesInScope() {
  if (!S.userFilter) return guides(S.doc);
  const t = userTypes(S.doc).find((u) => u.name === S.userFilter);
  return t ? t.guides.map((x) => x.guide) : guides(S.doc);
}

function stepGuide(dir) {
  const scope = guidesInScope();
  const at = scope.indexOf(S.guide);
  const next = scope[at + dir];
  if (!next) return false;
  commitEditor();
  S.guide = next; S.sel = null; S.shownField = null;
  render();
  $('stage').scrollTop = 0;
  return true;
}

function navBtn(glyph, dir, enabled, title) {
  const b = el('button', 'nav');
  b.appendChild(icon(glyph, 15));
  b.title = title;
  b.disabled = !enabled;
  b.onclick = () => stepGuide(dir);
  return b;
}

function renderPageHead() {
  const h = $('pagehead');
  h.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide') { h.style.display = 'none'; return; }
  h.style.display = '';
  const g = S.guide;

  const scope = guidesInScope();
  const at = scope.indexOf(g);

  const line = el('div', 'headline');
  const t = el('h1');
  t.textContent = g.name;
  if (!S.present) editable(t, g.name, (v) => { if (v) { g.name = v; g.dirtyHeading = true; } });
  line.appendChild(t);
  const cluster = el('div', 'hnav');
  if (S.present && scope.length > 1) {
    cluster.appendChild(navBtn('left', -1, at > 0, 'Previous screen'));
    cluster.appendChild(navBtn('right', 1, at < scope.length - 1, 'Next screen'));
    const c = el('span', 'count');
    c.textContent = `${at + 1} of ${scope.length}`;
    cluster.appendChild(c);
  }
  if (S.present) {
    const out = el('button', 'btn rexit', 'Done reading');
    out.title = 'Back to editing (Esc)';
    out.onclick = () => { S.present = false; render(); };
    cluster.appendChild(out);
  }
  line.appendChild(cluster);
  h.appendChild(line);

  const sub = el('div', 'sub');
  const n = rowsOf(g).length;
  const add = (txt, cls) => {
    if (sub.children.length) sub.appendChild(el('span', 'dot', '·'));
    sub.appendChild(el('span', cls || '', txt));
  };
  add(`${n} block${n === 1 ? '' : 's'}`);
  const open = guideOpenCount(g);
  if (open) add(`${open} open`, 'open');
  h.appendChild(sub);
  const ctl = el('div', 'pgctl');
  if (!S.present) {
    ctl.appendChild(el('span', 'pgctl-l', 'Notes'));
    ctl.appendChild(segmented([[false, 'Shown'], [true, 'Hidden']], S.notesHidden, (v) => setNotesHidden(v),
      { false: 'Every note beside its block', true: 'Only for the blocks you open. Click a block’s note count to open it' }));
  }
  if (!S.present && !S.beside) ctl.appendChild(zoomControl());
  sub.appendChild(ctl);
}

/** Two or three choices, one on. The same control everywhere it appears. */
function segmented(options, current, pick, titles = {}) {
  const seg = el('div', 'segctl');
  for (const [v, label] of options) {
    const b = el('button', v === current ? 'on' : '', label);
    if (titles[v]) b.title = titles[v];
    b.onclick = () => { if (v !== current) pick(v); };
    seg.appendChild(b);
  }
  return seg;
}

// ---------------------------------------------------------------- notes, hidden
/**
 * Notes can step aside. A guide read for its content wants the stack first and
 * the commentary on request, and on a narrow screen the notes lane is the first
 * thing to get squeezed. Hidden, a block says how many notes it holds and how
 * many are open, and a click opens just that block's. The selected block always
 * shows its own. Functionality never hides: what a block does is part of what
 * it is.
 *
 * Which way it is set is a reading preference, not content, so it lives in this
 * browser and never in the file.
 */
function notesShownFor(rw) {
  return !S.notesHidden || S.present || S.openNotes.has(rw) || S.sel === rw;
}

function setNotesHidden(v) {
  try { localStorage.setItem('pg-notes', v ? 'hidden' : 'shown'); } catch { /* private window */ }
  withLaneMotion(() => { S.notesHidden = v; S.openNotes.clear(); });
}

function toggleNotes(rw) {
  withLaneMotion(() => {
    if (S.openNotes.has(rw)) { S.openNotes.delete(rw); if (S.sel === rw) S.sel = null; }
    else S.openNotes.add(rw);
  }, rw);
}

const reducedMotion = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch { return false; } };

/**
 * Re-render with everything sliding to where it now sits rather than jumping —
 * the rows below an opened block move down by exactly the room it took — and
 * the notes that just appeared grow out of their block. Measured before, measured
 * after, played as the difference. The grid keeps the same children in the same
 * order either way, which is what makes the two measurements line up.
 */
function withLaneMotion(change, opened) {
  const kids = () => [...document.querySelectorAll('#stage .guide > *')];
  const calm = reducedMotion();
  const before = calm ? null : kids().map((n) => n.getBoundingClientRect());
  const st = $('stage'), y = st ? st.scrollTop : 0;
  change();
  render();
  if ($('stage')) $('stage').scrollTop = y;
  if (!before) return;
  const now = kids();
  if (now.length !== before.length) return;
  const z = S.zoom || 1;
  const timing = { duration: 220, easing: 'cubic-bezier(.2,.7,.2,1)' };
  now.forEach((n, i) => {
    const a = before[i], b = n.getBoundingClientRect();
    const dy = (a.top - b.top) / z;
    const sy = n.classList.contains('paper') && b.height ? a.height / b.height : 1;
    if (Math.abs(dy) < 0.5 && Math.abs(sy - 1) < 0.002) return;
    n.style.transformOrigin = 'top';
    n.animate([{ transform: `translateY(${dy}px) scaleY(${sy})` }, { transform: 'none' }], timing);
  });
  if (!opened) return;
  const item = [...document.querySelectorAll('#stage .guide .item')].find((n) => n._rw === opened);
  const cell = item && item.closest('.cell');
  if (!cell) return;
  const lane = notesLaneOf(cell);
  if (!lane) return;
  lane.querySelectorAll('.note, .slot, .lanemore').forEach((n, k) => {
    n.animate([{ opacity: 0, transform: 'translateX(16px)' }, { opacity: 1, transform: 'none' }],
      { ...timing, delay: 60 + k * 30, fill: 'backwards' });
  });
}

/** A block's notes lane: beside its cell in three columns, inside it when stacked. */
function notesLaneOf(cell) {
  return cell.querySelector(':scope > .lane-l') || (cell.previousElementSibling && cell.previousElementSibling.classList.contains('lane-l') ? cell.previousElementSibling : null);
}

/** A short ring on what you landed on, so the eye finds it after a jump. */
function pulse(...nodes) {
  for (const n of nodes) {
    if (!n) continue;
    n.classList.remove('landed'); void n.offsetWidth; n.classList.add('landed');
    setTimeout(() => n.classList.remove('landed'), 1900);
  }
}

const ZOOMS = [0.5, 0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.25, 1.5];
/**
 * A guide is a wide document, and a laptop is not a wide screen. Zoom is the
 * difference between reading three lanes at once and scrolling sideways to
 * find out what the right one said.
 */
/**
 * A transform does not change layout, so the scroll area has to be told what
 * the scaled guide actually occupies — otherwise the page scrolls to the wrong
 * depth and the minimap's arithmetic goes with it.
 */
/**
 * Three columns only while all three can be read. Below the narrowest width at
 * which a note still fits a few words to a line, the guide stacks: one column,
 * each block followed by its notes and functionality. Measured against the
 * stage at the current zoom, so zooming out can bring the columns back.
 */
const THREE_COLUMNS = 200 + 264 + 200 + 40;
function guideStacked() {
  const st = $('stage');
  if (!st || !st.clientWidth) return false;
  const cs = getComputedStyle(st);
  const w = (st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight)) / (S.zoom || 1);
  return w < THREE_COLUMNS;
}

function sizeZoomFrame(frame, grid) {
  const f = frame || document.querySelector('.gzoom');
  const g = grid || (f && f.querySelector('.guide'));
  if (!f || !g) return;
  const z = S.zoom || 1;
  f.style.height = (g.offsetHeight * z) + 'px';
}

document.documentElement.style.setProperty('--zoom', String(S.zoom || 1));

/**
 * Both the map and the zoom frame are measured, not declared, so a resized
 * window has to remeasure them. Without this the map keeps whatever visibility
 * it had at the size the page was first drawn at.
 */
let resizeSoon = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeSoon);
  resizeSoon = setTimeout(() => {
    // Crossing a width that changes the layout redraws; anything else only remeasures.
    const g = document.querySelector('#stage .guide');
    const folded = railRFolded();
    if ((g && g.classList.contains('stacked') !== guideStacked()) || folded !== S.railRWasFolded) { render(); return; }
    sizeZoomFrame(); renderMinimap();
  }, 90);
});
function setZoom(z) {
  S.zoom = Math.min(ZOOMS[ZOOMS.length - 1], Math.max(ZOOMS[0], z));
  document.documentElement.style.setProperty('--zoom', String(S.zoom));
  try { localStorage.setItem('pg-zoom', String(S.zoom)); } catch { /* private window */ }
  const g = document.querySelector('#stage .guide');
  if (g && g.classList.contains('stacked') !== guideStacked()) { render(); return; }
  sizeZoomFrame();
  renderMinimap();
}
function stepZoom(dir) {
  const at = ZOOMS.findIndex((z) => Math.abs(z - S.zoom) < 0.001);
  const i = at === -1 ? ZOOMS.indexOf(1) : at;
  setZoom(ZOOMS[Math.min(ZOOMS.length - 1, Math.max(0, i + dir))]);
  renderPageHead();
}
/**
 * Fit means fit the width — all three lanes on screen at once, which is the
 * thing you lose first on a laptop. Fitting the height instead would mean
 * shrinking a long guide to 50% and no longer being able to read it.
 */
function zoomToFit() {
  const stage = $('stage');
  const guide = stage.querySelector('.guide');
  if (!guide) return;
  const room = stage.clientWidth - 60;
  // The guide's own minimum, independent of what it is currently scaled to.
  const wide = (guide.scrollWidth || guide.offsetWidth || 1);
  setZoom(Math.floor(Math.min(1, room / wide) * 20) / 20);
  renderPageHead();
}
function zoomControl() {
  const z = el('div', 'zoom');
  const b = (glyph, title, fn) => {
    const x = el('button', 'zb');
    x.appendChild(icon(glyph, 12));
    x.title = title;
    x.onclick = fn;
    return x;
  };
  z.appendChild(b('minus', 'Zoom out (\u2318\u2212)', () => stepZoom(-1)));
  const pct = el('button', 'zpct', Math.round(S.zoom * 100) + '%');
  pct.title = 'Fit the width \u2014 press again for 100%';
  pct.onclick = () => {
    if (Math.abs(S.zoom - 1) < 0.001) zoomToFit(); else { setZoom(1); renderPageHead(); }
  };
  z.appendChild(pct);
  z.appendChild(b('plus', 'Zoom in (\u2318+)', () => stepZoom(1)));
  return z;
}

function blankTable() {
  const names = ['Content', 'Real data', 'Do', 'Link', 'Form', 'Note'];
  const keys = ['content', 'realData', 'capabilities', 'link', 'form', 'note'];
  return {
    kind: 'table',
    headerSrc: [`| ${names.join(' | ')} |`],
    dividerSrc: [`| ${names.map(() => '---').join(' | ')} |`],
    cols: { keyAt: keys, byKey: Object.fromEntries(keys.map((k, i) => [k, i])), names },
    rows: [], dirty: true
  };
}

// ---------------------------------------------------------------- minimap
/**
 * Where you are in a long guide.
 *
 * An editor's minimap is a shrunk picture of the text, and this is the same
 * idea: the guide itself, cloned and scaled down, so every block keeps the size
 * and the place it really has. You recognise where you are by shape — a long
 * section, a run of notes down the left, the visual you put halfway — without
 * reading a word. It is a column beside the guide rather than a layer over it,
 * so it covers nothing, and it is quiet until you look at it.
 */
function renderMinimap() {
  const m = $('minimap');
  m.innerHTML = '';
  const stage = $('stage');
  stage.onscroll = null;
  if (!S.doc || !S.guide || S.view !== 'guide' || S.present || S.beside) {
    m.style.display = 'none'; m.style.visibility = ''; return;
  }
  const guide = stage.querySelector('.guide');
  // The map costs 124px, so it goes only when the guide genuinely cannot spare
  // them — below its own three-lane minimum. It used to also hide below a
  // height threshold ("a short guide is one flick to scroll, a map is
  // furniture"), but that read as the map going missing at random, so every
  // real guide gets one now, short or tall.
  if (!guide) { m.style.display = ''; m.style.visibility = 'hidden'; return; }
  // Measured as if the map were there, so hiding it can never make room that brings it straight back.
  const withMap = stage.clientWidth - (getComputedStyle(m).display === 'none' ? 124 : 0);
  if (withMap < 600) { m.style.display = 'none'; m.style.visibility = ''; return; }
  m.style.display = ''; m.style.visibility = '';

  // The picture is the guide itself, cloned and shrunk. Drawing a second,
  // simplified version would be a second thing to keep true; a clone cannot
  // disagree with what is on the page, and every element keeps the size it
  // really has. cloneNode copies no listeners, so it is inert by construction.
  const wrap = el('div', 'mshotwrap');
  const shot = el('div', 'mshot');
  const copy = guide.cloneNode(true);
  copy.querySelectorAll('[contenteditable]').forEach((n) => n.removeAttribute('contenteditable'));
  copy.querySelectorAll('[id]').forEach((n) => n.removeAttribute('id'));
  // Anything that only exists to be clicked is noise at this size.
  copy.querySelectorAll('.rowstrip,.slot,.lanemore,.more,.bubble,.blk-add,.refx,.sectools')
    .forEach((n) => n.remove());
  // No state classes: a copy is never the thing that is selected, open or held.
  copy.querySelectorAll('.rowsel,.unset,.fresh,.on,.open,.dropbefore,.dropafter,.lifting')
    .forEach((n) => n.classList.remove('rowsel', 'unset', 'fresh', 'on', 'open',
      'dropbefore', 'dropafter', 'lifting'));
  copy.querySelectorAll('[draggable]').forEach((n) => n.removeAttribute('draggable'));
  shot.appendChild(copy);
  wrap.appendChild(shot);
  m.appendChild(wrap);

  const view = el('div', 'mview');
  m.appendChild(view);

  const gw = guide.offsetWidth || 1;
  shot.style.width = gw + 'px';
  // The clone's own natural height, measured directly rather than derived
  // from stage.scrollHeight. That included the stage's own fixed padding,
  // and — at any zoom but 100% — was deflated by the zoom transform the real
  // guide has and this unzoomed clone never does, so the two disagreed on
  // how tall "the guide" was by exactly the zoom factor. Without this, the
  // paper and the band were sized against a height the picture never
  // actually had, and stopped short of the true bottom the guide really
  // scrolled to.
  const naturalH = copy.offsetHeight || 1;

  // Recomputed on every call rather than captured once: a panel resize, a
  // zoom change, a note that reflows — anything that changes how tall the
  // guide really is — used to leave scale/contentH holding whatever was true
  // at the last full render, so the band synced against a page that no
  // longer existed.
  const measure = () => {
    const scale = (m.clientWidth - 10) / gw;
    const contentH = naturalH * scale;
    return { scale, contentH, fits: contentH <= m.clientHeight };
  };

  // scrollTop, scrollHeight and clientHeight describe the real, live page —
  // stage.scrollHeight includes the stage's own fixed padding and, at any
  // zoom but 100%, is deflated by a transform the unzoomed picture never
  // has. contentH describes the picture, measured on its own terms. The two
  // are different units, not two readings of the same height, so a band
  // position can only cross between them as a *fraction* of each — never by
  // multiplying a real-page pixel by the picture's own scale, which is what
  // silently assumed the two were proportional and left the band short of
  // (or past) the picture's true bottom whenever they were not.
  const bandFor = (contentH) => {
    const top = (stage.scrollTop / stage.scrollHeight) * contentH;
    const h = (stage.clientHeight / stage.scrollHeight) * contentH;
    return { top, h };
  };

  const sync = () => {
    const { scale, contentH, fits } = measure();
    const { top: bandTop, h: bandH } = bandFor(contentH);
    const slack = Math.max(0, contentH - m.clientHeight);
    const maxScroll = Math.max(1, stage.scrollHeight - stage.clientHeight);
    // When the picture is taller than the column it slides, the way an editor's
    // does, so the box you are watching never leaves the window.
    const shift = fits ? 0 : slack * (stage.scrollTop / maxScroll);
    // A backdrop the height of the guide, so the picture reads as one document
    // rather than as fragments floating in an empty column.
    wrap.style.setProperty('--paper', contentH + 'px');
    shot.style.transform = `translateY(${-shift}px) scale(${scale})`;
    shot.style.left = '8px';
    wrap.style.setProperty('--paper-top', (-shift) + 'px');
    view.style.top = (bandTop - shift) + 'px';
    view.style.height = Math.max(10, bandH) + 'px';
  };
  sync();
  stage.onscroll = sync;

  const goTo = (clientY) => {
    const { contentH } = measure();
    const r = m.getBoundingClientRect();
    const slack = Math.max(0, contentH - m.clientHeight);
    const maxScroll = Math.max(1, stage.scrollHeight - stage.clientHeight);
    const fits = contentH <= m.clientHeight;
    const shift = fits ? 0 : slack * (stage.scrollTop / maxScroll);
    // Where the click landed, as a fraction of the picture — then that same
    // fraction of the real page, which is the only way to convert between
    // the two when they do not share a scale.
    const fraction = (clientY - r.top + shift) / contentH;
    stage.scrollTop = fraction * stage.scrollHeight - stage.clientHeight / 2;
    sync();
  };
  m.onmousedown = (e) => {
    e.preventDefault();
    goTo(e.clientY);
    const move = (ev) => goTo(ev.clientY);
    const up = () => {
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
}

// ---------------------------------------------------------------- the palette
/**
 * Everything a guide can hold, in one place you drag from.
 *
 * Dragging is the only way to add, and the only way to move. That is one
 * gesture for "where does this go", instead of a menu that adds somewhere you
 * cannot see and arrows that move one step at a time.
 */
const PALETTE = [
  { what: 'content', glyph: 'line1', label: 'Content', hint: 'A data point, a control or an action' },
  { what: 'visual', glyph: 'visual', label: 'Visual', hint: 'An image, a map, a photo' },
  { what: 'chart', glyph: 'chartother', label: 'Data visual', hint: 'A chart, a table, a number' },
  { what: 'divider', glyph: 'rule', label: 'Divider', hint: 'A rule, to break a section up' },
  { what: 'subsection', glyph: 'other', label: 'Subsection', hint: 'A split inside a section' },
  { what: 'reference', glyph: 'source', label: 'Reference', hint: 'Point at another guide' },
  { what: 'section', glyph: 'lineN', label: 'Section', hint: 'A new group of content' }
];

function renderPalette() {
  const p = $('palette');
  p.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide' || S.readOnly || S.present) {
    p.style.display = 'none'; return;
  }
  p.style.display = '';
  p.appendChild(el('span', 'lbl', 'Drag onto the guide'));
  for (const it of PALETTE) {
    const b = el('div', 'ptool');
    b.draggable = true;
    b.title = it.hint;
    b.appendChild(icon(it.glyph, 15));
    b.appendChild(el('span', null, it.label));
    b.ondragstart = (e) => {
      S.drag = { kind: 'new', what: it.what };
      b.classList.add('lifting');
      e.dataTransfer.effectAllowed = 'copy';
      e.dataTransfer.setData('text/plain', it.label);
    };
    b.ondragend = () => { b.classList.remove('lifting'); endDrag(); };
    p.appendChild(b);
  }
}

function endDrag() {
  S.drag = null;
  document.querySelectorAll('.dropbefore,.dropafter')
    .forEach((n) => n.classList.remove('dropbefore', 'dropafter'));
  document.body.classList.remove('dragging');
}

// ---------------------------------------------------------------- dropping
/**
 * Every cell in the stack is a drop target and knows what it stands for, so a
 * drop always has a place: this row, the top of that section, the end of this
 * one. The line you see is where the thing will land.
 */
function dropZone(cell, spot) {
  cell._spot = spot;
  cell.ondragover = (e) => {
    if (!S.drag) return;
    if (S.drag.kind === 'row' && S.drag.row === spot.row) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = S.drag.kind === 'new' ? 'copy' : 'move';
    const r = cell.getBoundingClientRect();
    const after = spot.endOnly || e.clientY > r.top + r.height / 2;
    cell.classList.toggle('dropbefore', !after && !spot.endOnly);
    cell.classList.toggle('dropafter', after);
  };
  cell.ondragleave = () => cell.classList.remove('dropbefore', 'dropafter');
  cell.ondrop = (e) => {
    if (!S.drag) return;
    e.preventDefault();
    e.stopPropagation();
    const after = cell.classList.contains('dropafter');
    cell.classList.remove('dropbefore', 'dropafter');
    const d = S.drag;
    endDrag();
    if (d.kind === 'row') moveRowTo(d.row, spot, after);
    else if (d.kind === 'chunk') moveChunkTo(d.chunk, d.sec, spot, after);
    else addAt(d.what, spot, after);
  };
}

/** Where a drop lands, expressed as a table and an index inside it. */
function resolveSpot(spot, after) {
  const { g, sec } = spot;
  if (spot.guideLevel) return { g, sec: null, table: null, at: 0, guideLevel: true };
  if (spot.row) {
    const at = spot.table.rows.indexOf(spot.row) + (after ? 1 : 0);
    return { g, sec, table: spot.table, at };
  }
  // A section header, or the space after everything in a section.
  const tables = sec.chunks.filter((c) => c.kind === 'table');
  if (spot.atTop) {
    let t = tables[0];
    if (!t) { t = blankTable(); sec.chunks.unshift(t); sec.dirty = true; }
    return { g, sec, table: t, at: 0 };
  }
  let t = tables[tables.length - 1];
  if (!t) { t = blankTable(); sec.chunks.push(t); sec.dirty = true; }
  return { g, sec, table: t, at: t.rows.length };
}

function moveRowTo(row, spot, after) {
  const { g, sec, table, at, guideLevel } = resolveSpot(spot, after);
  if (guideLevel) { toast('A block has to live in a section'); return; }
  dropRow(g, row, table, sec, at);
  S.sel = row; mark(); render(); keepVisible();
}

const NEW_CONTENT = { content: '', visual: '[Visual] ', chart: '[Chart] ', divider: '[Divider]' };

/**
 * Relocate an existing subsection heading or reference card to wherever it
 * was dropped — the same {table, at} spot a fresh drop from the palette
 * lands on, via the same splitAt. Dragging one is just this with the target
 * chosen by hand instead of by one step.
 */
function moveChunkTo(chunk, fromSec, spot, after) {
  const { g, sec, table, at, guideLevel } = resolveSpot(spot, after);
  if (guideLevel) {
    toast(chunk.kind === 'sub' ? 'A subsection has to live in a section' : 'A reference has to live in a section');
    return;
  }
  const i = fromSec.chunks.indexOf(chunk);
  if (i === -1) return;
  fromSec.chunks.splice(i, 1);
  fromSec.dirty = true;
  splitAt(sec, table, at, chunk);
  sec.dirty = true;
  mark(); render();
}

function addAt(what, spot, after) {
  const { g, sec, table, at, guideLevel } = resolveSpot(spot, after);

  if (guideLevel) {
    // Only a reference can stand on its own outside a section — everything
    // else is content, and content lives in one.
    if (what !== 'reference') {
      toast('Only a reference can sit outside a section');
      return;
    }
    addGuideRef(g, 'See [[]] — why');
    mark(); render();
    setTimeout(() => { const r = $('stage').querySelector('.ref.unset'); if (r) r.click(); }, 30);
    return;
  }

  if (NEW_CONTENT[what] !== undefined) {
    const rw = addRow(table, sec, { content: NEW_CONTENT[what], at });
    S.sel = rw; mark(); render();
    if (what !== 'divider') focusSoon('.rowsel .lbl');
    return;
  }

  if (what === 'subsection' || what === 'reference') {
    const made = splitAt(sec, table, at, what === 'subsection'
      ? { kind: 'sub', src: ['#### Actions'], title: 'Actions', dirty: true }
      : { kind: 'ref', src: ['> See [[]] — why'], target: '', text: 'See [[]] — why', refs: [], dirty: true });
    sec.dirty = true; mark(); render();
    if (what === 'subsection') focusSoon('.guide .sub-t');
    else setTimeout(() => {
      const r = [...document.querySelectorAll('.ref.unset')][0];
      if (r) r.click();
    }, 30);
    return made;
  }

  if (what === 'section') {
    const to = g.sections.indexOf(sec) + (after || spot.row || !spot.atTop ? 1 : 0);
    const ns = addSection(g, 'New section');
    const i = g.sections.indexOf(ns);
    g.sections.splice(i, 1);
    g.sections.splice(to, 0, ns);
    mark(); render();
    focusSoon('.guide .sec-title');
  }
}

// ---------------------------------------------------------------- guide view
function renderGuide(host) {
  const stage = host || $('stage');
  // Clicking the page around the guide lets go of whatever was selected.
  if (!S.guide) { stage.appendChild(el('div', 'rail-empty', 'No guide selected.')); return; }
  const g = S.guide;
  const stacked = !host && guideStacked();
  const grid = el('div', 'guide' + (stacked ? ' stacked' : ''));
  const cells = [];
  const laneRows = [];

  let rowNo = 0;
  const gridRow = (bandCls) => {
    const l = el('div', 'lane lane-l');
    const c = el('div', 'cell');
    const r = el('div', 'lane lane-r');
    l.style.gridRow = c.style.gridRow = r.style.gridRow = String(++rowNo);
    // Stacked, the lanes join their cell once the row is filled (see below).
    if (stacked) { grid.append(c); laneRows.push({ l, c, r }); }
    else grid.append(l, c, r);
    cells.push(c);
    if (bandCls === undefined) return { l, c, r, host: c };
    const band = el('div', 'band' + (bandCls ? ' ' + bandCls : ''));
    c.appendChild(band);
    return { l, c, r, host: band, band };
  };
  const drops = [];
  const gap = () => { const { c } = gridRow(); c.classList.add('gap'); };

  if (!S.present) {
    const head = gridRow();
    cells.pop();                       // the labels sit above the stack, not in it
    head.c.className = 'lanehead';
    head.l.appendChild(el('div', 'lanelbl', 'Notes'));
    head.r.appendChild(el('div', 'lanelbl', 'Functionality'));
  }

  const heads = guideRefs(g);
  if (heads.length || (!S.readOnly && !S.present)) {
    const top = gridRow('');
    top.band.classList.add('open', 'close', 'guidelevel');
    if (!heads.length) top.c.classList.add('emptytop');
    heads.forEach((r, i) => top.host.appendChild(guideRefCard(g, r, i)));
    if (!S.readOnly && !S.present) dropZone(top.c, { g, guideLevel: true });
  }

  for (const sec of g.sections) {
    if (sec.kind === 'sources') continue;
    const secStart = cells.length;
    const rowStart = rowNo;
    const mine = [];
    const title = gridRow('open');
    mine.push(title.band);
    title.host.appendChild(sectionTitle(g, sec));
    title.c.classList.add('sechead');
    if (!S.readOnly && !S.present) dropZone(title.c, { g, sec, atTop: true });
    if (!S.readOnly && !S.present) {
      const more = menuButton('secmore', 'Add to this section, move it, or delete it');
      more.onclick = (e) => { e.stopPropagation(); sectionMenu(more, g, sec); };
      title.host.appendChild(more);
    }

    // The first row of a section's own content sits right under the heading's
    // surface, which is a different colour and reads as a hard edge — so it
    // gets the heading's own breathing room (the .open padding), the same way
    // the section's last row gets it back at the bottom via .close.
    let firstContent = true;
    const contentCls = () => { const c = firstContent ? 'open' : ''; firstContent = false; return c; };

    // The line of prose under a heading is part of the guide and editable like
    // everything else — but it is optional, so an empty one is not a permanent
    // placeholder on every section. Add it from the section menu.
    const prose = sec.chunks.find((c) => c.kind === 'raw' && !/^\s*\|/m.test(c.src.join('\n')));
    const hasProse = !!(prose && proseOf(prose));
    if (hasProse || S.addProse === sec) {
      const pRow = gridRow(contentCls()); mine.push(pRow.band);
      pRow.host.appendChild(sectionProse(g, sec, prose));
    }


    for (const chunk of sec.chunks) {
      if (chunk.kind === 'raw') {
        if (chunk === prose) continue;
        const text = chunk.src.join('\n').trim();
        if (!text) continue;
        const row = gridRow(contentCls()); mine.push(row.band);
        // Nothing added to a guide is allowed to be stuck here — unreadable
        // by the parser as a block, and, before this, also uneditable and
        // undeletable from the UI. Text that lands here (an odd paste, a
        // table missing its Content column, a stray paragraph) still needs a
        // way out that does not mean opening the file by hand.
        const w = el('div', 'rawblock');
        w.title = "Not shaped like a block priority guide understands, so it is shown as text — "
          + 'edit it in place, or remove it.';
        const t = el('div', 'text');
        t.textContent = text;
        if (!S.readOnly && !S.present) {
          t.contentEditable = 'plaintext-only';
          t.spellcheck = false;
          t.tabIndex = 0;
          t.onblur = () => {
            const v = t.textContent;
            if (v.trim() === text) return;
            const src = chunk.src;
            let i = 0; while (i < src.length && !src[i].trim()) i++;
            let j = src.length - 1; while (j >= i && !src[j].trim()) j--;
            chunk.src = [...src.slice(0, i), ...v.split('\n'), ...src.slice(j + 1)];
            sec.dirty = true;
            mark(); render();
          };
          t.onkeydown = (e) => {
            if (e.metaKey || e.ctrlKey) return;
            if (e.key === 'Escape') { e.preventDefault(); t.textContent = text; t.blur(); }
            else e.stopPropagation();
          };
        }
        w.appendChild(t);
        if (!S.readOnly && !S.present) {
          const x = el('button', 'x', '×');
          x.title = 'Remove this text';
          x.onclick = async (e) => {
            e.stopPropagation();
            if (!await confirmDelete('this text', "It is not part of any block, so nothing else depends on it.")) return;
            const back = sec.chunks.indexOf(chunk);
            sec.chunks.splice(back, 1);
            sec.dirty = true; mark(); render();
            undoable('Text', () => { sec.chunks.splice(back, 0, chunk); sec.dirty = true; });
          };
          w.appendChild(x);
        }
        row.host.appendChild(w);
      } else if (chunk.kind === 'sub') {
        const row = gridRow(contentCls()); mine.push(row.band);
        const w = el('div', 'sub');
        if (!S.readOnly && !S.present) {
          const grip = el('span', 'grip');
          grip.appendChild(icon('grip', 12));
          grip.title = 'Drag to move this subsection';
          w.appendChild(grip);
        }
        const h = el('div', 'sub-t');
        h.textContent = chunk.title;
        editable(h, chunk.title, (v) => { chunk.title = v || 'Untitled'; chunk.dirty = true; sec.dirty = true; });
        w.appendChild(h);
        if (!S.readOnly && !S.present) {
          const more = menuButton('submore', 'Move or delete this subsection');
          more.onclick = (e) => { e.stopPropagation(); markerMenu(more, sec, chunk, 'subsection'); };
          w.appendChild(more);
          dragMarker(w, row, sec, chunk);
        }
        row.host.appendChild(w);
      } else if (chunk.kind === 'ref') {
        const row = gridRow(contentCls()); mine.push(row.band);
        const p = el('div', 'ref' + (chunk.target ? '' : ' unset'));
        if (chunk.target) setLinked(p, chunk.text, g);
        else p.textContent = S.readOnly ? 'Reference — nothing chosen' : 'Choose what this references';
        if (!S.readOnly && !S.present) {
          p.setAttribute('role', 'button');
          p.tabIndex = 0;
          p.title = 'Choose the guide this points at';
          p.onclick = (e) => { if (e.target.closest('a,.more,.grip')) return; openRefPicker(p, g, sec, chunk); };
          const grip = el('span', 'grip');
          grip.appendChild(icon('grip', 12));
          grip.title = 'Drag to move this reference';
          p.appendChild(grip);
          const more = menuButton('refmore', 'Move or delete this reference');
          more.onclick = (e) => { e.stopPropagation(); markerMenu(more, sec, chunk, 'reference'); };
          p.appendChild(more);
          dragMarker(p, row, sec, chunk);
        }
        row.host.appendChild(p);
      } else if (chunk.kind === 'table') {
        for (const rw of chunk.rows) {
          const row = gridRow(contentCls()); mine.push(row.band);
          paintRow(row, g, sec, chunk, rw);
          if (!S.readOnly && !S.present) dropZone(row.c, { g, sec, table: chunk, row: rw });
        }
      }
    }
    if (mine.length) mine[mine.length - 1].classList.add('close');
    if (!S.readOnly && !S.present) {
      const tail = gridRow('');
      mine.push(tail.band);
      tail.c.classList.add('tail');
      tail.host.appendChild(el('div', 'tailhint'));
      dropZone(tail.c, { g, sec, endOnly: true });
      mine[mine.length - 2].classList.remove('close');
      tail.band.classList.add('close');
    }
    if (cells.length > secStart) {
      cells[secStart].classList.add('top');
      cells[cells.length - 1].classList.add('bot');
      const paper = el('div', 'paper');
      paper.style.gridRow = `${rowStart + 1} / ${rowNo + 1}`;
      grid.appendChild(paper);
    }
    gap();
  }
  if (!g.sections.some((s) => s.kind === 'section')) {
    stage.appendChild(el('div', 'rail-empty', 'Nothing here yet. Add a section from the toolbar below.'));
    return;
  }
  // The zoom frame. The guide lays out at 1/zoom of the frame's width and is
  // then scaled back onto it, so zooming out really does fit more on screen
  // rather than just drawing the same columns smaller.
  if (stacked) {
    for (const { l, c, r } of laneRows) {
      if (l.childNodes.length) c.appendChild(l);
      if (r.childNodes.length) c.appendChild(r);
    }
  }
  const frame = el('div', 'gzoom');
  if (S.present) frame.appendChild(readingContext(g));
  frame.appendChild(grid);
  stage.appendChild(frame);
  sizeZoomFrame(frame, grid);
}

/**
 * Reading mode hides both rails, and the guide's goals, users, sources and
 * design links lived in the right one — so reading a guide meant reading it
 * without the things that say who it is for and what it is answering. They
 * come inline here instead, read-only, above the stack.
 */
function readingContext(g) {
  const box = el('div', 'rctx');
  const dl = el('dl');
  let any = false;
  for (const k of ['type', 'userGoal', 'businessGoal', 'primaryUsers', 'notes']) {
    const raw = (g.fields[k] || '').trim();
    if (!raw) continue;
    any = true;
    dl.appendChild(el('dt', null, FIELD_LABELS[k] || k));
    const dd = el('dd', raw === '??' ? 'unknown' : '');
    if (raw === '??') dd.textContent = '?? — nobody has been asked';
    else setLinked(dd, raw, g);
    dl.appendChild(dd);
  }
  if (any) box.appendChild(dl);

  const cited = sourceUsage(S.doc).all
    .filter((x) => x.cites.some((c) => c.guide === g.name));
  const designs = designLinks(S.doc, g);
  const foot = el('div', 'rctx-f');
  const list = (title, items, make) => {
    if (!items.length) return;
    const h = el('div', 'rctx-h', title);
    foot.appendChild(h);
    const ul = el('div', 'rctx-l');
    items.forEach((x) => ul.appendChild(make(x)));
    foot.appendChild(ul);
  };
  list('Design', designs, (d) => outLink(d.url, d.title || d.handle, d.title));
  list('Sources', cited, (x) => outLink(x.url, x.title || x.handle, x.title));
  const routes = links(S.doc).routes.filter((r) => r.from === g.name);
  list('Goes to', routes, (r) => {
    const a = el('a', null, r.to);
    a.href = '#'; a.dataset.goto = r.to;
    return a;
  });
  if (foot.children.length) box.appendChild(foot);
  return box.children.length ? box : el('div');
}

/** A reference that belongs to the guide rather than to one of its sections. */
function guideRefCard(g, r, i) {
  const p = el('div', 'ref' + (r.target ? '' : ' unset'));
  if (r.target) setLinked(p, r.text, g);
  else p.textContent = S.readOnly ? 'Reference — nothing chosen' : 'Choose what this references';
  if (S.readOnly || S.present) return p;

  p.setAttribute('role', 'button');
  p.tabIndex = 0;
  p.title = 'Choose the guide this points at';
  const chunk = {
    get text() { return guideRefs(g)[i] ? guideRefs(g)[i].text : ''; },
    set text(v) { setGuideRef(g, i, v); },
    get target() { return guideRefs(g)[i] ? guideRefs(g)[i].target : ''; },
    set target(v) { /* written through text */ },
    set refs(v) { /* derived */ },
    set dirty(v) { /* headerSrc is the source */ },
    set src(v) { /* headerSrc is the source */ }
  };
  p.onclick = (e) => { if (e.target.closest('a')) return; openRefPicker(p, g, null, chunk); };
  const del = el('button', 'refx', '×');
  del.title = 'Remove this reference';
  del.onclick = async (e) => {
    e.stopPropagation();
    if (!await confirmDelete('this reference', 'The guide it points at is untouched.')) return;
    removeGuideRef(g, i);
    mark(); render();
  };
  p.appendChild(del);
  return p;
}

function sectionTitle(g, sec) {
  const t = el('h2', 'sec-title');
  t.textContent = sec.title;
  editable(t, sec.title, (v) => { sec.title = v || 'Untitled'; sec.dirtyHeading = true; });
  return t;
}

function sectionProse(g, sec, chunk) {
  const p = el('div', 'sec-note');
  const cur = chunk ? proseOf(chunk) : '';
  if (cur) setLinked(p, cur, g);
  else blankable(p, '', 'Add a line of clarity — “likely a table”, “filters above the results”');
  editable(p, cur, (v) => {
    if (chunk) { setProse(chunk, sec, v); return; }
    if (!v) return;
    const c = { kind: 'raw', src: ['', `*${v}*`, ''], dirty: true };
    sec.chunks.unshift(c);
    sec.dirty = true;
  });
  return p;
}

/** Everything a section can do, from one button that is always in the same place. */
function sectionMenu(anchor, g, sec) {
  const prose = sec.chunks.find((c) => c.kind === 'raw' && !/^\s*\|/m.test(c.src.join('\n')));
  const items = [];
  if (!(prose && proseOf(prose))) {
    items.push({ glyph: 'plus', label: 'Add a line of clarity', fn: () => {
      S.addProse = sec; render();
      focusSoon('.guide .sec-note');
    } });
  }
  // The Sources block, if there is one, always stays last — it is not a
  // section to reorder against, so it is left out of "how many are there".
  const list = g.sections.filter((s) => s.kind !== 'sources');
  const i = list.indexOf(sec);
  items.push(
    { glyph: 'up', label: 'Move up', disabled: i <= 0,
      fn: () => { if (moveSection(g, sec, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move down', disabled: i === -1 || i === list.length - 1,
      fn: () => { if (moveSection(g, sec, 1)) { mark(); render(); } } },
    { sep: true }
  );
  openMenu(anchor, items.concat([
    { glyph: 'trash', label: 'Delete section', danger: true, fn: async () => {
      if (!await confirmDelete(`the section “${sec.title}”`,
        'Every block in it goes too. You can undo this straight afterwards.')) return;
      const back = g.sections.indexOf(sec);
      g.sections.splice(back, 1);
      g.dirty = true; S.sel = null; mark(); render();
      undoable(`“${sec.title}”`, () => { g.sections.splice(back, 0, sec); g.dirty = true; });
    } }
  ]));
}

/**
 * Everything a subsection heading or a reference card can do. Moving either
 * one is a single step — past exactly one row, or past a neighbouring marker
 * if there is no row between them — the same step a drag would land on if you
 * nudged it one place. A subsection heading carries nothing with it: the rows
 * it used to introduce stay exactly where they are, now unlabelled.
 */
function markerMenu(anchor, sec, chunk, kind) {
  const { canUp, canDown } = markerStep(sec, chunk);
  openMenu(anchor, [
    { glyph: 'up', label: 'Move up', disabled: !canUp,
      fn: () => { if (moveMarker(sec, chunk, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move down', disabled: !canDown,
      fn: () => { if (moveMarker(sec, chunk, 1)) { mark(); render(); } } },
    { sep: true },
    { glyph: 'trash', label: `Delete ${kind}`, danger: true, fn: async () => {
      const body = kind === 'subsection'
        ? 'The heading goes; the blocks under it stay, now unlabeled. You can undo this straight afterwards.'
        : 'The guide it points at is untouched.';
      if (!await confirmDelete(`this ${kind}`, body)) return;
      const back = sec.chunks.indexOf(chunk);
      sec.chunks.splice(back, 1);
      sec.dirty = true; mark(); render();
      if (kind === 'subsection') {
        undoable(`“${chunk.title}”`, () => { sec.chunks.splice(back, 0, chunk); sec.dirty = true; });
      }
    } }
  ]);
}

// ---------------------------------------------------------------- comments
/**
 * Notes to yourself, pinned to a block.
 *
 * Distinct from a Note, which is part of the guide and travels to whoever reads
 * it. A comment is working material — a question to come back to, a thing to
 * check — so it can be switched off entirely, and the guide underneath is
 * exactly what it was.
 */
function commentBubble(ctx) {
  const { g, sec, table, rw } = ctx;
  const mine = rw.rid ? commentsFor(S.doc, rw.rid) : [];
  const open = mine.filter((c) => !c.done).length;
  if (!mine.length && (S.readOnly || S.present)) return null;

  const b = el('button', 'bubble' + (open ? ' has' : mine.length ? ' done' : ' none'));
  b.appendChild(icon('bubble', 12));
  if (mine.length) b.appendChild(el('span', null, String(open || mine.length)));
  b.title = mine.length
    ? `${mine.length} comment${mine.length === 1 ? '' : 's'}${open ? `, ${open} open` : ', all resolved'}`
    : 'Comment on this block';
  b.onclick = (e) => {
    e.stopPropagation();
    if (!rw.rid && !S.readOnly) { ensureRid(S.doc, rw, table, sec); mark(); }
    openThread(b, ctx);
  };
  b.dataset.rid = rw.rid || '';
  return b;
}

/**
 * One comment, wherever it is shown. The thread on a block and the list in the
 * panel are two views of the same thing, so they are one piece of code — a
 * resolve that behaved differently in the list than on the block would be a bug
 * waiting to happen.
 *
 * Comments are looked up fresh by position at click time: a save re-parses the
 * file, and the object this card was built from is gone by then.
 */
function commentCard(rid, i, repaint) {
  const live = () => commentsFor(S.doc, rid)[i] || null;
  const c = live();
  if (!c) return null;
  const card = el('div', 'tc' + (c.done ? ' done' : ''));

  const tick = el('button', 'tick' + (c.done ? ' on' : ''));
  tick.appendChild(icon(c.done ? 'tick' : 'circle', 12));
  tick.title = c.done ? 'Reopen' : 'Resolve';
  tick.onclick = (e) => {
    e.stopPropagation();
    const now = live();
    if (now) resolveComment(S.doc, now);
    mark(); repaint();
  };
  card.appendChild(tick);

  const t = el('div', 't');
  t.textContent = c.text;
  if (!S.readOnly) {
    editableInPlace(t, c.text, (v) => {
      const now = live();
      if (!now) return;
      if (!v) removeComment(S.doc, now); else setComment(S.doc, now, v);
      mark(); repaint();
    });
  }
  card.appendChild(t);

  if (!S.readOnly) {
    const x = el('button', 'x', '×');
    x.title = 'Delete this comment';
    x.onclick = async (e) => {
      e.stopPropagation();
      if (!await confirmDelete('this comment')) return;
      const now = live();
      if (!now) return;
      const was = { rid: now.rid, text: now.text, done: now.done };
      removeComment(S.doc, now);
      mark(); repaint();
      undoable('Comment', () => {
        const back = addComment(S.doc, was.rid, was.text);
        back.done = was.done;
        repaint();
      });
    };
    card.appendChild(x);
  }
  return card;
}

function openThread(anchor, ctx) {
  closePop();
  const { rw } = ctx;
  const pop = el('div', 'pop thread');
  const list = el('div', 'tlist');
