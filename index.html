  if (open) add(`${open} open`, 'open');
  h.appendChild(sub);
}

function blankTable() {
  const names = ['Content', 'Real data', 'Do', 'Link', 'Form', 'Note'];
  const keys = ['content', 'realData', 'capabilities', 'link', 'form', 'note'];
  return {
    kind: 'table',
    headerSrc: [`| ${names.join(' | ')} |`],
    dividerSrc: [`| ${names.map(() => '---').join(' | ')} |`],
    cols: { keyAt: keys, byKey: Object.fromEntries(keys.map((k, i) => [k, i])), names },
    rows: [], dirty: true
  };
}

// ---------------------------------------------------------------- guide view
function renderGuide() {
  const stage = $('stage');
  if (!S.guide) { stage.appendChild(el('div', 'rail-empty', 'No guide selected.')); return; }
  const g = S.guide;
  const grid = el('div', 'guide');
  const cells = [];

  const gridRow = (bandCls) => {
    const l = el('div', 'lane lane-l');
    const c = el('div', 'cell');
    const r = el('div', 'lane lane-r');
    grid.append(l, c, r);
    cells.push(c);
    if (bandCls === undefined) return { l, c, r, host: c };
    const band = el('div', 'band' + (bandCls ? ' ' + bandCls : ''));
    c.appendChild(band);
    return { l, c, r, host: band, band };
  };
  const gap = () => { const { c } = gridRow(); c.classList.add('gap'); };

  for (const sec of g.sections) {
    if (sec.kind === 'sources') continue;
    const mine = [];
    const title = gridRow('open');
    mine.push(title.band);
    title.host.appendChild(sectionTitle(g, sec));
    title.c.classList.add('sechead');
    if (!S.readOnly && !S.present) {
      const more = menuButton('secmore', 'Add to this section, move it, or delete it');
      more.onclick = (e) => { e.stopPropagation(); sectionMenu(more, g, sec); };
      title.host.appendChild(more);
    }

    // The line of prose under a heading is part of the guide, so it is editable
    // like everything else — and it exists even when the file has no line yet.
    const prose = sec.chunks.find((c) => c.kind === 'raw' && !/^\s*\|/m.test(c.src.join('\n')));
    if (!S.present || (prose && proseOf(prose))) {
      const pRow = gridRow(''); mine.push(pRow.band);
      pRow.host.appendChild(sectionProse(g, sec, prose));
    }


    for (const chunk of sec.chunks) {
      if (chunk.kind === 'raw') {
        if (chunk === prose) continue;
        const text = chunk.src.join('\n').trim();
        if (!text) continue;
        const row = gridRow(''); mine.push(row.band);
        const t = el('div', 'raw-table');
        t.textContent = text;
        t.title = 'This table has no Content column, so priority guide leaves it alone.';
        row.host.appendChild(t);
      } else if (chunk.kind === 'sub') {
        const row = gridRow(''); mine.push(row.band);
        const w = el('div', 'sub');
        const h = el('div', 'sub-t');
        h.textContent = chunk.title;
        editable(h, chunk.title, (v) => { chunk.title = v || 'Untitled'; chunk.dirty = true; sec.dirty = true; });
        w.appendChild(h);
        row.host.appendChild(w);
      } else if (chunk.kind === 'ref') {
        const row = gridRow(''); mine.push(row.band);
        const p = el('div', 'ref' + (chunk.target ? '' : ' unset'));
        if (chunk.target) setLinked(p, chunk.text, g);
        else p.textContent = S.readOnly ? 'Reference — nothing chosen' : 'Choose what this references';
        if (!S.readOnly && !S.present) {
          p.setAttribute('role', 'button');
          p.tabIndex = 0;
          p.title = 'Choose the guide this points at';
          p.onclick = (e) => { if (e.target.closest('a')) return; openRefPicker(p, g, sec, chunk); };
          const del = el('button', 'refx', '×');
          del.title = 'Remove this reference';
          del.onclick = (e) => {
            e.stopPropagation();
            sec.chunks.splice(sec.chunks.indexOf(chunk), 1);
            sec.dirty = true; mark(); render();
          };
          p.appendChild(del);
        }
        row.host.appendChild(p);
      } else if (chunk.kind === 'table') {
        for (const rw of chunk.rows) {
          const row = gridRow(''); mine.push(row.band);
          paintRow(row, g, sec, chunk, rw);
        }
      }
    }
    if (mine.length) mine[mine.length - 1].classList.add('close');
    gap();
  }

  if (cells.length) {
    cells[0].classList.add('top');
    cells[cells.length - 1].classList.add('bot');
  }
  if (!g.sections.some((s) => s.kind === 'section')) {
    stage.appendChild(el('div', 'rail-empty', 'Nothing here yet. Add a section from the toolbar below.'));
    return;
  }
  stage.appendChild(grid);
}

function sectionTitle(g, sec) {
  const t = el('h2', 'sec-title');
  t.textContent = sec.title;
  editable(t, sec.title, (v) => { sec.title = v || 'Untitled'; sec.dirtyHeading = true; });
  return t;
}

function sectionProse(g, sec, chunk) {
  const p = el('div', 'sec-note');
  const cur = chunk ? proseOf(chunk) : '';
  if (cur) setLinked(p, cur, g);
  else blankable(p, '', 'Add a line of clarity — “likely a table”, “filters above the results”');
  editable(p, cur, (v) => {
    if (chunk) { setProse(chunk, sec, v); return; }
    if (!v) return;
    const c = { kind: 'raw', src: ['', `*${v}*`, ''], dirty: true };
    sec.chunks.unshift(c);
    sec.dirty = true;
  });
  return p;
}

/** Everything a section can do, from one button that is always in the same place. */
function sectionMenu(anchor, g, sec) {
  const lastTable = () => {
    const ts = sec.chunks.filter((c) => c.kind === 'table');
    return ts[ts.length - 1] || null;
  };
  const intoTable = () => {
    let t = lastTable();
    if (!t) { t = blankTable(); sec.chunks.push(t); sec.dirty = true; }
    return t;
  };
  const secs = g.sections.filter((x) => x.kind === 'section');
  const at = secs.indexOf(sec);

  openMenu(anchor, [
    { glyph: 'line1', label: 'Add content', hint: 'A data point, a control or an action', fn: () => {
      const rw = addRow(intoTable(), sec, {});
      S.sel = rw; mark(); render(); focusSoon('.rowsel .lbl');
    } },
    { glyph: 'visual', label: 'Add a visual', hint: 'An image, a map, a data visual', fn: () => {
      const rw = addRow(intoTable(), sec, { content: '[Visual] ' });
      S.sel = rw; mark(); render(); focusSoon('.rowsel .lbl');
    } },
    { glyph: 'rule', label: 'Add a divider', hint: 'A rule, to break this section up', fn: () => {
      const rw = addRow(intoTable(), sec, { content: '[Divider]' });
      S.sel = rw; mark(); render();
    } },
    { glyph: 'other', label: 'Add a subsection', hint: 'A split inside this section', fn: () => {
      const i = sec.chunks.length;
      sec.chunks.splice(i, 0, { kind: 'sub', src: ['#### Actions'], title: 'Actions', dirty: true });
      sec.chunks.splice(i + 1, 0, blankTable());
      sec.dirty = true; mark(); render();
      focusSoon('.guide .sub-t:last-of-type');
    } },
    { glyph: 'source', label: 'Add a reference', hint: 'Point at another guide instead of repeating it', fn: () => {
      const c = { kind: 'ref', src: ['> See [[]] — why'], target: '', text: 'See [[]] — why', refs: [], dirty: true };
      sec.chunks.push(c);
      sec.dirty = true; mark(); render();
      setTimeout(() => { const r = [...document.querySelectorAll('.ref')].pop(); if (r) r.click(); }, 30);
    } },
    { sep: true },
    { glyph: 'plus', label: 'Add a section below', fn: () => {
      const to = g.sections.indexOf(sec) + 1;
      const ns = addSection(g, 'New section');
      const i = g.sections.indexOf(ns);
      g.sections.splice(i, 1);
      g.sections.splice(to, 0, ns);
      mark(); render();
      focusSoon('.guide .sec-title');
    } },
    { glyph: 'up', label: 'Move section up', disabled: at === 0,
      fn: () => { if (moveSection(g, sec, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move section down', disabled: at === secs.length - 1,
      fn: () => { if (moveSection(g, sec, 1)) { mark(); render(); } } },
    { sep: true },
    { glyph: 'trash', label: 'Delete section', danger: true, fn: () => {
      const n = sec.chunks.filter((c) => c.kind === 'table').reduce((a, c) => a + c.rows.length, 0);
      if (!confirm(`Delete “${sec.title}”${n ? ` and its ${n} block${n === 1 ? '' : 's'}` : ''}?`)) return;
      g.sections.splice(g.sections.indexOf(sec), 1);
      g.dirty = true; S.sel = null; mark(); render();
    } }
  ]);
}

// ---------------------------------------------------------------- one row
/**
 * The middle says what the thing is called and what its data actually looks
 * like. The right says what it does. The left holds everything else — a rule, a
 * link, something someone said, a follow-up.
 *
 * Every control that acts on a row lives on the row, revealed on hover and
 * positioned out of flow, so nothing moves and nothing has to be hunted for at
 * the bottom of the screen.
 */
function paintRow(row, g, sec, table, rw) {
  const ctx = { g, sec, table, rw };
  if (rw === S.sel) [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));

  const kind = rw.content.kind || (rw.content.type === 'Visual' ? 'visual' : 'text');

  // ---- a divider is a rule and nothing else
  if (kind === 'divider') {
    const item = el('div', 'item divider');
    item.appendChild(el('div', 'rule'));
    if (!S.readOnly && !S.present) item.appendChild(rowTools(ctx, kind));
    row.host.appendChild(item);
    if (!S.readOnly && !S.present) { wireSelect(item, row, rw); wireDrag(row, ctx); }
    return;
  }

  const hasForm = !!rw.form.type;
  const hasLink = !!rw.link.type;
  const visual = kind === 'visual' || kind === 'chart';
  const item = el('div', 'item' + (visual ? ' visual' : hasForm ? '' : hasLink ? ' linky' : ' plain'));
  const box = el('div', 'box');
  if (visual) {
    const gl = icon(kind === 'chart' ? (CHART_GLYPH[rw.content.chart] || 'chartother') : 'visual', 14);
    gl.classList.add('kindmark');
    box.appendChild(gl);
  }
  const lbl = el('div', 'lbl');
  const label = rw.content.text.trim();
  if (isUnknown(label)) lbl.innerHTML = '<span class="unk">?? not known</span>';
  else blankable(lbl, label, visual ? 'What is the visual of?' : 'What is it called?');
  editable(lbl, label, (v) => {
    rw.content = { ...rw.content, text: v };
    touchRow(rw, table, sec);
  });
  box.appendChild(lbl);
  if (rw.form.type === 'single select' || rw.form.type === 'multi select') {
    const ch = icon('chev', 13); ch.classList.add('chev'); box.appendChild(ch);
  }
  item.appendChild(box);

  const cur = rw.realData;
  const makeExample = (value) => {
    const eg = el('div', 'eg');
    if (isUnknown(value)) { eg.classList.add('unk'); eg.textContent = value; }
    else if (value) setLinked(eg, value, g);
    editable(eg, value, (v) => { rw.realData = v; touchRow(rw, table, sec); });
    return eg;
  };
  if (cur) item.appendChild(makeExample(cur));

  const openExample = () => {
    if (item.querySelector('.eg')) { focusSoon(item.querySelector('.eg')); return; }
    const eg = makeExample('');
    item.insertBefore(eg, item.querySelector('.rowtools') || null);
    focusSoon(eg);
  };
  lbl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); lbl.blur(); openExample(); }
  });

  if (!S.readOnly && !S.present) item.appendChild(rowTools(ctx, kind, cur ? null : openExample));
  row.host.appendChild(item);

  if (!S.present) {
    for (const f of lintRow(rw)) {
      const n = el('div', 'flag');
      if (f.kind === 'visual-answer') n.innerHTML = '<b>&ldquo;' + esc(f.word) + '&rdquo;</b> is a visual answer. ' + esc(f.ask);
      else if (f.kind === 'unknown-form') n.textContent = '"' + f.word + '" is not one of the form types.';
      else if (f.kind === 'unknown-link') n.textContent = '"' + f.word + '" is not one of the link types.';
      row.host.appendChild(n);
    }
  }

  // ---- left: notes
  const notes = el('div', 'notes');
  rw.note.forEach((n, i) => notes.appendChild(noteCard(ctx, n, i)));
  if (!S.readOnly && !S.present) {
    const add = el('button', 'addnote');
    add.appendChild(icon('plus', 11));
    add.appendChild(el('span', null, 'note'));
    add.title = 'A rule, a link, something said in a session, or a follow-up';
    add.onclick = (e) => {
      e.stopPropagation();
      rw.note.push({ text: '', action: false });
      S.sel = rw; S.newRowNote = rw; render();
      focusSoon('.rowsel .note.fresh .t');
    };
    notes.appendChild(add);
  }
  row.l.appendChild(notes);
  if (rw.note.length) row.l.appendChild(el('div', 'lead'));

  // ---- right: functionality only
  const hasFn = !!(rw.link.type || rw.form.type || rw.capabilities.length);
  const lead = el('div', 'lead');
  if (!hasFn) lead.style.borderColor = 'transparent';
  row.r.appendChild(lead);
  row.r.appendChild(fnCard(ctx));

  if (S.readOnly || S.present) return;
  wireSelect(item, row, rw);
  wireDrag(row, ctx);
}

const CHART_GLYPH = {
  pie: 'pie', bar: 'bar', line: 'linechart', table: 'gridicon',
  number: 'number', map: 'mapicon', other: 'chartother'
};
const KIND_LABEL = { text: 'text', visual: 'visual', chart: 'data visual', divider: 'divider' };

/** What a row's own controls are: move it, add after it, change what it is. */
function rowTools(ctx, kind, openExample) {
  const { g, sec, table, rw } = ctx;
  const tools = el('div', 'rowtools');
  const icoBtn = (glyph, title, fn, disabled) => {
    const b = el('button', 'ic');
    b.appendChild(icon(glyph, 12));
    b.title = title;
    b.disabled = !!disabled;
    b.onclick = (e) => { e.stopPropagation(); fn(); };
    return b;
  };
  const rows = table.rows;
  const at = rows.indexOf(rw);
  const tabs = tablesOf(g);
  const ti = tabs.findIndex((t) => t.table === table);
  tools.appendChild(icoBtn('up', 'Move up', () => {
    S.sel = rw; if (moveRow(g, rw, -1, true)) { mark(); render(); keepVisible(); }
  }, at === 0 && ti === 0));
  tools.appendChild(icoBtn('down', 'Move down', () => {
    S.sel = rw; if (moveRow(g, rw, 1, true)) { mark(); render(); keepVisible(); }
  }, at === rows.length - 1 && ti === tabs.length - 1));
  tools.appendChild(icoBtn('plus', 'Add a block below this one', () => insertBelow(g, sec, table, rw)));

  const k = el('button', 'kind');
  k.textContent = kind === 'chart'
    ? (rw.content.chart ? rw.content.chart : 'data visual')
    : KIND_LABEL[kind];
  k.title = 'What this block is. Changing it keeps everything else.';
  k.onclick = (e) => { e.stopPropagation(); S.sel = rw; openKindPicker(k, ctx); };
  tools.appendChild(k);

  const more = menuButton('rowmore', 'More for this block');
  more.onclick = (e) => {
    e.stopPropagation();
    S.sel = rw;
    openMenu(more, [
      ...(openExample && kind !== 'divider'
        ? [{ glyph: 'line1', label: 'Add an example', hint: 'What the data really looks like', fn: openExample }]
        : []),
      { glyph: 'note', label: 'Add a note', hint: 'A rule, a link, or a follow-up', fn: () => {
        rw.note.push({ text: '', action: false });
        S.newRowNote = rw; render();
        focusSoon('.rowsel .note.fresh .t');
      } },
      { glyph: 'plus', label: 'Duplicate', fn: () => {
        const copy = addRow(table, sec, { at: rows.indexOf(rw) + 1 });
        copy.content = { ...rw.content };
        copy.realData = rw.realData;
        copy.capabilities = rw.capabilities.slice();
        copy.link = { ...rw.link };
        copy.form = { ...rw.form };
        copy.note = rw.note.map((n) => ({ ...n }));
        touchRow(copy, table, sec);
        S.sel = copy; mark(); render(); focusSoon('.rowsel .lbl');
      } },
      { sep: true },
      { glyph: 'trash', label: 'Delete block', danger: true, fn: () => {
        rows.splice(rows.indexOf(rw), 1);
        table.dirty = true; sec.dirty = true;
        S.sel = null; mark(); render();
      } }
    ]);
  };
  tools.appendChild(more);
  return tools;
}

function wireSelect(item, row, rw) {
  const lightSelect = () => {
    if (S.sel === rw) return;
    S.sel = rw;
    document.querySelectorAll('.rowsel').forEach((n) => n.classList.remove('rowsel'));
    [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));
  };
  item.onmousedown = (e) => { if (e.target.closest('.lbl,.eg')) lightSelect(); };
  item.onclick = (e) => {
    if (e.target.closest('.lbl,.eg,a,button')) return;
    e.stopPropagation();
    if (S.sel !== rw || S.selSection) { S.sel = rw; S.selSection = null; render(); }
  };
}

// ---------------------------------------------------------------- what a block is
/**
 * Changing a block's kind must keep its notes, its example and its
 * functionality. Rebuilding a block by hand and copying the notes across is the
 * clunky workaround this exists to remove.
 */
function openKindPicker(anchor, ctx) {
  closePop();
  const { sec, table, rw } = ctx;
  const pop = el('div', 'pop kindpop');
  const now = rw.content.kind || (rw.content.type === 'Visual' ? 'visual' : 'text');

  const apply = (kind, chart) => {
    setKind(rw, kind, chart);
    touchRow(rw, table, sec);
    mark(); closePop(); render();
  };

  pop.appendChild(el('div', 'pop-h', 'What this block is'));
  const list = el('div', 'kinds');
  const opt = (kind, glyph, label, blurb, chart) => {
    const on = now === kind && (kind !== 'chart' || (rw.content.chart || '') === (chart || ''));
    const b = el('button', 'kindopt' + (on ? ' on' : ''));
    b.appendChild(icon(glyph, 15));
    const t = el('div');
    t.appendChild(el('div', 'n', label));
    if (blurb) t.appendChild(el('div', 'b', blurb));
    b.appendChild(t);
    b.onclick = () => apply(kind, chart);
    list.appendChild(b);
  };
  opt('text', 'line1', 'Content', 'A data point, a control or an action');
  opt('visual', 'visual', 'Visual', 'An image, a map, a photo');
  opt('divider', 'rule', 'Divider', 'A rule, to break a section up');
  pop.appendChild(list);

  pop.appendChild(el('div', 'pop-h', 'Data visual'));
  const charts = el('div', 'charts');
  const chartOpt = (chart, glyph, label) => {
    const on = now === 'chart' && (rw.content.chart || '') === chart;
    const b = el('button', 'chartopt' + (on ? ' on' : ''));
    b.appendChild(icon(glyph, 16));
    b.appendChild(el('span', null, label));
    b.title = label;
    b.onclick = () => apply('chart', chart);
    charts.appendChild(b);
  };
  chartOpt('', 'chartother', 'Not decided');
  chartOpt('pie', 'pie', 'Pie');
  chartOpt('bar', 'bar', 'Bar');
  chartOpt('line', 'linechart', 'Line');
  chartOpt('table', 'gridicon', 'Table');
  chartOpt('number', 'number', 'Single number');
  chartOpt('map', 'mapicon', 'Map');
  pop.appendChild(charts);

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
  };
  setTimeout(() => document.addEventListener('mousedown', popAway), 0);
}

/**
 * Pick the guide a reference points at, with enough of each one on screen to
 * tell them apart. At twenty guides a name alone is not enough to choose from.
 */
function openRefPicker(anchor, g, sec, chunk) {
  closePop();
  const pop = el('div', 'pop refpop');
  pop.appendChild(el('div', 'pop-h', 'This references'));

  const search = el('input');
  search.type = 'text';
  search.placeholder = 'Search guides';
  pop.appendChild(search);

  const list = el('div', 'reflist');
  pop.appendChild(list);

  const why = el('input');
  why.type = 'text';
  why.placeholder = 'Why — “the customer fields are specified there”';
  const m = /^\s*See\s+\[\[[^\]]*\]\]\s*(?:—|-)?\s*(.*)$/i.exec(chunk.text || '');
  why.value = m && m[1] && m[1] !== 'why' ? m[1] : '';
  pop.appendChild(el('div', 'pop-h', 'Why'));
  pop.appendChild(why);

  const write = (name) => {
    const w = why.value.trim();
    chunk.target = name;
    chunk.text = `See [[${name}]]${w ? ` — ${w}` : ''}`;
    chunk.src = [`> ${chunk.text}`];
    chunk.refs = refsIn(chunk.text);
    chunk.dirty = true; sec.dirty = true;
    mark();
  };

  const paint = () => {
    list.innerHTML = '';
    const q = search.value.trim().toLowerCase();
    const options = guides(S.doc).filter((x) => x !== g)
      .filter((x) => !q || x.name.toLowerCase().includes(q)
        || (x.fields.userGoal || '').toLowerCase().includes(q));
    if (!options.length) {
      list.appendChild(el('div', 'rail-empty', q ? 'No guide matches that.' : 'This file has only one guide.'));
      return;
    }
    for (const x of options) {
      const b = el('button', 'refopt' + (chunk.target === x.name ? ' on' : ''));
      b.appendChild(el('div', 'n', x.name));
      const n = rowsOf(x).length;
      const goal = (x.fields.userGoal || '').trim();
      b.appendChild(el('div', 'm', `${n} block${n === 1 ? '' : 's'}`
        + (goal && !isUnknown(goal) ? ` · ${goal.slice(0, 70)}` : '')));
      b.onclick = () => { write(x.name); closePop(); render(); };
      list.appendChild(b);
    }
  };
  search.oninput = paint;
  paint();

  why.onchange = () => { if (chunk.target) { write(chunk.target); render(); } };

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
    if (e.key === 'Enter') {
      const first = list.querySelector('.refopt');
      if (document.activeElement === search && first) first.click();
    }
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); search.focus(); }, 0);
}

function placePop(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 12)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 12)) + 'px';
}

function noteCard(ctx, n, i) {
  const { g, sec, table, rw } = ctx;
  const fresh = !n.text && S.newRowNote === rw;
  const card = el('div', 'note' + (n.action ? ' act' : '') + (fresh ? ' fresh' : ''));
  const only = /^\s*\[[^\[\]]+\]\s*$/.test(n.text);
  const gl = icon(only ? 'source' : 'note', 12);
  gl.classList.add('gl');
  card.appendChild(gl);

  const body = el('div', 'nbody');
  if (n.action) body.appendChild(el('div', 'k', 'ACTION'));
  const t = el('div', 't');
  setLinked(t, n.text, g);
  if (!n.text) blankable(t, '', 'A rule, a link, or something said in the session');
  editable(t, n.text, (v) => {
    S.newRowNote = null;
    if (!v) rw.note.splice(i, 1);
    else n.text = v;
    touchRow(rw, table, sec);
  }, { multiline: true });
  body.appendChild(t);
  card.appendChild(body);

  if (!S.readOnly && !S.present) {
    const tools = el('div', 'tools');
    const a = el('button', null, n.action ? '↩' : '!');
    a.title = n.action ? 'This is settled — stop treating it as a follow-up' : 'Make this a follow-up to circle back on';
    a.onclick = () => { n.action = !n.action; touchRow(rw, table, sec); mark(); render(); };
    tools.appendChild(a);
    const x = el('button', null, '×');
    x.title = 'Delete this note';
    x.onclick = () => { rw.note.splice(i, 1); touchRow(rw, table, sec); mark(); render(); };
    tools.appendChild(x);
    card.appendChild(tools);
  }
  return card;
}

const LINK_SAYS = {
  'onsite page': (t) => t ? ['Opens ', t] : ['Opens another page in the app'],
  'offsite page': (t) => t ? ['Opens ', t, ', outside the app'] : ['Opens a page outside the app'],
  modal: (t) => t ? ['Opens ', t, ' in a modal'] : ['Opens a modal'],
  download: () => ['Downloads a file'],
  upload: () => ['Uploads a file'],
  mailto: () => ['Starts an email'],
  trigger: () => ['Triggers an action in place'],
  other: (t) => t ? ['Goes to ', t] : ['Does something else']
};

function fnCard(ctx) {
  const { g, rw } = ctx;
  const hasAny = rw.link.type || rw.form.type || rw.capabilities.length;
  const card = el('div', 'fn' + (hasAny ? '' : ' empty'));
  card.setAttribute('role', 'button');
  card.tabIndex = S.readOnly || S.present ? -1 : 0;

  if (!hasAny) {
    card.textContent = S.readOnly ? '' : '+ functionality';
    card.title = 'What does this do — go somewhere, take input, or let someone search it?';
  } else {
    if (rw.link.type) {
      const l = el('div', 'l');
      l.appendChild(icon(LINK_GLYPH[rw.link.type] || 'other', 13));
      const say = (LINK_SAYS[rw.link.type] || (() => [rw.link.type]))(rw.link.target);
      const b = el('div');
      say.forEach((part, i) => {
        if (i === 1 && rw.link.target) {
          const known = !!findGuide(S.doc, rw.link.target);
          const t = el(known ? 'a' : 'span', 'tgt' + (known ? '' : ' dead'), rw.link.target);
          if (known) { t.href = '#'; t.dataset.goto = rw.link.target; t.title = 'Go to this guide'; }
          else t.title = 'No guide in this file has that name';
          b.appendChild(t);
        } else b.appendChild(document.createTextNode(part));
      });
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.form.type) {
      const l = el('div', 'l');
      l.appendChild(icon(FORM_GLYPH[rw.form.type] || 'other', 13));
      const b = el('div');
      b.appendChild(document.createTextNode(FORM_SAYS[rw.form.type] || rw.form.type));
      if (rw.form.required) {
        b.appendChild(document.createTextNode(' · '));
        b.appendChild(el('span', 'req', 'required'));
      }
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.capabilities.length) {
      // Words, not icons. Four short labels are read faster than four glyphs
      // nobody has learned yet.
      const l = el('div', 'l');
      if (!rw.link.type && !rw.form.type) l.appendChild(icon('search', 13));
      l.appendChild(el('div', 'caps', rw.capabilities.join(' · ')));
      card.appendChild(l);
    }
  }

  card._ctx = ctx;
  if (S.readOnly || S.present) return card;
  card.onclick = (e) => {
    if (e.target.closest('a')) return;   // a route takes you there instead
    e.stopPropagation(); S.sel = rw; render(); reopenPop();
  };
  card.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.sel = rw; render(); reopenPop(); }
  };
  return card;
}

const FORM_SAYS = {
  'date picker': 'Takes a date',
  'single line': 'Takes a short line of text',
  'multi line': 'Takes several lines of text',
  'single select': 'Takes one from a list',
  'multi select': 'Takes several from a list',
  other: 'Takes input'
};

// ---------------------------------------------------------------- functionality popover
/**
 * Enumerated values need a picker, but a picker is not a form: every change
 * applies the moment it is made, and there is nothing to save.
 */
function openFnPopover(anchor, ctx) {
  closePop();
  const { g, sec, table, rw } = ctx;
  const pop = el('div', 'pop fnpop');
  const apply = () => { touchRow(rw, table, sec); mark(); };

  const field = (label, node, hint) => {
    pop.appendChild(el('label', null, label));
    pop.appendChild(node);
    if (hint) pop.appendChild(el('div', 'hint', hint));
  };

  const lRow = el('div', 'row');
  const lSel = el('select');
  for (const t of LINK_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.link.type || '') === o.value) o.selected = true;
    lSel.appendChild(o);
  }
  const lTar = el('input');
  lTar.type = 'text'; lTar.value = rw.link.target || '';
  lTar.placeholder = 'Which guide or page?';
  lTar.setAttribute('list', 'guidenames');
  const syncL = () => { lTar.style.display = lSel.value ? '' : 'none'; };
  const setLink = () => {
    const target = lTar.value.trim();
    rw.link = { type: lSel.value, target, wiki: !!(target && findGuide(S.doc, target)), raw: '' };
    apply(); syncL();
    const keep = document.activeElement === lTar;
    render();
    if (keep) reopenPop();
  };
  lSel.onchange = setLink;
  lTar.onchange = setLink;
  lTar.oninput = () => { rw.link.target = lTar.value.trim(); rw.link.wiki = !!findGuide(S.doc, lTar.value.trim()); apply(); };
  syncL();
  lRow.append(lSel, lTar);
  field('Goes to', lRow, 'A target naming another guide becomes a route.');

  const fRow = el('div', 'row');
  const fSel = el('select');
  for (const t of FORM_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.form.type || '') === o.value) o.selected = true;
    fSel.appendChild(o);
  }
  const req = el('button', 'tog' + (rw.form.required ? ' on' : ''), 'required');
  req.onclick = () => {
    rw.form = { ...rw.form, required: !rw.form.required };
    apply(); render(); reopenPop();
  };
  req.style.display = rw.form.type ? '' : 'none';
  fSel.onchange = () => {
    rw.form = { type: fSel.value, required: !!(fSel.value && rw.form.required), raw: '' };
    apply(); render(); reopenPop();
  };
  fRow.append(fSel, req);
  field('Takes', fRow, 'What it is, never how it looks — “one from a list”, not “dropdown”.');

  const caps = el('div', 'row');
  for (const c of CAPABILITIES) {
    const b = el('button', 'tog' + (rw.capabilities.includes(c) ? ' on' : ''), c);
    b.onclick = () => {
      const i = rw.capabilities.indexOf(c);
      if (i === -1) rw.capabilities.push(c); else rw.capabilities.splice(i, 1);
      rw.capabilities = CAPABILITIES.filter((x) => rw.capabilities.includes(x));
      apply(); render(); reopenPop();
    };
    caps.appendChild(b);
  }
  field('Can be', caps);

  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth - 280) + 'px';
  pop.style.top = Math.min(r.top, innerHeight - pop.offsetHeight - 12) + 'px';
  S.pop = pop; S.popRow = rw;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
  };
  setTimeout(() => document.addEventListener('mousedown', popAway), 0);
}

function popAway(e) {
  if (S.pop && !S.pop.contains(e.target) && !e.target.closest('.fn')) { closePop(); }
}
function closePop() {
  if (S.pop) S.pop.remove();
  S.pop = null; S.popRow = null;
  document.removeEventListener('mousedown', popAway);
}
/** Keep the picker open across the re-render its own change caused. */
function reopenPop() {
  setTimeout(() => {
    const card = document.querySelector('.lane-r.rowsel .fn');
    if (card && card._ctx) openFnPopover(card, card._ctx);
  }, 0);
}

// ---------------------------------------------------------------- drag
function wireDrag(row, ctx) {
  const { g, sec, table, rw } = ctx;
  const item = row.host.querySelector('.item');
  if (!item) return;
  item.draggable = true;
  item.ondragstart = (e) => {
    S.drag = rw; row.c.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', rw.content.text || 'block');
  };
  item.ondragend = () => {
    S.drag = null;
    document.querySelectorAll('.cell').forEach((x) => x.classList.remove('drag', 'over', 'over-b'));
  };
  row.c.ondragover = (e) => {
    if (!S.drag || S.drag === rw) return;
    e.preventDefault();
    const r = row.c.getBoundingClientRect();
    const below = e.clientY > r.top + r.height / 2;
    row.c.classList.toggle('over', !below);
    row.c.classList.toggle('over-b', below);
  };
  row.c.ondragleave = () => row.c.classList.remove('over', 'over-b');
  row.c.ondrop = (e) => {
    e.preventDefault();
    const below = row.c.classList.contains('over-b');
    row.c.classList.remove('over', 'over-b');
    const moving = S.drag;
    if (!moving || moving === rw) return;
    dropRow(g, moving, table, sec, table.rows.indexOf(rw) + (below ? 1 : 0));
    S.sel = moving; S.drag = null; mark(); render();
  };
}

/** Move a row to an explicit position, possibly in another table. */
function dropRow(g, row, table, sec, at) {
  for (const { table: t, section } of tablesOf(g)) {
    const i = t.rows.indexOf(row);
    if (i === -1) continue;
    const cols = t.cols.names;
    t.rows.splice(i, 1);
    t.dirty = true; section.dirty = true;
    if (t === table && i < at) at--;
    if (JSON.stringify(cols) !== JSON.stringify(table.cols.names)) row.dirty = true;
    break;
  }
  table.rows.splice(Math.max(0, Math.min(at, table.rows.length)), 0, row);
  table.dirty = true; sec.dirty = true;
}

/** Nothing is held in a draft any more, but the picker can be open. */
function commitEditor() { closePop(); }
function focusEditor() { focusSoon('.rowsel .lbl'); }

/** A new block right after this one, which is what "add here" has to mean. */
function insertBelow(g, sec, table, rw) {
  const at = table.rows.indexOf(rw) + 1;
  const row = addRow(table, sec, { at });
  S.sel = row; mark(); render();
  focusSoon('.rowsel .lbl');
  return row;
}

// ---------------------------------------------------------------- right panel
/**
 * Everything that is true of the whole guide rather than one row: what it is
 * for, what it leans on, and what points at it. All at the same altitude,
 * because they are the same kind of fact — and none of it takes width away from
 * the guide itself.
 */
function renderRailRight() {
  const r = $('railR');
  r.innerHTML = '';
  if (S.present || S.view !== 'guide' || !S.guide) { r.style.display = 'none'; return; }
  r.style.display = '';

  const tabs = el('div', 'ptabs');
  const body = el('div', 'pbody');
  const links = backlinks(S.doc, S.guide.name);
  const out = links_out(S.guide);
  const counts = {
    context: 0,
    sources: sourceUsage(S.doc).all.filter((s) => s.cites.some((c) => c.guide === S.guide.name)).length,
    links: links.routes.length + links.references.length + out.length
  };
  for (const [k, label] of [['context', 'Context'], ['sources', 'Sources'], ['links', 'Links']]) {
    const b = el('button', (S.panel || 'context') === k ? 'on' : '');
    b.textContent = label + (counts[k] ? ` ${counts[k]}` : '');
    b.onclick = () => { S.panel = k; render(); };
    tabs.appendChild(b);
  }
  r.append(tabs, body);

  if ((S.panel || 'context') === 'context') panelContext(body);
  else if (S.panel === 'sources') panelSources(body);
  else panelLinks(body, links, out);
}

function links_out(g) {
  return links(S.doc).routes.filter((r) => r.from === g.name);
}

// ---------------------------------------------------------------- context tab
/**
 * What the guide is for. Each field says what it means on request, because
 * "Business goal" is only obvious to the person who wrote the method down.
 */
const FIELD_MEANS = {
  type: 'Screen, or Reference section. A Screen is any contained experience — a page, a dialog, a modal, a side panel. What matters is that it is contained, not what shape it is.',
  userGoal: 'What someone is trying to get done on this screen, and how they go about it. One or two sentences.',
  businessGoal: 'Why the business wants this screen to work — tie it back to the brief. If nobody has said, leave it ?? rather than reasoning one out.'
};

// Type sits last: it is the field you set once and rarely look at again.
const CONTEXT_ORDER = ['userGoal', 'businessGoal', 'primaryUsers', 'notes', 'type'];

function panelContext(body) {
  const g = S.guide;
  const OPTIONAL = ['type'];
  const missing = [];

  for (const key of CONTEXT_ORDER) {
    const val = (g.fields[key] || '').trim();
    if (!val && OPTIONAL.includes(key) && S.shownField !== key) { missing.push(key); continue; }

    const box = el('div', 'ctx');
    const head = el('div', 'ctx-h');
    head.appendChild(el('span', 'lb', FIELD_LABELS[key]));

    if (FIELD_MEANS[key]) {
      const i = el('button', 'info');
      i.appendChild(icon('info', 12));
      i.title = FIELD_MEANS[key];
      i.onclick = () => { S.explain = S.explain === key ? null : key; render(); };
      head.appendChild(i);
    }
    if (key === 'primaryUsers' && !S.readOnly) head.appendChild(addBtn('+ user', () => startUser(g)));
    if (key === 'notes' && !S.readOnly) head.appendChild(addBtn('+ note', () => addGuideNote()));
    box.appendChild(head);

    if (S.explain === key) box.appendChild(el('div', 'means', FIELD_MEANS[key]));

    if (key === 'primaryUsers') box.appendChild(usersField(g));
    else if (key === 'notes') box.appendChild(notesField(g));
    else box.appendChild(textField(g, key, val));
    body.appendChild(box);
  }

  if (missing.length && !S.readOnly) {
    const add = el('div', 'addfield');
    for (const key of missing) {
      const b = el('button', null, '+ ' + FIELD_LABELS[key].toLowerCase());
      b.onclick = () => { S.shownField = key; render(); focusSoon(`.ctx dd[data-key="${key}"]`); };
      add.appendChild(b);
    }
    body.appendChild(add);
  }
}

function addBtn(label, fn) {
  const b = el('button', 'ctx-add', label);
  b.onclick = fn;
  return b;
}

function textField(g, key, val) {
  const dd = el('dd');
  dd.dataset.key = key;
  if (isUnknown(val)) { dd.className = 'unknown'; dd.textContent = val; dd.title = 'Nobody has been asked yet'; }
  else if (val) setLinked(dd, val, g);
  else blankable(dd, '', FIELD_PLACEHOLDER[key], 'empty');
  editable(dd, val, (v) => {
    setField(g, key, v);
    if (S.shownField === key && v) S.shownField = null;
  }, { multiline: true });
  return dd;
}

/**
 * Notes on the guide are separate blocks, the same as notes on a row. Nobody
 * should have to think about how to get two paragraphs into one field.
 */
function notesField(g) {
  const wrap = el('div', 'gnotes');
  const list = parseNoteCell(g.fields.notes);
  if (S.newNote) list.push({ text: '', action: false });
  const commit = () => { S.newNote = false; setField(g, 'notes', renderNoteCell(list)); mark(); };
  if (!list.length) {
    const p = el('div', 'ctx-empty', S.readOnly ? '' : 'Screen-wide context only — scope, phase, why it exists.');
    wrap.appendChild(p);
    return wrap;
  }
  list.forEach((n, i) => {
    const card = el('div', 'gnote');
    const t = el('div', 't');
    setLinked(t, n.text, g);
    if (!n.text) blankable(t, '', 'Note');
    editable(t, n.text, (v) => {
      if (!v) list.splice(i, 1); else n.text = v;
      commit();
    }, { multiline: true });
    if (!n.text) t.addEventListener('blur', () => { if (S.newNote) { S.newNote = false; render(); } });
    card.appendChild(t);
    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Delete this note';
      x.onclick = () => { list.splice(i, 1); commit(); render(); };
      card.appendChild(x);
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function addGuideNote() {
  S.newNote = true;
  render();
  focusSoon('.gnotes .gnote:last-of-type .t');
}

/**
 * A user type is a thing, not a phrase. Picking from what the file already uses
 * is what stops "Sales agent" and "Sales Agent" becoming two groups that are
 * really one.
 */
function usersField(g) {
  const dd = el('dd', 'nofocus');
  dd.dataset.key = 'primaryUsers';
  const raw = (g.fields.primaryUsers || '').trim();
  const list = parseUsers(raw);
  const commit = (next) => { setField(g, 'primaryUsers', renderUsers(next)); mark(); render(); };

  if (!list.length) {
    dd.appendChild(el('div', 'ctx-empty',
      isUnknown(raw) ? '?? nobody has been asked' : (S.readOnly ? '' : 'Who uses this screen, and who uses it most.')));
    if (isUnknown(raw)) dd.firstChild.classList.add('unknown');
    if (S.startUser) dd.appendChild(userInput(list, commit));
    return dd;
  }
  const wrap = el('div', 'chips');
  list.forEach((u, i) => {
    const c = el('span', 'chip' + (u.primary ? ' pri' : ''));
    const t = el('span', 'nm', u.name);
    if (!S.readOnly) {
      t.title = 'Rename this role. It changes everywhere it is used.';
      editable(t, u.name, (v) => {
        if (!v || v === u.name) return;
        const n = renameUserType(S.doc, u.name, v);
        if (n > 1) {
          const b = banner('info', `<b>Renamed in ${n} guides.</b> “${esc(u.name)}” is now “${esc(v)}”.`);
          setTimeout(() => b.remove(), 3000);
        }
      });
    }
    c.appendChild(t);
    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Remove';
      x.onclick = () => commit(list.filter((_, j) => j !== i));
      c.appendChild(x);
    }
    wrap.appendChild(c);
  });
  if (S.startUser) wrap.appendChild(userInput(list, commit));
  dd.appendChild(wrap);
  return dd;
}

function startUser(g) {
  S.startUser = true;
  render();
  focusSoon('.chip input');
}

function userInput(list, commit) {
  const c = el('span', 'chip');
  const inp = el('input');
  inp.setAttribute('list', 'usertypes');
  inp.placeholder = 'user type';
  const done = () => { S.startUser = false; };
  inp.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Enter') {
      const v = inp.value.trim();
      done();
      if (!v) { render(); return; }
      const known = userTypes(S.doc).find((u) => u.name.toLowerCase() === v.toLowerCase());
      commit([...list, { name: known ? known.name : v, primary: false }]);
    } else if (e.key === 'Escape') { done(); render(); }
  };
  inp.onblur = () => setTimeout(() => { if (document.activeElement !== inp) { done(); render(); } }, 120);
  c.appendChild(inp);
  return c;
}

// ---------------------------------------------------------------- sources tab
function panelSources(body) {
  const usage = sourceUsage(S.doc);
  const mine = usage.all.filter((s) => s.cites.some((c) => c.guide === S.guide.name));
  const rest = usage.all.filter((s) => s.def && !mine.includes(s));

  if (!mine.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing attached yet. A brief, a synthesis, a decision — anything this guide leans on.'));
  }
  for (const s of mine) body.appendChild(sourceCard(s, true));

  if (!S.readOnly) {
    const add = el('button', 'rail-add', '+  Add a source');
    add.onclick = () => { add.style.display = 'none'; newSourceForm(add.parentNode, null, S.guide); };
    body.appendChild(add);
  }
  if (rest.length) {
    const h = el('div', 'rail-h', 'Also in this file');
    h.style.marginTop = '20px';
    body.appendChild(h);
    for (const s of rest) body.appendChild(sourceCard(s, false));
  }
}

function sourceCard(s, here) {
  const c = el('div', 'src' + (s.def ? '' : ' bad'));
  if (!s.def) {
    c.appendChild(el('div', 'h', s.handle));
    c.appendChild(el('div', 't', 'Cited in this guide, but no source by that name is defined.'));
    if (!S.readOnly) {
      const fix = el('button', 'quiet', 'Define it');
      fix.onclick = () => { fix.style.display = 'none'; newSourceForm(c, null, null); };
      c.appendChild(fix);
    }
    return c;
  }
  const head = el('div', 'h');
  const link = outLink(s.def.url, s.def.title || s.handle, s.def.url);
  link.classList.add('title');
  head.appendChild(link);
  if (here && !S.readOnly) {
    const x = el('button', 'x', '×');
    x.title = 'Detach from this guide. The source stays in the file.';
    x.onclick = () => detachFromGuide(S.guide, s.handle);
    head.appendChild(x);
  }
  c.appendChild(head);
  c.appendChild(el('div', 'u', shortUrl(s.def.url)));
  if (!here && !S.readOnly) {
    const a = el('button', 'quiet', '+ attach to this guide');
    a.onclick = () => { attachToGuide(S.guide, s.handle); mark(); render(); };
    c.appendChild(a);
  }
  return c;
}

// ---------------------------------------------------------------- links tab
/**
 * What this guide leads to, and what leads here. The second half is the thing a
 * design tool cannot tell you, so it does not belong buried under the guide
 * where nobody scrolls.
 */
function panelLinks(body, back, out) {
  const group = (title, list, render1) => {
    if (!list.length) return;
    const h = el('div', 'rail-h', title);
    h.style.marginTop = body.children.length ? '18px' : '0';
    body.appendChild(h);
    for (const x of list) body.appendChild(render1(x));
  };

  group('Goes to', out, (r) => {
    const b = el('button', 'linkrow');
    const n = el('div', 'n', r.to);
    if (!r.resolved) { n.className = 'n'; n.style.color = 'var(--flag)'; }
    b.appendChild(n);
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`
      + (r.resolved ? '' : ' · no guide by that name')));
    if (r.resolved) b.onclick = () => goGuide(r.to);
    return b;
  });

  group('Referenced by', back.routes, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  group('Mentioned by', back.references, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', r.text));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  if (!body.children.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing links to or from this guide yet. Give a block a Goes-to, or add a reference from the toolbar.'));
  }
}

function goGuide(name) {
  const g = findGuide(S.doc, name);
  if (!g) return;
  commitEditor();
  S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide';
  render();
  $('stage').scrollTop = 0;
}

// ---------------------------------------------------------------- sources
/**
 * A source is a title and a link. Nothing else.
 *
 * The handle the file cites it by is derived and never shown — nobody should
 * have to invent a key to attach a document. Attached here is what this guide
 * relies on; the rest of the file is one click from being attached too.
 */
function newSourceForm(host, onDone, guide) {
  const box = el('div', 'srcform');
  const t = el('input'); t.type = 'text'; t.placeholder = 'What is it? e.g. Deskline brief';
  const u = el('input'); u.type = 'text'; u.placeholder = 'Link or file path';
  const row = el('div', 'srcform-foot');
  const ok = el('button', 'btn primary', 'Add');
  const no = el('button', 'quiet', 'Cancel');
  row.append(ok, no);
  box.append(t, u, row);

  const done = () => {
    const title = t.value.trim();
    const url = u.value.trim();
    if (!url) { u.focus(); return; }
    const entry = addSource(S.doc, { handle: handleFor(title || url, S.doc), url, title });
    if (guide) attachToGuide(guide, entry.handle);
    mark();
    if (onDone) onDone(entry);
    render();
  };
  ok.onclick = done;
  no.onclick = () => { box.remove(); render(); };
  box.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); done(); }
    if (e.key === 'Escape') { e.preventDefault(); box.remove(); render(); }
  };
  host.appendChild(box);
  setTimeout(() => t.focus(), 0);
  return box;
}

function attachToGuide(guide, handle) {
  const cur = (guide.fields.sources || '').trim();
  const have = refsIn(cur);
  if (have.includes(handle)) return;
  setField(guide, 'sources', cur ? `${cur}, [${handle}]` : `[${handle}]`);
}

function detachFromGuide(guide, handle) {
  const left = refsIn(guide.fields.sources || '').filter((h) => h !== handle);
  setField(guide, 'sources', left.map((h) => `[${h}]`).join(', '));
  mark(); render();
}

/** Enough of an address to recognise it. The whole thing stays on the link. */
function shortUrl(u) {
  const raw = String(u || '');
  try {
    const url = new URL(raw);
    const tail = url.pathname.replace(/\/$/, '').split('/').filter(Boolean).pop() || '';
    return url.host.replace(/^www\./, '') + (tail ? '/' + (tail.length > 22 ? tail.slice(0, 21) + '…' : tail) : '');
  } catch {
    const base = raw.split('/').filter(Boolean).pop() || raw;
    return base.length > 32 ? base.slice(0, 31) + '…' : base;
  }
}

// ---------------------------------------------------------------- users
/**
 * Who each guide is for, read sideways.
 *
 * The point is a targeted session: pick the group you have in the room and see
 * exactly which screens apply to them, instead of walking everyone through
 * everything.
 */
function renderUsersView() {
  const stage = $('stage');
  const w = el('div', 'wrap');
  const types = userTypes(S.doc);

  if (!types.length) {
    const d = el('div', 'done');
    d.innerHTML = 'No user types yet.<span>Add one to a guide&rsquo;s Primary users and it will appear here.</span>';
    w.appendChild(d);
    stage.appendChild(w);
    return;
  }

  const head = el('div');
  head.style.cssText = 'margin-bottom:22px';
  head.appendChild(el('h1', 'g-title', types.length + ' user type' + (types.length === 1 ? '' : 's')));
  head.appendChild(el('div', 'blurb',
    'What each group actually needs to look at. Pick one to walk a session through only their screens.'));
  w.appendChild(head);

  for (const t of types) {
    const box = el('div', 'usr');
    const h = el('div', 'usr-h');
    h.appendChild(el('span', 'n', t.name));
    const n = t.guides.length;
    h.appendChild(el('span', 'm', n + ' guide' + (n === 1 ? '' : 's')));
    const pres = el('button', 'btn', 'Show only these');
    pres.title = 'Narrow the whole app to this group’s screens. Present from there if you want to.';
    pres.onclick = () => {
      S.userFilter = t.name;
      S.guide = t.guides[0].guide;
      S.view = 'guide'; S.sel = null;
      render();
    };
    h.appendChild(pres);
    box.appendChild(h);

    for (const { guide, primary } of t.guides) {
      const b = el('button', 'oi');
      const tt = el('div', 't', guide.name);
      if (primary) {
        const chip = el('span', 'pill');
        chip.textContent = 'their main screen';
        chip.style.marginLeft = '8px';
        tt.appendChild(chip);
      }
      b.appendChild(tt);
      const open = guideOpenCount(guide);
      b.appendChild(el('div', 'w', rowsOf(guide).length + ' blocks'
        + (open ? '  ·  ' + open + ' open' : '')
        + '  ·  ' + (guide.fields.userGoal || '').slice(0, 90)));
      b.onclick = () => { S.guide = guide; S.view = 'guide'; S.sel = null; render(); };
      box.appendChild(b);
    }
    w.appendChild(box);
  }
  stage.appendChild(w);
}

// ---------------------------------------------------------------- flow
/**
 * Every route in the file, drawn. Figma cannot do this: there a link is a node
 * id with no inverse, so nothing knows what points at it. Here the picture is
 * derived from the file on every read, which is why it is always true.
 */
function renderFlow() {
  const stage = $('stage');
  const gs = guides(S.doc);
  if (!gs.length) { stage.appendChild(el('div', 'rail-empty', 'No guides yet.')); return; }
  const { routes, references } = links(S.doc);
  const resolved = routes.filter((r) => r.resolved);

  const incoming = new Map(gs.map((g) => [g.name, 0]));
  for (const r of resolved) if (r.from !== r.to) incoming.set(r.to, (incoming.get(r.to) || 0) + 1);

  // Layer by distance from the entry points, so reading left to right is
  // reading the order someone actually moves through the product.
  const depth = new Map();
  const roots = gs.filter((g) => !incoming.get(g.name));
  const queue = (roots.length ? roots : [gs[0]]).map((g) => { depth.set(g.name, 0); return g.name; });
  while (queue.length) {
    const n = queue.shift();
    for (const r of resolved) {
      if (r.from !== n || r.to === n) continue;
      const d = depth.get(n) + 1;
      if (depth.has(r.to) && depth.get(r.to) >= d) continue;
      depth.set(r.to, d);
      queue.push(r.to);
    }
  }
  let maxD = 0;
  for (const g of gs) { if (!depth.has(g.name)) depth.set(g.name, 0); maxD = Math.max(maxD, depth.get(g.name)); }

  const W = 196, H = 54, GX = 96, GY = 26, PAD = 30;
  const cols = [];
  for (let d = 0; d <= maxD; d++) cols[d] = gs.filter((g) => depth.get(g.name) === d);
  const pos = new Map();
  cols.forEach((col, d) => {
    col.forEach((g, i) => pos.set(g.name, { x: PAD + d * (W + GX), y: PAD + i * (H + GY) }));
  });
  const width = PAD * 2 + (maxD + 1) * W + maxD * GX;
  const height = PAD * 2 + Math.max(1, ...cols.map((c) => c.length)) * (H + GY);

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" '
    + 'orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgba(16,18,22,.34)"/></marker>'
    + '<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" '
    + 'orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>';
  svg.appendChild(defs);

  const drawEdge = (from, to, cls) => {
    const a = pos.get(from), b = pos.get(to);
    if (!a || !b) return;
    const hot = S.guide && (from === S.guide.name || to === S.guide.name);
    const p = document.createElementNS(NS, 'path');
    const forward = b.x > a.x;
    const x1 = forward ? a.x + W : a.x;
    const x2 = forward ? b.x : b.x + W;
    const y1 = a.y + H / 2, y2 = b.y + H / 2;
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
    p.setAttribute('d', `M${x1},${y1} C${x1 + (forward ? dx : -dx)},${y1} ${x2 - (forward ? dx : -dx)},${y2} ${x2},${y2}`);
    p.setAttribute('class', 'edge ' + cls + (hot ? ' hot' : ''));
    p.setAttribute('marker-end', hot ? 'url(#ah)' : 'url(#a)');
    svg.appendChild(p);
  };
  for (const r of resolved) if (r.from !== r.to) drawEdge(r.from, r.to, '');
  for (const r of references) if (r.resolved && r.from !== r.to) drawEdge(r.from, r.to, 'ref');

  for (const g of gs) {
    const p = pos.get(g.name);
    const grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'node' + (g === S.guide ? ' on' : ''));
    grp.setAttribute('transform', `translate(${p.x},${p.y})`);
    grp.style.cursor = 'pointer';
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('width', W); rect.setAttribute('height', H);
    rect.setAttribute('rx', 10);
    grp.appendChild(rect);
    const t1 = document.createElementNS(NS, 'text');
    t1.setAttribute('x', 13); t1.setAttribute('y', 22);
    t1.textContent = g.name.length > 24 ? g.name.slice(0, 23) + '…' : g.name;
    grp.appendChild(t1);
    const t2 = document.createElementNS(NS, 'text');
    t2.setAttribute('class', 'm');
    t2.setAttribute('x', 13); t2.setAttribute('y', 40);
    t2.textContent = rowsOf(g).length + ' blocks';
    grp.appendChild(t2);
    const open = guideOpenCount(g);
    if (open) {
      const t3 = document.createElementNS(NS, 'text');
      t3.setAttribute('class', 'o');
      t3.setAttribute('x', W - 13); t3.setAttribute('y', 40);
      t3.setAttribute('text-anchor', 'end');
      t3.textContent = open + ' open';
      grp.appendChild(t3);
    }
    grp.onclick = () => { S.guide = g; S.sel = null; S.view = 'guide'; render(); };
    svg.appendChild(grp);
  }

  const w = el('div');
  w.style.maxWidth = 'none';
  const box = el('div');
  box.id = 'flow';
  box.appendChild(svg);
  w.appendChild(box);

  const notes = el('div');
  notes.style.cssText = 'margin-top:26px;max-width:620px';
  const dangling = routes.filter((r) => !r.resolved);
  const danglingRefs = references.filter((r) => !r.resolved);
  const un = unreachable(S.doc);
  const say = (label, list, fmt) => {
    if (!list.length) return;
    notes.appendChild(el('div', 'rail-h', label)).style.marginTop = '16px';
    for (const x of list) {
      const p = el('div', 'blk-note');
      p.innerHTML = fmt(x);
      notes.appendChild(p);
    }
  };
  say('Routes that point at no guide in this file', dangling,
    (r) => guideLink(r.from) + ' &rarr; <b>' + esc(r.to) + '</b> &mdash; from &ldquo;' + esc(r.via) + '&rdquo;');
  say('References that point at no guide in this file', danglingRefs,
    (r) => guideLink(r.from) + ' &rarr; <b>' + esc(r.to) + '</b>');
  say('Nothing routes to these', un, (n) => guideLink(n));
  const legend = el('div', 'rail-empty');
  legend.style.marginTop = '22px';
  legend.innerHTML = 'Solid is a route &mdash; the user can get there. '
    + 'Dashed is a reference &mdash; the detail is specified there.';
  notes.appendChild(legend);
  w.appendChild(notes);
  stage.appendChild(w);
}

// ---------------------------------------------------------------- open items
/**
 * The number that is supposed to reach zero. An action item is a follow-up to
 * circle back on; a `??` is a question nobody has been asked yet. Both are open,
 * and both say where they came from so they can actually be chased.
 */
function renderOpen() {
  const stage = $('stage');
  const w = el('div', 'wrap');
  const items = openItems(S.doc);
  if (!items.length) {
    const d = el('div', 'done');
    d.innerHTML = 'Nothing open.<span>Every action item is answered and no question is unasked.</span>';
    w.appendChild(d);
    stage.appendChild(w);
    return;
  }
  const byGuide = new Map();
  for (const i of items) {
    if (!byGuide.has(i.guide)) byGuide.set(i.guide, []);
    byGuide.get(i.guide).push(i);
  }
  const head = el('div');
  head.style.cssText = 'margin-bottom:22px';
  const n = items.filter((i) => i.kind === 'action').length;
  const u = items.length - n;
  head.appendChild(el('h1', 'g-title', items.length + ' open'));
  head.appendChild(el('div', 'blurb',
    n + ' action item' + (n === 1 ? '' : 's') + ' to circle back on, '
    + u + ' thing' + (u === 1 ? '' : 's') + ' nobody has been asked.'));
  w.appendChild(head);

  for (const [name, list] of byGuide) {
    const sec = el('div', 'sec');
    const h = el('div', 'sec-head');
    h.appendChild(el('h2', 'sec-title', name));
    sec.appendChild(h);
    for (const i of list) {
      const b = el('button', 'oi ' + (i.kind === 'action' ? 'act' : 'unk'));
      const t = el('div', 't');
      t.innerHTML = linkify(i.text, findGuide(S.doc, i.guide));
      b.appendChild(t);
      const w = el('div', 'w');
      w.textContent = (i.kind === 'action' ? 'Action item' : 'Not asked') + '  ·  ' + i.where;
      b.appendChild(w);
      b.onclick = () => {
        S.guide = findGuide(S.doc, i.guide);
        S.view = 'guide';
        if (i.target && i.target.kind === 'row') { S.sel = i.target; S.editing = S.readOnly ? null : i.target; }
        else { S.sel = null; S.shownField = i.field || null; }
        render();
        if (!S.readOnly && i.target && i.target.kind === 'row') { focusEditor(); return; }
        if (i.field) {
          const dd = document.querySelector(`.g-fields dd[data-key="${i.field}"]`);
          if (dd) { dd.scrollIntoView({ block: 'center' }); if (!S.readOnly) dd.focus(); }
          return;
        }
        const on = document.querySelector('.blk.on');
        if (on) on.scrollIntoView({ block: 'center', behavior: 'smooth' });
      };
      sec.appendChild(b);
    }
    w.appendChild(sec);
  }
  stage.appendChild(w);
}

// ---------------------------------------------------------------- source
function renderSource() {
  const stage = $('stage');
  const w = el('div');
  w.style.maxWidth = '980px';
  const pre = el('div');
  pre.id = 'src';
  pre.textContent = S.doc ? serializeDocument(S.doc) : '';
  w.appendChild(pre);
  const note = el('div', 'rail-empty');
  note.style.marginTop = '14px';
  note.textContent = 'This is the file. It is the source of truth — the guide above is a render of it.';
  w.appendChild(note);
  stage.appendChild(w);
}

// ---------------------------------------------------------------- moving blocks
/** The table a row sits in, and where it sits, within the current guide. */
function whereIs(g, row) {
  const ts = tablesOf(g);
  for (let i = 0; i < ts.length; i++) {
    const j = ts[i].table.rows.indexOf(row);
    if (j !== -1) return { tables: ts, ti: i, ri: j };
  }
  return null;
}

/** Move a block one position, crossing into the next group when it runs out. */
function nudge(dir) {
  if (!S.guide || !S.sel || S.readOnly) return;
  commitEditor();
  if (moveRow(S.guide, S.sel, dir, true)) { mark(); render(); keepVisible(); }
}

/** Move a block straight into the group above or below. */
function jumpGroup(dir) {
  if (!S.guide || !S.sel || S.readOnly) return;
  commitEditor();
  const w = whereIs(S.guide, S.sel);
  if (!w) return;
  const next = w.tables[w.ti + dir];
  if (!next) return;
  const here = w.tables[w.ti];
  here.table.rows.splice(w.ri, 1);
  here.table.dirty = true; here.section.dirty = true;
  next.table.rows.splice(dir > 0 ? 0 : next.table.rows.length, 0, S.sel);
  next.table.dirty = true; next.section.dirty = true;
  if (JSON.stringify(next.table.cols.names) !== JSON.stringify(here.table.cols.names)) S.sel.dirty = true;
  mark(); render(); keepVisible();
}

/** Move the selection, not the block. */
function step(dir) {
  if (!S.guide) return;
  const rows = rowsOf(S.guide).map((r) => r.row);
  if (!rows.length) return;
  const i = rows.indexOf(S.sel);
  S.sel = rows[Math.max(0, Math.min(rows.length - 1, (i === -1 ? 0 : i + dir)))];
  render(); keepVisible();
}

function keepVisible() {
  const on = document.querySelector('.blk.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

// ---------------------------------------------------------------- capture
/**
 * A stakeholder talks faster than a six-field form can be filled. So capture
 * takes one line at a time and nothing else; the fields get set afterwards,
 * alone, when there is time to think about them.
 */
function captureTarget() {
  if (!S.guide) return null;
  const ts = tablesOf(S.guide);
  if (!ts.length) return null;
  if (S.sel) {
    const w = whereIs(S.guide, S.sel);
    if (w) return w.tables[w.ti];
  }
  return ts[ts.length - 1];
}

function toggleCapture(on) {
  if (S.readOnly) return;
  S.capture = on === undefined ? !S.capture : on;
  if (!S.capture) S.captured = 0;
  render();
  if (S.capture) setTimeout(() => $('capIn').focus(), 0);
}

function captureLine(text) {
  const t = captureTarget();
  if (!t) {
    banner('warn', '<b>Nowhere to put it.</b> This guide has no section yet.');
    return;
  }
  const row = addRow(t.table, t.section, { content: text });
  S.sel = row;
  S.captured++;
  mark(); render();
  keepVisible();
}

// ---------------------------------------------------------------- keyboard
const typing = (e) => {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
};

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }

  if (e.key === 'Escape') {
    if (S.pop) { closePop(); return; }
    if (S.capture) { toggleCapture(false); return; }
    if (S.present) { S.present = false; render(); return; }
    return;
  }

  // Moving a block works while its editor is open, because that is exactly when
  // you realise it is in the wrong place.
  if (e.altKey && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    if (!S.sel || S.view !== 'guide') return;
    e.preventDefault();
    const dir = e.key === 'ArrowDown' ? 1 : -1;
    if (e.shiftKey) jumpGroup(dir); else nudge(dir);
    return;
  }

  if (typing(e)) return;

  if (S.present && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    stepGuide(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (S.view !== 'guide') return;
    e.preventDefault();
    step(e.key === 'ArrowDown' ? 1 : -1);
    return;
  }
  if (e.key === 'Enter' && S.sel && S.view === 'guide' && !S.readOnly && !S.present) {
    e.preventDefault();
    const w = whereIs(S.guide, S.sel);
    if (w) insertBelow(S.guide, w.tables[w.ti].section, w.tables[w.ti].table, S.sel);
    return;
  }

  const k = e.key.toLowerCase();
  if (k === 'p') { S.present = !S.present; S.editing = null; render(); }
  else if (k === 'c') { toggleCapture(); }
  else if (k === 's') { commitEditor(); S.view = 'source'; render(); }
  else if (k === 'g') { commitEditor(); S.view = 'guide'; render(); }
  else if (k === 'f') { commitEditor(); S.view = 'flow'; render(); }
  else if (k === 'u') { commitEditor(); S.view = 'users'; render(); }
  else if (k === 'o') { commitEditor(); S.view = 'open'; render(); }
});

// ---------------------------------------------------------------- wiring
$('file').onclick = pickFolder;
$('save').onclick = save;
$('present').onclick = () => { S.present = !S.present; S.editing = null; render(); };
$('capDone').onclick = () => toggleCapture(false);
$('capIn').onkeydown = (e) => {
  if (e.key === 'Enter') {
    const v = $('capIn').value.trim();
    if (!v) { toggleCapture(false); return; }
    captureLine(v);
    $('capIn').value = '';
    setTimeout(() => $('capIn').focus(), 0);
  } else if (e.key === 'Escape') {
    toggleCapture(false);
  }
};

// A link to another guide, wherever it appears, goes there.
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-goto]');
  if (!a) return;
  e.preventDefault();
  const g = findGuide(S.doc, a.dataset.goto);
  if (!g) return;
  commitEditor();
  S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide';
  render();
  $('stage').scrollTop = 0;
});

window.addEventListener('beforeunload', (e) => {
  if (!S.dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

/**
 * Guide names and user types, so picking one is a pick rather than a spelling
 * test. A typed-again user type is how one group silently becomes two.
 */
function datalist(id, values) {
  let dl = document.getElementById(id);
  if (!dl) {
    dl = document.createElement('datalist');
    dl.id = id;
    document.body.appendChild(dl);
  }
  dl.innerHTML = '';
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v;
    dl.appendChild(o);
  }
}

function syncNames() {
  if (!S.doc) { datalist('guidenames', []); datalist('usertypes', []); return; }
  datalist('guidenames', guides(S.doc).map((g) => g.name));
  datalist('usertypes', userTypes(S.doc).map((u) => u.name));
}
const baseRender = render;
render = function () { baseRender(); syncNames(); };

// ---------------------------------------------------------------- boot
(async function boot() {
  if (typeof window.showDirectoryPicker !== 'function') {
    $('stage').innerHTML = '<div class="hello"><h1>Chromium only</h1>'
      + '<p>priority guide reads and writes a folder on your machine using the '
      + 'File System Access API, which exists in Chrome, Edge, Arc and Brave.<br>'
      + 'Open <b>http://localhost:8044</b> in one of those.</p></div>';
    return;
  }
  const saved = await kvGet('folder');
  if (saved) {
    try {
      if ((await saved.queryPermission({ mode: 'readwrite' })) === 'granted') {
        S.dir = saved;
        await loadFolder();
        return;
      }
    } catch { /* the grant has lapsed; fall through to the picker */ }
  }
  render();
})();
