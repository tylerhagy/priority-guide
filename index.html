  pop.appendChild(el('div', 'pop-h', 'Comments'));
  pop.appendChild(list);

  const paint = () => {
    list.innerHTML = '';
    const mine = commentsFor(S.doc, rw.rid);
    if (!mine.length) list.appendChild(el('div', 'rail-empty', 'Nothing yet.'));
    mine.forEach((c, i) => {
      const card = commentCard(rw.rid, i, () => { paint(); renderCommentCounts(anchor, rw.rid); });
      if (card) list.appendChild(card);
    });
  };
  paint();

  if (!S.readOnly) {
    const box = el('textarea', 'tnew');
    box.placeholder = 'Leave a comment on this block';
    box.rows = 2;
    const send = el('button', 'btn primary', 'Comment');
    const post = () => {
      const v = box.value.trim();
      if (!v) return;
      addComment(S.doc, rw.rid, v);
      box.value = '';
      mark(); paint(); renderCommentCounts(anchor, rw.rid);
    };
    send.onclick = post;
    box.onkeydown = (e) => {
      if (e.metaKey || e.ctrlKey) { if (e.key === 'Enter') { e.preventDefault(); post(); } return; }
      e.stopPropagation();
      if (e.key === 'Escape') { closePop(); render(); }
    };
    const foot = el('div', 'tfoot');
    foot.append(el('span', 'hint', '⌘↵'), send);
    pop.append(box, foot);
  }

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
  };
  setTimeout(() => {
    document.addEventListener('mousedown', popAway);
    const box = pop.querySelector('.tnew');
    if (box) box.focus();
  }, 0);
}

/**
 * Edit in place without the guide-wide render that `editable` does — a thread
 * repaints itself, and a full render would close the popover it lives in.
 */
function editableInPlace(node, current, commit) {
  node.contentEditable = 'plaintext-only';
  node.spellcheck = false;
  node.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { e.preventDefault(); node.textContent = current; node.blur(); }
    if (e.key === 'Enter') { e.preventDefault(); node.blur(); }
  };
  node.onblur = () => {
    const v = node.textContent.trim();
    if (v !== current) commit(v);
  };
  return node;
}

/**
 * A full render would tear down the open thread mid-edit, so while one is open
 * the two things it changes — its own bubble and the panel's count — are
 * updated in place. Leaving them stale until the next render was the bug where
 * a new comment did not appear on the guide until comments were toggled off
 * and on again.
 */
function renderCommentCounts(anchor, rid) {
  if (S.pop && S.pop.classList.contains('thread')) {
    if (anchor && rid) paintBubble(anchor, rid);
    paintPanelCommentCount();
    return;
  }
  render();
}

/** A bubble says how many, and whether any are still open. */
function paintBubble(b, rid) {
  const mine = commentsFor(S.doc, rid);
  const open = mine.filter((c) => !c.done).length;
  b.className = 'bubble' + (open ? ' has' : mine.length ? ' done' : ' none');
  let n = b.querySelector('span');
  if (mine.length) {
    if (!n) { n = el('span'); b.appendChild(n); }
    n.textContent = String(open || mine.length);
  } else if (n) n.remove();
  b.title = mine.length
    ? `${mine.length} comment${mine.length === 1 ? '' : 's'}${open ? `, ${open} open` : ', all resolved'}`
    : 'Comment on this block';
}

function paintPanelCommentCount() {
  if (!S.doc || !S.guide) return;
  const tab = [...document.querySelectorAll('#railR .ptabs button')]
    .find((b) => b.dataset.panel === 'comments');
  if (!tab) return;
  const n = openCommentCount(S.doc, S.guide);
  let badge = tab.querySelector('.n');
  if (n) {
    if (!badge) { badge = el('span', 'n'); tab.appendChild(badge); }
    badge.textContent = String(n);
  } else if (badge) badge.remove();
}

// ---------------------------------------------------------------- the comments panel
/**
 * Every comment on this guide, in one list, in block order.
 *
 * Opening each bubble in turn to find out what was said is not reading a
 * review, it is excavating one. The list is the readable form; the bubbles on
 * the guide say where each one is. Pressing an entry goes to its block.
 */
function panelComments(body) {
  const groups = commentsInGuide(S.doc, S.guide);
  const orphans = orphanComments(S.doc);
  const total = groups.reduce((n, g) => n + g.comments.length, 0);
  const open = groups.reduce((n, g) => n + g.comments.filter((c) => !c.done).length, 0);

  // Markers on the guide are a working state, not a property of the file, so
  // the switch for them sits with the comments rather than in the app bar —
  // where it was also true of Flow, Users, Open and Source, and it is not.
  const sw = el('button', 'markers' + (S.comments ? ' on' : ''));
  sw.appendChild(icon('bubble', 12));
  sw.appendChild(el('span', 'l', 'Markers on the guide'));
  sw.appendChild(el('span', 'sw'));
  sw.title = 'Show a comment marker on every block (K)';
  sw.onclick = () => { S.comments = !S.comments; render(); };
  body.appendChild(sw);

  if (!total && !orphans.length) {
    body.appendChild(el('div', 'rail-empty',
      'No comments yet. Turn markers on, then press the marker on any block to leave one.'));
    return;
  }

  const sum = el('div', 'csum');
  sum.textContent = open
    ? `${open} open of ${total}`
    : `${total} comment${total === 1 ? '' : 's'}, all resolved`;
  body.appendChild(sum);

  const repaint = () => { render(); };

  for (const g of groups) {
    const sec = el('div', 'cgroup');
    const h = el('button', 'cg-h');
    const nm = el('span', 'nm');
    nm.textContent = renderContentCell(g.row.content) || '(unnamed block)';
    h.appendChild(nm);
    const openN = g.comments.filter((c) => !c.done).length;
    if (openN) h.appendChild(el('span', 'o', String(openN)));
    h.title = 'Go to this block';
    h.onclick = () => {
      S.sel = g.row;
      S.comments = true;
      render();
      const hit = [...$('stage').querySelectorAll('.item')].find((n) => n.closest('.rowsel'));
      if (hit) hit.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };
    sec.appendChild(h);
    g.comments.forEach((c, i) => {
      const card = commentCard(g.row.rid, i, repaint);
      if (card) sec.appendChild(card);
    });
    body.appendChild(sec);
  }

  if (orphans.length) {
    const sec = el('div', 'cgroup orphan');
    sec.appendChild(el('div', 'cg-h static',
      `${orphans.length} on block${orphans.length === 1 ? '' : 's'} that no longer exist`));
    orphans.forEach((c) => {
      const all = commentsFor(S.doc, c.rid);
      const card = commentCard(c.rid, all.indexOf(c), repaint);
      if (card) sec.appendChild(card);
    });
    body.appendChild(sec);
  }
}

// ---------------------------------------------------------------- one row
/**
 * The middle says what the thing is called and what its data actually looks
 * like. The right says what it does. The left holds everything else — a rule, a
 * link, something someone said, an action.
 *
 * Nothing important is hidden behind hover. Both side lanes always show where a
 * note or a piece of functionality would go, so you can see what a row can hold
 * without touching it. The controls that act on a row appear in the row's own
 * space when you select it, so they never sit on top of what you are reading.
 */
function paintRow(row, g, sec, table, rw) {
  const ctx = { g, sec, table, rw };
  const chosen = rw === S.sel;
  if (chosen) [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));

  const kind = rw.content.kind || (rw.content.type === 'Visual' ? 'visual' : 'text');

  // ---- a divider is a rule and nothing else
  if (kind === 'divider') {
    const item = el('div', 'item divider');
    item._rw = rw;
    item.appendChild(el('div', 'rule'));
    row.host.appendChild(item);
    if (chosen && !S.readOnly && !S.present) item.appendChild(rowStrip(ctx, kind, null));
    if (!S.readOnly && !S.present) { wireSelect(item, row, rw, ctx, kind, null); wireDrag(row, ctx); }
    return;
  }

  const hasForm = !!rw.form.type;
  const hasLink = !!rw.link.type;
  const visual = kind === 'visual' || kind === 'chart';
  const item = el('div', 'item'
    + (visual ? ' visual' : hasForm ? '' : hasLink ? ' linky' : ' plain')
    + (kind === 'chart' ? ' chart' : ''));

  const box = el('div', 'box');
  if (visual) {
    // A visual is a placeholder for something that will take up room, so it
    // takes up room here. Reading the stack should tell you the shape of the
    // screen, and a chart is not the same size as a line of text.
    const gl = icon(kind === 'chart' ? (CHART_GLYPH[rw.content.chart] || 'chartother') : 'visual', 22);
    gl.classList.add('kindmark');
    box.appendChild(gl);
  }
  const inner = el('div', 'boxin');
  if (isControl(kind)) {
    const badge = el('div', 'kbadge ' + kind);
    badge.appendChild(icon(KIND_GLYPH[kind], 11));
    badge.appendChild(el('span', null, KIND_LABEL[kind]));
    inner.appendChild(badge);
  }
  const lbl = el('div', 'lbl');
  const label = rw.content.text.trim();
  if (isUnknown(label)) lbl.innerHTML = '<span class="unk">?? not known</span>';
  else blankable(lbl, label, visual ? 'What is the visual of?' : 'What is it called?');
  editable(lbl, label, (v) => {
    rw.content = { ...rw.content, text: v };
    touchRow(rw, table, sec);
  });
  inner.appendChild(lbl);

  const cur = rw.realData;
  const makeExample = (value) => {
    const eg = el('div', 'eg');
    if (isUnknown(value)) { eg.classList.add('unk'); eg.textContent = value; }
    else if (value) setLinked(eg, value, g);
    else blankable(eg, '', visual ? 'What it shows' : 'For example…');
    editable(eg, value, (v) => { rw.realData = v; touchRow(rw, table, sec); });
    return eg;
  };
  if (cur) inner.appendChild(makeExample(cur));
  const frefs = rowFieldRefs(rw);
  const fref = frefs.length === 1 ? frefs[0] : '';
  const fhit = fref && S.fdoc ? resolveField(S.fdoc, fref) : null;
  if (!cur && fhit && fhit.row.values && !isUnknown(fhit.row.values)) {
    // No example of its own: show what the field allows, greyed, so the row is
    // never blank when the answer already exists elsewhere.
    const inh = el('div', 'eg inherit', fhit.row.values);
    inh.title = `From ${fhit.ref} in the fields file. Add an example to say what this screen shows.`;
    inner.appendChild(inh);
  }
  if (frefs.length) {
    const chips = el('div', 'fchips');
    if (kind === 'search') chips.appendChild(el('span', 'fchips-l', 'Searches'));
    for (const r of frefs) chips.appendChild(fieldChip(ctx, r, S.fdoc ? resolveField(S.fdoc, r) : null));
    inner.appendChild(chips);
  }
  if (isControl(kind)) inner.appendChild(specLine(rw, fhit));
  box.appendChild(inner);

  if (rw.form.type === 'single select' || rw.form.type === 'multi select') {
    const ch = icon('chev', 13); ch.classList.add('chev'); box.appendChild(ch);
  }
  if (S.comments) { const bb = commentBubble(ctx); if (bb) box.appendChild(bb); }
  const notesShown = notesShownFor(rw);
  if (S.notesHidden && !S.present && rw.note.length) {
    const opened = notesShown;
    // On a line of their own under the block, so they never squeeze its name.
    const marks = el('div', 'lanemarks');
    {
      const acts = rw.note.filter((n) => n.action).length;
      const nc = el('button', 'lanemark notes' + (acts ? ' act' : '') + (opened ? ' on' : ''));
      if (acts) nc.appendChild(el('span', 'd'));
      nc.appendChild(document.createTextNode(`${rw.note.length} note${rw.note.length === 1 ? '' : 's'}${acts ? ` · ${acts} open` : ''}`));
      nc.title = opened ? 'Hide this block’s notes' : 'Show this block’s notes';
      nc.onclick = (e) => { e.stopPropagation(); toggleNotes(rw); };
      marks.appendChild(nc);
    }
    inner.appendChild(marks);
  }
  item.appendChild(box);

  const openExample = () => {
    if (item.querySelector('.eg')) { focusSoon(item.querySelector('.eg')); return; }
    const eg = makeExample('');
    inner.appendChild(eg);
    focusSoon(eg);
  };
  lbl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); lbl.blur(); openExample(); }
  });

  // The strip sits in the row's own flow, under it, so it can never cover the
  // thing it belongs to.
  const wantExample = cur ? null : openExample;
  if (chosen && !S.readOnly && !S.present) item.appendChild(rowStrip(ctx, kind, wantExample));
  item._rw = rw;
  row.host.appendChild(item);

  if (!S.present && fhit) {
    const off = valueMismatch(rw, fhit);
    if (off.length) {
      const n = el('div', 'flag');
      n.innerHTML = off.map((x) => '<b>' + esc(x) + '</b>').join(', ')
        + (off.length === 1 ? ' is not a value of ' : ' are not values of ') + esc(fhit.ref)
        + ' (' + esc(fhit.row.values) + ').';
      row.host.appendChild(n);
    }
  }
  if (!S.present) {
    for (const f of lintRow(rw)) {
      const n = el('div', 'flag');
      if (f.kind === 'visual-answer') n.innerHTML = '<b>&ldquo;' + esc(f.word) + '&rdquo;</b> is a visual answer. ' + esc(f.ask);
      else if (f.kind === 'unknown-form') n.textContent = '"' + f.word + '" is not one of the form types.';
      else if (f.kind === 'unknown-link') n.textContent = '"' + f.word + '" is not one of the link types.';
      else if (f.kind === 'link-and-form') n.textContent = 'This block both goes somewhere and takes input (' + f.word + '). Pick one.';
      row.host.appendChild(n);
    }
  }

  // ---- left: notes
  const notes = el('div', 'notes');
  rw.note.forEach((n, i) => notes.appendChild(noteCard(ctx, n, i)));
  if (!S.readOnly && !S.present) {
    const addNote = () => {
      rw.note.push({ text: '', action: false });
      S.sel = rw; S.newRowNote = rw; render();
      focusSoon('.rowsel .note.fresh .t');
    };
    if (rw.note.length) {
      const more = el('button', 'lanemore');
      more.appendChild(icon('plus', 11));
      more.title = 'Another note on this block';
      more.onclick = (e) => { e.stopPropagation(); addNote(); };
      notes.appendChild(more);
    } else {
      notes.appendChild(slot('note', 'Note', addNote));
    }
  }
  // Notes hidden: the lane stays empty except beside a block someone opened.
  if (notesShown) {
    row.l.appendChild(notes);
    // The lane always ends with a leader, transparent when there is nothing to
    // lead to, so the gap before the stack matches the one after it.
    const lLead = el('div', 'lead');
    if (!rw.note.length) lLead.style.borderColor = 'transparent';
    row.l.appendChild(lLead);
  }

  // ---- right: functionality only
  const hasFn = !!(rw.link.type || rw.form.type || rw.capabilities.length);
  const lead = el('div', 'lead');
  if (!hasFn) lead.style.borderColor = 'transparent';
  row.r.appendChild(lead);
  row.r.appendChild(fnCard(ctx));

  if (S.readOnly || S.present) return;
  wireSelect(item, row, rw, ctx, kind, wantExample);
  wireDrag(row, ctx);
}

/**
 * An empty lane still shows what belongs in it. A dotted slot beside a labelled
 * column is a thing you can read without touching, which is the whole point.
 */
function slot(glyph, label, fn) {
  const b = el('button', 'slot');
  b.appendChild(icon(glyph, 11));
  b.appendChild(el('span', null, label));
  b.onclick = (e) => { e.stopPropagation(); fn(); };
  return b;
}

const CHART_GLYPH = {
  pie: 'pie', bar: 'bar', line: 'linechart', table: 'gridicon',
  number: 'number', map: 'mapicon', other: 'chartother'
};
const KIND_LABEL = { text: 'Content', visual: 'Visual', chart: 'Data visual', divider: 'Divider',
  search: 'Search', filter: 'Filter', sort: 'Sort', action: 'Action' };
const KIND_GLYPH = { search: 'search', filter: 'filter', sort: 'sort', action: 'trigger' };

/**
 * What you can do to the row you selected, in the row, in reading order, with
 * every target a real button. Delete asks first; undo is the net after that.
 */
function rowStrip(ctx, kind, openExample) {
  const { g, sec, table, rw } = ctx;
  const strip = el('div', 'rowstrip');

  const k = el('button', 'sbtn kind');
  k.appendChild(icon(kind === 'chart' ? (CHART_GLYPH[rw.content.chart] || 'chartother')
    : kind === 'visual' ? 'visual' : kind === 'divider' ? 'rule' : KIND_GLYPH[kind] || 'line1', 12));
  k.appendChild(el('span', null, kind === 'chart'
    ? (rw.content.chart ? rw.content.chart : 'Data visual')
    : KIND_LABEL[kind]));
  k.appendChild(el('span', 'caret', '▾'));
  k.title = 'What this block is. Changing it keeps everything else.';
  k.onclick = (e) => { e.stopPropagation(); openKindPicker(k, ctx); };
  strip.appendChild(k);

  if (openExample && kind !== 'divider') {
    const b = el('button', 'sbtn');
    b.appendChild(icon('plus', 12));
    b.appendChild(el('span', null, 'Example'));
    b.title = 'What the data really looks like. Optional.';
    b.onclick = (e) => { e.stopPropagation(); openExample(); };
    strip.appendChild(b);
  }

  if (kind !== 'divider') {
    const fb = el('button', 'sbtn');
    fb.appendChild(icon('gridicon', 12));
    fb.appendChild(el('span', null, rw.field ? 'Field' : 'Link a field'));
    fb.title = 'Which field this block shows, from the fields file. Optional.';
    fb.onclick = (e) => { e.stopPropagation(); openFieldPicker(fb, ctx); };
    strip.appendChild(fb);
  }

  const dup = el('button', 'sbtn');
  dup.appendChild(icon('copy', 12));
  dup.appendChild(el('span', null, 'Duplicate'));
  dup.onclick = (e) => {
    e.stopPropagation();
    const copy = addRow(table, sec, { at: table.rows.indexOf(rw) + 1 });
    copy.content = { ...rw.content };
    copy.realData = rw.realData;
    copy.capabilities = rw.capabilities.slice();
    copy.link = { ...rw.link };
    copy.form = { ...rw.form };
    copy.note = rw.note.map((n) => ({ ...n }));
    if (rw.field) setRowField(copy, table, sec, rw.field);
    touchRow(copy, table, sec);
    S.sel = copy; mark(); render(); focusSoon('.rowsel .lbl');
  };
  strip.appendChild(dup);

  const del = el('button', 'sbtn danger');
  del.appendChild(icon('trash', 12));
  del.appendChild(el('span', null, 'Delete'));
  del.title = 'Delete this block.';
  del.onclick = async (e) => {
    e.stopPropagation();
    if (!await confirmDelete(rw.content.text ? `“${rw.content.text}”` : 'this block')) return;
    const at = table.rows.indexOf(rw);
    table.rows.splice(at, 1);
    table.dirty = true; sec.dirty = true;
    S.sel = null; mark(); render();
    undoable(rw.content.text ? `“${rw.content.text}”` : 'Block', () => {
      table.rows.splice(at, 0, rw);
      table.dirty = true; sec.dirty = true; S.sel = rw;
    });
  };
  strip.appendChild(del);
  if (isControl(kind)) strip.appendChild(specForm(ctx));
  return strip;
}

function wireSelect(item, row, rw, ctx, kind, openExample) {
  // Three columns, one row: hovering the block lights the two lanes that
  // annotate it, so you never have to trace a hairline across an empty column
  // to work out which note belongs to what.
  const lanes = [row.l, row.r];
  item.addEventListener('mouseenter', () => lanes.forEach((n) => n.classList.add('rowhot')));
  item.addEventListener('mouseleave', () => lanes.forEach((n) => n.classList.remove('rowhot')));
  const hold = () => {
    if (S.sel === rw) return;
    S.sel = rw;
    $('stage').querySelectorAll('.rowsel').forEach((n) => n.classList.remove('rowsel'));
    $('stage').querySelectorAll('.rowstrip').forEach((n) => n.remove());
    [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));
    // Appended in place rather than re-rendered, so the caret in the field you
    // just pressed into stays exactly where you put it.
    if (!item.querySelector('.rowstrip')) item.appendChild(rowStrip(ctx, kind, openExample));
  };
  item.onmousedown = (e) => { if (e.target.closest('.lbl,.eg')) hold(); };
  item.onclick = (e) => {
    if (e.target.closest('.lbl,.eg,a,button')) return;
    e.stopPropagation();
    hold();
  };
}

// ---------------------------------------------------------------- what a block is
/**
 * Changing a block's kind must keep its notes, its example and its
 * functionality. Rebuilding a block by hand and copying the notes across is the
 * clunky workaround this exists to remove.
 */
function openKindPicker(anchor, ctx) {
  closePop();
  const { sec, table, rw } = ctx;
  const pop = el('div', 'pop kindpop');
  const now = rw.content.kind || (rw.content.type === 'Visual' ? 'visual' : 'text');

  const apply = (kind, chart) => {
    setKind(rw, kind, chart);
    touchRow(rw, table, sec);
    mark(); closePop(); render();
  };

  pop.appendChild(el('div', 'pop-h', 'What this block is'));
  const list = el('div', 'kinds');
  const opt = (kind, glyph, label, blurb, chart) => {
    const on = now === kind && (kind !== 'chart' || (rw.content.chart || '') === (chart || ''));
    const b = el('button', 'kindopt' + (on ? ' on' : ''));
    b.appendChild(icon(glyph, 15));
    const t = el('div');
    t.appendChild(el('div', 'n', label));
    if (blurb) t.appendChild(el('div', 'b', blurb));
    b.appendChild(t);
    b.onclick = () => apply(kind, chart);
    list.appendChild(b);
  };
  opt('text', 'line1', 'Content', 'A data point, a control or an action');
  opt('visual', 'visual', 'Visual', 'An image, a map, a photo');
  opt('divider', 'rule', 'Divider', 'A rule, to break a section up');
  pop.appendChild(list);

  pop.appendChild(el('div', 'pop-h', 'Control'));
  const ctl = el('div', 'kinds');
  const copt = (kind, label, blurb) => {
    const b = el('button', 'kindopt' + (now === kind ? ' on' : ''));
    b.appendChild(icon(KIND_GLYPH[kind], 15));
    const t = el('div');
    t.appendChild(el('div', 'n', label));
    t.appendChild(el('div', 'b', blurb));
    b.appendChild(t);
    b.onclick = () => apply(kind);
    ctl.appendChild(b);
  };
  copt('search', 'Search', 'Find something by typing');
  copt('filter', 'Filter', 'Narrow a list by a value');
  copt('sort', 'Sort', 'Put a list in an order');
  copt('action', 'Action', 'A button that does something');
  pop.appendChild(ctl);

  pop.appendChild(el('div', 'pop-h', 'Data visual'));
  const charts = el('div', 'charts');
  const chartOpt = (chart, glyph, label) => {
    const on = now === 'chart' && (rw.content.chart || '') === chart;
    const b = el('button', 'chartopt' + (on ? ' on' : ''));
    b.appendChild(icon(glyph, 16));
    b.appendChild(el('span', null, label));
    b.title = label;
    b.onclick = () => apply('chart', chart);
    charts.appendChild(b);
  };
  chartOpt('', 'chartother', 'Not decided');
  chartOpt('pie', 'pie', 'Pie');
  chartOpt('bar', 'bar', 'Bar');
  chartOpt('line', 'linechart', 'Line');
  chartOpt('table', 'gridicon', 'Table');
  chartOpt('number', 'number', 'Single number');
  chartOpt('map', 'mapicon', 'Map');
  pop.appendChild(charts);

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
  };
  setTimeout(() => document.addEventListener('mousedown', popAway), 0);
}

/**
 * Pick the guide a reference points at, with enough of each one on screen to
 * tell them apart. At twenty guides a name alone is not enough to choose from.
 */
function openRefPicker(anchor, g, sec, chunk) {
  closePop();
  const pop = el('div', 'pop refpop');
  pop.appendChild(el('div', 'pop-h', 'This references'));

  const search = el('input');
  search.type = 'text';
  search.placeholder = 'Search guides';
  pop.appendChild(search);

  const list = el('div', 'reflist');
  pop.appendChild(list);

  const why = el('input');
  why.type = 'text';
  why.placeholder = 'Why — “the customer fields are specified there”';
  const m = /^\s*See\s+\[\[[^\]]*\]\]\s*(?:—|-)?\s*(.*)$/i.exec(chunk.text || '');
  why.value = m && m[1] && m[1] !== 'why' ? m[1] : '';
  pop.appendChild(el('div', 'pop-h', 'Why'));
  pop.appendChild(why);

  const write = (name) => {
    const w = why.value.trim();
    const text = `See [[${name}]]${w ? ` — ${w}` : ''}`;
    chunk.target = name;
    chunk.text = text;
    if (sec) {
      chunk.src = [`> ${text}`];
      chunk.refs = refsIn(text);
      chunk.dirty = true; sec.dirty = true;
    }
    mark();
  };

  const paint = () => {
    list.innerHTML = '';
    const q = search.value.trim().toLowerCase();
    const options = guides(S.doc).filter((x) => x !== g)
      .filter((x) => !q || x.name.toLowerCase().includes(q)
        || (x.fields.userGoal || '').toLowerCase().includes(q));
    if (!options.length) {
      list.appendChild(el('div', 'rail-empty', q ? 'No guide matches that.' : 'This file has only one guide.'));
      return;
    }
    for (const x of options) {
      const b = el('button', 'refopt' + (chunk.target === x.name ? ' on' : ''));
      b.appendChild(el('div', 'n', x.name));
      const n = rowsOf(x).length;
      const goal = (x.fields.userGoal || '').trim();
      b.appendChild(el('div', 'm', `${n} block${n === 1 ? '' : 's'}`
        + (goal && !isUnknown(goal) ? ` · ${goal.slice(0, 70)}` : '')));
      b.onclick = () => { write(x.name); closePop(); render(); };
      list.appendChild(b);
    }
  };
  search.oninput = paint;
  paint();

  why.onchange = () => { if (chunk.target) { write(chunk.target); render(); } };

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
    if (e.key === 'Enter') {
      const first = list.querySelector('.refopt');
      if (document.activeElement === search && first) first.click();
    }
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); search.focus(); }, 0);
}

// ---------------------------------------------------------------- controls
/** One line under a control: what has been answered. */
function specLine(rw, fhit) {
  const line = el('div', 'specline');
  const kind = rw.content.kind;
  const hasValues = !!(fhit && fhit.row.values && !isUnknown(fhit.row.values));
  const said = [];
  for (const q of specQuestions(rw)) {
    const v = getSpec(rw, q.key);
    if (!v || isUnknown(v)) continue;
    if (q.key === 'min chars') { said.push(`after ${v} characters`); continue; }
    if (q.type === 'choice' && (v === 'yes' || v === 'no')) { if (v === 'yes') said.push(q.label.toLowerCase()); continue; }
    if (q.key === 'placeholder') { said.push(`“${v}”`); continue; }
    if (q.type === 'text' && v.length > 40) continue;
    said.push(v);
  }
  if (kind === 'filter' && !getSpec(rw, 'options') && hasValues) said.push('options from the field');
  if (said.length) line.appendChild(el('span', 'said', said.join(' · ')));
  return line;
}

/**
 * The questions a control can answer, asked under it while it is selected.
 * A blank answer is fine; `??` says someone has to find out. Changes are
 * written as you go and the guide only redraws when an answer changes which
 * questions apply, so tabbing through the form never loses your place.
 */
function specForm(ctx) {
  const { sec, table, rw } = ctx;
  const kind = rw.content.kind;
  const wrap = el('div', 'specform');
  wrap.onclick = (e) => e.stopPropagation();
  wrap.onmousedown = (e) => e.stopPropagation();
  const frefs = rowFieldRefs(rw);
  const fhit = frefs.length === 1 && S.fdoc ? resolveField(S.fdoc, frefs[0]) : null;
  const drivers = new Set((SPECS[kind] || []).filter((q) => q.when).map((q) => q.when[0]));
  const refreshLine = () => {
    const item = wrap.closest('.item');
    const old = item && item.querySelector('.specline');
    if (old) old.replaceWith(specLine(rw, fhit));
    renderBar();
  };
  const write = (q, v) => {
    setSpec(rw, table, sec, q.key, v);
    mark();
    if (drivers.has(q.key)) { render(); return; }
    refreshLine();
  };

  const head = el('div', 'spec-h');
  head.appendChild(el('span', null, `${KIND_LABEL[kind]} — what it needs`));
  if (kind === 'search' || kind === 'filter' || kind === 'sort') {
    const fb = el('button', 'quiet', frefs.length ? (kind === 'search' ? `${frefs.length} field${frefs.length === 1 ? '' : 's'} searched` : 'Change field') : (kind === 'search' ? 'Pick the fields it searches' : 'Pick the field'));
    fb.onclick = (e) => { e.stopPropagation(); openFieldPicker(fb, ctx); };
    head.appendChild(fb);
  }
  wrap.appendChild(head);

  for (const q of specQuestions(rw)) {
    const rowEl = el('label', 'spec-q');
    rowEl.appendChild(el('span', 'k', q.label));
    const cur = getSpec(rw, q.key);
    let input;
    if (q.type === 'choice') {
      input = el('select');
      const opts = [['', '—'], ...q.choices.map((c) => [c, c]), ['??', 'Not known (??)']];
      for (const [v, t] of opts) {
        const o = el('option', null, t); o.value = v;
        if (cur === v) o.selected = true;
        input.appendChild(o);
      }
      input.onchange = () => write(q, input.value);
    } else {
      input = el('input');
      input.type = q.type === 'number' ? 'number' : 'text';
      input.value = cur;
      const inherited = q.fromField && fhit && fhit.row.values && !isUnknown(fhit.row.values);
      input.placeholder = inherited ? `From ${fhit.ref}: ${fhit.row.values}` : q.ask;
      input.onchange = () => write(q, input.value.trim());
      input.onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); input.blur(); } };
    }
    input.title = q.ask;
    rowEl.appendChild(input);
    wrap.appendChild(rowEl);
  }
  return wrap;
}

// ---------------------------------------------------------------- fields on a row
/** The field a block shows, under its example: Object › Label, red when nothing by that name exists. */
function fieldChip(ctx, ref, hit) {
  const { object, label } = splitFieldRef(ref);
  const c = el('button', 'fchip' + (hit ? '' : ' broken'));
  c.appendChild(icon('gridicon', 11));
  c.appendChild(el('span', null, object ? `${object} › ${label}` : label));
  c.title = hit
    ? [hit.ref, hit.row.backend ? `Backend: ${hit.row.backend}` : '', hit.row.fkind ? `Kind: ${hit.row.fkind}` : '',
      hit.row.definition || ''].filter(Boolean).join('\n')
    : (S.fdoc ? `No field called ${ref} in the fields file.` : 'This folder has no fields file yet.');
  c.onclick = (e) => {
    e.stopPropagation();
    if (S.readOnly || S.present) { if (hit) { S.view = 'fields'; render(); } return; }
    openFieldPicker(c, ctx);
  };
  return c;
}

/**
 * Pick the field a block shows, or name a new one. Typing `Object.Label` that
 * does not exist offers to add it, so the fields file grows from the guides
 * rather than having to be written first.
 */
function openFieldPicker(anchor, ctx) {
  closePop();
  const { sec, table, rw } = ctx;
  const pop = el('div', 'pop refpop fieldpop');
  pop.appendChild(el('div', 'pop-h', rw.content.kind === 'search' ? 'Fields this search looks in' : 'Field this block shows'));

  if (!S.fdoc) {
    pop.appendChild(el('div', 'rail-empty', S.ffile
      ? 'The fields file could not be read.'
      : 'This folder has no fields file yet. Start one to keep field names, backend names and values consistent across guides.'));
    if (!S.ffile && !S.readOnly) {
      const b = el('button', 'btn primary', 'Start the fields file');
      b.onclick = async () => { closePop(); await createFieldsFile(); };
      pop.appendChild(b);
    }
    document.body.appendChild(pop); placePop(pop, anchor); S.pop = pop;
    setTimeout(() => document.addEventListener('mousedown', popAway), 0);
    return;
  }

  const search = el('input');
  search.type = 'text';
  search.placeholder = 'Search fields, or type Object.Label';
  search.value = rw.field || '';
  pop.appendChild(search);
  const list = el('div', 'reflist');
  pop.appendChild(list);

  // A search runs over several fields, so picking adds and removes rather than replaces.
  const multi = rw.content.kind === 'search';
  if (multi) search.value = '';
  const pick = (ref) => {
    if (multi && ref) {
      const have = rowFieldRefs(rw);
      const i = have.findIndex((x) => x.toLowerCase() === ref.toLowerCase());
      if (i >= 0) have.splice(i, 1); else have.push(ref);
      setRowField(rw, table, sec, have.join(', '));
      mark(); render(); paint(); search.focus();
      return;
    }
    setRowField(rw, table, sec, ref);
    mark(); closePop(); render();
  };
  const create = (object, label) => {
    addFieldTo(S.fdoc, object, label, { backend: '??' });
    markFields();
    pick(fieldRef(object, label));
  };

  const paint = () => {
    list.innerHTML = '';
    const q = search.value.trim();
    const ql = q.toLowerCase();
    const all = [...fieldIndex(S.fdoc).values()];
    const label = (rw.content.text || '').trim().toLowerCase();
    const hits = all.filter((f) => !ql || f.ref.toLowerCase().includes(ql)
      || (f.row.backend || '').toLowerCase().includes(ql) || (f.row.definition || '').toLowerCase().includes(ql))
      .sort((a, b) => (b.label.toLowerCase() === label) - (a.label.toLowerCase() === label) || a.ref.localeCompare(b.ref))
      .slice(0, 40);
    for (const f of hits) {
      const b = el('button', 'refopt' + (rowFieldRefs(rw).some((x) => x.toLowerCase() === f.ref.toLowerCase()) ? ' on' : ''));
      b.appendChild(el('div', 'n', `${f.object} › ${f.label}`));
      const meta = [f.row.backend, f.row.fkind, f.row.values].filter((x) => x && !isUnknown(x)).join(' · ');
      if (meta) b.appendChild(el('div', 'm', meta));
      b.onclick = () => pick(f.ref);
      list.appendChild(b);
    }
    if (q && !all.some((f) => f.ref.toLowerCase() === ql)) {
      const sp = splitFieldRef(q);
      const objects = guides(S.fdoc).map((g) => g.name);
      const taken = (o, l) => all.some((f) => f.object.toLowerCase() === o.toLowerCase() && f.label.toLowerCase() === l.toLowerCase());
      // A bare word that already finds fields is a search, not a new field: only
      // Object.Label, or a word that finds nothing, offers to add one.
      const offers = (sp.object
        ? [[sp.object, sp.label]]
        : hits.length ? [] : objects.slice(0, 4).map((o) => [o, sp.label])).filter(([o, l]) => !taken(o, l));
      if (!sp.object && hits.length) {
        const hint = el('div', 'rail-empty', 'Not here? Type Object.Label to add a new field.');
        list.appendChild(hint);
      }
      for (const [o, l] of offers) {
        if (!l || S.fReadOnly) continue;
        const b = el('button', 'refopt add');
        b.appendChild(el('div', 'n', `Add ${o} › ${l}`));
        b.appendChild(el('div', 'm', objects.some((x) => x.toLowerCase() === o.toLowerCase())
          ? 'A new field on this object' : 'A new object, with this as its first field'));
        b.onclick = () => create(o, l);
        list.appendChild(b);
      }
      if (!sp.object && !objects.length) list.appendChild(el('div', 'rail-empty', 'Write it as Object.Label to start the first object.'));
    }
    if (!list.childNodes.length) list.appendChild(el('div', 'rail-empty', 'No field matches that.'));
    if (rw.field) {
      const clr = el('button', 'refopt clear');
      clr.appendChild(el('div', 'n', rowFieldRefs(rw).length > 1 ? 'Clear every field' : 'Clear the field'));
      clr.appendChild(el('div', 'm', 'Keep this block conceptual'));
      clr.onclick = () => { setRowField(rw, table, sec, ''); mark(); closePop(); render(); };
      list.appendChild(clr);
    }
  };
  search.oninput = paint;
  paint();

  document.body.appendChild(pop);
  placePop(pop, anchor);
  S.pop = pop;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
    if (e.key === 'Enter') {
      const first = list.querySelector('.refopt');
      if (document.activeElement === search && first) first.click();
    }
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); search.focus(); search.select(); }, 0);
}

function placePop(pop, anchor) {
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.max(8, Math.min(r.left, innerWidth - pop.offsetWidth - 12)) + 'px';
  pop.style.top = Math.max(8, Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 12)) + 'px';
}

function noteCard(ctx, n, i) {
  const { g, sec, table, rw } = ctx;
  const fresh = !n.text && S.newRowNote === rw;
  const card = el('div', 'note' + (n.action ? ' act' : '') + (fresh ? ' fresh' : ''));
  const only = /^\s*\[[^\[\]]+\]\s*$/.test(n.text);
  const gl = icon(only ? 'source' : 'note', 12);
  gl.classList.add('gl');
  card.appendChild(gl);

  const body = el('div', 'nbody');
  // An action shows its kind as a label and its question as plain text. The
  // prefix only comes back while you edit, so reading never changes the file.
  const at = n.action ? actionType(n.text) : null;
  if (at) body.appendChild(actionLabel(at.type, ctx, n));
  // A note belongs to its row, so pressing one selects that row rather than
  // reading as a press on dead space.
  card.onmousedown = () => {
    if (S.sel === rw) return;
    S.sel = rw;
    $('stage').querySelectorAll('.rowsel').forEach((x) => x.classList.remove('rowsel'));
    const lane = card.closest('.lane');
    if (lane) [lane.previousElementSibling, lane, lane.nextElementSibling]
      .forEach((x) => x && x.classList.add('rowsel'));
  };

  const t = el('div', 't');
  const shown = at ? capFirst(at.question) : n.text;
  setLinked(t, shown, g);
  if (!n.text) blankable(t, '', 'A rule, a link, or something said in the session');
  editable(t, n.text, (v) => {
    S.newRowNote = null;
    if (!v) rw.note.splice(i, 1);
    else n.text = v;
    touchRow(rw, table, sec);
  }, { multiline: true });
  if (at && !S.readOnly) {
    // Edit the note as written, prefix and [handles] included, so nothing is
    // lost by editing what was shown in short.
    const onFocus = t.onfocus, onBlur = t.onblur;
    t.onfocus = () => { t.textContent = n.text; if (onFocus) onFocus(); focusSoon(t); };
    t.onblur = () => {
      if (t.textContent.trim() === n.text.trim()) { setLinked(t, shown, g); return; }
      onBlur();
    };
  }
  body.appendChild(t);
  card.appendChild(body);

  if (!S.readOnly && !S.present) {
    card.classList.add('hastools');
    const tools = el('div', 'tools');
    const a = el('button', null, n.action ? '↩' : '!');
    a.title = n.action ? 'This is settled — stop treating it as an action' : 'Make this an action to circle back on';
    a.onclick = () => { n.action = !n.action; touchRow(rw, table, sec); mark(); render(); };
    tools.appendChild(a);
    const x = el('button', null, '×');
    x.title = 'Delete this note';
    x.onclick = async () => {
      if (!await confirmDelete('this note', 'There is no undo for a note.')) return;
      rw.note.splice(i, 1); touchRow(rw, table, sec); mark(); render();
    };
    tools.appendChild(x);
    card.appendChild(tools);
  }
  return card;
}

const capFirst = (x) => { const t = String(x || '').trim(); return t.charAt(0).toUpperCase() + t.slice(1); };
const ACTION_LOOK = {
  decision: { label: 'Needs decision', cls: 'tp-dec' },
  answer: { label: 'Needs answer', cls: 'tp-ans' },
  unclear: { label: 'Unclear', cls: 'tp-unc' },
  open: { label: 'Open question', cls: 'tp-act' },
  unknown: { label: 'Not asked yet', cls: 'tp-unk' }
};
/** The order a room takes them in: decisions, answers, the unclear, the untyped, then the never asked. */
const ACTION_ORDER = ['decision', 'answer', 'unclear', 'open', 'unknown'];

/** An action's kind, and — on a note you can edit — the menu to change it or settle it. */
function actionLabel(type, ctx, n) {
  const look = ACTION_LOOK[type];
  const editableNote = ctx && n && !S.readOnly && !S.present;
  const chip = el(editableNote ? 'button' : 'span', 'tp ' + look.cls, look.label);
  if (!editableNote) return chip;
  const { sec, table, rw } = ctx;
  chip.appendChild(icon('down', 9));
  chip.title = 'What kind of question this is, or settle it';
  chip.onclick = (e) => {
    e.stopPropagation();
    const set = (fn) => { fn(); touchRow(rw, table, sec); mark(); render(); };
    openMenu(chip, [
      ...ACTION_TYPES.map((x) => ({ glyph: 'circle', label: x.label, hint: x.ask, disabled: type === x.key, fn: () => set(() => setActionType(n, x.key)) })),
      { glyph: 'circle', label: 'Open question', hint: 'No kind yet', disabled: type === 'open', fn: () => set(() => setActionType(n, 'open')) },
      { sep: true },
      { glyph: 'tick', label: 'Settled', hint: 'Keeps the text as an ordinary note', fn: () => set(() => resolveAction(n)) }
    ]);
  };
  return chip;
}

const LINK_SAYS = {
  'onsite page': (t) => t ? ['Opens ', t] : ['Opens another page in the app'],
  'offsite page': (t) => t ? ['Opens ', t, ', outside the app'] : ['Opens a page outside the app'],
  modal: (t) => t ? ['Opens ', t, ' in a modal'] : ['Opens a modal'],
  download: () => ['Downloads a file'],
  upload: () => ['Uploads a file'],
  mailto: () => ['Starts an email'],
  trigger: () => ['Triggers an action in place'],
  other: (t) => t ? ['Goes to ', t] : ['Does something else']
};

function fnCard(ctx) {
  const { g, rw } = ctx;
  const hasAny = rw.link.type || rw.form.type || rw.capabilities.length;
  const card = el('div', 'fn' + (hasAny ? '' : ' empty'));
  card.setAttribute('role', 'button');
  card.tabIndex = S.readOnly || S.present ? -1 : 0;

  if (!hasAny) {
    if (S.readOnly || S.present) { card.textContent = ''; }
    else {
      card.classList.add('asslot');
      card.appendChild(icon('plus', 11));
      card.appendChild(el('span', null, 'Functionality'));
      card.title = 'What does this do — go somewhere, take input, or let someone search it?';
    }
  } else {
    if (rw.link.type) {
      const l = el('div', 'l');
      l.appendChild(icon(LINK_GLYPH[rw.link.type] || 'other', 13));
      const say = (LINK_SAYS[rw.link.type] || (() => [rw.link.type]))(rw.link.target);
      const b = el('div');
      say.forEach((part, i) => {
        if (i === 1 && rw.link.target) {
          const known = !!findGuide(S.doc, rw.link.target);
          const t = el(known ? 'a' : 'span', 'tgt' + (known ? '' : ' dead'), rw.link.target);
          if (known) { t.href = '#'; t.dataset.goto = rw.link.target; t.title = 'Go to this guide'; }
          else t.title = 'No guide in this file has that name';
          b.appendChild(t);
        } else b.appendChild(document.createTextNode(part));
      });
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.form.type) {
      const l = el('div', 'l');
      l.appendChild(icon(FORM_GLYPH[rw.form.type] || 'other', 13));
      const b = el('div');
      b.appendChild(document.createTextNode(FORM_SAYS[rw.form.type] || rw.form.type));
      if (rw.form.required) {
        b.appendChild(document.createTextNode(' · '));
        b.appendChild(el('span', 'req', 'required'));
      }
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.capabilities.length) {
      // One glyph per capability, each keeping its word. The icons separate the
      // four at a glance; the words are what make the icons learnable, so the
      // old "words, not icons" call is kept rather than reversed.
      const l = el('div', 'l');
      const caps = el('div', 'caps');
      rw.capabilities.forEach((c, i) => {
        if (i) caps.appendChild(el('span', 'capsep', '·'));
        const chip = el('span', 'cap');
        chip.appendChild(icon(CAP_GLYPH[c] || 'other', 12));
        chip.appendChild(el('span', null, c));
        caps.appendChild(chip);
      });
      l.appendChild(caps);
      card.appendChild(l);
    }
  }

  card._ctx = ctx;
  if (S.readOnly || S.present) return card;
  card.onclick = (e) => {
    if (e.target.closest('a')) return;   // a route takes you there instead
    e.stopPropagation(); S.sel = rw; render(); reopenPop();
  };
  card.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.sel = rw; render(); reopenPop(); }
  };
  return card;
}

const FORM_SAYS = {
  'date picker': 'Takes a date',
  'single line': 'Takes a short line of text',
  'multi line': 'Takes several lines of text',
  'single select': 'Takes one from a list',
  'multi select': 'Takes several from a list',
  other: 'Takes input'
};

// ---------------------------------------------------------------- functionality popover
/**
 * Enumerated values need a picker, but a picker is not a form: every change
 * applies the moment it is made, and there is nothing to save.
 */
function openFnPopover(anchor, ctx) {
  closePop();
  const { g, sec, table, rw } = ctx;
  const pop = el('div', 'pop fnpop');
  const apply = () => { touchRow(rw, table, sec); mark(); };

  const field = (label, node, hint) => {
    pop.appendChild(el('label', null, label));
    pop.appendChild(node);
    if (hint) pop.appendChild(el('div', 'hint', hint));
  };

  const lRow = el('div', 'row');
  const lSel = el('select');
  for (const t of LINK_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.link.type || '') === o.value) o.selected = true;
    lSel.appendChild(o);
  }
  const lTar = el('input');
  lTar.type = 'text'; lTar.value = rw.link.target || '';
  lTar.placeholder = 'Which guide or page?';
  lTar.setAttribute('list', 'guidenames');
  const syncL = () => { lTar.style.display = lSel.value ? '' : 'none'; };
  const setLink = () => {
    const target = lTar.value.trim();
    rw.link = { type: lSel.value, target, wiki: !!(target && findGuide(S.doc, target)), raw: '' };
    // Goes to and Takes are one choice, not two. Picking a destination drops
    // whatever input this block claimed to take.
    if (lSel.value && rw.form.type) rw.form = { type: '', required: false, raw: '' };
    apply(); syncL();
    const keep = document.activeElement === lTar;
    render();
    if (keep) reopenPop();
  };
  lSel.onchange = setLink;
  lTar.onchange = setLink;
  lTar.oninput = () => { rw.link.target = lTar.value.trim(); rw.link.wiki = !!findGuide(S.doc, lTar.value.trim()); apply(); };
  syncL();
  lRow.append(lSel, lTar);
  field('Goes to', lRow, 'A target naming another guide becomes a route.');

  const fRow = el('div', 'row');
  const fSel = el('select');
  for (const t of FORM_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.form.type || '') === o.value) o.selected = true;
    fSel.appendChild(o);
  }
  const req = el('button', 'tog' + (rw.form.required ? ' on' : ''), 'required');
  req.onclick = () => {
    rw.form = { ...rw.form, required: !rw.form.required };
    apply(); render(); reopenPop();
  };
  req.style.display = rw.form.type ? '' : 'none';
  fSel.onchange = () => {
    rw.form = { type: fSel.value, required: !!(fSel.value && rw.form.required), raw: '' };
    if (fSel.value && rw.link.type) { rw.link = { type: '', target: '', wiki: false, raw: '' }; }
    apply(); render(); reopenPop();
  };
  fRow.append(fSel, req);
  field('Takes', fRow, 'What it is, never how it looks — “one from a list”, not “dropdown”.');

  const caps = el('div', 'row');
  for (const c of CAPABILITIES) {
    const b = el('button', 'tog' + (rw.capabilities.includes(c) ? ' on' : ''), c);
    b.onclick = () => {
      const i = rw.capabilities.indexOf(c);
      if (i === -1) rw.capabilities.push(c); else rw.capabilities.splice(i, 1);
      rw.capabilities = CAPABILITIES.filter((x) => rw.capabilities.includes(x));
      apply(); render(); reopenPop();
    };
    caps.appendChild(b);
  }
  field('Can be', caps);

  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth - 280) + 'px';
  pop.style.top = Math.min(r.top, innerHeight - pop.offsetHeight - 12) + 'px';
  S.pop = pop; S.popRow = rw;
  pop.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') { closePop(); render(); }
  };
  setTimeout(() => document.addEventListener('mousedown', popAway), 0);
}

function popAway(e) {
  if (S.pop && !S.pop.contains(e.target) && !e.target.closest('.fn')) { closePop(); }
}
function closePop() {
  const wasThread = !!(S.pop && S.pop.classList.contains('thread'));
  if (S.pop) S.pop.remove();
  S.pop = null; S.popRow = null;
  if (wasThread) setTimeout(() => { if (!S.pop) render(); }, 0);
  document.querySelectorAll('.more.open').forEach((n) => n.classList.remove('open'));
  document.removeEventListener('mousedown', popAway);
}
/** Keep the picker open across the re-render its own change caused. */
function reopenPop() {
  setTimeout(() => {
    const card = document.querySelector('.lane-r.rowsel .fn');
    if (card && card._ctx) openFnPopover(card, card._ctx);
  }, 0);
}

// ---------------------------------------------------------------- drag
function wireDrag(row, ctx) {
  const { rw } = ctx;
  const item = row.host.querySelector('.item');
  if (!item) return;
  item.draggable = true;
  item.ondragstart = (e) => {
    S.drag = { kind: 'row', row: rw };
    row.c.classList.add('lifting');
    document.body.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', rw.content.text || 'block');
  };
  item.ondragend = () => {
    row.c.classList.remove('lifting');
    endDrag();
  };
}

/** A subsection heading or a reference card can be dragged, the same as a row. */
function dragMarker(el, row, sec, chunk) {
  el.draggable = true;
  el.ondragstart = (e) => {
    S.drag = { kind: 'chunk', chunk, sec };
    row.c.classList.add('lifting');
    document.body.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', chunk.kind === 'sub' ? chunk.title : (chunk.text || 'reference'));
  };
  el.ondragend = () => {
    row.c.classList.remove('lifting');
    endDrag();
  };
}

/** Move a row to an explicit position, possibly in another table. */
function dropRow(g, row, table, sec, at) {
  for (const { table: t, section } of tablesOf(g)) {
    const i = t.rows.indexOf(row);
    if (i === -1) continue;
    const cols = t.cols.names;
    t.rows.splice(i, 1);
    t.dirty = true; section.dirty = true;
    if (t === table && i < at) at--;
    if (JSON.stringify(cols) !== JSON.stringify(table.cols.names)) row.dirty = true;
    break;
  }
  table.rows.splice(Math.max(0, Math.min(at, table.rows.length)), 0, row);
  table.dirty = true; sec.dirty = true;
}

// A design can be a Figma file, or it can be a picture of the thing. Rendering
// it beside the guide is the whole point of linking it, so the picture cases
// get the same treatment the Figma case already had.
const IMAGE_EXT = /\.(png|jpe?g|gif|webp|avif|svg)(\?|#|$)/i;
function isImageUrl(u) { return IMAGE_EXT.test(String(u || '').trim()); }

// A local path is relative to the folder that was opened, and the page is
// served from somewhere else entirely — so it has to be read through the
// directory handle and handed over as a blob.
const blobCache = new Map();
async function localImageUrl(path) {
  const clean = String(path || '').trim().replace(/^<|>$/g, '');
  if (!clean || /^[a-z]+:/i.test(clean)) return null;
  if (blobCache.has(clean)) return blobCache.get(clean);
  if (!S.dir) return null;
  const parts = clean.replace(/^\.\//, '').split('/').filter((p) => p && p !== '.');
  try {
    let dir = S.dir;
    for (const p of parts.slice(0, -1)) {
      if (p === '..') return null;           // never climb out of the opened folder
      dir = await dir.getDirectoryHandle(p);
    }
    const fh = await dir.getFileHandle(parts[parts.length - 1]);
    const url = URL.createObjectURL(await fh.getFile());
    blobCache.set(clean, url);
    return url;
  } catch { blobCache.set(clean, null); return null; }
}

/** Put the picture in the node once it can be reached, or say it could not be. */
async function paintImage(host, url, alt) {
  const src = /^[a-z]+:/i.test(url) ? url : await localImageUrl(url);
  if (!src) {
    host.appendChild(el('div', 'dmiss', 'Not found in this folder'));
    return;
  }
  const img = el('img');
  img.src = src; img.alt = alt || '';
  img.onerror = () => { img.remove(); host.appendChild(el('div', 'dmiss', 'Could not be shown')); };
  host.appendChild(img);
}

// One roster for the panel, read by both the open tabs and the collapsed rail.
const PANELS = [['context', 'Context'], ['design', 'Design'], ['sources', 'Sources'],
  ['links', 'Links'], ['comments', 'Comments']];
const PANEL_GLYPH = { context: 'info', design: 'visual', sources: 'source',
  links: 'onsite', comments: 'bubble' };

function panelCounts() {
  if (!S.doc || !S.guide) return { context: 0, design: 0, sources: 0, links: 0, comments: 0 };
  const links = backlinks(S.doc, S.guide.name);
  const out = links_out(S.guide);
  return {
    context: 0,
    design: designLinks(S.doc, S.guide).length,
    sources: sourceUsage(S.doc).all.filter((s) => s.cites.some((c) => c.guide === S.guide.name)).length,
    links: links.routes.length + links.references.length + out.length,
    comments: openCommentCount(S.doc, S.guide)
  };
}

// Three states, not two: following the machine is the default, and choosing
// light or dark is an override that sticks. Every colour in the app is a token,
// so this is the only place a theme has to be applied.
const THEMES = [
  ['system', 'auto', 'Theme: following the system'],
  ['light', 'sun', 'Theme: light'],
  ['dark', 'moon', 'Theme: dark']
];
function applyTheme() {
  const r = document.documentElement;
  if (S.theme === 'system') r.removeAttribute('data-theme');
  else r.setAttribute('data-theme', S.theme);
  const b = $('theme');
  if (!b) return;
  const [, glyph, title] = THEMES.find((t) => t[0] === S.theme) || THEMES[0];
  b.innerHTML = '';
  b.appendChild(icon(glyph, 14));
  b.title = title + ' — click to change';
  b.setAttribute('aria-label', title);
}
function cycleTheme() {
  const i = THEMES.findIndex((t) => t[0] === S.theme);
  S.theme = THEMES[(i + 1) % THEMES.length][0];
  try {
    if (S.theme === 'system') localStorage.removeItem('pg-theme');
    else localStorage.setItem('pg-theme', S.theme);
  } catch { /* private window */ }
  applyTheme();
}

/** Nothing is held in a draft any more, but the picker can be open. */
function commitEditor() { closePop(); }
function focusEditor() { focusSoon('.rowsel .lbl'); }

/** A new block right after this one, which is what "add here" has to mean. */
function insertBelow(g, sec, table, rw) {
  const at = table.rows.indexOf(rw) + 1;
  const row = addRow(table, sec, { at });
  S.sel = row; mark(); render();
  focusSoon('.rowsel .lbl');
  return row;
}

// ---------------------------------------------------------------- right panel
/**
 * Everything that is true of the whole guide rather than one row: what it is
 * for, what it leans on, and what points at it. All at the same altitude,
 * because they are the same kind of fact — and none of it takes width away from
 * the guide itself.
 */
function renderRailRight() {
  const r = $('railR');
  r.innerHTML = '';
  r.classList.remove('collapsed');
  if (S.present || S.view !== 'guide' || !S.guide) { r.style.display = 'none'; return; }
  r.style.display = '';

  // Collapsed reclaims the width for the guide. A single chevron said only that
  // something was hidden; a stacked icon per tab says what, and a badge says
  // whether it holds anything — so the rail keeps its affordance while closed.
  S.railRWasFolded = railRFolded();
  if (S.railRWasFolded) {
    r.classList.add('collapsed');
    r.style.width = '40px';
    const expand = el('button', 'rexpand');
    expand.appendChild(icon('chev', 13));
    expand.title = 'Show panel';
    expand.onclick = () => setRailRCollapsed(false);
    r.appendChild(expand);

    const counts = panelCounts();
    const strip = el('div', 'rminis');
    for (const [k, label] of PANELS) {
      const b = el('button', 'rmini' + ((S.panel || 'context') === k ? ' on' : ''));
      b.appendChild(icon(PANEL_GLYPH[k] || 'other', 15));
      if (counts[k]) b.appendChild(el('span', 'b', String(counts[k])));
      b.title = counts[k] ? `${label} — ${counts[k]}` : label;
      b.setAttribute('aria-label', b.title);
      b.onclick = () => { S.panel = k; setRailRCollapsed(false); };
      strip.appendChild(b);
    }
    r.appendChild(strip);
    return;
  }
  r.style.width = (S.railRWidth || 340) + 'px';

  const handle = el('div', 'rdrag');
  handle.title = 'Drag to resize';
  handle.onmousedown = (e) => {
    e.preventDefault();
    handle.classList.add('active');
    const startX = e.clientX;
    const startW = S.railRWidth || 340;
    // Narrowing this panel is widening the guide's own column, which can
    // reflow every note in it and change how tall the guide really is — the
    // minimap has to be told, live, or it keeps showing the shape (and the
    // scroll math) the guide had before the drag started.
    let resyncSoon = null;
    const move = (ev) => {
      const w = Math.max(260, Math.min(520, startW - (ev.clientX - startX)));
      S.railRWidth = w;
      r.style.width = w + 'px';
      clearTimeout(resyncSoon);
      resyncSoon = setTimeout(renderMinimap, 60);
    };
    const up = () => {
      handle.classList.remove('active');
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
      setRailRWidth(S.railRWidth);
      clearTimeout(resyncSoon);
      renderMinimap();
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  r.appendChild(handle);

  // Its own row, not squeezed into the tab bar — the tabs are already sized
  // to fill the panel exactly, and a badge on any one of them is enough to
  // push a shared row past the edge.
  const rhead = el('div', 'rhead');
  const collapse = el('button', 'rcollapse');
  collapse.appendChild(icon('chev', 13));
  collapse.title = 'Collapse panel';
  collapse.onclick = () => setRailRCollapsed(true);
  rhead.appendChild(collapse);
  r.appendChild(rhead);

  const tabs = el('div', 'ptabs');
  const body = el('div', 'pbody');
  // Named apart from the imported `links()` so the panel cannot accidentally
  // read the function instead of this guide's back-links.
  const backLinks = backlinks(S.doc, S.guide.name);
  const outLinks = links_out(S.guide);
  const counts = panelCounts();
  for (const [k, label] of PANELS) {
    const b = el('button', (S.panel || 'context') === k ? 'on' : '');
    b.dataset.panel = k;
    b.appendChild(el('span', 'l', label));
    if (counts[k]) b.appendChild(el('span', 'n', String(counts[k])));
    b.onclick = () => { S.panel = k; render(); };
    tabs.appendChild(b);
  }
  r.append(tabs, body);

  if ((S.panel || 'context') === 'context') panelContext(body);
  else if (S.panel === 'design') panelDesign(body);
  else if (S.panel === 'sources') panelSources(body);
  else if (S.panel === 'comments') panelComments(body);
  else panelLinks(body, backLinks, outLinks);
}

function links_out(g) {
  return links(S.doc).routes.filter((r) => r.from === g.name);
}

// ---------------------------------------------------------------- context tab
/**
 * What the guide is for. Each field says what it means on request, because
 * "Business goal" is only obvious to the person who wrote the method down.
 */
const FIELD_MEANS = {
  type: 'Screen, or Reference section. A Screen is any contained experience — a page, a dialog, a modal, a side panel. What matters is that it is contained, not what shape it is.',
  userGoal: 'What someone is trying to get done on this screen, and how they go about it. One or two sentences.',
  businessGoal: 'Why the business wants this screen to work — tie it back to the brief. If nobody has said, leave it ?? rather than reasoning one out.'
};

// Type sits last: it is the field you set once and rarely look at again.
const CONTEXT_ORDER = ['userGoal', 'businessGoal', 'primaryUsers', 'notes', 'type'];

function panelContext(body) {
  const g = S.guide;
  const OPTIONAL = ['type'];
  const missing = [];

  for (const key of CONTEXT_ORDER) {
    const val = (g.fields[key] || '').trim();
    if (!val && OPTIONAL.includes(key) && S.shownField !== key) { missing.push(key); continue; }

    const box = el('div', 'ctx');
    const head = el('div', 'ctx-h');
    head.appendChild(el('span', 'lb', FIELD_LABELS[key]));

    if (FIELD_MEANS[key]) {
      const i = el('button', 'info');
      i.appendChild(icon('info', 12));
      i.title = FIELD_MEANS[key];
      i.onclick = () => { S.explain = S.explain === key ? null : key; render(); };
      head.appendChild(i);
    }
    if (key === 'primaryUsers' && !S.readOnly) head.appendChild(addBtn('+ user', () => startUser(g)));
    if (key === 'notes' && !S.readOnly) head.appendChild(addBtn('+ note', () => addGuideNote()));
    box.appendChild(head);

    if (S.explain === key) box.appendChild(el('div', 'means', FIELD_MEANS[key]));

    if (key === 'primaryUsers') box.appendChild(usersField(g));
    else if (key === 'notes') box.appendChild(notesField(g));
    else box.appendChild(textField(g, key, val));
    body.appendChild(box);
  }

  if (missing.length && !S.readOnly) {
    const add = el('div', 'addfield');
    for (const key of missing) {
      const b = el('button', null, '+ ' + FIELD_LABELS[key].toLowerCase());
      b.onclick = () => { S.shownField = key; render(); focusSoon(`.ctx dd[data-key="${key}"]`); };
      add.appendChild(b);
    }
    body.appendChild(add);
  }
}

function addBtn(label, fn) {
  const b = el('button', 'ctx-add', label);
  b.onclick = fn;
  return b;
}

function textField(g, key, val) {
  const dd = el('dd');
  dd.dataset.key = key;
  if (isUnknown(val)) { dd.className = 'unknown'; dd.textContent = val; dd.title = 'Nobody has been asked yet'; }
  else if (val) setLinked(dd, val, g);
  else blankable(dd, '', FIELD_PLACEHOLDER[key], 'empty');
  editable(dd, val, (v) => {
    setField(g, key, v);
    if (S.shownField === key && v) S.shownField = null;
  }, { multiline: true });
  return dd;
}

/**
 * Notes on the guide are separate blocks, the same as notes on a row. Nobody
 * should have to think about how to get two paragraphs into one field.
 */
function notesField(g) {
  const wrap = el('div', 'gnotes');
  const list = parseNoteCell(g.fields.notes);
  if (S.newNote) list.push({ text: '', action: false });
  const commit = () => { S.newNote = false; setField(g, 'notes', renderNoteCell(list)); mark(); };
  if (!list.length) {
    const p = el('div', 'ctx-empty', S.readOnly ? '' : 'Screen-wide context only — scope, phase, why it exists.');
    wrap.appendChild(p);
    return wrap;
  }
  list.forEach((n, i) => {
    const card = el('div', 'gnote');
    const t = el('div', 't');
    setLinked(t, n.text, g);
    if (!n.text) blankable(t, '', 'Note');
    editable(t, n.text, (v) => {
      if (!v) list.splice(i, 1); else n.text = v;
      commit();
    }, { multiline: true });
    if (!n.text) t.addEventListener('blur', () => { if (S.newNote) { S.newNote = false; render(); } });
    card.appendChild(t);
    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Delete this note';
      x.onclick = async () => {
        if (!await confirmDelete('this note', 'There is no undo for a note.')) return;
        list.splice(i, 1); commit(); render();
      };
      card.appendChild(x);
    }
    wrap.appendChild(card);
  });
  return wrap;
}

function addGuideNote() {
  S.newNote = true;
  render();
  focusSoon('.gnotes .gnote:last-of-type .t');
}

/**
 * A user type is a thing, not a phrase. Picking from what the file already uses
 * is what stops "Sales agent" and "Sales Agent" becoming two groups that are
 * really one.
 */
function usersField(g) {
  const dd = el('dd', 'nofocus');
  dd.dataset.key = 'primaryUsers';
  const raw = (g.fields.primaryUsers || '').trim();
  const list = parseUsers(raw);
  const commit = (next) => { setField(g, 'primaryUsers', renderUsers(next)); mark(); render(); };

  if (!list.length) {
    dd.appendChild(el('div', 'ctx-empty',
      isUnknown(raw) ? '?? nobody has been asked' : (S.readOnly ? '' : 'Who uses this screen, and who uses it most.')));
    if (isUnknown(raw)) dd.firstChild.classList.add('unknown');
    if (S.startUser) dd.appendChild(userInput(list, commit));
    return dd;
  }
  const wrap = el('div', 'chips');
  list.forEach((u, i) => {
    const c = el('span', 'chip');
    const t = el('span', 'nm', u.name);
    if (!S.readOnly) {
      t.title = 'Rename this role. It changes everywhere it is used.';
      editable(t, u.name, (v) => {
        if (!v || v === u.name) return;
        const n = renameUserType(S.doc, u.name, v);
        if (n > 1) {
          const b = banner('info', `<b>Renamed in ${n} guides.</b> “${esc(u.name)}” is now “${esc(v)}”.`);
          setTimeout(() => b.remove(), 3000);
        }
      });
    }
    c.appendChild(t);
    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Remove';
      x.onclick = () => commit(list.filter((_, j) => j !== i));
      c.appendChild(x);
    }
    wrap.appendChild(c);
  });
  if (S.startUser) wrap.appendChild(userInput(list, commit));
  dd.appendChild(wrap);
  return dd;
}

function startUser(g) {
  S.startUser = true;
  render();
  focusSoon('.chip input');
}

function userInput(list, commit) {
  const c = el('span', 'chip');
  const inp = el('input');
  inp.setAttribute('list', 'usertypes');
  inp.placeholder = 'user type';
  const done = () => { S.startUser = false; };
  inp.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Enter') {
      const v = inp.value.trim();
      done();
      if (!v) { render(); return; }
      const known = userTypes(S.doc).find((u) => u.name.toLowerCase() === v.toLowerCase());
      commit([...list, { name: known ? known.name : v, primary: false }]);
    } else if (e.key === 'Escape') { done(); render(); }
  };
  inp.onblur = () => setTimeout(() => { if (document.activeElement !== inp) { done(); render(); } }, 120);
  c.appendChild(inp);
  return c;
}

// ---------------------------------------------------------------- sources tab
function panelSources(body) {
  const usage = sourceUsage(S.doc);
  // Attached, not merely cited: a handle can appear here because it sits in
  // this guide's own Sources field, or only because it was cited once from
  // inside a note somewhere in the guide. Detaching only ever edits the
  // Sources field, so a card built from the second kind looked exactly like
  // the first but its × did nothing — the field never had it to remove.
  const attached = refsIn(S.guide.fields.sources);
  const mine = attached.map((h) => usage.all.find((s) => s.handle === h)
    || { handle: h, def: resolveSource(S.doc, S.guide, h), cites: [] });

  if (!mine.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing attached yet. A brief, a synthesis, a decision — anything this guide leans on.'));
  }
  for (const s of mine) body.appendChild(sourceCard(s));

  if (!S.readOnly) {
    const add = el('button', 'rail-add', '+  Add a source');
    add.onclick = () => { add.style.display = 'none'; newSourceForm(add.parentNode, null, S.guide); };
    body.appendChild(add);
  }
}

function sourceCard(s) {
  const c = el('div', 'src' + (s.def ? '' : ' bad'));
  if (!s.def) {
    c.appendChild(el('div', 'h', s.handle));
    c.appendChild(el('div', 't', 'Attached, but no source by that name is defined.'));
    if (!S.readOnly) {
      const fix = el('button', 'quiet', 'Define it');
      fix.onclick = () => { fix.style.display = 'none'; newSourceForm(c, null, null); };
      c.appendChild(fix);
    }
    return c;
  }
  const head = el('div', 'h');
  const web = isWebUrl(s.def.url);
  // A web link opens; a local path cannot, so clicking it used to copy the
  // path and swap the whole title to say so — jarring, and gone the moment
  // you looked away. A copy icon next to delete does the one thing it says.
  let link;
  if (web) {
    link = outLink(s.def.url, s.def.title || s.handle, s.def.url);
  } else {
    link = el('span', null, s.def.title || s.handle);
    link.title = s.def.url;
  }
  link.classList.add('title');
  head.appendChild(link);
  if (!web) {
    const copy = el('button', 'copybtn');
    copy.appendChild(icon('copy', 13));
    copy.title = 'Copy the path — a browser cannot open a local file';
    copy.onclick = (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(s.def.url).then(() => {
        copy.classList.add('copied');
        copy.innerHTML = '';
        copy.appendChild(icon('tick', 13));
        setTimeout(() => {
          copy.classList.remove('copied');
          copy.innerHTML = '';
          copy.appendChild(icon('copy', 13));
        }, 1200);
      }, () => banner('warn', `<b>Could not copy.</b> The path is <code>${esc(s.def.url)}</code>`));
    };
    head.appendChild(copy);
  }
  if (!S.readOnly) {
    const x = el('button', 'x', '×');
    x.title = 'Detach from this guide. The source stays in the file.';
    x.onclick = () => detachFromGuide(S.guide, s.handle);
    head.appendChild(x);
  }
  c.appendChild(head);
  c.appendChild(el('div', 'u', shortUrl(s.def.url)));
  return c;
}

// ---------------------------------------------------------------- design tab
/**
 * What this guide turned into.
 *
 * A priority guide is the thing you agree before anything is laid out, so the
 * layout it produced is the one artifact worth keeping a hand on. A Figma link
 * can be opened beside the guide, which is the only way to check one against
 * the other without holding a screen in your head.
 */
function panelDesign(body) {
  const g = S.guide;
  const links = designLinks(S.doc, g);
  const order = () => refsIn(g.fields.design);
  const write = (handles) => {
    setField(g, 'design', handles.map((h) => `[${h}]`).join(', '));
    mark(); render();
  };

  if (!links.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing linked yet. A Figma file, a prototype, a screenshot — whatever this guide became.'));
  }

  links.forEach((d, i) => {
    const c = el('div', 'dcard' + (d.figma ? ' figma' : ''));
    const head = el('div', 'h');

    if (!S.readOnly) {
      const grip = el('span', 'grip');
      grip.appendChild(icon('grip', 12));
      grip.title = 'Drag to reorder';
      head.appendChild(grip);
    }

    // The name is the thing you read, so it is the thing you click to change.
    // It belongs to the source, so every guide citing it follows.
    const name = el('div', 'title');
    name.textContent = d.title;
    if (S.readOnly) name.title = d.url;
    else {
      name.title = 'Rename. This is the source’s name, so it changes everywhere it is cited.';
      editable(name, d.title, (v) => { if (v) setSourceTitle(S.doc, g, d.handle, v); });
    }
    head.appendChild(name);

    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Unlink from this guide. The source stays in the file.';
      // A one-click-plus-undo delete is fine for content the guide owns. A
      // linked design is different: the seven-second toast is not a real way
      // back once it is gone, so this one asks first — undo stays, as a
      // second net, for the moment right after confirming.
      x.onclick = async () => {
        const proceed = await ask({
          title: `Unlink “${d.title}”?`,
          body: 'The source stays in the file — nothing is deleted. But this '
            + 'guide will need to be re-linked to bring it back here.',
          choices: [
            { label: 'Cancel', value: false, cancel: true },
            { label: 'Unlink', value: true, danger: true }
          ]
        });
        if (!proceed) return;
        const before = order();
        write(before.filter((h) => h !== d.handle));
        undoable(`“${d.title}”`, () => write(before));
      };
      head.appendChild(x);
    }
    c.appendChild(head);

    const open = outLink(d.url, shortUrl(d.url), d.url);
    open.classList.add('u');
    c.appendChild(open);

    if (isImageUrl(d.url)) {
      const th = el('div', 'dthumb');
      th.title = 'Open beside the guide';
      th.onclick = () => { S.beside = d; render(); };
      c.appendChild(th);
      paintImage(th, d.url, d.title);
    }

    if (d.figma || isImageUrl(d.url)) {
      const b = el('button', 'sidebyside');
      b.appendChild(icon('sideby', 13));
      b.appendChild(el('span', null, 'Open beside the guide'));
      b.onclick = () => { S.beside = d; render(); };
      c.appendChild(b);
    }

    if (!S.readOnly) {
      c.draggable = true;
      c.ondragstart = (e) => {
        S.dragDesign = d.handle; c.classList.add('lifting');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', d.title);
      };
      c.ondragend = () => {
        S.dragDesign = null;
        document.querySelectorAll('.dcard').forEach((n) =>
          n.classList.remove('lifting', 'dropbefore', 'dropafter'));
      };
      c.ondragover = (e) => {
        if (!S.dragDesign || S.dragDesign === d.handle) return;
        e.preventDefault();
        const r = c.getBoundingClientRect();
        const below = e.clientY > r.top + r.height / 2;
        c.classList.toggle('dropbefore', !below);
        c.classList.toggle('dropafter', below);
      };
      c.ondragleave = () => c.classList.remove('dropbefore', 'dropafter');
      c.ondrop = (e) => {
        e.preventDefault();
        const below = c.classList.contains('dropafter');
        c.classList.remove('dropbefore', 'dropafter');
        const moving = S.dragDesign;
        S.dragDesign = null;
        if (!moving || moving === d.handle) return;
        const list = order().filter((h) => h !== moving);
        let at = list.indexOf(d.handle) + (below ? 1 : 0);
        list.splice(Math.max(0, Math.min(at, list.length)), 0, moving);
        write(list);
      };
    }
    body.appendChild(c);
  });

  if (S.readOnly) return;
  const add = el('button', 'rail-add', '+  Link a design');
  add.onclick = async () => {
    const url = await askText({
      title: 'Link a design',
      body: 'A Figma file, a prototype, a screenshot — anything this guide turned into. '
        + 'A Figma link can be opened beside the guide.',
      placeholder: 'https://www.figma.com/design/…',
      action: 'Link'
    });
    if (!url) return;
    const title = await askText({
      title: 'What is it?',
      placeholder: isFigma(url) ? 'Deskline — booking flow' : 'Name for this artifact',
      value: isFigma(url) ? guessFigmaName(url) : '',
      action: 'Link'
    });
    const entry = addSource(S.doc, { handle: handleFor(title || url, S.doc), url, title: title || '' });
    write([...order(), entry.handle]);
  };
  body.appendChild(add);
}

/** Figma puts the file name in the path, so offer it rather than an empty box. */
function guessFigmaName(url) {
  try {
    const parts = new URL(url).pathname.split('/').filter(Boolean);
    return decodeURIComponent(parts[2] || '').replace(/-/g, ' ').trim();
  } catch { return ''; }
}

// ---------------------------------------------------------------- side by side
/**
 * The guide and the design it produced, on one screen.
 *
 * The guide is read-only here on purpose: this is the checking pass, not the
 * writing one, and an accidental edit while you are looking at something else
 * is the kind of change nobody remembers making.
 */
function renderBeside() {
  const stage = $('stage');
  const d = S.beside;
  const wrap = el('div', 'beside');

  const left = el('div', 'bside');
  const lh = el('div', 'bhead');
  lh.appendChild(el('span', 'n', S.guide.name));
  lh.appendChild(el('span', 'm', 'read-only'));
  left.appendChild(lh);
  const scroll = el('div', 'bscroll');
  left.appendChild(scroll);

  const divider = el('div', 'bdrag');
  divider.title = 'Drag to resize';

  const right = el('div', 'bside');
  const rh = el('div', 'bhead');
  rh.appendChild(el('span', 'n', d.title));
  const open = outLink(d.url, d.figma ? 'Open in Figma' : 'Open the file', d.url);
  open.classList.add('m');
  rh.appendChild(open);
  // Closing lives on the design side, next to the link that opened it — the
  // guide pane stays exactly what it already says it is: read-only.
  const close = el('button', 'bclose', 'Close');
  close.title = 'Close (Esc)';
  close.onclick = () => { S.beside = null; render(); };
  rh.appendChild(close);
  right.appendChild(rh);
  let frame;
  if (d.figma) {
    frame = el('iframe', 'bframe');
    frame.src = d.figma;
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('loading', 'lazy');
  } else {
    frame = el('div', 'bframe bimg');
    paintImage(frame, d.url, d.title);
  }
  right.appendChild(frame);

  wrap.append(left, divider, right);
  stage.appendChild(wrap);

  const setSplit = (w) => { wrap.style.gridTemplateColumns = `minmax(0,${w}px) 11px minmax(0,1fr)`; };
  setSplit(S.besideSplit || 564);
  divider.onmousedown = (e) => {
    e.preventDefault();
    divider.classList.add('active');
    // The iframe swallows mousemove once the cursor crosses into it, which
    // would otherwise cut a rightward drag off at the divider's own edge.
    frame.style.pointerEvents = 'none';
    const startX = e.clientX;
    const startW = S.besideSplit || 564;
    const move = (ev) => {
      const total = wrap.getBoundingClientRect().width;
      const max = Math.max(320, Math.min(900, total - 11 - 400));
      const w = Math.max(320, Math.min(max, startW + (ev.clientX - startX)));
      S.besideSplit = w;
      setSplit(w);
    };
    const up = () => {
      divider.classList.remove('active');
      frame.style.pointerEvents = '';
      document.removeEventListener('mousemove', move);
      document.removeEventListener('mouseup', up);
    };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };

  // The guide, drawn by the same code that draws it anywhere else — read-only
  // so this cannot become a second way to edit that behaves differently.
  const was = S.readOnly;
  S.readOnly = true;
  try { renderGuide(scroll); } finally { S.readOnly = was; }
}

// ---------------------------------------------------------------- links tab
/**
 * What this guide leads to, and what leads here. The second half is the thing a
 * design tool cannot tell you, so it does not belong buried under the guide
 * where nobody scrolls.
 */
function panelLinks(body, back, out) {
  const group = (title, list, render1) => {
    if (!list.length) return;
    const h = el('div', 'rail-h', title);
    h.style.marginTop = body.children.length ? '18px' : '0';
    body.appendChild(h);
    for (const x of list) body.appendChild(render1(x));
  };

  group('Goes to', out, (r) => {
    const b = el('button', 'linkrow');
    const n = el('div', 'n', r.to);
    if (!r.resolved) { n.className = 'n'; n.style.color = 'var(--flag)'; }
    b.appendChild(n);
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`
      + (r.resolved ? '' : ' · no guide by that name')));
    if (r.resolved) b.onclick = () => goGuide(r.to);
    return b;
  });

  group('Referenced by', back.routes, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  group('Mentioned by', back.references, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', r.text));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  if (!body.children.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing links to or from this guide yet. Give a block a Goes-to, or add a reference from the toolbar.'));
  }
}

function goGuide(name) {
  const g = findGuide(S.doc, name);
