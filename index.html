<!doctype html>
<meta charset="utf-8">
<title>priority guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#16181d; --dim:#6b7280; --faint:#9aa1ac;
  --line:rgba(16,18,22,.11); --hover:rgba(16,18,22,.05);
  --bg:#f6f7f9; --panel:#fff; --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --ok:#177245; --warn:#9a6700; --none:#8a8f98; --flag:#b8541f; --act:#b3261e;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
#bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
#bar .brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#bar .file{color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:26ch;
  cursor:pointer;padding:4px 7px;border-radius:7px}
#bar .file:hover{background:var(--hover);color:var(--ink)}
#bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--dim);font-size:12.5px;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--dim);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.on:hover{background:var(--ink);filter:brightness(1.35)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.count{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:600;color:var(--flag)}
.count.clear b{color:var(--ok)}
.quiet{color:var(--faint);font-size:12px}
.quiet:hover{color:var(--dim);text-decoration:underline}

/* ---------- banners ---------- */
#banners{position:sticky;top:52px;z-index:5}
.banner{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
.banner.err{background:#fdf1ef;color:#8a2d16}
.banner.warn{background:#fdf8ec;color:#7a5b00}
.banner.info{background:#eef4ff;color:#1b3f8f}
.banner b{font-weight:600}
.banner code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.banner button{margin-left:10px;text-decoration:underline}

/* ---------- layout ---------- */
main{height:calc(100% - 52px);display:flex;overflow:hidden}
#railL{width:214px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px 10px 40px}
#railR{width:296px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;overflow-y:auto;padding:22px 30px 40px;min-width:0}
.wrap{max-width:760px;margin:0 auto}

/* ---------- page header: which guide, always ---------- */
#pagehead{flex:none;padding:16px 30px 12px;border-bottom:1px solid var(--line);
  background:var(--panel)}
#pagehead h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25;
  padding:2px 6px;margin-left:-6px;border-radius:7px;display:inline-block;min-width:2ch}
#pagehead h1:hover{background:var(--hover)}
#pagehead h1:focus{outline:none;background:var(--accent-soft)}
#pagehead .sub{margin-top:4px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
#pagehead .sub .who{color:var(--ink)}
#pagehead .sub .dot{color:var(--faint)}
#pagehead .sub .open{color:var(--flag);font-weight:500}

/* ---------- bottom toolbar: the creator tools ---------- */
#tools{flex:none;display:flex;align-items:center;gap:6px;padding:9px 30px;
  border-top:1px solid var(--line);background:var(--panel);font-size:12.5px}
#tools .lbl{color:var(--faint);margin-right:2px}
#tools .into{margin-left:auto;color:var(--faint);display:flex;align-items:center;gap:6px}
#tools .into select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;
  background:var(--panel);max-width:22ch}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  color:var(--dim);font-weight:500}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool svg{color:var(--faint)}
.tool:hover svg{color:var(--ink)}

body.present #railL,body.present #railR,body.present #tools{display:none}
body.present #pagehead{padding:22px 30px 16px}
body.present #pagehead h1{font-size:28px}
body.present #stage{padding:30px 30px 90px}
body.present{font-size:15px}
body.present .sec-title{font-size:15.5px}

/* ---------- left rail: guides ---------- */
.rail-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:0 8px 7px}
.g-item{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--dim);line-height:1.35}
.g-item:hover{background:var(--hover);color:var(--ink)}
.g-item.on{background:var(--accent-soft);color:var(--ink)}
.g-item .n{font-weight:500;display:block}
.g-item .m{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.g-item.on .m{color:var(--dim)}
.g-item .m .o{color:var(--flag);font-weight:600}
.rail-add{margin-top:6px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--faint);font-size:12.5px}
.rail-add:hover{background:var(--hover);color:var(--ink)}

.g-title{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;
  font-size:11px;font-weight:500;white-space:nowrap;background:var(--hover);color:var(--dim)}
.pill.dead{background:rgba(184,84,31,.12);color:var(--flag)}

/* ---------- the guide: three lanes ----------
   The middle is the guide itself — what each thing is called, and what its data
   actually looks like. Notes annotate it from the left, functionality from the
   right, each on a dotted leader to the one row it describes. */
.guide{--lane-l:264px; --stack:340px; --lane-r:270px;
  display:grid;grid-template-columns:var(--lane-l) var(--stack) var(--lane-r);
  margin:0 auto;width:max-content;max-width:100%}
body.present .guide{--lane-l:300px; --stack:400px; --lane-r:320px}

/* Every row is a grid row so an annotation lines up with the one item it
   annotates. The stack reads as one continuous column because each middle cell
   carries the side borders and the ends carry the caps. */
.cell{grid-column:2;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);
  background:var(--panel);padding:0 10px;display:flex;flex-direction:column}
.cell.top{border-top:1.5px solid var(--ink);padding-top:10px}
.cell.bot{border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.cell.gap{height:10px}
.band{background:var(--hover);padding:0 12px;flex:1;display:flex;flex-direction:column}
.band.open{padding-top:9px;border-radius:2px 2px 0 0}
.band.close{padding-bottom:9px;border-radius:0 0 2px 2px}
.band > *{margin-bottom:6px}
.band.close > *:last-child{margin-bottom:0}
.lane{display:flex;align-items:flex-start;min-height:1px;position:relative}
.lane-l{grid-column:1;justify-content:flex-end}
.lane-r{grid-column:3}
.lead{flex:none;width:20px;border-top:1px dotted var(--faint);margin-top:12px}

/* ---------- one row in the stack ---------- */
.item{padding:2px 0}
.item .box{border:1px solid var(--ink);background:var(--panel);border-radius:2px;
  padding:3px 8px;display:flex;align-items:center;gap:6px;min-height:24px}
.item.plain .box,.item.linky .box{border-color:transparent;background:transparent;padding-left:2px}
.item.linky .lbl{text-decoration:underline;text-underline-offset:2px}
.item.visual .box{border-style:dashed;color:var(--dim)}
.lbl{flex:1;min-width:0;font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;
  padding:1px 3px;margin-left:-3px;border-radius:4px}
.lbl:hover{background:rgba(16,18,22,.06)}
.lbl:focus{outline:none;background:var(--accent-soft)}
.lbl .unk{color:var(--flag);font-weight:500}
.eg{font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:2px;padding:1px 4px;
  margin-left:-1px;border-radius:4px;overflow-wrap:anywhere}
.eg:hover{background:rgba(16,18,22,.06)}
.eg:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.eg.none{color:var(--faint);font-style:italic}
.eg.unk{color:var(--flag);font-weight:500;font-style:normal}
.item .chev{flex:none;color:var(--dim)}
.rowsel .box{outline:2px solid var(--accent);outline-offset:1px}
.drag .item{opacity:.35}
.over .item{box-shadow:0 -2px 0 var(--accent)}
.over-b .item{box-shadow:0 2px 0 var(--accent)}
.flag{font-size:10.5px;color:var(--flag);line-height:1.4;margin-top:3px;padding-left:2px}

/* ---------- notes, on the left ---------- */
.notes{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:1;min-width:0}
.note{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:3px 7px;font-size:11px;line-height:1.4;color:var(--dim);
  display:flex;gap:6px;align-items:flex-start;max-width:100%}
.note.act{border-color:rgba(179,38,30,.35);background:rgba(179,38,30,.05);color:var(--act)}
.note .t{min-width:0;flex:1;padding:0 2px;border-radius:3px}
.note .t:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.note .k{flex:none;font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--act);margin-top:1px}
.note .gl{flex:none;color:var(--faint);margin-top:1px}
.note.act .gl{color:var(--act)}
.note{position:relative}
/* Outside the card, so revealing them cannot reflow the note or the row. */
.note .tools{position:absolute;right:100%;top:1px;margin-right:5px;display:flex;gap:1px;
  opacity:0;pointer-events:none;transition:opacity .1s var(--ease)}
.note:hover .tools,.note:focus-within .tools{opacity:1;pointer-events:auto}
.note .tools button{color:var(--faint);font-size:11px;line-height:1;padding:1px 3px;border-radius:4px}
.note .tools button:hover{color:var(--ink);background:var(--hover)}
.note a{color:var(--accent)}
.rowtools{display:flex;gap:10px;margin-top:3px;padding-left:2px}
.rowtools button{font-size:11px;color:var(--faint);padding:1px 0}
.rowtools button:hover{color:var(--ink);text-decoration:underline}
.addnote{opacity:0;font-size:11px;color:var(--faint);padding:2px 6px;border-radius:6px;
  border:1px dashed var(--line);transition:opacity .12s var(--ease)}
.lane-l:hover .addnote,.rowsel .addnote{opacity:1}
.addnote:hover{color:var(--ink);border-color:var(--dim)}

/* ---------- functionality, on the right ---------- */
.fn{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;max-width:100%}
.fn{cursor:pointer}
.fn:hover{border-color:var(--dim)}
.fn a.tgt:hover{text-decoration:underline}
.fn .l{display:flex;gap:6px;align-items:flex-start}
.fn .l svg{flex:none;color:var(--dim);margin-top:1px}
.fn .l b{font-weight:500}
.fn .tgt{color:var(--accent)}
.fn .tgt.dead{color:var(--flag)}
.fn .req{color:var(--act);font-weight:600}
.fn .caps{color:var(--dim);font-size:11px;letter-spacing:.01em}
.fn.empty{border-style:dashed;color:var(--faint);opacity:0;transition:opacity .12s var(--ease)}
.lane-r:hover .fn.empty,.rowsel .fn.empty{opacity:1}

/* ---------- functionality popover ---------- */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.14);padding:12px;width:266px;
  display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px 9px;align-items:center}
.pop label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint)}
.pop select,.pop input{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.pop .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pop .hint{grid-column:2;font-size:10.5px;color:var(--faint);line-height:1.35}
.pop .foot{grid-column:1/-1;display:flex;justify-content:flex-end;padding-top:2px}
.tog{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:500;color:var(--dim);
  background:var(--hover)}
.tog:hover{color:var(--ink)}
.tog.on{background:var(--ink);color:var(--panel)}
.tog.act.on{background:var(--act)}

/* ---------- sections in the stack ---------- */
.sec-title{font-size:12.5px;font-weight:500;text-align:center;margin:0;padding:2px 6px;
  border-radius:5px}
.sec-title:hover{background:rgba(16,18,22,.06)}
.sec-title:focus{outline:none;background:var(--accent-soft)}
.sec-note{font-size:11px;color:var(--dim);text-align:center;font-style:italic;line-height:1.4;
  padding:2px 6px;border-radius:5px}
.sec-note:hover{background:rgba(16,18,22,.06)}
.sec-note:focus{outline:none;background:var(--accent-soft);font-style:normal;color:var(--ink)}
.sec-note.none{color:var(--faint)}
.sub{border-top:1px solid var(--line);margin-top:3px;padding-top:8px}
.sub-t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);text-align:center;padding:1px 4px;border-radius:4px}
.sub-t:focus{outline:none;background:var(--accent-soft)}
.ref{border:1px dashed var(--line);border-radius:2px;padding:7px 10px;font-size:11.5px;
  color:var(--dim);text-align:center;line-height:1.45}
.ref:focus{outline:none;background:var(--accent-soft)}
.raw-table{white-space:pre;overflow-x:auto;font:10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--faint);background:var(--panel);border-radius:4px;padding:6px 8px}
.sectools{display:flex;gap:1px;opacity:0;transition:opacity .12s var(--ease);margin-top:1px}
.lane-l:hover .sectools{opacity:.75}
.sectools:hover{opacity:1}
.sectools button{color:var(--faint);font-size:12px;padding:2px 5px;border-radius:5px}
.sectools button:hover{color:var(--ink);background:var(--hover)}

/* ---------- right panel ---------- */
#railR .ptabs{flex:none;display:flex;gap:2px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
#railR .ptabs button{padding:6px 10px;border-radius:7px 7px 0 0;color:var(--dim);font-size:12.5px;
  font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
#railR .ptabs button:hover{color:var(--ink)}
#railR .ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#railR .pbody{flex:1;overflow-y:auto;padding:14px 14px 40px}
.ctx{margin-bottom:14px}
.ctx dt{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);margin-bottom:2px}
.ctx dd{margin:0;font-size:12.5px;line-height:1.5;padding:3px 6px;margin-left:-6px;border-radius:7px}
.ctx dd:hover{background:var(--hover)}
.ctx dd:focus{outline:none;background:var(--accent-soft)}
.ctx dd.unknown{color:var(--flag);font-weight:500}
.ctx dd.empty{color:var(--faint);font-style:italic}
.ctx dd a{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--hover);
  border-radius:6px;padding:2px 5px 2px 8px;color:var(--ink)}
.chip.pri{background:var(--ink);color:var(--panel);font-weight:500}
.chip .x{color:var(--faint);font-size:13px;line-height:1;padding:0 1px}
.chip.pri .x{color:rgba(255,255,255,.6)}
.chip .x:hover{color:var(--act)}
.chip.pri .x:hover{color:#fff}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--faint);padding:2px 8px}
.chip.add:hover{color:var(--ink);border-color:var(--dim)}
.chip input{background:transparent;border:0;color:inherit;width:13ch;outline:none;font-size:11.5px}
.addfield{margin-top:8px;font-size:11.5px}
.addfield button{color:var(--faint);margin-right:12px}
.addfield button:hover{color:var(--ink);text-decoration:underline}
.linkrow{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;
  font-size:12.5px;line-height:1.45}
.linkrow:hover{background:var(--hover)}
.linkrow .n{font-weight:500;color:var(--accent)}
.linkrow .m{color:var(--faint);font-size:11.5px;display:block;margin-top:1px}

/* ---------- capture ---------- */
#cap{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);
  border-top:1px solid var(--line);padding:12px 30px;box-shadow:0 -6px 24px rgba(0,0,0,.06)}
#cap .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
#cap input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
#cap .where{font-size:12px;color:var(--faint);white-space:nowrap}
#cap .tally{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- right rail: sources ---------- */
.src{padding:9px 10px;border-radius:9px;margin-bottom:2px}
.src:hover{background:var(--hover)}
.src .h{font-weight:500;display:flex;align-items:baseline;gap:6px}
.src .h .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto}
.src .t{font-size:12.3px;color:var(--dim);line-height:1.4;margin-top:1px}
.src .u{font-size:11.5px;color:var(--faint);word-break:break-all;margin-top:2px;display:block}
.src.bad .h{color:var(--flag)}
.src .cites{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.5}
.rail-empty{color:var(--faint);font-size:12.5px;padding:6px 10px;line-height:1.5}

.srcform{padding:8px 10px;background:var(--hover);border-radius:9px;margin:4px 0 8px}
.srcform input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);margin-bottom:5px;font-size:12.5px}
.srcform-foot{display:flex;gap:8px;align-items:center;margin-top:2px}
.src .h{align-items:center}
.src .title{font-weight:500;text-align:left}
.src .x{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;padding:0 3px}
.src .x:hover{color:var(--act)}
.src .quiet{margin-top:4px;display:block}

/* ---------- users ---------- */
.usr{margin:0 0 26px}
.usr-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:4px}
.usr-h .n{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.usr-h .m{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.usr-h .btn{margin-left:auto}
#userbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--accent-soft);
  border-bottom:1px solid var(--line);font-size:12.5px}
#userbar b{font-weight:600}

/* ---------- flow ---------- */
#flow{width:100%;overflow:auto}
#flow svg{display:block}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1}
.node.on rect{stroke:var(--accent);stroke-width:2}
.node:hover rect{fill:var(--hover)}
.node text{font-size:12.5px;font-weight:500;fill:var(--ink)}
.node text.m{font-size:11px;fill:var(--faint);font-weight:400}
.node text.o{font-size:11px;fill:var(--flag);font-weight:600}
.edge{fill:none;stroke:rgba(16,18,22,.26);stroke-width:1.5}
.edge.hot{stroke:var(--accent);stroke-width:2}
.edge.ref{stroke-dasharray:5 4;stroke:rgba(16,18,22,.20)}
.elabel{font-size:10.5px;fill:var(--faint)}

/* ---------- open items ---------- */
.oi{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;

<script type="module">
import {
  parseDocument, serializeDocument, verifyRoundTrip,
  guides, findGuide, tablesOf, rowsOf, allRows, countRows,
  openItems, links, backlinks, unreachable, sourceUsage, resolveSource,
  lintRow, addRow, touchRow, moveRow, moveSection, setField,
  addSection, addGuide, addSource, blankGuidesFile,
  parseContentCell, renderContentCell, parseCapabilities, renderCapabilities,
  parseLinkCell, renderLinkCell, parseFormCell, renderFormCell,
  parseNoteCell, renderNoteCell,
  parseUsers, renderUsers, userTypes, handleFor, isWebUrl, refsIn, hasAction,
  proseOf, setProse,
  LINK_TYPES, FORM_TYPES, CAPABILITIES, GUIDE_FIELDS
} from './parser.js';

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

const FIELD_LABELS = {
  type: 'Type', userGoal: 'User goal', businessGoal: 'Business goal',
  primaryUsers: 'Primary users', notes: 'Notes', sources: 'Sources'
};
// A blank is not the same as ??. Blank means the question does not apply here;
// ?? means nobody has been asked. Neither is ever normalised into the other.
const FIELD_PLACEHOLDER = {
  type: 'Screen', userGoal: 'What is someone trying to get done here?',
  businessGoal: 'Why does the business want this screen to work?',
  primaryUsers: 'Who uses it, and who uses it most?',
  notes: 'Screen-wide context only', sources: 'Cite a source with [handle]'
};

const S = {
  dir: null, files: [], file: null, originalText: '', doc: null,
  readOnly: false, dirty: false,
  guide: null, sel: null, editing: null,
  view: 'guide', present: false, capture: false, captured: 0,
  userFilter: null, shownField: null
};

// ---------------------------------------------------------------- storage
const DB = 'priority-guide';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const t = db.transaction('kv').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result);
      t.onerror = () => res(undefined);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  // Never let a storage failure break the thing the user actually asked for.
  // Remembering the folder is a convenience; opening it is the job.
  try {
    const db = await idb();
    await new Promise((res) => {
      const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => res(); t.onsuccess = () => res();
    });
  } catch { /* not persistable in this context */ }
}
/** Ten-deep backup ring, so a bad save is always recoverable. */
async function backup(name, text) {
  const ring = (await kvGet('backups')) || [];
  ring.unshift({ name, text, at: new Date().toISOString() });
  await kvSet('backups', ring.slice(0, 10));
}

// ---------------------------------------------------------------- banners
function banner(kind, html, sticky) {
  const n = el('div', 'banner ' + kind);
  n.innerHTML = html;
  if (!sticky) {
    const x = el('button', null, 'dismiss');
    x.onclick = () => n.remove();
    n.appendChild(x);
  }
  $('banners').appendChild(n);
  return n;
}
const clearBanners = () => { $('banners').innerHTML = ''; };

// ---------------------------------------------------------------- file access
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.dir = dir;
    await loadFolder();
    await kvSet('folder', dir);   // after, so a storage failure cannot block opening
  } catch (e) {
    if (e.name !== 'AbortError') banner('err', `<b>Could not open that folder.</b> ${esc(e.message)}`);
  }
}

async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

async function loadFolder() {
  clearBanners();
  S.files = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.md')) S.files.push({ name, handle: h });
  }
  S.files.sort((a, b) => a.name.localeCompare(b.name));

  for (const f of S.files) {
    try {
      const text = await (await f.handle.getFile()).text();
      const d = parseDocument(text);
      f.blocks = countRows(d);
      f.guides = guides(d).length;
    } catch { f.blocks = 0; f.guides = 0; }
  }

  const real = S.files.filter((f) => f.blocks > 0);
  if (!S.files.length) {
    banner('warn', '<b>No markdown files here.</b> Point priority guide at a folder holding a guides file.', true);
    render(); return;
  }
  if (real.length === 1) return openFile(real[0]);
  if (!real.length) {
    banner('warn', '<b>No guides here.</b> These files read fine but hold no content blocks.', true);
  }
  render();
}

async function openFile(f) {
  clearBanners();
  const text = await (await f.handle.getFile()).text();
  const rt = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = parseDocument(text);
  S.readOnly = !rt.ok; S.dirty = false; S.sel = null; S.editing = null;
  S.guide = guides(S.doc)[0] || null;
  S.captured = 0;

  if (!rt.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip, `
      + `so priority guide will not write to it. First difference at line <code>${rt.line}</code>.<br>`
      + `in the file <code>${esc(rt.expected)}</code><br>parsed back <code>${esc(rt.produced)}</code>`, true);
  } else if (!S.guide) {
    banner('warn', '<b>No guides in this file.</b> It reads fine, but there are no <code>##</code> guide headings.', true);
  }
  // Two guides with the same name make every route to that name ambiguous.
  const seen = new Set();
  const dupes = [];
  for (const g of guides(S.doc)) {
    const k = g.name.toLowerCase();
    if (seen.has(k)) dupes.push(g.name); else seen.add(k);
  }
  if (dupes.length) {
    banner('warn', `<b>Two guides share a name.</b> Every route to `
      + dupes.map((d) => `<code>${esc(d)}</code>`).join(', ')
      + ' lands on the first one. Rename one of them.', true);
  }
  render();
}

// ---------------------------------------------------------------- save
async function save() {
  if (!S.file || S.readOnly) return;
  // Flush an inline edit that is still focused; leave any open picker alone.
  const a = document.activeElement;
  if (a && a.isContentEditable) a.blur();
  if (!(await ensureWritable(S.file.handle))) {
    banner('err', '<b>Write permission was declined.</b> Chrome needs <b>Edit files</b> for this folder.');
    return;
  }
  const onDisk = await (await S.file.handle.getFile()).text();
  if (onDisk !== S.originalText) {
    const keepMine = confirm('This file changed on disk since you opened it (Obsidian?).\n\n'
      + 'OK = overwrite with your version.\nCancel = discard yours and reload from disk.');
    if (!keepMine) return openFile(S.file);
  }
  const text = serializeDocument(S.doc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save.</b> The output does not round-trip (line ${rt.line}). Nothing was written.`);
    return;
  }
  await backup(S.file.name, S.originalText);
  const w = await S.file.handle.createWritable();
  await w.write(text); await w.close();

  // Re-parse our own bytes so the model can never drift from the file.
  const keepName = S.guide ? S.guide.name : null;
  const keepSel = S.sel ? renderContentCell(S.sel.content) : null;
  S.originalText = text;
  S.doc = parseDocument(text);
  S.guide = (keepName && findGuide(S.doc, keepName)) || guides(S.doc)[0] || null;
  S.sel = null;
  if (keepSel && S.guide) {
    const hit = rowsOf(S.guide).find((r) => renderContentCell(r.row.content) === keepSel);
    if (hit) S.sel = hit.row;
  }
  S.dirty = false; S.editing = null;
  render();
  const b = banner('info', '<b>Saved.</b>');
  setTimeout(() => b.remove(), 1500);
}

function mark() { S.dirty = true; }

// ---------------------------------------------------------------- helpers
/** Where a row lives, so an edit can mark exactly the right pieces dirty. */
function ctx(row) {
  if (!S.guide) return {};
  for (const { table, section } of tablesOf(S.guide)) {
    if (table.rows.includes(row)) return { table, section };
  }
  return {};
}
function guideOpenCount(g) {
  return openItems(S.doc).filter((i) => i.guide === g.name).length;
}
function isUnknown(v) { return String(v || '').trim() === '??'; }

// ---------------------------------------------------------------- render
function render() {
  document.body.classList.toggle('present', S.present);
  renderBar();
  renderUserBar();
  renderPageHead();
  renderTools();
  if (!S.doc) { renderHello(); return; }
  renderRailLeft();
  $('stage').innerHTML = '';
  if (S.view === 'guide') renderGuide();
  else if (S.view === 'flow') renderFlow();
  else if (S.view === 'users') renderUsersView();
  else if (S.view === 'open') renderOpen();
  else renderSource();
  renderRailRight();
  $('cap').hidden = !S.capture;
  if (S.capture) {
    const t = tablesOf(S.guide || {}).slice(-1)[0];
    $('capWhere').textContent = t ? `${S.guide.name} · ${t.section.title}` : '';
    $('capTally').textContent = S.captured ? `${S.captured} added` : '';
  }
}

function renderUserBar() {
  const old = document.getElementById('userbar');
  if (old) old.remove();
  if (!S.userFilter) return;
  const b = el('div');
  b.id = 'userbar';
  b.innerHTML = `Showing only what <b>${esc(S.userFilter)}</b> needs.`;
  const clear = el('button', 'quiet', 'show every guide');
  clear.onclick = () => { S.userFilter = null; render(); };
  b.appendChild(clear);
  $('banners').after(b);
}

function renderBar() {
  $('file').textContent = S.file ? S.file.name : (S.dir ? S.dir.name : '');
  $('file').style.display = S.dir ? '' : 'none';
  $('save').disabled = !S.dirty || S.readOnly;
  $('save').className = 'btn' + (S.dirty && !S.readOnly ? ' primary' : '');
  $('save').textContent = S.readOnly ? 'Read-only' : (S.dirty ? 'Save' : 'Saved');
  $('present').classList.toggle('on', S.present);
  $('present').textContent = S.present ? 'Exit' : 'Present';
  $('present').title = S.present ? 'Leave present mode (Esc)' : 'Present (P)';
  $('present').style.display = S.doc ? '' : 'none';

  const tabs = $('tabs');
  tabs.innerHTML = '';
  if (!S.doc) return;
  // In a room, the only things worth showing are the guide and what is still open.
  tabs.style.display = S.present ? 'none' : '';
  $('save').style.display = S.present ? 'none' : '';
  $('file').style.display = S.present || !S.dir ? 'none' : '';
  for (const [k, label] of [['guide', 'Guide'], ['flow', 'Flow'], ['users', 'Users'], ['open', 'Open'], ['source', 'Source']]) {
    const b = el('button', S.view === k ? 'on' : '', label);
    b.onclick = () => { commitEditor(); S.view = k; render(); };
    tabs.appendChild(b);
  }
  const n = openItems(S.doc).length;
  const c = $('open');
  c.className = 'count' + (n ? '' : ' clear');
  // A count that is supposed to reach zero, so it is stated as a countdown and
  // says so when it gets there.
  c.innerHTML = n ? `<b>${n}</b> open` : '<b>0</b> open';
  c.title = n ? 'Action items and unanswered questions across every guide' : 'Nothing left open';
}

function renderHello() {
  $('railL').innerHTML = ''; $('railR').innerHTML = '';
  const w = el('div', 'hello');
  w.innerHTML = `<h1>priority guide</h1>
    <p>What a screen needs, in order, before anything is laid out.<br>
    Open a folder holding a guides markdown file.</p>`;
  const b = el('button', 'btn primary', 'Open a folder');
  b.onclick = pickFolder;
  w.appendChild(b);
  if (S.files.length) {
    const list = el('div');
    list.style.cssText = 'margin-top:26px;text-align:left';
    list.appendChild(el('div', 'rail-h', 'Files in ' + S.dir.name));
    for (const f of S.files) {
      const i = el('button', 'g-item');
      i.innerHTML = `<span class="n">${esc(f.name)}</span><span class="m">${f.guides} guides · ${f.blocks} blocks</span>`;
      i.onclick = () => openFile(f);
      list.appendChild(i);
    }
    w.appendChild(list);
  }
  w.appendChild(el('div', 'keys')).innerHTML =
    '<kbd>P</kbd> present &nbsp; <kbd>C</kbd> capture &nbsp; <kbd>S</kbd> source'
    + ' &nbsp; <kbd>⌥↑</kbd><kbd>⌥↓</kbd> move a block';
  $('stage').innerHTML = '';
  $('stage').appendChild(w);
}

// ---------------------------------------------------------------- left rail
function renderRailLeft() {
  const r = $('railL');
  r.innerHTML = '';
  const filtered = S.userFilter
    ? (userTypes(S.doc).find((u) => u.name === S.userFilter) || { guides: [] }).guides.map((x) => x.guide)
    : null;
  r.appendChild(el('div', 'rail-h', filtered ? S.userFilter : 'Guides'));
  for (const g of (filtered || guides(S.doc))) {
    const b = el('button', 'g-item' + (g === S.guide ? ' on' : ''));
    const n = rowsOf(g).length;
    const o = guideOpenCount(g);
    b.innerHTML = `<span class="n">${esc(g.name)}</span>`
      + `<span class="m">${n} block${n === 1 ? '' : 's'}`
      + (o ? ` · <span class="o">${o} open</span>` : '') + '</span>';
    b.onclick = () => { commitEditor(); S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide'; render(); };
    r.appendChild(b);
  }
  if (filtered) {
    const clear = el('button', 'rail-add', 'Show every guide');
    clear.onclick = () => { S.userFilter = null; render(); };
    r.appendChild(clear);
    return;
  }
  if (S.readOnly) return;
  const add = el('button', 'rail-add', '+  New guide');
  add.onclick = () => {
    const name = prompt('What is this screen called?\n\nUse the name the team uses, including the mode — "Bookings — Manager view".');
    if (!name) return;
    S.guide = addGuide(S.doc, name);
    S.view = 'guide'; mark(); render();
  };
  r.appendChild(add);
}

// ---------------------------------------------------------------- icons
/*
 * Small monochrome glyphs so a scan of the functionality lane is a glance, not
 * a read. Inline SVG: no network, no font, and they take the colour around them.
 */
const GLYPH = {
  search: 'M7 2.5a4.5 4.5 0 104.5 4.5A4.5 4.5 0 007 2.5zM10.4 10.4L14 14',

  pickN: 'M4 8h.01M8 8h.01M12 8h.01',

  chev: 'M4.5 6.5L8 10l3.5-3.5'
};
// Which dots are filled tells you one-from-a-list from several-from-a-list
// without ever naming a control.
const FILLED = { pick1: [0], pickN: [0, 1] };

function icon(name, size = 14) {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 16 16');
  svg.setAttribute('width', size);
  svg.setAttribute('height', size);
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.4');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.style.flex = 'none';
  svg.style.display = 'block';
  const d = GLYPH[name] || GLYPH.other;
  if (name === 'other' || name === 'pick1' || name === 'pickN') {
    const on = FILLED[name] || [0, 1, 2];
    [4, 8, 12].forEach((cx, i) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', cx); c.setAttribute('cy', 8); c.setAttribute('r', 1.7);
      if (name !== 'other' && !on.includes(i)) c.setAttribute('fill', 'none');
      else c.setAttribute('fill', 'currentColor');
      svg.appendChild(c);
    });
    return svg;
  }
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  return svg;
}

const LINK_GLYPH = {
  download: 'download', upload: 'upload', mailto: 'mailto', modal: 'modal',
  'offsite page': 'offsite', 'onsite page': 'onsite', trigger: 'trigger', other: 'other'
};
const FORM_GLYPH = {
  'date picker': 'date', 'single line': 'line1', 'multi line': 'lineN',
  'single select': 'pick1', 'multi select': 'pickN', other: 'other'
};
const CAP_GLYPH = { search: 'search', filter: 'filter', sort: 'sort', edit: 'edit' };

// ---------------------------------------------------------------- links out
/**
 * A local path cannot be opened from a page served over http, so offering it as
 * a link would hand over something that always fails. Show the path, and copy it
 * on click, which is the thing you actually wanted to do with it.
 */
function outLink(url, label, title) {
  if (isWebUrl(url)) {
    const a = el('a', null, label);
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.title = title || url;
    return a;
  }
  const b = el('button', 'pathlink', label);
  b.title = (title ? title + '\n' : '') + url + '\n\nClick to copy the path — a browser cannot open a local file.';
  b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    navigator.clipboard.writeText(url).then(
      () => { const was = b.textContent; b.textContent = 'path copied'; setTimeout(() => { b.textContent = was; }, 1200); },
      () => banner('warn', '<b>Could not copy.</b> The path is <code>' + esc(url) + '</code>')
    );
  };
  return b;
}

function guideLink(name) {
  return `<a href="#" data-goto="${esc(name)}">${esc(name)}</a>`;
}

/** Turn [handle] into a source link and [[Guide]] into a jump. */
function linkify(text, guide) {
  const frag = document.createDocumentFragment();
  const s = String(text == null ? '' : text);
  const re = /\[\[([^\]]+)\]\]|\[([^\[\]]+)\](?![(:])/g;
  let at = 0; let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > at) frag.appendChild(document.createTextNode(s.slice(at, m.index)));
    at = m.index + m[0].length;
    if (m[1] !== undefined) {
      const a = el('a', null, m[1]);
      a.href = '#'; a.dataset.goto = m[1];
      frag.appendChild(a);
      continue;
    }
    const h = m[2];
    const def = resolveSource(S.doc, guide, h);
    if (!def) {
      const b = el('span', 'pill dead', h + ' — no source by that name');
      frag.appendChild(b);
      continue;
    }
    frag.appendChild(outLink(def.url, def.title || h, def.title));
  }
  if (at < s.length) frag.appendChild(document.createTextNode(s.slice(at)));
  return frag;
}

function setLinked(node, text, guide) {
  node.textContent = '';
  node.appendChild(linkify(text, guide));
  return node;
}

// ---------------------------------------------------------------- inline editing
/**
 * Everything on a guide is edited where it sits. No forms, no Save — you click
 * the thing and type. Escape puts it back.
 */
function editable(node, current, commit, opts = {}) {
  if (S.readOnly) return node;
  node.contentEditable = 'plaintext-only';
  node.spellcheck = false;
  node.tabIndex = 0;
  node.onfocus = () => {
    if (node.dataset.blank === '1') { node.textContent = ''; node.classList.remove('none', 'empty'); }
  };
  node.onblur = () => {
    const v = node.textContent.trim();
    if (v === current) {
      if (node.dataset.ph && !v) {
        node.textContent = node.dataset.ph;
        node.classList.add(node.dataset.phcls || 'none');
        node.dataset.blank = '1';
      }
      return;
    }
    commit(v);
    mark();
    render();
  };
  node.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Escape') { e.preventDefault(); node.textContent = current; node.blur(); }
    else if (e.key === 'Enter' && !opts.multiline) { e.preventDefault(); node.blur(); }
  };
  return node;
}

/** Text that reads as a prompt until someone types in it. */
function blankable(node, value, placeholder, cls) {
  node.dataset.ph = placeholder;
  node.dataset.phcls = cls || 'none';
  if (value) { node.textContent = value; return node; }
  node.dataset.blank = '1';
  node.classList.add(cls || 'none');
  node.textContent = S.readOnly || S.present ? '' : placeholder;
  return node;
}

const focusSoon = (sel) => setTimeout(() => {
  const n = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!n) return;
  n.focus();
  const r = document.createRange();
  r.selectNodeContents(n);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}, 0);

// ---------------------------------------------------------------- page header
/** Which guide you are on, always, without spending the guide's own width on it. */
function renderPageHead() {
  const h = $('pagehead');
  h.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide') { h.style.display = 'none'; return; }
  h.style.display = '';
  const g = S.guide;

  const t = el('h1');
  t.textContent = g.name;
  editable(t, g.name, (v) => { if (v) { g.name = v; g.dirtyHeading = true; } });
  h.appendChild(t);

  const sub = el('div', 'sub');
  const users = parseUsers(g.fields.primaryUsers);
  if (users.length) {
    const w = el('span', 'who');
    w.textContent = users.map((u) => u.name + (u.primary ? ' (primary)' : '')).join(' · ');
    sub.appendChild(w);
  }
  const n = rowsOf(g).length;
  const add = (txt, cls) => {
    if (sub.children.length) sub.appendChild(el('span', 'dot', '·'));
    sub.appendChild(el('span', cls || '', txt));
  };
  add(`${n} block${n === 1 ? '' : 's'}`);
  const open = guideOpenCount(g);
  if (open) add(`${open} open`, 'open');
  const goal = (g.fields.userGoal || '').trim();
  if (goal && !isUnknown(goal)) {
    const b = el('button', 'quiet', 'context');
    b.onclick = () => { S.panel = 'context'; render(); };
    if (sub.children.length) sub.appendChild(el('span', 'dot', '·'));
    sub.appendChild(b);
  }
  h.appendChild(sub);
}

// ---------------------------------------------------------------- toolbar
/** The creator tools, always to hand, never in the way of the guide. */
function renderTools() {
  const t = $('tools');
  t.innerHTML = '';
  if (!S.doc || !S.guide || S.view !== 'guide' || S.readOnly || S.present) {
    t.style.display = 'none'; return;
  }
  t.style.display = '';
  const g = S.guide;
  const secs = g.sections.filter((s) => s.kind === 'section');

  const target = () => {
    const chosen = secs.find((s) => s.title === S.intoSection);
    if (chosen) return chosen;
    if (S.sel) { const w = whereIs(g, S.sel); if (w) return w.tables[w.ti].section; }
    return secs[secs.length - 1] || null;
  };
  const tableOf = (sec) => {
    if (!sec) return null;
    const ts = sec.chunks.filter((c) => c.kind === 'table');
    return ts[ts.length - 1] || null;
  };

  t.appendChild(el('span', 'lbl', 'Add'));

  const tool = (glyph, label, fn, title) => {
    const b = el('button', 'tool');
    b.appendChild(icon(glyph, 14));
    b.appendChild(el('span', null, label));
    if (title) b.title = title;
    b.onclick = fn;
    t.appendChild(b);
  };

  tool('line1', 'Content', () => {
    const sec = target();
    let tab = tableOf(sec);
    if (!sec) { banner('warn', '<b>Add a section first.</b> Content lives inside one.'); return; }
    if (!tab) { addSection(g, sec.title); tab = tableOf(sec); }
    const here = S.sel && tab.rows.includes(S.sel) ? tab.rows.indexOf(S.sel) + 1 : tab.rows.length;
    const row = addRow(tab, sec, { at: here });
    S.sel = row; mark(); render();
    focusSoon('.rowsel .lbl');
  }, 'A data point, a control, or an action — after the selected block');

  tool('lineN', 'Section', () => {
    const sec = addSection(g, 'New section');
    S.intoSection = sec.title; mark(); render();
    focusSoon('.guide .sec-title:last-of-type');
  }, 'A group of content, usually about one thing');

  tool('other', 'Subsection', () => {
    const sec = target();
    if (!sec) return;
    const at = sec.chunks.length;
    sec.chunks.splice(at, 0, { kind: 'sub', src: ['#### Actions'], title: 'Actions', dirty: true });
    sec.chunks.splice(at + 1, 0, blankTable());
    sec.dirty = true; mark(); render();
  }, 'A split inside a section — often the per-row actions');

  tool('source', 'Reference', () => {
    const sec = target();
    if (!sec) return;
    const other = guides(S.doc).find((x) => x !== g);
    const name = other ? other.name : 'Another guide';
    sec.chunks.push({ kind: 'ref', src: [`> See [[${name}]] — why`], target: name,
      text: `See [[${name}]] — why`, refs: [], dirty: true });
    sec.dirty = true; mark(); render();
  }, 'Point at another guide instead of repeating its content');

  const into = el('div', 'into');
  into.appendChild(el('span', null, 'into'));
  const sel = el('select');
  for (const s of secs) {
    const o = el('option', null, s.title);
    o.value = s.title;
    if (target() === s) o.selected = true;
    sel.appendChild(o);
  }
  if (!secs.length) { const o = el('option', null, 'no sections yet'); o.disabled = true; sel.appendChild(o); }
  sel.onchange = () => { S.intoSection = sel.value; render(); };
  into.appendChild(sel);
  t.appendChild(into);
}

function blankTable() {
  const names = ['Content', 'Real data', 'Do', 'Link', 'Form', 'Note'];
  const keys = ['content', 'realData', 'capabilities', 'link', 'form', 'note'];
  return {
    kind: 'table',
    headerSrc: [`| ${names.join(' | ')} |`],
    dividerSrc: [`| ${names.map(() => '---').join(' | ')} |`],
    cols: { keyAt: keys, byKey: Object.fromEntries(keys.map((k, i) => [k, i])), names },
    rows: [], dirty: true
  };
}

// ---------------------------------------------------------------- guide view
function renderGuide() {
  const stage = $('stage');
  if (!S.guide) { stage.appendChild(el('div', 'rail-empty', 'No guide selected.')); return; }
  const g = S.guide;
  const grid = el('div', 'guide');
  const cells = [];

  const gridRow = (bandCls) => {
    const l = el('div', 'lane lane-l');
    const c = el('div', 'cell');
    const r = el('div', 'lane lane-r');
    grid.append(l, c, r);
    cells.push(c);
    if (bandCls === undefined) return { l, c, r, host: c };
    const band = el('div', 'band' + (bandCls ? ' ' + bandCls : ''));
    c.appendChild(band);
    return { l, c, r, host: band, band };
  };
  const gap = () => { const { c } = gridRow(); c.classList.add('gap'); };

  for (const sec of g.sections) {
    if (sec.kind === 'sources') continue;
    const mine = [];
    const title = gridRow('open');
    mine.push(title.band);
    title.host.appendChild(sectionTitle(g, sec));
    if (!S.present && !S.readOnly) title.l.appendChild(sectionTools(g, sec));

    // The line of prose under a heading is part of the guide, so it is editable
    // like everything else — and it exists even when the file has no line yet.
    const prose = sec.chunks.find((c) => c.kind === 'raw' && !/^\s*\|/m.test(c.src.join('\n')));
    if (!S.present || (prose && proseOf(prose))) {
      const pRow = gridRow(''); mine.push(pRow.band);
      pRow.host.appendChild(sectionProse(g, sec, prose));
    }

    for (const chunk of sec.chunks) {
      if (chunk.kind === 'raw') {
        if (chunk === prose) continue;
        const text = chunk.src.join('\n').trim();
        if (!text) continue;
        const row = gridRow(''); mine.push(row.band);
        const t = el('div', 'raw-table');
        t.textContent = text;
        t.title = 'This table has no Content column, so priority guide leaves it alone.';
        row.host.appendChild(t);
      } else if (chunk.kind === 'sub') {
        const row = gridRow(''); mine.push(row.band);
        const w = el('div', 'sub');
        const h = el('div', 'sub-t');
        h.textContent = chunk.title;
        editable(h, chunk.title, (v) => { chunk.title = v || 'Untitled'; chunk.dirty = true; sec.dirty = true; });
        w.appendChild(h);
        row.host.appendChild(w);
      } else if (chunk.kind === 'ref') {
        const row = gridRow(''); mine.push(row.band);
        const p = el('div', 'ref');
        setLinked(p, chunk.text, g);
        editable(p, chunk.text, (v) => {
          chunk.text = v;
          const m = /\[\[([^\]]+)\]\]/.exec(v);
          chunk.target = m ? m[1].trim() : '';
          chunk.refs = refsIn(v);
          chunk.dirty = true; sec.dirty = true;
        });
        row.host.appendChild(p);
      } else if (chunk.kind === 'table') {
        for (const rw of chunk.rows) {
          const row = gridRow(''); mine.push(row.band);
          paintRow(row, g, sec, chunk, rw);
        }
      }
    }
    if (mine.length) mine[mine.length - 1].classList.add('close');
    gap();
  }

  if (cells.length) {
    cells[0].classList.add('top');
    cells[cells.length - 1].classList.add('bot');
  }
  if (!g.sections.some((s) => s.kind === 'section')) {
    stage.appendChild(el('div', 'rail-empty', 'Nothing here yet. Add a section from the toolbar below.'));
    return;
  }
  stage.appendChild(grid);
}

function sectionTitle(g, sec) {
  const t = el('h2', 'sec-title');
  t.textContent = sec.title;
  editable(t, sec.title, (v) => { sec.title = v || 'Untitled'; sec.dirtyHeading = true; });
  return t;
}

function sectionProse(g, sec, chunk) {
  const p = el('div', 'sec-note');
  const cur = chunk ? proseOf(chunk) : '';
  if (cur) setLinked(p, cur, g);
  else blankable(p, '', 'Add a line of clarity — “likely a table”, “filters above the results”');
  editable(p, cur, (v) => {
    if (chunk) { setProse(chunk, sec, v); return; }
    if (!v) return;
    const c = { kind: 'raw', src: ['', `*${v}*`, ''], dirty: true };
    sec.chunks.unshift(c);
    sec.dirty = true;
  });
  return p;
}

function sectionTools(g, sec) {
  const tools = el('div', 'sectools');
  for (const [label, dir, title] of [['↑', -1, 'Move this section up'], ['↓', 1, 'Move this section down']]) {
    const b = el('button', null, label);
    b.title = title;
    b.onclick = () => { if (moveSection(g, sec, dir)) { mark(); render(); } };
    tools.appendChild(b);
  }
  const del = el('button', null, '×');
  del.title = 'Delete this section and everything in it';
  del.onclick = () => {
    const n = sec.chunks.filter((c) => c.kind === 'table').reduce((a, c) => a + c.rows.length, 0);
    if (!confirm(`Delete “${sec.title}”${n ? ` and its ${n} block${n === 1 ? '' : 's'}` : ''}?`)) return;
    g.sections.splice(g.sections.indexOf(sec), 1);
    g.dirty = true; S.sel = null; mark(); render();
  };
  tools.appendChild(del);
  return tools;
}

// ---------------------------------------------------------------- one row
/**
 * The middle says what the thing is called and what its data actually looks
 * like. The right says what it does. The left holds everything else — a rule, a
 * link, something someone said, a follow-up.
 */
function paintRow(row, g, sec, table, rw) {
  const ctx = { g, sec, table, rw };
  if (rw === S.sel) [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));

  // ---- middle
  const hasForm = !!rw.form.type;
  const hasLink = !!rw.link.type;
  const isVisual = rw.content.type === 'Visual';
  const item = el('div', 'item' + (isVisual ? ' visual' : hasForm ? '' : hasLink ? ' linky' : ' plain'));
  const box = el('div', 'box');
  const lbl = el('div', 'lbl');
  const label = rw.content.text.trim();
  if (isUnknown(label)) { lbl.innerHTML = '<span class="unk">?? not known</span>'; }
  else blankable(lbl, label, 'What is it called?');
  editable(lbl, label, (v) => {
    rw.content = { type: rw.content.type, text: v };
    touchRow(rw, table, sec);
  });
  box.appendChild(lbl);
  if (rw.form.type === 'single select' || rw.form.type === 'multi select') {
    const ch = icon('chev', 13); ch.classList.add('chev'); box.appendChild(ch);
  }
  item.appendChild(box);

  // The example is what the data really looks like, so it belongs under the
  // name it belongs to — not off in another lane.
  const cur = rw.realData;
  const makeExample = (value) => {
    const eg = el('div', 'eg');
    if (isUnknown(value)) { eg.classList.add('unk'); eg.textContent = value; }
    else if (value) setLinked(eg, value, g);
    editable(eg, value, (v) => { rw.realData = v; touchRow(rw, table, sec); });
    return eg;
  };
  if (cur) item.appendChild(makeExample(cur));

  // An example is optional, so its absence says nothing at all. Getting to one
  // is a quiet offer on the row you have selected, and Tab from the name.
  const openExample = () => {
    if (item.querySelector('.eg')) { focusSoon(item.querySelector('.eg')); return; }
    const eg = makeExample('');
    const tools = item.querySelector('.rowtools');
    item.insertBefore(eg, tools || null);
    focusSoon(eg);
  };
  lbl.addEventListener('keydown', (e) => {
    if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); lbl.blur(); openExample(); }
  });

  if (rw === S.sel && !S.readOnly && !S.present) {
    const tools = el('div', 'rowtools');
    if (!cur) {
      const b = el('button', null, '+ example');
      b.title = 'What the data really looks like. Optional.';
      b.onclick = (e) => { e.stopPropagation(); openExample(); };
      tools.appendChild(b);
    }
    const below = el('button', null, '+ block below');
    below.title = 'Add a block here, not at the end of the section';
    below.onclick = (e) => { e.stopPropagation(); insertBelow(g, sec, table, rw); };
    tools.appendChild(below);
    item.appendChild(tools);
  }

  // Clicking the row opens it: its own tools and the add-a-note button appear.
  // Clicking straight onto text edits that text instead, without a re-render
  // that would steal the caret.
  if (!S.readOnly && !S.present) {
    const lightSelect = () => {
      if (S.sel === rw) return;
      S.sel = rw;
      document.querySelectorAll('.rowsel').forEach((n) => n.classList.remove('rowsel'));
      [row.l, row.c, row.r].forEach((n) => n.classList.add('rowsel'));
    };
    item.onmousedown = (e) => { if (e.target.closest('.lbl,.eg')) lightSelect(); };
    item.onclick = (e) => {
      if (e.target.closest('.lbl,.eg,a,button')) return;
      if (S.sel !== rw) { S.sel = rw; render(); }
    };
  } else {
    item.onclick = () => { S.sel = rw; render(); };
  }

  row.host.appendChild(item);

  if (!S.present) {
    for (const f of lintRow(rw)) {
      const n = el('div', 'flag');
      if (f.kind === 'visual-answer') n.innerHTML = '<b>&ldquo;' + esc(f.word) + '&rdquo;</b> is a visual answer. ' + esc(f.ask);
      else if (f.kind === 'no-real-data') n.innerHTML = '<b>No example.</b> ' + esc(f.ask);
      else if (f.kind === 'unknown-form') n.textContent = '"' + f.word + '" is not one of the form types.';
      else if (f.kind === 'unknown-link') n.textContent = '"' + f.word + '" is not one of the link types.';
      row.host.appendChild(n);
    }
  }

  // ---- left: notes
  const notes = el('div', 'notes');
  rw.note.forEach((n, i) => notes.appendChild(noteCard(ctx, n, i)));
  if (!S.readOnly && !S.present) {
    const add = el('button', 'addnote', rw.note.length ? '+ note' : '+ note');
    add.title = 'A rule, a link, something said in a session, or a follow-up';
    add.onclick = () => {
      rw.note.push({ text: '', action: false });
      S.sel = rw; render();
      focusSoon('.rowsel .note:last-of-type .t');
    };
    notes.appendChild(add);
  }
  row.l.appendChild(notes);
  if (rw.note.length) row.l.appendChild(el('div', 'lead'));

  // ---- right: functionality only
  const hasFn = !!(rw.link.type || rw.form.type || rw.capabilities.length);
  if (hasFn) row.r.appendChild(el('div', 'lead'));
  else row.r.appendChild(Object.assign(el('div', 'lead'), { style: 'border-color:transparent' }));
  row.r.appendChild(fnCard(ctx));

  if (S.readOnly || S.present) return;
  wireDrag(row, ctx);
}

function noteCard(ctx, n, i) {
  const { g, sec, table, rw } = ctx;
  const card = el('div', 'note' + (n.action ? ' act' : ''));
  const only = /^\s*\[[^\[\]]+\]\s*$/.test(n.text);
  const gl = icon(only ? 'source' : 'note', 12);
  gl.classList.add('gl');
  card.appendChild(gl);
  if (n.action) card.appendChild(el('span', 'k', 'ACTION'));

  const t = el('div', 't');
  setLinked(t, n.text, g);
  if (!n.text) blankable(t, '', 'Note');
  editable(t, n.text, (v) => {
    if (!v) rw.note.splice(i, 1);
    else n.text = v;
    touchRow(rw, table, sec);
  }, { multiline: true });
  card.appendChild(t);

  if (!S.readOnly && !S.present) {
    const tools = el('div', 'tools');
    const a = el('button', null, n.action ? '↩' : '!');
    a.title = n.action ? 'This is settled — stop treating it as a follow-up' : 'Make this a follow-up to circle back on';
    a.onclick = () => { n.action = !n.action; touchRow(rw, table, sec); mark(); render(); };
    tools.appendChild(a);
    const x = el('button', null, '×');
    x.title = 'Delete this note';
    x.onclick = () => { rw.note.splice(i, 1); touchRow(rw, table, sec); mark(); render(); };
    tools.appendChild(x);
    card.appendChild(tools);
  }
  return card;
}

const LINK_SAYS = {
  'onsite page': (t) => t ? ['Opens ', t] : ['Opens another page in the app'],
  'offsite page': (t) => t ? ['Opens ', t, ', outside the app'] : ['Opens a page outside the app'],
  modal: (t) => t ? ['Opens ', t, ' in a modal'] : ['Opens a modal'],
  download: () => ['Downloads a file'],
  upload: () => ['Uploads a file'],
  mailto: () => ['Starts an email'],
  trigger: () => ['Triggers an action in place'],
  other: (t) => t ? ['Goes to ', t] : ['Does something else']
};

function fnCard(ctx) {
  const { g, rw } = ctx;
  const hasAny = rw.link.type || rw.form.type || rw.capabilities.length;
  const card = el('div', 'fn' + (hasAny ? '' : ' empty'));
  card.setAttribute('role', 'button');
  card.tabIndex = S.readOnly || S.present ? -1 : 0;

  if (!hasAny) {
    card.textContent = S.readOnly ? '' : '+ functionality';
    card.title = 'What does this do — go somewhere, take input, or let someone search it?';
  } else {
    if (rw.link.type) {
      const l = el('div', 'l');
      l.appendChild(icon(LINK_GLYPH[rw.link.type] || 'other', 13));
      const say = (LINK_SAYS[rw.link.type] || (() => [rw.link.type]))(rw.link.target);
      const b = el('div');
      say.forEach((part, i) => {
        if (i === 1 && rw.link.target) {
          const known = !!findGuide(S.doc, rw.link.target);
          const t = el(known ? 'a' : 'span', 'tgt' + (known ? '' : ' dead'), rw.link.target);
          if (known) { t.href = '#'; t.dataset.goto = rw.link.target; t.title = 'Go to this guide'; }
          else t.title = 'No guide in this file has that name';
          b.appendChild(t);
        } else b.appendChild(document.createTextNode(part));
      });
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.form.type) {
      const l = el('div', 'l');
      l.appendChild(icon(FORM_GLYPH[rw.form.type] || 'other', 13));
      const b = el('div');
      b.appendChild(document.createTextNode(FORM_SAYS[rw.form.type] || rw.form.type));
      if (rw.form.required) {
        b.appendChild(document.createTextNode(' · '));
        b.appendChild(el('span', 'req', 'required'));
      }
      l.appendChild(b);
      card.appendChild(l);
    }
    if (rw.capabilities.length) {
      // Words, not icons. Four short labels are read faster than four glyphs
      // nobody has learned yet.
      const l = el('div', 'l');
      if (!rw.link.type && !rw.form.type) l.appendChild(icon('search', 13));
      l.appendChild(el('div', 'caps', rw.capabilities.join(' · ')));
      card.appendChild(l);
    }
  }

  card._ctx = ctx;
  if (S.readOnly || S.present) return card;
  card.onclick = (e) => {
    if (e.target.closest('a')) return;   // a route takes you there instead
    e.stopPropagation(); S.sel = rw; render(); reopenPop();
  };
  card.onkeydown = (e) => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); S.sel = rw; render(); reopenPop(); }
  };
  return card;
}

const FORM_SAYS = {
  'date picker': 'Takes a date',
  'single line': 'Takes a short line of text',
  'multi line': 'Takes several lines of text',
  'single select': 'Takes one from a list',
  'multi select': 'Takes several from a list',
  other: 'Takes input'
};

// ---------------------------------------------------------------- functionality popover
/**
 * Enumerated values need a picker, but a picker is not a form: every change
 * applies the moment it is made, and there is nothing to save.
 */
function openFnPopover(anchor, ctx) {
  closePop();
  const { g, sec, table, rw } = ctx;
  const pop = el('div', 'pop');
  const apply = () => { touchRow(rw, table, sec); mark(); };

  const field = (label, node, hint) => {
    pop.appendChild(el('label', null, label));
    pop.appendChild(node);
    if (hint) pop.appendChild(el('div', 'hint', hint));
  };

  const lRow = el('div', 'row');
  const lSel = el('select');
  for (const t of LINK_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.link.type || '') === o.value) o.selected = true;
    lSel.appendChild(o);
  }
  const lTar = el('input');
  lTar.type = 'text'; lTar.value = rw.link.target || '';
  lTar.placeholder = 'Which guide or page?';
  lTar.setAttribute('list', 'guidenames');
  const syncL = () => { lTar.style.display = lSel.value ? '' : 'none'; };
  const setLink = () => {
    const target = lTar.value.trim();
    rw.link = { type: lSel.value, target, wiki: !!(target && findGuide(S.doc, target)), raw: '' };
    apply(); syncL();
    const keep = document.activeElement === lTar;
    render();
    if (keep) reopenPop();
  };
  lSel.onchange = setLink;
  lTar.onchange = setLink;
  lTar.oninput = () => { rw.link.target = lTar.value.trim(); rw.link.wiki = !!findGuide(S.doc, lTar.value.trim()); apply(); };
  syncL();
  lRow.append(lSel, lTar);
  field('Goes to', lRow, 'A target naming another guide becomes a route.');

  const fRow = el('div', 'row');
  const fSel = el('select');
  for (const t of FORM_TYPES) {
    const o = el('option', null, t === 'none' ? '—' : t);
    o.value = t === 'none' ? '' : t;
    if ((rw.form.type || '') === o.value) o.selected = true;
    fSel.appendChild(o);
  }
  const req = el('button', 'tog' + (rw.form.required ? ' on' : ''), 'required');
  req.onclick = () => {
    rw.form = { ...rw.form, required: !rw.form.required };
    apply(); render(); reopenPop();
  };
  req.style.display = rw.form.type ? '' : 'none';
  fSel.onchange = () => {
    rw.form = { type: fSel.value, required: !!(fSel.value && rw.form.required), raw: '' };
    apply(); render(); reopenPop();
  };
  fRow.append(fSel, req);
  field('Takes', fRow, 'What it is, never how it looks — “one from a list”, not “dropdown”.');

  const caps = el('div', 'row');
  for (const c of CAPABILITIES) {
    const b = el('button', 'tog' + (rw.capabilities.includes(c) ? ' on' : ''), c);
    b.onclick = () => {
      const i = rw.capabilities.indexOf(c);
      if (i === -1) rw.capabilities.push(c); else rw.capabilities.splice(i, 1);
      rw.capabilities = CAPABILITIES.filter((x) => rw.capabilities.includes(x));
      apply(); render(); reopenPop();
    };
    caps.appendChild(b);
  }
  field('Can be', caps);

  const foot = el('div', 'foot');
  const del = el('button', 'quiet', 'Delete this block');
  del.onclick = () => {
    if (!confirm(`Delete “${rw.content.text || 'this block'}”?`)) return;
    table.rows.splice(table.rows.indexOf(rw), 1);
    table.dirty = true; sec.dirty = true;
    S.sel = null; closePop(); mark(); render();
  };
  foot.appendChild(del);
  pop.appendChild(foot);

  document.body.appendChild(pop);
  const r = anchor.getBoundingClientRect();
  pop.style.left = Math.min(r.left, innerWidth - 280) + 'px';
  pop.style.top = Math.min(r.top, innerHeight - pop.offsetHeight - 12) + 'px';
  S.pop = pop; S.popRow = rw;
  pop.onkeydown = (e) => { e.stopPropagation(); if (e.key === 'Escape') { closePop(); render(); } };
  setTimeout(() => document.addEventListener('mousedown', popAway), 0);
}

function popAway(e) {
  if (S.pop && !S.pop.contains(e.target) && !e.target.closest('.fn')) { closePop(); }
}
function closePop() {
  if (S.pop) S.pop.remove();
  S.pop = null; S.popRow = null;
  document.removeEventListener('mousedown', popAway);
}
/** Keep the picker open across the re-render its own change caused. */
function reopenPop() {
  setTimeout(() => {
    const card = document.querySelector('.lane-r.rowsel .fn');
    if (card && card._ctx) openFnPopover(card, card._ctx);
  }, 0);
}

// ---------------------------------------------------------------- drag
function wireDrag(row, ctx) {
  const { g, sec, table, rw } = ctx;
  const item = row.host.querySelector('.item');
  if (!item) return;
  item.draggable = true;
  item.ondragstart = (e) => {
    S.drag = rw; row.c.classList.add('drag');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', rw.content.text || 'block');
  };
  item.ondragend = () => {
    S.drag = null;
    document.querySelectorAll('.cell').forEach((x) => x.classList.remove('drag', 'over', 'over-b'));
  };
  row.c.ondragover = (e) => {
    if (!S.drag || S.drag === rw) return;
    e.preventDefault();
    const r = row.c.getBoundingClientRect();
    const below = e.clientY > r.top + r.height / 2;
    row.c.classList.toggle('over', !below);
    row.c.classList.toggle('over-b', below);
  };
  row.c.ondragleave = () => row.c.classList.remove('over', 'over-b');
  row.c.ondrop = (e) => {
    e.preventDefault();
    const below = row.c.classList.contains('over-b');
    row.c.classList.remove('over', 'over-b');
    const moving = S.drag;
    if (!moving || moving === rw) return;
    dropRow(g, moving, table, sec, table.rows.indexOf(rw) + (below ? 1 : 0));
    S.sel = moving; S.drag = null; mark(); render();
  };
}

/** Move a row to an explicit position, possibly in another table. */
function dropRow(g, row, table, sec, at) {
  for (const { table: t, section } of tablesOf(g)) {
    const i = t.rows.indexOf(row);
    if (i === -1) continue;
    const cols = t.cols.names;
    t.rows.splice(i, 1);
    t.dirty = true; section.dirty = true;
    if (t === table && i < at) at--;
    if (JSON.stringify(cols) !== JSON.stringify(table.cols.names)) row.dirty = true;
    break;
  }
  table.rows.splice(Math.max(0, Math.min(at, table.rows.length)), 0, row);
  table.dirty = true; sec.dirty = true;
}

/** Nothing is held in a draft any more, but the picker can be open. */
function commitEditor() { closePop(); }
function focusEditor() { focusSoon('.rowsel .lbl'); }

/** A new block right after this one, which is what "add here" has to mean. */
function insertBelow(g, sec, table, rw) {
  const at = table.rows.indexOf(rw) + 1;
  const row = addRow(table, sec, { at });
  S.sel = row; mark(); render();
  focusSoon('.rowsel .lbl');
  return row;
}

// ---------------------------------------------------------------- right panel
/**
 * Everything that is true of the whole guide rather than one row: what it is
 * for, what it leans on, and what points at it. All at the same altitude,
 * because they are the same kind of fact — and none of it takes width away from
 * the guide itself.
 */
function renderRailRight() {
  const r = $('railR');
  r.innerHTML = '';
  if (S.present || S.view !== 'guide' || !S.guide) { r.style.display = 'none'; return; }
  r.style.display = '';

  const tabs = el('div', 'ptabs');
  const body = el('div', 'pbody');
  const links = backlinks(S.doc, S.guide.name);
  const out = links_out(S.guide);
  const counts = {
    context: 0,
    sources: sourceUsage(S.doc).all.filter((s) => s.cites.some((c) => c.guide === S.guide.name)).length,
    links: links.routes.length + links.references.length + out.length
  };
  for (const [k, label] of [['context', 'Context'], ['sources', 'Sources'], ['links', 'Links']]) {
    const b = el('button', (S.panel || 'context') === k ? 'on' : '');
    b.textContent = label + (counts[k] ? ` ${counts[k]}` : '');
    b.onclick = () => { S.panel = k; render(); };
    tabs.appendChild(b);
  }
  r.append(tabs, body);

  if ((S.panel || 'context') === 'context') panelContext(body);
  else if (S.panel === 'sources') panelSources(body);
  else panelLinks(body, links, out);
}

function links_out(g) {
  return links(S.doc).routes.filter((r) => r.from === g.name);
}

// ---------------------------------------------------------------- context tab
function panelContext(body) {
  const g = S.guide;
  const OPTIONAL = ['type', 'notes'];
  const missing = [];
  for (const key of GUIDE_FIELDS) {
    if (key === 'sources') continue;   // its own tab
    const val = (g.fields[key] || '').trim();
    if (!val && OPTIONAL.includes(key) && S.shownField !== key) { missing.push(key); continue; }
    const box = el('div', 'ctx');
    box.appendChild(el('dt', null, FIELD_LABELS[key]));
    box.appendChild(key === 'primaryUsers' ? usersField(g) : textField(g, key, val));
    body.appendChild(box);
  }
  if (missing.length && !S.readOnly) {
    const add = el('div', 'addfield');
    for (const key of missing) {
      const b = el('button', null, '+ ' + FIELD_LABELS[key].toLowerCase());
      b.onclick = () => {
        S.shownField = key; render();
        focusSoon(`.ctx dd[data-key="${key}"]`);
      };
      add.appendChild(b);
    }
    body.appendChild(add);
  }
}

function textField(g, key, val) {
  const dd = el('dd');
  dd.dataset.key = key;
  if (isUnknown(val)) { dd.className = 'unknown'; dd.textContent = val; dd.title = 'Nobody has been asked yet'; }
  else if (val) setLinked(dd, val, g);
  else blankable(dd, '', FIELD_PLACEHOLDER[key], 'empty');
  editable(dd, val, (v) => {
    setField(g, key, v);
    if (S.shownField === key && v) S.shownField = null;
  }, { multiline: true });
  return dd;
}

/**
 * A user type is a thing, not a phrase. Picking from what the file already uses
 * is what stops "Sales agent" and "Sales Agent" becoming two groups that are
 * really one.
 */
function usersField(g) {
  const dd = el('dd');
  dd.dataset.key = 'primaryUsers';
  const raw = (g.fields.primaryUsers || '').trim();
  const list = parseUsers(raw);
  const commit = (next) => { setField(g, 'primaryUsers', renderUsers(next)); mark(); render(); };

  if (!list.length && isUnknown(raw)) {
    dd.className = 'unknown';
    dd.textContent = raw;
  }
  const wrap = el('div', 'chips');
  list.forEach((u, i) => {
    const c = el('span', 'chip' + (u.primary ? ' pri' : ''));
    const t = el('span', null, u.name);
    t.title = u.primary ? 'The power user of this screen' : 'Click to mark as the primary user';
    if (!S.readOnly) {
      t.style.cursor = 'pointer';
      t.onclick = () => commit(list.map((x, j) => ({ ...x, primary: j === i ? !x.primary : false })));
    }
    c.appendChild(t);
    if (!S.readOnly) {
      const x = el('button', 'x', '×');
      x.title = 'Remove';
      x.onclick = () => commit(list.filter((_, j) => j !== i));
      c.appendChild(x);
    }
    wrap.appendChild(c);
  });
  if (!S.readOnly) {
    const add = el('button', 'chip add', '+ user');
    add.onclick = () => {
      add.replaceWith(userInput(list, commit));
      focusSoon('.chip input');
    };
    wrap.appendChild(add);
  }
  dd.appendChild(wrap);
  return dd;
}

function userInput(list, commit) {
  const c = el('span', 'chip');
  const inp = el('input');
  inp.setAttribute('list', 'usertypes');
  inp.placeholder = 'user type';
  inp.onkeydown = (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') {
      const v = inp.value.trim();
      if (!v) { render(); return; }
      const known = userTypes(S.doc).find((u) => u.name.toLowerCase() === v.toLowerCase());
      commit([...list, { name: known ? known.name : v, primary: false }]);
    } else if (e.key === 'Escape') render();
  };
  inp.onblur = () => setTimeout(() => { if (document.activeElement !== inp) render(); }, 120);
  c.appendChild(inp);
  return c;
}

// ---------------------------------------------------------------- sources tab
function panelSources(body) {
  const usage = sourceUsage(S.doc);
  const mine = usage.all.filter((s) => s.cites.some((c) => c.guide === S.guide.name));
  const rest = usage.all.filter((s) => s.def && !mine.includes(s));

  if (!mine.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing attached yet. A brief, a synthesis, a decision — anything this guide leans on.'));
  }
  for (const s of mine) body.appendChild(sourceCard(s, true));

  if (!S.readOnly) {
    const add = el('button', 'rail-add', '+  Add a source');
    add.onclick = () => { add.style.display = 'none'; newSourceForm(add.parentNode, null, S.guide); };
    body.appendChild(add);
  }
  if (rest.length) {
    const h = el('div', 'rail-h', 'Also in this file');
    h.style.marginTop = '20px';
    body.appendChild(h);
    for (const s of rest) body.appendChild(sourceCard(s, false));
  }
}

function sourceCard(s, here) {
  const c = el('div', 'src' + (s.def ? '' : ' bad'));
  if (!s.def) {
    c.appendChild(el('div', 'h', s.handle));
    c.appendChild(el('div', 't', 'Cited in this guide, but no source by that name is defined.'));
    if (!S.readOnly) {
      const fix = el('button', 'quiet', 'Define it');
      fix.onclick = () => { fix.style.display = 'none'; newSourceForm(c, null, null); };
      c.appendChild(fix);
    }
    return c;
  }
  const head = el('div', 'h');
  const link = outLink(s.def.url, s.def.title || s.handle, s.def.url);
  link.classList.add('title');
  head.appendChild(link);
  if (here && !S.readOnly) {
    const x = el('button', 'x', '×');
    x.title = 'Detach from this guide. The source stays in the file.';
    x.onclick = () => detachFromGuide(S.guide, s.handle);
    head.appendChild(x);
  }
  c.appendChild(head);
  c.appendChild(el('div', 'u', shortUrl(s.def.url)));
  if (!here && !S.readOnly) {
    const a = el('button', 'quiet', '+ attach to this guide');
    a.onclick = () => { attachToGuide(S.guide, s.handle); mark(); render(); };
    c.appendChild(a);
  }
  return c;
}

// ---------------------------------------------------------------- links tab
/**
 * What this guide leads to, and what leads here. The second half is the thing a
 * design tool cannot tell you, so it does not belong buried under the guide
 * where nobody scrolls.
 */
function panelLinks(body, back, out) {
  const group = (title, list, render1) => {
    if (!list.length) return;
    const h = el('div', 'rail-h', title);
    h.style.marginTop = body.children.length ? '18px' : '0';
    body.appendChild(h);
    for (const x of list) body.appendChild(render1(x));
  };

  group('Goes to', out, (r) => {
    const b = el('button', 'linkrow');
    const n = el('div', 'n', r.to);
    if (!r.resolved) { n.className = 'n'; n.style.color = 'var(--flag)'; }
    b.appendChild(n);
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`
      + (r.resolved ? '' : ' · no guide by that name')));
    if (r.resolved) b.onclick = () => goGuide(r.to);
    return b;
  });

  group('Referenced by', back.routes, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', `${r.type} · from “${r.via}”`));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  group('Mentioned by', back.references, (r) => {
    const b = el('button', 'linkrow');
    b.appendChild(el('div', 'n', r.from));
    b.appendChild(el('span', 'm', r.text));
    b.onclick = () => goGuide(r.from);
    return b;
  });

  if (!body.children.length) {
    body.appendChild(el('div', 'rail-empty',
      'Nothing links to or from this guide yet. Give a block a Goes-to, or add a reference from the toolbar.'));
  }
}

function goGuide(name) {
  const g = findGuide(S.doc, name);
  if (!g) return;
  commitEditor();
  S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide';
  render();
  $('stage').scrollTop = 0;
}

// ---------------------------------------------------------------- sources
/**
 * A source is a title and a link. Nothing else.
 *
 * The handle the file cites it by is derived and never shown — nobody should
 * have to invent a key to attach a document. Attached here is what this guide
 * relies on; the rest of the file is one click from being attached too.
 */
function newSourceForm(host, onDone, guide) {
  const box = el('div', 'srcform');
  const t = el('input'); t.type = 'text'; t.placeholder = 'What is it? e.g. Deskline brief';
  const u = el('input'); u.type = 'text'; u.placeholder = 'Link or file path';
  const row = el('div', 'srcform-foot');
  const ok = el('button', 'btn primary', 'Add');
  const no = el('button', 'quiet', 'Cancel');
  row.append(ok, no);
  box.append(t, u, row);

  const done = () => {
    const title = t.value.trim();
    const url = u.value.trim();
    if (!url) { u.focus(); return; }
    const entry = addSource(S.doc, { handle: handleFor(title || url, S.doc), url, title });
    if (guide) attachToGuide(guide, entry.handle);
    mark();
    if (onDone) onDone(entry);
    render();
  };
  ok.onclick = done;
  no.onclick = () => { box.remove(); render(); };
  box.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); done(); }
    if (e.key === 'Escape') { e.preventDefault(); box.remove(); render(); }
  };
  host.appendChild(box);
  setTimeout(() => t.focus(), 0);
  return box;
}

function attachToGuide(guide, handle) {
  const cur = (guide.fields.sources || '').trim();
  const have = refsIn(cur);
  if (have.includes(handle)) return;
  setField(guide, 'sources', cur ? `${cur}, [${handle}]` : `[${handle}]`);
}

function detachFromGuide(guide, handle) {
  const left = refsIn(guide.fields.sources || '').filter((h) => h !== handle);
  setField(guide, 'sources', left.map((h) => `[${h}]`).join(', '));
  mark(); render();
}

/** Enough of an address to recognise it. The whole thing stays on the link. */
function shortUrl(u) {
  const raw = String(u || '');
  try {
    const url = new URL(raw);
    const tail = url.pathname.replace(/\/$/, '').split('/').filter(Boolean).pop() || '';
    return url.host.replace(/^www\./, '') + (tail ? '/' + (tail.length > 22 ? tail.slice(0, 21) + '…' : tail) : '');
  } catch {
    const base = raw.split('/').filter(Boolean).pop() || raw;
    return base.length > 32 ? base.slice(0, 31) + '…' : base;
  }
}

// ---------------------------------------------------------------- users
/**

 *

function renderUsersView() {

    w.appendChild(d);

  head.appendChild(el('div', 'sec-note',

  for (const t of types) {

    h.appendChild(el('span', 'n', t.name));

      S.view = 'guide'; S.present = true; S.editing = null;

    };
    h.appendChild(pres);
    box.appendChild(h);

    for (const { guide, primary } of t.guides) {
      const b = el('button', 'oi');
      const tt = el('div', 't', guide.name);
      if (primary) {
