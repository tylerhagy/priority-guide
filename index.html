<!doctype html>
<meta charset="utf-8">
<title>priority guide</title>
<!-- Family mark: same rounded-square badge as ORCA/jobmap. Color is this
     app's own --warn amber (shared across the suite); glyph is three
     descending bars — content ranked by priority, the thing this app is for. -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='rgb(154,103,0)'/><rect x='8' y='9' width='16' height='3.6' rx='1.8' fill='white'/><rect x='8' y='14.4' width='11.5' height='3.6' rx='1.8' fill='white'/><rect x='8' y='19.8' width='7' height='3.6' rx='1.8' fill='white'/></svg>">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
/* Values below are the shared/tokens.css family palette (design-utilities
   repo) — the source of truth for ORCA/jobmap/priority-guide. Kept in sync
   by hand; see that file's README for how to check for drift. */
:root{
  color-scheme:light;

  /* ---- surfaces. Solid steps, not translucent washes over near-white. A wash
     is why every boundary read as a slightly different grey: two of them
     overlapping make a third value nobody chose. ---- */
  --bg:#f2f3f6;          /* the ground the paper sits on */
  --panel:#ffffff;       /* paper: the card, the rails, a popover */
  --surface-2:#e5e8ee;   /* a section's own ground, a lane ground, a well */
  --surface-3:#d9dde5;   /* pressed, or a header inside paper */

  /* ---- text. Three steps, spread far enough apart to be three. ---- */
  --ink:#14161b; --dim:#5b6470; --faint:#8b939f;

  /* ---- edges. Two, both tokenised, so a dark theme can invert them. ---- */
  --line:#e2e5ea; --line-2:#c9ced7;

  /* ---- one elevation, painted once, on one element. ---- */
  --shadow-card:0 1px 2px rgba(20,22,27,.05), 0 12px 28px -18px rgba(20,22,27,.22);
  --shadow-pop:0 8px 28px -8px rgba(20,22,27,.28);
  /* Shadows need translucency, so they stay rgba rather than referring to a
     surface token. Naming them here keeps them themeable anyway. */
  --shadow-1:0 1px 2px rgba(20,22,27,.08);
  --shadow-2:0 1px 3px rgba(20,22,27,.10);
  --shadow-toast:0 6px 24px rgba(20,22,27,.18);
  --shadow-palette:0 -6px 24px rgba(20,22,27,.07);
  --shadow-sm:0 1px 2px rgba(20,22,27,.05), 0 14px 34px -22px rgba(20,22,27,.28);

  /* ---- interaction. Blue means "you can act on this" and nothing else: a
     link, the focus ring, the selected row. It never reports content. ---- */
  --accent:#2563eb; --accent-soft:#eaf1fe; --accent-line:#b9d0fb;
  --accent-ink:#1b3f8f; --on-accent:#fff;

  /* ---- content state. The only colour in the guide body, and it answers one
     question: has this been answered? Two values, nothing else. ---- */
  --unanswered:#8a5a00; --unanswered-soft:#fdf6e8; --unanswered-line:#ebd9ae;
  --action:#a8271f;     --action-soft:#fdf1ef;    --action-line:#f0cdc7;
  /* ---- what kind of open question: a decision, an answer to find, left unclear.
     Only ever on an action's label, never in the guide body. ---- */
  --t-dec:#8e1468; --t-dec-soft:#f8e9f3; --t-ans:#01579b; --t-ans-soft:#e6f3fa; --t-unc:#9a4a00; --t-unc-soft:#fdf0e6;

  /* ---- neutral interface feedback. No hue. ---- */
  --hover:#eef0f4; --tint:#f7f8fa; --press:#dfe3ea;

  /* ---- kept for non-guide chrome: banners, toggles, destructive buttons ---- */
  --ok:#177245; --ok-soft:#e8f3ec; --on-ok:#fff;
  --warn:#8a5a00; --warn-soft:#fdf6e8;
  --danger:#b3261e; --danger-soft:#fdf1ef;
  --none:#8b939f; --flag:var(--unanswered); --act:var(--action);
  --scrim:rgba(20,22,27,.34);
  /* The minimap's scroll-position band sits over its own picture of the
     guide — it has to stay translucent so that picture still reads through
     it, the same reason --scrim stays rgba instead of a solid step. */
  --accent-veil:rgba(37,99,235,.11); --accent-veil-hover:rgba(37,99,235,.2);

  --t-micro:11px; --t-small:12.5px; --t-body:13.5px; --t-ui:14px;
  --t-title:16px; --t-lede:17px; --t-display:28px; --t-hero:38px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:28px; --s7:96px;
  --radius:10px; --radius-sm:7px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --mono:ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* Dark is the same set of decisions with the surfaces inverted and the two
   state colours lifted so they still read as themselves on a dark ground.
   Every value above is redefined here — none is left to inherit a light
   value, which is what made a dark theme impossible before. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#14161a; --panel:#1c1f25; --surface-2:#2a2f38; --surface-3:#343a45;
    --ink:#e9ebef; --dim:#a2abb7; --faint:#727c89;
    --line:#2e333b; --line-2:#454c57;
    --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -18px rgba(0,0,0,.7);
    --shadow-pop:0 10px 34px -8px rgba(0,0,0,.75);
    --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.7);
    --shadow-1:0 1px 2px rgba(0,0,0,.45); --shadow-2:0 1px 3px rgba(0,0,0,.5);
    --shadow-toast:0 6px 24px rgba(0,0,0,.6); --shadow-palette:0 -6px 24px rgba(0,0,0,.45);
    --accent:#6ea3ff; --accent-soft:#1d2a41; --accent-line:#2f4162;
    --accent-ink:#c4d9ff; --on-accent:#0f1115;
    --unanswered:#e0b45f; --unanswered-soft:#2d2716; --unanswered-line:#4a3f22;
    --action:#f08d84;     --action-soft:#331d1b;    --action-line:#54302c;
  --t-dec:#f3a6d8; --t-dec-soft:#3a1d31; --t-ans:#8fd0f5; --t-ans-soft:#13303f; --t-unc:#f6b77c; --t-unc-soft:#3a2614;
    --hover:#262b33; --tint:#1f232a; --press:#343a45;
    --ok:#5cc48a; --ok-soft:#16291f; --on-ok:#0f1115;
    --warn:#e0b45f; --warn-soft:#2d2716;
    --danger:#f08d84; --danger-soft:#331d1b;
    --none:#727c89;
    --scrim:rgba(0,0,0,.62);
    --accent-veil:rgba(110,163,255,.16); --accent-veil-hover:rgba(110,163,255,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#14161a; --panel:#1c1f25; --surface-2:#2a2f38; --surface-3:#343a45;
  --ink:#e9ebef; --dim:#a2abb7; --faint:#727c89;
  --line:#2e333b; --line-2:#454c57;
  --shadow-card:0 1px 2px rgba(0,0,0,.5), 0 12px 28px -18px rgba(0,0,0,.7);
  --shadow-pop:0 10px 34px -8px rgba(0,0,0,.75);
  --shadow-sm:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.7);
  --shadow-1:0 1px 2px rgba(0,0,0,.45); --shadow-2:0 1px 3px rgba(0,0,0,.5);
  --shadow-toast:0 6px 24px rgba(0,0,0,.6); --shadow-palette:0 -6px 24px rgba(0,0,0,.45);
  --accent:#6ea3ff; --accent-soft:#1d2a41; --accent-line:#2f4162;
  --accent-ink:#c4d9ff; --on-accent:#0f1115;
  --unanswered:#e0b45f; --unanswered-soft:#2d2716; --unanswered-line:#4a3f22;
  --action:#f08d84;     --action-soft:#331d1b;    --action-line:#54302c;
  --t-dec:#f3a6d8; --t-dec-soft:#3a1d31; --t-ans:#8fd0f5; --t-ans-soft:#13303f; --t-unc:#f6b77c; --t-unc-soft:#3a2614;
  --hover:#262b33; --tint:#1f232a; --press:#343a45;
  --ok:#5cc48a; --ok-soft:#16291f; --on-ok:#0f1115;
  --warn:#e0b45f; --warn-soft:#2d2716;
  --danger:#f08d84; --danger-soft:#331d1b;
  --none:#727c89;
  --scrim:rgba(0,0,0,.62);
  --accent-veil:rgba(110,163,255,.16); --accent-veil-hover:rgba(110,163,255,.3);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
#bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
#bar .brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#bar .file{color:var(--dim);white-space:nowrap;max-width:52ch;min-width:0;cursor:pointer;padding:4px 8px;
  border-radius:7px;display:flex;align-items:center;gap:6px}
#bar .file span{overflow:hidden;text-overflow:ellipsis}
#bar .file svg{color:var(--faint);flex:none}
#bar .file:hover svg{color:var(--ink)}
#bar .file:hover{background:var(--hover);color:var(--ink)}
#bar .file .ft{color:var(--ink);font-weight:500}
#bar .file.open{background:var(--hover);color:var(--ink)}
.pop.menu.files{width:min(440px,calc(100vw - 24px));max-width:none}
#bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--dim);font-size:12.5px;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1)}
.btn{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--dim);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.on:hover{background:var(--ink);filter:brightness(1.35)}
.btn.primary{background:var(--accent);color:var(--panel)}
.btn.save{display:inline-flex;align-items:center;gap:6px}
.btn.save[disabled]{opacity:1;color:var(--faint)}
.btn.save .kbd{font-size:10.5px;opacity:.7;font-variant-numeric:tabular-nums}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.count{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:600;color:var(--flag)}
.count.clear b{color:var(--ok)}
.quiet{color:var(--faint);font-size:12px}
.quiet:hover{color:var(--dim);text-decoration:underline}

/* ---------- banners ---------- */
#banners{position:sticky;top:52px;z-index:5}
.banner{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
.banner.err{background:var(--action-soft);color:var(--action)}
.banner.warn{background:var(--unanswered-soft);color:var(--unanswered)}
.banner.info{background:var(--accent-soft);color:var(--accent-ink)}
.banner b{font-weight:600}
.banner code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--hover);padding:1px 4px;border-radius:4px}
.banner button{margin-left:10px;text-decoration:underline}

/* ---------- layout ---------- */
main{height:calc(100% - 52px);display:flex;overflow:hidden}
#railL{width:214px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px 10px 40px}
#railR{width:340px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0;position:relative}
#railR.collapsed{align-items:center;justify-content:flex-start;padding-top:10px}
/* An overlay strip on the border, not a grid track — the same drag idiom the
   minimap already uses, just for a horizontal measurement instead of scroll. */
.rdrag{position:absolute;left:-4px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:3}
.rdrag:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--line);transform:translateX(-50%)}
.rdrag:hover:before,.rdrag.active:before{background:var(--line-2);width:2px}
.rhead{flex:none;display:flex;justify-content:flex-end;padding:8px 8px 0}
.rcollapse{color:var(--faint);padding:4px 6px;border-radius:6px;display:flex;
  transform:rotate(-90deg)}
.rcollapse:hover{color:var(--ink);background:var(--hover)}
.rexpand{color:var(--dim);padding:8px 6px;border-radius:7px;display:flex;transform:rotate(90deg)}
.rexpand:hover{background:var(--hover);color:var(--ink)}
.dthumb{margin-top:8px;border:1px solid var(--line);border-radius:var(--radius-sm);
  background:var(--hover);overflow:hidden;cursor:pointer;display:block;max-height:220px}
.dthumb:hover{border-color:var(--dim)}
.dthumb img{display:block;width:100%;height:auto}
.dmiss{padding:10px;font-size:11.5px;color:var(--faint);text-align:center}
.bimg{overflow:auto;background:var(--hover);display:block}
.bimg img{display:block;max-width:100%;height:auto;margin:0 auto}
.btn.icon{padding:5px 7px;display:inline-flex;align-items:center}
.btn.icon svg{color:var(--dim)}
.btn.icon:hover svg{color:var(--ink)}
.rminis{display:flex;flex-direction:column;gap:2px;margin-top:6px;align-items:center}
.rmini{position:relative;color:var(--dim);padding:7px 6px;border-radius:7px;display:flex}
.rmini:hover{background:var(--hover);color:var(--ink)}
.rmini.on{color:var(--ink);background:var(--hover)}
.rmini .b{position:absolute;top:1px;right:0;min-width:13px;height:13px;padding:0 3px;
  border-radius:7px;background:var(--accent);color:var(--panel);font-size:9px;font-weight:700;
  line-height:13px;text-align:center;font-variant-numeric:tabular-nums}
#mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#midrow{flex:1;display:flex;min-height:0;min-width:0}

/* ---------- where you are in a long guide ----------
   A column beside the guide, holding the guide itself at a size you can take in
   at a glance. It is a picture, not a diagram: the same shapes in the same
   places, so what you recognise on the page you recognise here. Quiet until you
   look at it, because it is for orienting, not for reading. */
/* The column is margin, not a panel. A guide is wider than it is tall, so a
   true-to-scale picture of one is short — and a full-height rail around a short
   picture reads as an empty container with something stranded at the top. */
#minimap{flex:none;width:124px;position:relative;overflow:hidden;cursor:pointer;
  user-select:none;background:transparent;padding-left:6px}
.mshotwrap{position:absolute;inset:0;overflow:hidden;opacity:.4;
  transition:opacity .14s var(--ease)}
/* The extent of the guide, so the picture reads as one document. */
.mshotwrap:before{content:"";position:absolute;left:6px;right:2px;
  top:var(--paper-top,0);height:var(--paper,0);
  background:var(--panel);border:1px solid var(--line);border-radius:3px}
#minimap:hover .mshotwrap{opacity:.78}
.mshot{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
/* Inset to the same edges as the picture, so the band reads as being on the
   document rather than across the column. */
.mview{position:absolute;left:6px;right:2px;background:var(--accent-veil);
  border-top:1px solid var(--accent);border-bottom:1px solid var(--accent);
  pointer-events:none;min-height:10px}
#minimap:hover .mview{background:var(--accent-veil-hover)}
body.present #minimap,body.is-paired #minimap{display:none}
/* And if it still cannot fit — a very narrow window, or zoomed in — it scrolls
   sideways rather than hiding under anything. */
#stage{flex:1;overflow:auto;padding:22px 30px 40px;min-width:0}
.wrap{max-width:760px;margin:0 auto}

/* ---------- page header: which guide, always ---------- */
#pagehead{flex:none;padding:16px 30px 12px;border-bottom:1px solid var(--line);
  background:var(--panel)}
#pagehead .headline{display:flex;align-items:center;gap:8px}
#pagehead .hnav{margin-left:auto;display:flex;align-items:center;gap:4px;flex:none}
#pagehead .rexit{margin-left:10px}
#pagehead h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25;
  padding:2px 6px;margin-left:-6px;border-radius:7px;min-width:2ch}
#pagehead .nav{color:var(--dim);padding:4px;border-radius:8px;display:flex}
#pagehead .nav:hover{background:var(--hover);color:var(--ink)}
#pagehead .nav[disabled]{opacity:.25;pointer-events:none}
#pagehead .count{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;margin-left:2px}
#pagehead h1:hover{background:var(--hover)}
#pagehead h1:focus{outline:none;background:var(--accent-soft)}
#pagehead .sub{margin-top:4px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
#pagehead .sub .who{color:var(--ink)}
#pagehead .sub .dot{color:var(--faint)}
#pagehead .sub .open{color:var(--flag);font-weight:500}

/* ---------- flow: a card says what it connects to; the bar is what actually
   takes you there, so a click can stay a click instead of a jump ---------- */
#flowbar{flex:none;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 14px;
  margin:0 auto 16px;width:max-content;max-width:calc(100% - 40px);
  border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line),var(--shadow-sm)}
#flowbar .n{font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
#flowbar .m{font-size:11.5px;color:var(--faint);margin-left:2px;white-space:nowrap}
#flowbar .x{color:var(--faint);padding:4px;border-radius:6px;display:flex;flex:none}
#flowbar .x:hover{color:var(--ink);background:var(--hover)}

/* ---------- the palette: the one place you drag from ---------- */
/* Floating, the width of what it holds. A full-bleed strip pinned to the bottom
   edge of the window is a status bar, and this is a set of tools. */
#palette{flex:none;display:flex;align-items:center;gap:6px;padding:8px 12px;
  margin:0 auto 16px;width:max-content;max-width:calc(100% - 40px);
  border-radius:16px;background:var(--panel);box-shadow:0 0 0 1px var(--line),var(--shadow-sm);overflow-x:auto}
#palette .lbl{color:var(--faint);font-size:11.5px;white-space:nowrap;margin-right:6px;flex:none}
.ptool{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:10px;
  border:1px solid var(--line);background:var(--panel);color:var(--dim);font-size:12px;
  font-weight:500;white-space:nowrap;cursor:grab;user-select:none;flex:none}
.ptool:hover{color:var(--ink);border-color:var(--dim);background:var(--hover)}
.ptool svg{color:var(--faint)}
.ptool:hover svg{color:var(--ink)}
.ptool.lifting{opacity:.4;cursor:grabbing}

/* Where it will land. */
.cell.dropbefore{box-shadow:inset 0 3px 0 var(--accent)}
.cell.dropafter{box-shadow:inset 0 -3px 0 var(--accent)}
.cell.lifting{opacity:.35}
.cell.tail{min-height:18px}
.tailhint{height:10px}
body.dragging .item{cursor:grabbing}

/* ---------- bottom toolbar: the creator tools ---------- */
body.present #bar,body.present #railL,body.present #railR,body.present #palette,
body.present #flowbar{display:none}
body.present main{height:100%}
body.present #pagehead{padding:22px 30px 16px}
body.present #stage{padding:30px 30px 90px}
body.present{font-size:15px}
body.present .sec-title{font-size:15.5px}

/* ---------- left rail: guides ---------- */
.rail-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:0 8px 7px}
.g-item{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--dim);line-height:1.35;position:relative;cursor:pointer}
.g-item:hover{background:var(--hover);color:var(--ink)}
.g-item.on{background:var(--accent-soft);color:var(--ink)}
.g-item.on:hover{background:var(--accent-line);color:var(--ink)}
.g-item .n{font-weight:500;display:block;padding:1px 3px;margin-left:-3px;border-radius:4px}
.g-item .n:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.gmore{position:absolute;right:5px;top:5px;padding-left:12px;
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.g-item.on .gmore{background:linear-gradient(90deg,transparent,var(--accent-soft) 40%)}
.g-item.dragging{opacity:.4}
.g-item.dropat{box-shadow:inset 0 2px 0 var(--accent)}
.g-item.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.g-item .m{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.g-item.on .m{color:var(--dim)}
.g-item .m .o{color:var(--flag);font-weight:600}
.rail-add{margin-top:6px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--faint);font-size:12.5px}
.rail-add:hover{background:var(--hover);color:var(--ink)}

.g-title{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;
  font-size:11px;font-weight:500;white-space:nowrap;background:var(--hover);color:var(--dim)}
.pill.dead{background:var(--unanswered-soft);color:var(--flag)}

/* ---------- the guide: three lanes ----------
   The middle is the guide itself — what each thing is called, and what its data
   actually looks like. Notes annotate it from the left, functionality from the
   right, each on a dotted leader to the one row it describes. */
/* Fluid, not fixed. A 340px stack was a phone-shaped guess; a priority guide is
   an order of importance, not a mock, and on a wide screen a fixed column leaves
   the page reading as a narrow strip adrift in grey. */
/* The minimums have to be small enough to survive a laptop. Anything larger and
   the grid overflows its own column instead of shrinking, which is what put the
   functionality lane underneath the minimap. */
/* Shares of the guide, not of the viewport. A vw-based lane sizes itself from a
   window that includes both rails and the minimap, so on a laptop the three
   columns added up to more than the stage could hold and the functionality lane
   ran off the edge. fr divides the room the guide actually has. */
.guide{display:grid;
  grid-template-columns:minmax(200px,1.05fr) minmax(264px,1.5fr) minmax(200px,1.15fr);
  margin:0 auto;width:100%;max-width:1140px}
body.present .guide{grid-template-columns:minmax(150px,1.05fr) minmax(320px,1.5fr) minmax(160px,1.15fr);
  max-width:1360px}
/* Chromium's `zoom` scales layout, not just paint, so scroll heights, hit
   testing and the minimap's own arithmetic all stay true — which a transform
   would not. This app is Chromium-only anyway (File System Access). */
/* A transform, not `zoom`: `zoom` resolves a percentage width against a
   containing block that is itself zoomed, so a fluid guide comes out exactly
   the same size at every level. */
.gzoom{position:relative;width:100%;max-width:1140px;margin:0 auto}
.rctx{max-width:760px;margin:0 auto 26px;padding:0 4px}
.rctx dl{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;margin:0}
.rctx dt{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding-top:2px}
.rctx dd{margin:0;font-size:13px;line-height:1.5;color:var(--ink)}
.rctx dd.unknown{color:var(--unanswered)}
.rctx-f{display:flex;flex-wrap:wrap;gap:6px 22px;align-items:baseline;margin-top:14px;
  padding-top:12px;border-top:1px solid var(--line)}
.rctx-h{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.rctx-l{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px}
.rctx-l a{color:var(--accent)}
.gzoom > .guide{transform:scale(var(--zoom,1));transform-origin:top left;
  width:calc(100% / var(--zoom,1));max-width:none;margin:0}
body.present .gzoom{max-width:1360px}

/* Every row is a grid row so an annotation lines up with the one item it
   annotates. The stack reads as one continuous column because each middle cell
   carries the side borders and the ends carry the caps. */
.cell{grid-column:2;padding:0 14px;display:flex;flex-direction:column;
  position:relative;z-index:1}
.cell.top{padding-top:16px}
.cell.bot{padding-bottom:16px}
/* The card itself: one element spanning the section's rows, so it has one edge
   at one set of coordinates. Nothing else in the stack paints a surface. */
.paper{grid-column:2;position:relative;z-index:0;background:var(--panel);
  border-radius:var(--radius);box-shadow:0 0 0 1px var(--line), var(--shadow-card);
  pointer-events:none}
/* The break between two sections is not part of either card, so it draws
   nothing — otherwise the side lines run on and the two read as one. */
.cell.gap{height:14px;background:transparent;box-shadow:none}
/* The band was a second framed container inside the first: four vertical
   hairlines per row, 13px apart, over two backgrounds one step apart. It is
   padding now, and the cell is the card. */
.band{padding:0 13px;flex:1;display:flex;flex-direction:column}
.band.open{padding-top:13px}
.band.close{padding-bottom:13px}
.band > *{margin-bottom:7px}
.band.close > *:last-child{margin-bottom:0}
.lane{display:flex;align-items:flex-start;min-height:1px;position:relative}
/* Stacked, when three readable columns do not fit: one column, and each block's
   notes and functionality sit under it inside the card. Empty slots only show on
   the selected block, or every block would carry two placeholders. */
.guide.stacked{grid-template-columns:minmax(0,1fr);max-width:620px}
.guide.stacked .cell,.guide.stacked .paper{grid-column:1}
.guide.stacked .lanehead{display:none}
.guide.stacked .cell > .lane{flex-direction:column;align-items:stretch;gap:4px;padding:0 13px;margin:-3px 0 9px}
.guide.stacked .cell > .lane .lead{display:none}
.guide.stacked .cell > .lane-l .notes{align-items:stretch}
.guide.stacked .cell > .lane .note,.guide.stacked .cell > .lane .fn{max-width:none;width:100%}
.guide.stacked .cell > .lane:not(.rowsel) .slot,.guide.stacked .cell > .lane:not(.rowsel) .fn.asslot{display:none}
.guide.stacked .cell > .lane:empty{display:none}
.lane-l{grid-column:1;justify-content:flex-end}
.lane-r{grid-column:3}
/* A solid hairline, not a dotted one: a leader is a tie, and a row of dots is
   a table of contents from 1994. */
/* An annotation line: it runs from the note or the functionality card and
   crosses the card's edge, so the two read as attached to the block rather than
   floating alongside it. Positioned, to sit over the card rather than under it,
   and only drawn when there is something on that side to tie. */
.lead{flex:none;width:30px;border-top:1px solid var(--line-2);margin-top:15px;
  position:relative;z-index:2;transition:border-color .12s var(--ease)}
.lane-l .lead{margin-right:-9px}
.lane-r .lead{margin-left:-9px}
.lane.rowhot{background:var(--accent-soft);border-radius:var(--radius-sm)}
.rowhot .lead,.rowsel .lead{border-color:var(--accent)}

/* ---------- one row in the stack ---------- */
.item{padding:2px 0;position:relative}
.item .box{cursor:grab;border:1px solid var(--line-2);background:var(--panel);
  border-radius:var(--radius-sm);padding:6px 10px;display:flex;align-items:center;gap:8px;min-height:32px;
  transition:border-color .12s var(--ease),box-shadow .12s var(--ease)}
.item .box:hover{border-color:var(--line-2);box-shadow:var(--shadow-2)}
.boxin{flex:1;min-width:0}
.item.plain .box,.item.linky .box{border-color:transparent;background:transparent;
  padding:4px 4px 4px 3px;min-height:26px}
.item.plain .box:hover,.item.linky .box:hover{border-color:transparent;box-shadow:none;
  background:var(--hover)}
.item.linky .lbl{text-decoration:underline;text-underline-offset:2px}

/* A visual stands for something that will take up room on the screen, so it
   takes up room here. Reading the stack should tell you its shape. */
.item.visual .box{border-style:dashed;border-color:var(--line-2);border-radius:var(--radius-sm);
  color:var(--dim);min-height:82px;padding:14px;gap:11px;
  background:repeating-linear-gradient(-45deg,transparent,transparent 8px,
    var(--tint) 8px,var(--tint) 16px)}
.item.visual.chart .box{min-height:96px}
.item.visual .kindmark{color:var(--faint)}
.item.visual .lbl{font-weight:500}
/* The name is the thing; the real data is the evidence under it. They were the
   same size and the data was the fainter of the two, which put the least
   contrast on the column that earns the artifact. */
.lbl{flex:1;min-width:0;font-size:13px;font-weight:500;line-height:1.4;overflow-wrap:anywhere;
  padding:1px 4px;margin-left:-4px;border-radius:var(--radius-sm)}
.lbl:hover{background:var(--hover)}
.lbl:focus{outline:none;background:var(--accent-soft)}
.lbl .unk{color:var(--flag);font-weight:500}
.eg{font-size:12px;color:var(--dim);line-height:1.45;margin-top:3px;padding:1px 4px;
  margin-left:-4px;border-radius:var(--radius-sm);overflow-wrap:anywhere;
  font-variant-numeric:tabular-nums}
.eg:hover{background:var(--hover)}
.eg:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.eg.none{color:var(--faint);font-style:italic}
.eg.unk{color:var(--flag);font-weight:500;font-style:normal}
.item .chev{flex:none;color:var(--dim)}
.rowsel .box{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.drag .item{opacity:.35}
.over .item{box-shadow:0 -2px 0 var(--accent)}
.over-b .item{box-shadow:0 2px 0 var(--accent)}
.flag{font-size:10.5px;color:var(--flag);line-height:1.4;margin-top:3px;padding-left:2px}

/* ---------- notes, on the left ---------- */
.notes{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:1;min-width:0}
.note{border:1px solid var(--line);background:var(--panel);border-radius:var(--radius-sm);
  box-shadow:var(--shadow-1);
  padding:3px 7px;font-size:11px;line-height:1.4;color:var(--dim);
  display:flex;gap:6px;align-items:flex-start;max-width:100%}
.note.act{border-color:var(--action-line);background:var(--action-soft);color:var(--act)}
.nbody{min-width:0;flex:1;padding-right:2px}
/* The tools float over the top-right corner, so the text needs a lane of its
   own to wrap into. Reserved whenever the tools can exist at all, not on
   hover — a gutter that appears under the cursor rewraps the note you are
   reading. */
.note.hastools .nbody{padding-right:38px}
.note .t{min-width:0;padding:0 2px;border-radius:3px}
.note .t:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.note .k{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--act);margin-bottom:1px}
.note .gl{flex:none;color:var(--faint);margin-top:1px}
.note.act .gl{color:var(--act)}
.note{position:relative}
/* Inside the card and out of flow: reachable without crossing a gap, and
   revealing them still cannot reflow the note or the row. */
.note .tools{position:absolute;right:2px;top:2px;display:flex;gap:1px;padding-left:10px;
  opacity:0;pointer-events:none;transition:opacity .1s var(--ease);
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.note.act .tools{background:linear-gradient(90deg,transparent,var(--action-soft) 40%)}
.note:hover .tools,.note:focus-within .tools{opacity:1;pointer-events:auto}
.note .tools button{color:var(--faint);font-size:11px;line-height:1;padding:1px 3px;border-radius:4px}
.note .tools button:hover{color:var(--ink);background:var(--hover)}
.note a{color:var(--accent)}
/* In the row's own flow, under it: it can never sit on top of what it belongs to. */
.rowstrip{display:flex;flex-wrap:wrap;gap:2px;margin-top:5px;padding-top:5px;
  border-top:1px dashed var(--line)}
.sbtn{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--dim);
  padding:4px 8px;border-radius:7px;white-space:nowrap;line-height:1}
.sbtn:hover{color:var(--ink);background:var(--hover)}
.sbtn svg{color:var(--faint)}
.sbtn:hover svg{color:var(--ink)}
.sbtn.kind{color:var(--ink);font-weight:500}
.sbtn .caret{color:var(--faint);font-size:9px}
.sbtn.danger:hover{color:var(--danger);background:var(--danger-soft)}
.sbtn.danger:hover svg{color:var(--danger)}

/* ---------- what a lane holds, said once at the top ---------- */
.lanehead{grid-column:2;height:26px}
.lanelbl{font-size:9.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;
  color:var(--faint);padding:0 4px 8px}
.lane-l .lanelbl{text-align:right;width:100%}

/* An empty lane still shows what belongs in it. */
/* Still there at rest, so you can see a lane can hold something without
   touching it — but as a mark, not as a dashed pill on every row. Nineteen
   blocks meant thirty-eight of them, and that is most of what read as grey. */
.slot,.fn.asslot{display:inline-flex;align-items:center;gap:0;font-size:10.5px;
  color:var(--faint);padding:4px;border-radius:var(--radius-sm);border:1px dashed transparent;
  background:transparent;white-space:nowrap;line-height:1;cursor:pointer;opacity:.3;
  transition:opacity .12s var(--ease),color .12s var(--ease),border-color .12s var(--ease)}
.slot svg,.fn.asslot svg{color:var(--faint);flex:none}
.slot span,.fn.asslot span{max-width:0;overflow:hidden;transition:max-width .12s var(--ease),
  margin .12s var(--ease)}
.lane:hover .slot,.lane:hover .fn.asslot,.rowsel .slot,.rowsel .fn.asslot{opacity:1;padding:4px 9px;
  border-color:var(--line-2)}
.lane:hover .slot span,.lane:hover .fn.asslot span,
.rowsel .slot span,.rowsel .fn.asslot span{max-width:14ch;margin-left:5px}
.slot:hover,.fn.asslot:hover{color:var(--ink);border-color:var(--dim)}
.slot:hover svg,.fn.asslot:hover svg{color:var(--ink)}
.fn.asslot{flex-direction:row;text-align:left}
.lanemore{opacity:0;display:inline-flex;padding:2px 5px;border-radius:6px;color:var(--faint);
  border:1px dashed var(--line);transition:opacity .1s var(--ease)}
.lane-l:hover .lanemore,.rowsel .lanemore{opacity:.8}
.lanemore:hover{opacity:1;color:var(--ink);border-color:var(--dim)}

/* ---------- a divider is a rule and nothing else ---------- */
.item.divider{padding:8px 0}
.item.divider .rule{border-top:1px solid var(--line-2)}
.item .kindmark{color:var(--dim);flex:none}
.item.visual .box{align-items:flex-start}

/* ---------- one overflow button, everywhere ---------- */
.more{color:var(--faint);padding:3px;border-radius:6px;display:flex;align-items:center;
  opacity:0;transition:opacity .1s var(--ease)}
.more:hover,.more.open{color:var(--ink);background:var(--hover)}
.more.open{opacity:1}
.g-item:hover .more,.g-item:focus-within .more,
.cell.sechead:hover .more,.item:hover .more,.rowsel .more,
.sub:hover .more,.sub:focus-within .more,
.ref:hover .more,.ref:focus-within .more{opacity:1}
.secmore{position:absolute;right:10px;top:8px}
.submore{position:absolute;right:6px;top:6px}
.refmore{position:absolute;right:4px;top:2px}
.cell.sechead{position:relative;background:var(--surface-2);padding-top:0;padding-bottom:0;
  border-bottom:1px solid var(--line);
  border-radius:var(--radius) var(--radius) 0 0}
.cell.sechead .band{padding-top:17px;padding-bottom:17px}
/* A spacer above the first card, outside any section. Now that each section
   rounds its own corners it is top padding and nothing else — with a ground it
   drew a square strip above a rounded card. */
.cell.emptytop{background:transparent;box-shadow:none}
.cell.sechead.top{background:var(--surface-2)}
/* The header owns its band too, or the ground stops halfway across the card. */
.cell.sechead .band{background:transparent}
.menu{width:236px;padding:5px;display:flex;flex-direction:column;gap:1px}
.mitem{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border-radius:8px}
.mitem:hover,.mitem:focus-visible{background:var(--hover);outline:none}
.mitem > div{flex:1;min-width:0}
.mitem svg{color:var(--dim);margin-top:1px;flex:none}
.mitem .n{font-size:12.5px;line-height:1.35}
.mitem .h{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.mitem[disabled]{opacity:.35;pointer-events:none}
.mitem.danger .n{color:var(--danger)}
.mitem.danger svg{color:var(--danger)}
.mitem.danger:hover{background:var(--action-soft)}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- what a block is ---------- */
.pop-h{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);grid-column:1/-1;margin-bottom:1px}
.pop-h + *{margin-top:0}
.kindpop{width:296px}
.kindpop .pop-h{margin:10px 0 5px}
.kindpop .pop-h:first-child{margin-top:0}
.kinds{display:flex;flex-direction:column;gap:1px}
.kindopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px}
.kindopt:hover{background:var(--hover)}
.kindopt.on{background:var(--accent-soft)}
.kindopt > div{flex:1;min-width:0}
.kindopt svg{color:var(--dim);margin-top:1px;flex:none}
.kindopt.on svg{color:var(--accent)}
.kindopt .n{font-size:12.5px;font-weight:500}
.kindopt .b{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.charts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.chartopt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;
  border-radius:8px;font-size:9.5px;color:var(--dim);line-height:1.25;text-align:center;
  min-height:56px;justify-content:center}
.chartopt:hover{background:var(--hover);color:var(--ink)}
.chartopt.on{background:var(--accent-soft);color:var(--accent)}
.chartopt svg{color:currentColor}

/* ---------- choosing what a reference points at ---------- */
.refpop{width:300px}
.refpop input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.refpop .pop-h{margin:11px 0 5px}
.refpop .pop-h:first-child{margin-top:0}
.reflist{max-height:210px;overflow-y:auto;margin-top:5px;display:flex;flex-direction:column;gap:1px}
.refopt{width:100%;text-align:left;padding:6px 8px;border-radius:8px}
.refopt:hover{background:var(--hover)}
.refopt.on{background:var(--accent-soft)}
.refopt .n{font-size:12.5px;font-weight:500}
.refopt .m{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.ref{position:relative}
.band.guidelevel{background:transparent;padding-top:2px;padding-bottom:2px}
.cell.emptytop{min-height:14px}
.band.guidelevel .ref{margin:0 0 2px}
.ref.unset{color:var(--faint);border-style:dashed}
.ref[role=button]{cursor:pointer}
.ref[role=button]:hover{border-color:var(--dim);color:var(--ink)}
.refx{position:absolute;right:4px;top:2px;color:var(--faint);font-size:13px;line-height:1;
  padding:1px 4px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.ref:hover .refx{opacity:1}
.refx:hover{color:var(--danger);background:var(--danger-soft)}
/* A brand-new note is a field, not a hairline. */
.note.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);min-width:190px}
.note.fresh .t{min-height:32px}

/* ---------- functionality, on the right ---------- */
.fn{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;max-width:100%}
.fn{cursor:pointer}
.fn.empty{background:transparent;border-color:transparent}
.fn.empty:hover{border-color:var(--line)}
.fn:hover{border-color:var(--dim)}
.fn a.tgt:hover{text-decoration:underline}
.fn .l{display:flex;gap:6px;align-items:flex-start}
.fn .l svg{flex:none;color:var(--dim);margin-top:1px}
.fn .l b{font-weight:500}
.fn .tgt{color:var(--accent)}
.fn .tgt.dead{color:var(--flag)}
.fn .req{color:var(--ink);font-weight:600}
.fn .caps{color:var(--dim);font-size:11px;letter-spacing:.01em;
  display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.fn .cap{display:inline-flex;align-items:center;gap:3px}
.fn .cap svg{color:var(--dim);margin-top:0}
.fn .capsep{color:var(--faint)}


/* ---------- functionality popover ---------- */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow-sm);padding:12px}
.fnpop{width:266px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px 9px;
  align-items:center}
.pop label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint)}
.pop select,.pop input{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.pop .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pop .hint{grid-column:2;font-size:10.5px;color:var(--faint);line-height:1.35}
.pop .foot{grid-column:1/-1;display:flex;justify-content:flex-end;padding-top:2px}
.tog{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:500;color:var(--dim);
  background:var(--hover)}
.tog:hover{color:var(--ink)}
.tog.on{background:var(--ink);color:var(--panel)}
.tog.act.on{background:var(--act)}

/* ---------- sections in the stack ---------- */
/* ---------- comments ---------- */
#railL .g-item{position:relative}
#railL .g-item .cn{position:absolute;right:8px;top:10px;display:inline-flex;align-items:center;
  gap:3px;font-size:10.5px;font-weight:600;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:2px 6px;line-height:1;
  font-variant-numeric:tabular-nums}
#railL .g-item .cn svg{opacity:.85}
#railL .g-item .more ~ .cn,#railL .g-item.on .cn{right:8px}

.markers{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;margin-bottom:12px;
  border:1px solid var(--line);border-radius:var(--radius-sm);color:var(--dim);font-size:12px;
  background:var(--panel)}
.markers .l{flex:1;text-align:left}
.markers svg{color:var(--faint);flex:none}
.markers .sw{flex:none;width:28px;height:16px;border-radius:999px;background:var(--line-2);
  position:relative;transition:background .14s var(--ease)}
.markers .sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;
  border-radius:50%;background:var(--panel);box-shadow:var(--shadow-1);
  transition:transform .14s var(--ease)}
.markers:hover{border-color:var(--line-2);color:var(--ink)}
.markers.on{color:var(--ink);border-color:var(--accent-soft);background:var(--accent-soft)}
.markers.on svg{color:var(--accent)}
.markers.on .sw{background:var(--accent)}
.markers.on .sw:after{transform:translateX(12px)}

/* ---------- zoom ---------- */
.zoom{margin-left:auto;display:inline-flex;align-items:center;gap:1px;flex:none;
  border:1px solid var(--line);border-radius:999px;padding:1px;background:var(--panel)}
.zb{display:inline-flex;align-items:center;justify-content:center;width:22px;height:20px;
  border-radius:999px;color:var(--faint)}
.zb:hover{color:var(--ink);background:var(--hover)}
.zpct{font-size:11px;font-variant-numeric:tabular-nums;color:var(--dim);min-width:38px;
  height:20px;border-radius:999px;padding:0 4px}
.zpct:hover{color:var(--ink);background:var(--hover)}
#pagehead .sub{align-items:center}

.csum{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);margin-bottom:8px}
.cgroup{margin-bottom:14px}
.cg-h{display:flex;align-items:baseline;gap:6px;width:100%;text-align:left;font-size:12px;
  font-weight:600;color:var(--ink);padding:4px 6px;margin:0 -6px 4px;border-radius:var(--radius-sm);
  line-height:1.35}
.cg-h .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cg-h .o{flex:none;font-size:10px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);border-radius:999px;padding:1px 6px}
.cg-h:hover{background:var(--hover)}
.cg-h.static{font-weight:500;color:var(--dim);cursor:default}
.cg-h.static:hover{background:none}
.cgroup.orphan .tc{opacity:.75}

.sec-title{font-size:15px;font-weight:650;letter-spacing:-.012em;text-align:center;margin:0;
  padding:3px 8px;border-radius:var(--radius-sm);color:var(--ink)}
.sec-title:hover{background:var(--hover)}
.sec-title:focus{outline:none;background:var(--accent-soft)}
.sec-note{font-size:11px;color:var(--dim);text-align:center;font-style:italic;line-height:1.4;
  padding:2px 6px;border-radius:5px}
.blurb{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}
.sec-note:hover{background:var(--hover)}
.sec-note:focus{outline:none;background:var(--accent-soft);font-style:normal;color:var(--ink)}
.sec-note.none{color:var(--faint)}
.sub{position:relative;border-top:1px solid var(--line-2);margin-top:5px;padding-top:10px}
.sub-t{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--dim);text-align:center;padding:1px 4px;border-radius:4px}
.sub-t:focus{outline:none;background:var(--accent-soft)}
.ref{border:1px dashed var(--line-2);border-radius:var(--radius-sm);padding:8px 11px;font-size:11.5px;
  color:var(--dim);text-align:center;line-height:1.45}
.ref:focus{outline:none;background:var(--accent-soft)}
/* A heading's label is editable text, and a reference's is a click target —
   grabbing either one directly to drag is what a browser reads as starting a
   text selection instead, so dragging the row underneath never fires. A grip
   is a place that is neither: nothing to select, nothing to click, only to
   drag — the same fix .dcard already uses for an editable, draggable title. */
.sub .grip{position:absolute;left:6px;top:6px;color:var(--faint);cursor:grab;display:flex}
.sub:hover .grip{color:var(--dim)}
.ref .grip{position:absolute;left:4px;top:2px;color:var(--faint);cursor:grab;display:flex}
.ref:hover .grip{color:var(--dim)}
.rawblock{position:relative;padding:6px 26px 6px 8px;border-radius:4px;background:var(--panel)}
.rawblock .text{white-space:pre;overflow-x:auto;font:10.5px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--faint);outline:none;border-radius:3px}
.rawblock .text:focus{background:var(--accent-soft)}
.rawblock .x{position:absolute;right:4px;top:4px;color:var(--faint);font-size:14px;line-height:1;
  padding:1px 4px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.rawblock:hover .x{opacity:1}
.rawblock .x:hover{color:var(--act);background:var(--action-soft)}


/* ---------- right panel ---------- */
/* The rail is resizable, so no padding value can make five labels fit at every
   width. Scrolling is the only thing that cannot clip. */
#railR .ptabs{flex:none;display:flex;gap:0;padding:10px 8px 0;border-bottom:1px solid var(--line);
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#railR .ptabs::-webkit-scrollbar{display:none}
/* One line of text per tab, always. A count that wraps under its label lifts
   that label off the baseline the others sit on, and four tabs stop reading as
   one row. It goes beside the word instead, where it is read as part of it. */
#railR .ptabs button{display:flex;align-items:baseline;gap:3px;white-space:nowrap;flex:none;
  padding:6px 5px;border-radius:7px 7px 0 0;color:var(--dim);font-size:11.5px;
  font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
#railR .ptabs button .n{font-size:10.5px;font-weight:600;color:var(--faint);
  font-variant-numeric:tabular-nums}
#railR .ptabs button:hover{color:var(--ink)}
#railR .ptabs button.on{color:var(--ink);border-bottom-color:var(--ink)}
#railR .ptabs button.on .n{color:var(--dim)}
#railR .pbody{flex:1;overflow-y:auto;padding:14px 14px 40px}
.ctx{margin-bottom:15px}
.ctx-h{display:flex;align-items:center;gap:5px;margin-bottom:3px}
.ctx-h .lb{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint)}
.ctx-h .info{color:var(--faint);display:flex;padding:1px;border-radius:4px}
.ctx-h .info:hover{color:var(--ink);background:var(--hover)}
.ctx-add{margin-left:auto;font-size:11.5px;color:var(--faint);padding:1px 5px;border-radius:5px}
.ctx-add:hover{color:var(--ink);background:var(--hover)}
.means{font-size:11.5px;line-height:1.5;color:var(--dim);background:var(--hover);
  border-radius:7px;padding:7px 9px;margin-bottom:5px}
.ctx-empty{font-size:12.5px;color:var(--faint);font-style:italic;line-height:1.5;padding:3px 0}
.ctx-empty.unknown{color:var(--flag);font-style:normal;font-weight:500}
.gnotes{display:flex;flex-direction:column;gap:4px}
.gnote{position:relative;background:var(--hover);border-radius:8px;padding:6px 24px 6px 9px;
  font-size:12.5px;line-height:1.5}
.gnote .t{border-radius:4px}
.gnote .t:focus{outline:none;background:var(--accent-soft)}
.gnote .x{position:absolute;right:5px;top:4px;color:var(--faint);font-size:13px;line-height:1;
  padding:1px 3px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.gnote:hover .x{opacity:1}
.gnote .x:hover{color:var(--act);background:var(--action-soft)}
.ctx dt{font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:var(--faint);margin-bottom:2px}
.ctx dd{margin:0;font-size:12.5px;line-height:1.5;padding:3px 6px;margin-left:-6px;border-radius:7px}
.ctx dd:hover{background:var(--hover)}
.ctx dd:focus{outline:none;background:var(--accent-soft)}
.ctx dd.unknown{color:var(--flag);font-weight:500}
.ctx dd.empty{color:var(--faint);font-style:italic}
.ctx dd a{color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--hover);
  border-radius:6px;padding:2px 5px 2px 8px;color:var(--ink)}

.chip .x{color:var(--faint);font-size:13px;line-height:1;padding:0 1px}
.chip .x:hover{color:var(--act)}
.chip.add{background:transparent;border:1px dashed var(--line);color:var(--faint);padding:2px 8px}
.chip.add:hover{color:var(--ink);border-color:var(--dim)}
.chip input{background:transparent;border:0;color:inherit;width:13ch;outline:none;font-size:11.5px}
.chip .nm{border-radius:4px;padding:0 2px;margin:0 -2px}
.chip .nm:focus{outline:none;background:var(--panel);color:var(--ink)}
.addfield{margin-top:8px;font-size:11.5px}
.addfield button{color:var(--faint);margin-right:12px}
.addfield button:hover{color:var(--ink);text-decoration:underline}
.linkrow{display:block;width:100%;text-align:left;padding:7px 8px;border-radius:8px;
  font-size:12.5px;line-height:1.45}
.linkrow:hover{background:var(--hover)}
.linkrow .n{font-weight:500;color:var(--accent)}
.linkrow .m{color:var(--faint);font-size:11.5px;display:block;margin-top:1px}

/* ---------- comments: working material, switchable off ---------- */
#comments{display:inline-flex;align-items:center;gap:5px}
#comments .n{font-variant-numeric:tabular-nums;font-size:11.5px}
#comments .n:empty{display:none}
.bubble{display:inline-flex;align-items:center;gap:3px;flex:none;padding:1px 4px;border-radius:6px;
  font-size:10px;font-weight:600;color:var(--faint);line-height:1;margin-left:2px}
.bubble svg{color:currentColor}
.bubble:hover{background:var(--hover);color:var(--ink)}
.bubble.has{color:var(--flag);background:var(--unanswered-soft)}
.bubble.done{color:var(--ok)}
.bubble.none{opacity:0}
.item:hover .bubble.none,.rowsel .bubble.none{opacity:.5}
.item:hover .bubble.none:hover{opacity:1}
.thread{width:296px;display:block}
.tlist{max-height:230px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin:5px 0 9px}
.tc{display:flex;align-items:flex-start;gap:7px;padding:6px 7px;border-radius:8px;
  background:var(--hover);font-size:12.5px;line-height:1.5}
/* Resolved is the same card, not a different one: same size, same padding,
   same two-icon layout — only the text recedes. A blanket opacity used to
   wash out the tick along with it, so the one signal that says "resolved"
   read as faint instead of confident; muting just the text keeps the green
   checkmark exactly as clear as the open circle it replaced. */
.tc.done{background:var(--tint)}
.tc.done .t{color:var(--faint);text-decoration:line-through;text-decoration-color:var(--line-2)}
.tc .t{flex:1;min-width:0;border-radius:4px;padding:0 2px}
.tc .t:focus{outline:none;background:var(--panel)}
.tc .tick{flex:none;color:var(--faint);padding:1px;border-radius:5px;display:flex;margin-top:1px}
.tc .tick:hover{color:var(--ink);background:var(--hover)}
.tc .tick.on{color:var(--ok)}
.tc .x{flex:none;color:var(--faint);font-size:14px;line-height:1;padding:0 3px;border-radius:4px;
  opacity:0;transition:opacity .1s var(--ease)}
.tc:hover .x{opacity:1}
.tc .x:hover{color:var(--act);background:var(--action-soft)}
.tnew{width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:12.5px;resize:vertical;min-height:44px;line-height:1.45}
.tnew:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.tfoot{display:flex;align-items:center;justify-content:flex-end;gap:9px;margin-top:7px}
.tfoot .hint{font-size:11px;color:var(--faint)}

/* ---------- asked in the app, never by the browser ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--scrim);
  display:flex;align-items:center;justify-content:center;padding:24px;
  animation:fade .12s var(--ease)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.dialog{background:var(--panel);border-radius:14px;padding:20px;width:400px;max-width:100%;
  box-shadow:var(--shadow-pop)}
.dialog h2{font-size:15.5px;font-weight:600;margin:0 0 6px;letter-spacing:-.01em}
.dialog p{font-size:13px;line-height:1.55;color:var(--dim);margin:0 0 14px}
.dialog input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-size:13.5px;margin-bottom:14px}
.dialog input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.dfoot{display:flex;justify-content:flex-end;gap:8px}
.dfoot .btn{padding:7px 14px;border-radius:9px}
.dfoot .btn:not(.primary):not(.danger){background:var(--hover);color:var(--ink)}
.dfoot .btn.danger{background:var(--act);color:var(--panel)}

/* ---------- what just happened, and how to take it back ---------- */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:30;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;background:var(--ink);
  color:var(--panel);font-size:12.5px;padding:8px 10px 8px 14px;border-radius:10px;
  box-shadow:var(--shadow-toast);animation:rise .14s var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.toast.going{opacity:0;transition:opacity .4s var(--ease)}
.toast button{color:var(--accent-line);font-weight:500;padding:2px 4px;border-radius:5px}
.toast button:hover{color:var(--panel);background:var(--line)}
.toast .x{color:var(--faint);font-size:15px;line-height:1}

/* ---------- capture ---------- */
#cap{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--panel);
  border-top:1px solid var(--line);padding:12px 30px;box-shadow:var(--shadow-palette)}
#cap .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
#cap input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px}
#cap .where{font-size:12px;color:var(--faint);white-space:nowrap}
#cap .tally{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- right rail: sources ---------- */
.src{padding:9px 10px;border-radius:9px;margin-bottom:2px}
.src:hover{background:var(--hover)}
.src .h{font-weight:500;display:flex;align-items:baseline;gap:6px}
.src .h .n{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;margin-left:auto}
.src .t{font-size:12.3px;color:var(--dim);line-height:1.4;margin-top:1px}
.src .u{font-size:11.5px;color:var(--faint);word-break:break-all;margin-top:2px;display:block}
.src.bad .h{color:var(--flag)}
.src .cites{font-size:11.5px;color:var(--faint);margin-top:4px;line-height:1.5}
.rail-empty{color:var(--faint);font-size:12.5px;padding:6px 10px;line-height:1.5}

.srcform{padding:8px 10px;background:var(--hover);border-radius:9px;margin:4px 0 8px}
.srcform input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);margin-bottom:5px;font-size:12.5px}
.srcform-foot{display:flex;gap:8px;align-items:center;margin-top:2px}
.src .h{align-items:center}
.src .title{font-weight:500;text-align:left;flex:1;min-width:0}
.src .copybtn{display:flex;flex:none;color:var(--faint);padding:2px;border-radius:5px}
.src .copybtn:hover{color:var(--ink);background:var(--hover)}
.src .copybtn.copied{color:var(--ok)}
.src .x{color:var(--faint);font-size:14px;line-height:1;padding:0 3px;flex:none}
.src .x:hover{color:var(--act)}
.src .quiet{margin-top:4px;display:block}

/* ---------- design ---------- */
.dcard{padding:9px 10px;border-radius:9px;margin-bottom:4px;border:1px solid var(--line);
  position:relative;background:var(--panel)}
.dcard:hover{border-color:var(--dim)}
.dcard.lifting{opacity:.4}
.dcard.dropbefore{box-shadow:inset 0 2px 0 var(--accent)}
.dcard.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.dcard .h{display:flex;align-items:center;gap:6px}
.dcard .grip{color:var(--faint);display:flex;cursor:grab;flex:none;margin-left:-3px}
.dcard:hover .grip{color:var(--dim)}
.dcard .title{font-weight:500;text-align:left;flex:1;min-width:0;padding:1px 3px;
  margin-left:-3px;border-radius:4px;color:var(--ink)}
.dcard .title:hover{background:var(--hover)}
.dcard .title:focus{outline:none;background:var(--accent-soft)}
.dcard .x{margin-left:auto;color:var(--faint);font-size:14px;line-height:1;padding:0 3px;
  border-radius:4px}
.dcard .x:hover{color:var(--act);background:var(--action-soft)}
.dcard .u{font-size:11.5px;color:var(--faint);word-break:break-all;display:block;margin-top:2px;
  text-align:left;padding:0}
.dcard .u:hover{color:var(--accent)}
.sidebyside{display:inline-flex;align-items:center;gap:6px;margin-top:7px;font-size:11.5px;
  color:var(--accent);padding:4px 8px;border-radius:7px;background:var(--accent-soft);
  font-weight:500}
.sidebyside:hover{filter:brightness(.96)}
.sidebyside svg{color:currentColor}

/* ---------- the guide and what it became, on one screen ---------- */
.beside{display:grid;grid-template-columns:minmax(0,564px) 11px minmax(0,1fr);
  height:100%;min-height:0}
.bside{display:flex;flex-direction:column;min-height:0;min-width:0;
  border:1px solid var(--line);border-radius:11px;background:var(--panel);overflow:hidden}
/* The divider between the two panes — a drag handle standing in for the old
   fixed gap, so the split is a choice rather than a constant. */
.bdrag{cursor:col-resize;position:relative}
.bdrag:before{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--line);transform:translateX(-50%)}
.bdrag:hover:before,.bdrag.active:before{background:var(--line-2);width:2px}
.bhead{flex:none;display:flex;align-items:baseline;gap:9px;padding:9px 13px;
  border-bottom:1px solid var(--line)}
.bhead .n{font-weight:600;font-size:13px;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bhead .m{font-size:11.5px;color:var(--faint);margin-left:auto;white-space:nowrap}
/* The Figma pane is where you leave beside view from — the design side is
   what you came to check, so closing it back out belongs next to the link
   that took you there in the first place, not on the guide you are keeping. */
.bclose{color:var(--dim);font-size:11.5px;font-weight:500;white-space:nowrap;
  padding:4px 9px;border-radius:7px}
.bclose:hover{color:var(--ink);background:var(--hover)}
.bscroll{flex:1;overflow:auto;min-height:0;padding:14px 10px 24px}
/* Three lanes at full width are wider than half a screen, so the copy beside
   the design is drawn tighter. It is the same guide, read at arm's length. */
/* No cap here: on a window too narrow for the lanes the pane scrolls rather
   than cutting the functionality off the right-hand edge. */
.bscroll .guide{--lane-l:150px; --stack:232px; --lane-r:158px;font-size:12px;max-width:none;
  grid-template-columns:minmax(118px,1.05fr) minmax(232px,1.5fr) minmax(126px,1.15fr)}
.bscroll .lbl{font-size:11.5px}
.bscroll .eg,.bscroll .note,.bscroll .fn{font-size:10.5px}
.bscroll .sec-title{font-size:11.5px}
.bscroll .sec-note{font-size:10px}
.bscroll .lanelbl{font-size:8.5px}
.bscroll .item.visual .box{min-height:56px}
.bscroll .item.visual.chart .box{min-height:64px}
.bframe{flex:1;border:0;width:100%;min-height:0;background:var(--bg)}
body.is-paired #stage{padding:16px 20px;overflow:hidden}

/* ---------- users ---------- */
.usr{margin:0 0 26px}
.usr-h{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid var(--line);
  padding-bottom:6px;margin-bottom:4px}
.usr-h .n{font-size:16.5px;font-weight:600;letter-spacing:-.01em}
.usr-h .m{font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.usr-h .btn{margin-left:auto}
#userbar{display:flex;align-items:center;gap:8px;padding:7px 16px;background:var(--accent-soft);
  border-bottom:1px solid var(--line);font-size:12.5px}
#userbar b{font-weight:600}

/* ---------- flow ---------- */
#flow{width:100%;overflow:auto}
#flow svg{display:block}
.node rect{fill:var(--panel);stroke:var(--line);stroke-width:1}
.node.on rect{stroke:var(--accent);stroke-width:2}
.node:hover rect{fill:var(--hover)}
.node text{font-size:12.5px;font-weight:500;fill:var(--ink)}
.node text.m{font-size:11px;fill:var(--faint);font-weight:400}
.node text.o{font-size:11px;fill:var(--flag);font-weight:600}
.edge{fill:none;stroke:var(--line-2);stroke-width:1.5;transition:opacity .12s var(--ease)}
/* Picking a card recedes everything it is not connected to, so the lines that
   matter do not have to fight a page full of equally grey ones for attention. */
svg.has-sel .edge:not(.hot){opacity:.3}
.edge.ref{stroke-dasharray:5 4;stroke:var(--line-2)}
/* After .ref, not before it — a reference edge that is also the selected
   one has to win the tie on stroke colour, or "hot" silently means "route
   only" and a reference never visibly highlights at all. */
.edge.hot{stroke:var(--accent);stroke-width:2}
.elabel{font-size:10.5px;fill:var(--faint)}

/* ---------- open items ---------- */
.oi{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px;
  border-bottom:1px solid var(--line)}
.oi:hover{background:var(--hover)}
.oi .t{font-weight:500}
.oi.act .t{color:var(--act)}
.oi.unk .t{color:var(--flag)}
/* ---- the list views — Open and Users — as cards: a band per guide or group, a row per item */
.listwrap{max-width:920px}
.listhead{margin-bottom:16px}
.fbar .grow{flex:1}
.fpill b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;margin-left:2px}
.fpill.on b{color:var(--accent-ink)}
.segctl{display:inline-flex;background:var(--hover);padding:3px;border-radius:9px;gap:2px}
.segctl button{padding:5px 12px;border-radius:7px;font-size:12.5px;font-weight:500;color:var(--dim)}
.segctl button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-1)}
.listsec{margin:0 0 30px}
.listsec-h{display:flex;align-items:baseline;gap:8px;margin:0 0 8px}

<!-- Plain, non-module script: runs before the module below is even parsed.
     Chromium blocks ES module imports over the file: origin (CORS), so the
     module's own boot()/file:// check never gets a chance to run when this
     page is opened by double-clicking it. This check has no dependency on
     the module loading, so it can still show the explanation. -->
<script>
(function () {
  if (location.protocol === 'file:') {
    document.body.innerHTML =
      '<div id="banners"><div class="banner err" style="border-bottom:none">' +
      '<b>Opened as a file, not over http.</b> Run <code>./serve.sh</code> and open ' +
      '<code>http://localhost:8044</code>.</div></div>';
  }
})();
</script>

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;

};
function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

const FIELD_LABELS = {
  type: 'Type', userGoal: 'User goal', businessGoal: 'Business goal',
  primaryUsers: 'Primary users', notes: 'Notes', sources: 'Sources'
};
// A blank is not the same as ??. Blank means the question does not apply here;
// ?? means nobody has been asked. Neither is ever normalised into the other.
const FIELD_PLACEHOLDER = {
  type: 'Screen', userGoal: 'What is someone trying to get done here?',
  businessGoal: 'Why does the business want this screen to work?',
  primaryUsers: 'Who uses it, and who uses it most?',
  notes: 'Screen-wide context only', sources: 'Cite a source with [handle]'
};

const S = {
  dir: null, files: [], file: null, originalText: '', doc: null,
  readOnly: false, dirty: false,
  // The folder's fields file, read beside the guides file: objects and the fields they hold.
  ffile: null, fdoc: null, fOriginal: '', fDirty: false, fReadOnly: false, fieldFilter: 'all',
  guide: null, sel: null, editing: null,
  view: 'guide', present: false,
  // Notes beside every block, or only beside the blocks you open.

  theme: 'system',

  // until first touched (renderFlow then defaults it to the open guide);
  // null means picked, then explicitly cleared.
  flowSel: undefined
};
// Restored before the first render: a guide that snaps from 100% to 70% after
// it has already been read once is worse than not remembering at all.
try {
  const z = parseFloat(localStorage.getItem('pg-zoom'));
  if (z > 0) { S.zoom = z; document.documentElement.style.setProperty('--zoom', String(z)); }
} catch { /* private window, or site data blocked */ }
// The right panel's width and open/closed state are a seating preference, not
// document content — they belong to the browser, not the file on disk.
try {
  const w = parseFloat(localStorage.getItem('pg-railr-w'));
  if (w >= 260 && w <= 520) S.railRWidth = w;
} catch { /* private window, or site data blocked */ }
try { S.notesHidden = localStorage.getItem('pg-notes') === 'hidden'; } catch { /* private window */ }
try {
  S.railRCollapsed = localStorage.getItem('pg-railr-collapsed') === '1';
  const th = localStorage.getItem('pg-theme');
  if (th === 'light' || th === 'dark') S.theme = th;
} catch { /* private window, or site data blocked */ }

  S.railRWidth = Math.max(260, Math.min(520, w));

/**
 * The panel is 340px, the largest single cost on a laptop screen, so below
 * 1280px it starts folded. Opening it there keeps it open for this session;
 * folding it is remembered as always.

function railRFolded() {
  return S.railRCollapsed || (innerWidth < 1280 && !S.railRNarrowOpen);

  if (!v && innerWidth < 1280) S.railRNarrowOpen = true;
  if (v) S.railRNarrowOpen = false;

    if (v) localStorage.setItem('pg-railr-collapsed', '1');
    else localStorage.removeItem('pg-railr-collapsed');
  } catch { /* private window */ }
  render();
}

// ---------------------------------------------------------------- storage
const DB = 'priority-guide';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const t = db.transaction('kv').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result);
      t.onerror = () => res(undefined);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  // Never let a storage failure break the thing the user actually asked for.
  // Remembering the folder is a convenience; opening it is the job.
  try {
    const db = await idb();
    await new Promise((res) => {
      const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => res(); t.onsuccess = () => res();
    });
  } catch { /* not persistable in this context */ }
}
/** Ten-deep backup ring, so a bad save is always recoverable. */
async function backup(name, text) {
  const ring = (await kvGet('backups')) || [];
  ring.unshift({ name, text, at: new Date().toISOString() });
  await kvSet('backups', ring.slice(0, 10));
}

// ---------------------------------------------------------------- undo
/**
 * Deleting is one click, and always recoverable.
 *
 * A confirm box asks a question the answer to which is nearly always yes, and
 * makes the common case cost two clicks to protect against the rare one. Undo
 * inverts that: the common case is instant, and the rare mistake is one click
 * back. It also means nothing in this app needs a browser dialog.
 */
function undoable(label, undo) {
  S.undo = { label, undo, at: Date.now() };
  toast(`${label} deleted`, 'Undo', () => {
    const u = S.undo;
    S.undo = null;
    if (u) u.undo();
    mark(); render();
  });
}

/** A quiet line that says what happened and how to take it back. */
function toast(text, actionLabel, action) {
  const host = $('toasts');
  host.innerHTML = '';
  const t = el('div', 'toast');
  t.appendChild(el('span', null, text));
  if (actionLabel) {
    const b = el('button', null, actionLabel);
    b.onclick = () => { t.remove(); action(); };
    t.appendChild(b);
  }
  const x = el('button', 'x', '×');
  x.title = 'Dismiss';
  x.onclick = () => t.remove();
  t.appendChild(x);
  host.appendChild(t);
  setTimeout(() => { if (t.isConnected) t.classList.add('going'); }, 7000);
  setTimeout(() => t.remove(), 7400);
  return t;
}
