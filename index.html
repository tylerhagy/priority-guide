<!doctype html>
<meta charset="utf-8">
<title>priority guide</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --ink:#16181d; --dim:#6b7280; --faint:#9aa1ac;
  --line:rgba(16,18,22,.11); --hover:rgba(16,18,22,.05);
  --bg:#f6f7f9; --panel:#fff; --accent:#2563eb; --accent-soft:rgba(37,99,235,.10);
  --ok:#177245; --warn:#9a6700; --none:#8a8f98; --flag:#b8541f; --act:#b3261e;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:13.5px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- header ---------- */
#bar{display:flex;align-items:center;gap:12px;height:52px;padding:0 14px;
  background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6}
#bar .brand{font-weight:600;letter-spacing:-.01em;white-space:nowrap}
#bar .file{color:var(--dim);white-space:nowrap;max-width:28ch;cursor:pointer;padding:4px 8px;
  border-radius:7px;display:flex;align-items:center;gap:6px}
#bar .file span{overflow:hidden;text-overflow:ellipsis}
#bar .file svg{color:var(--faint);flex:none}
#bar .file:hover svg{color:var(--ink)}
#bar .file:hover{background:var(--hover);color:var(--ink)}
#bar .spacer{flex:1}
.tabs{display:flex;gap:2px;background:var(--hover);padding:3px;border-radius:9px}
.tabs button{padding:5px 12px;border-radius:7px;color:var(--dim);font-size:12.5px;font-weight:500;white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.btn{padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:500;color:var(--dim);white-space:nowrap}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.on{background:var(--ink);color:var(--panel)}
.btn.on:hover{background:var(--ink);filter:brightness(1.35)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.4;pointer-events:none}
.count{color:var(--dim);font-size:12.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:600;color:var(--flag)}
.count.clear b{color:var(--ok)}
.quiet{color:var(--faint);font-size:12px}
.quiet:hover{color:var(--dim);text-decoration:underline}

/* ---------- banners ---------- */
#banners{position:sticky;top:52px;z-index:5}
.banner{padding:9px 16px;font-size:12.5px;border-bottom:1px solid var(--line)}
.banner.err{background:#fdf1ef;color:#8a2d16}
.banner.warn{background:#fdf8ec;color:#7a5b00}
.banner.info{background:#eef4ff;color:#1b3f8f}
.banner b{font-weight:600}
.banner code{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;background:rgba(0,0,0,.05);padding:1px 4px;border-radius:4px}
.banner button{margin-left:10px;text-decoration:underline}

/* ---------- layout ---------- */
main{height:calc(100% - 52px);display:flex;overflow:hidden}
#railL{width:214px;flex:none;border-right:1px solid var(--line);background:var(--panel);
  overflow-y:auto;padding:14px 10px 40px}
#railR{width:296px;flex:none;border-left:1px solid var(--line);background:var(--panel);
  display:flex;flex-direction:column;min-height:0}
#mid{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
#stage{flex:1;overflow-y:auto;padding:22px 30px 40px;min-width:0}
.wrap{max-width:760px;margin:0 auto}

/* ---------- page header: which guide, always ---------- */
#pagehead{flex:none;padding:16px 30px 12px;border-bottom:1px solid var(--line);
  background:var(--panel)}
#pagehead .headline{display:flex;align-items:center;gap:8px}
#pagehead h1{font-size:21px;font-weight:600;letter-spacing:-.02em;margin:0;line-height:1.25;
  padding:2px 6px;margin-left:-6px;border-radius:7px;min-width:2ch}
#pagehead .nav{color:var(--dim);padding:4px;border-radius:8px;display:flex}
#pagehead .nav:hover{background:var(--hover);color:var(--ink)}
#pagehead .nav[disabled]{opacity:.25;pointer-events:none}
#pagehead .count{color:var(--faint);font-size:12.5px;font-variant-numeric:tabular-nums;margin-left:2px}
#pagehead h1:hover{background:var(--hover)}
#pagehead h1:focus{outline:none;background:var(--accent-soft)}
#pagehead .sub{margin-top:4px;font-size:12.5px;color:var(--dim);display:flex;gap:8px;
  align-items:center;flex-wrap:wrap}
#pagehead .sub .who{color:var(--ink)}
#pagehead .sub .dot{color:var(--faint)}
#pagehead .sub .open{color:var(--flag);font-weight:500}

/* ---------- bottom toolbar: the creator tools ---------- */
#tools{flex:none;display:flex;align-items:center;gap:6px;padding:9px 30px;
  border-top:1px solid var(--line);background:var(--panel);font-size:12.5px}
#tools .lbl{color:var(--faint);margin-right:2px}
#tools .into{margin-left:auto;color:var(--faint);display:flex;align-items:center;gap:6px}
#tools .into select{border:1px solid var(--line);border-radius:7px;padding:3px 6px;
  background:var(--panel);max-width:22ch}
.tool{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:8px;
  color:var(--dim);font-weight:500}
.tool:hover{background:var(--hover);color:var(--ink)}
.tool svg{color:var(--faint)}
.tool:hover svg{color:var(--ink)}

body.present #railL,body.present #railR,body.present #tools{display:none}
body.present #pagehead{padding:22px 30px 16px}
body.present #pagehead h1{font-size:28px}
body.present #stage{padding:30px 30px 90px}
body.present{font-size:15px}
body.present .sec-title{font-size:15.5px}

/* ---------- left rail: guides ---------- */
.rail-h{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);padding:0 8px 7px}
.g-item{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--dim);line-height:1.35;position:relative;cursor:pointer}
.g-item:hover{background:var(--hover);color:var(--ink)}
.g-item.on{background:var(--accent-soft);color:var(--ink)}
.g-item .n{font-weight:500;display:block;padding:1px 3px;margin-left:-3px;border-radius:4px}
.g-item .n:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.gmore{position:absolute;right:5px;top:5px;padding-left:12px;
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.g-item.on .gmore{background:linear-gradient(90deg,transparent,#e7edfb 40%)}
.g-item.dragging{opacity:.4}
.g-item.dropat{box-shadow:inset 0 2px 0 var(--accent)}
.g-item.dropafter{box-shadow:inset 0 -2px 0 var(--accent)}
.g-item .m{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.g-item.on .m{color:var(--dim)}
.g-item .m .o{color:var(--flag);font-weight:600}
.rail-add{margin-top:6px;width:100%;text-align:left;padding:7px 9px;border-radius:8px;
  color:var(--faint);font-size:12.5px}
.rail-add:hover{background:var(--hover);color:var(--ink)}

.g-title{font-size:23px;font-weight:600;letter-spacing:-.02em;margin:0 0 3px;line-height:1.25}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:99px;
  font-size:11px;font-weight:500;white-space:nowrap;background:var(--hover);color:var(--dim)}
.pill.dead{background:rgba(184,84,31,.12);color:var(--flag)}

/* ---------- the guide: three lanes ----------
   The middle is the guide itself — what each thing is called, and what its data
   actually looks like. Notes annotate it from the left, functionality from the
   right, each on a dotted leader to the one row it describes. */
.guide{--lane-l:264px; --stack:340px; --lane-r:270px;
  display:grid;grid-template-columns:var(--lane-l) var(--stack) var(--lane-r);
  margin:0 auto;width:max-content;max-width:100%}
body.present .guide{--lane-l:300px; --stack:400px; --lane-r:320px}

/* Every row is a grid row so an annotation lines up with the one item it
   annotates. The stack reads as one continuous column because each middle cell
   carries the side borders and the ends carry the caps. */
.cell{grid-column:2;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);
  background:var(--panel);padding:0 10px;display:flex;flex-direction:column}
.cell.top{border-top:1.5px solid var(--ink);padding-top:10px}
.cell.bot{border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.cell.gap{height:10px}
.band{background:var(--hover);padding:0 12px;flex:1;display:flex;flex-direction:column}
.band.open{padding-top:9px;border-radius:2px 2px 0 0}
.band.close{padding-bottom:9px;border-radius:0 0 2px 2px}
.band > *{margin-bottom:6px}
.band.close > *:last-child{margin-bottom:0}
.lane{display:flex;align-items:flex-start;min-height:1px;position:relative}
.lane-l{grid-column:1;justify-content:flex-end}
.lane-r{grid-column:3}
.lead{flex:none;width:20px;border-top:1px dotted var(--faint);margin-top:12px}

/* ---------- one row in the stack ---------- */
.item{padding:2px 0}
.item .box{border:1px solid var(--ink);background:var(--panel);border-radius:2px;
  padding:3px 8px;display:flex;align-items:center;gap:6px;min-height:24px}
.item.plain .box,.item.linky .box{border-color:transparent;background:transparent;padding-left:2px}
.item.linky .lbl{text-decoration:underline;text-underline-offset:2px}
.item.visual .box{border-style:dashed;color:var(--dim)}
.lbl{flex:1;min-width:0;font-size:12.5px;line-height:1.4;overflow-wrap:anywhere;
  padding:1px 3px;margin-left:-3px;border-radius:4px}
.lbl:hover{background:rgba(16,18,22,.06)}
.lbl:focus{outline:none;background:var(--accent-soft)}
.lbl .unk{color:var(--flag);font-weight:500}
.eg{font-size:11.5px;color:var(--dim);line-height:1.4;margin-top:2px;padding:1px 4px;
  margin-left:-1px;border-radius:4px;overflow-wrap:anywhere}
.eg:hover{background:rgba(16,18,22,.06)}
.eg:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.eg.none{color:var(--faint);font-style:italic}
.eg.unk{color:var(--flag);font-weight:500;font-style:normal}
.item .chev{flex:none;color:var(--dim)}
.rowsel .box{outline:2px solid var(--accent);outline-offset:1px}
.drag .item{opacity:.35}
.over .item{box-shadow:0 -2px 0 var(--accent)}
.over-b .item{box-shadow:0 2px 0 var(--accent)}
.flag{font-size:10.5px;color:var(--flag);line-height:1.4;margin-top:3px;padding-left:2px}

/* ---------- notes, on the left ---------- */
.notes{display:flex;flex-direction:column;align-items:flex-end;gap:3px;flex:1;min-width:0}
.note{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:3px 7px;font-size:11px;line-height:1.4;color:var(--dim);
  display:flex;gap:6px;align-items:flex-start;max-width:100%}
.note.act{border-color:rgba(179,38,30,.35);background:rgba(179,38,30,.05);color:var(--act)}
.nbody{min-width:0;flex:1;padding-right:2px}
.note .t{min-width:0;padding:0 2px;border-radius:3px}
.note .t:focus{outline:none;background:var(--accent-soft);color:var(--ink)}
.note .k{font-size:9px;font-weight:700;letter-spacing:.07em;color:var(--act);margin-bottom:1px}
.note .gl{flex:none;color:var(--faint);margin-top:1px}
.note.act .gl{color:var(--act)}
.note{position:relative}
/* Inside the card and out of flow: reachable without crossing a gap, and
   revealing them still cannot reflow the note or the row. */
.note .tools{position:absolute;right:2px;top:2px;display:flex;gap:1px;padding-left:10px;
  opacity:0;pointer-events:none;transition:opacity .1s var(--ease);
  background:linear-gradient(90deg,transparent,var(--panel) 40%)}
.note.act .tools{background:linear-gradient(90deg,transparent,#fdf3f2 40%)}
.note:hover .tools,.note:focus-within .tools{opacity:1;pointer-events:auto}
.note .tools button{color:var(--faint);font-size:11px;line-height:1;padding:1px 3px;border-radius:4px}
.note .tools button:hover{color:var(--ink);background:var(--hover)}
.note a{color:var(--accent)}
/* Out of flow, so hovering a row cannot move the row below it. */
.item{position:relative}
/* On the label line, which has slack — the example line under it does not. */
.rowtools{position:absolute;right:-2px;top:-3px;z-index:3;display:flex;gap:1px;align-items:center;
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:2px;
  opacity:0;pointer-events:none;transition:opacity .1s var(--ease);
  box-shadow:0 2px 8px rgba(0,0,0,.09)}
.item:hover .rowtools,.rowsel .rowtools,.rowtools:hover{opacity:1;pointer-events:auto}
.rowtools button{font-size:10.5px;color:var(--dim);padding:2px 6px;border-radius:5px;white-space:nowrap}
.rowtools button:hover{color:var(--ink);background:var(--hover)}
.rowtools button.ic{padding:3px;display:flex}
.rowtools button.ic svg{color:var(--dim)}
.rowtools button.ic:hover svg{color:var(--ink)}
.rowtools button[disabled]{opacity:.3;pointer-events:none}
.rowtools .kind{color:var(--ink);font-weight:500;border-left:1px solid var(--line);
  margin-left:2px;padding-left:8px}
.rowtools .more{opacity:1;padding:3px 4px}
.rowtools .kind:after{content:" ▾";color:var(--faint)}

/* ---------- a divider is a rule and nothing else ---------- */
.item.divider{padding:8px 0}
.item.divider .rule{border-top:1px solid var(--ink);opacity:.35}
.item .kindmark{color:var(--dim);flex:none}
.item.visual .box{align-items:flex-start}

/* ---------- one overflow button, everywhere ---------- */
.more{color:var(--faint);padding:3px;border-radius:6px;display:flex;align-items:center;
  opacity:0;transition:opacity .1s var(--ease)}
.more:hover,.more.open{color:var(--ink);background:rgba(16,18,22,.09)}
.more.open{opacity:1}
.g-item:hover .more,.g-item:focus-within .more,
.cell.sechead:hover .more,.item:hover .more,.rowsel .more{opacity:1}
.secmore{position:absolute;right:10px;top:8px}
.cell.sechead{position:relative}
.menu{width:236px;padding:5px;display:flex;flex-direction:column;gap:1px}
.mitem{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:6px 8px;border-radius:8px}
.mitem:hover,.mitem:focus-visible{background:var(--hover);outline:none}
.mitem > div{flex:1;min-width:0}
.mitem svg{color:var(--dim);margin-top:1px;flex:none}
.mitem .n{font-size:12.5px;line-height:1.35}
.mitem .h{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.mitem[disabled]{opacity:.35;pointer-events:none}
.mitem.danger .n{color:var(--act)}
.mitem.danger svg{color:var(--act)}
.mitem.danger:hover{background:rgba(179,38,30,.08)}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ---------- what a block is ---------- */
.pop-h{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--faint);grid-column:1/-1;margin-bottom:1px}
.pop-h + *{margin-top:0}
.kindpop{width:296px}
.kindpop .pop-h{margin:10px 0 5px}
.kindpop .pop-h:first-child{margin-top:0}
.kinds{display:flex;flex-direction:column;gap:1px}
.kindopt{display:flex;align-items:flex-start;gap:9px;width:100%;text-align:left;
  padding:7px 8px;border-radius:8px}
.kindopt:hover{background:var(--hover)}
.kindopt.on{background:var(--accent-soft)}
.kindopt > div{flex:1;min-width:0}
.kindopt svg{color:var(--dim);margin-top:1px;flex:none}
.kindopt.on svg{color:var(--accent)}
.kindopt .n{font-size:12.5px;font-weight:500}
.kindopt .b{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.charts{display:grid;grid-template-columns:repeat(4,1fr);gap:2px}
.chartopt{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;
  border-radius:8px;font-size:9.5px;color:var(--dim);line-height:1.25;text-align:center;
  min-height:56px;justify-content:center}
.chartopt:hover{background:var(--hover);color:var(--ink)}
.chartopt.on{background:var(--accent-soft);color:var(--accent)}
.chartopt svg{color:currentColor}

/* ---------- choosing what a reference points at ---------- */
.refpop{width:300px}
.refpop input{width:100%;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.refpop .pop-h{margin:11px 0 5px}
.refpop .pop-h:first-child{margin-top:0}
.reflist{max-height:210px;overflow-y:auto;margin-top:5px;display:flex;flex-direction:column;gap:1px}
.refopt{width:100%;text-align:left;padding:6px 8px;border-radius:8px}
.refopt:hover{background:var(--hover)}
.refopt.on{background:var(--accent-soft)}
.refopt .n{font-size:12.5px;font-weight:500}
.refopt .m{font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.ref{position:relative}
.ref.unset{color:var(--faint);border-style:dashed}
.ref[role=button]{cursor:pointer}
.ref[role=button]:hover{border-color:var(--dim);color:var(--ink)}
.refx{position:absolute;right:4px;top:2px;color:var(--faint);font-size:13px;line-height:1;
  padding:1px 4px;border-radius:4px;opacity:0;transition:opacity .1s var(--ease)}
.ref:hover .refx{opacity:1}
.refx:hover{color:var(--act);background:rgba(179,38,30,.1)}
.addnote{opacity:0;font-size:11px;color:var(--dim);padding:3px 8px;border-radius:7px;
  border:1px dashed var(--line);background:var(--panel);transition:opacity .12s var(--ease);
  display:inline-flex;align-items:center;gap:4px}
.addnote svg{color:var(--faint)}
.lane-l:hover .addnote,.rowsel .addnote{opacity:1}
.addnote:hover{color:var(--ink);border-color:var(--dim);background:var(--hover)}
.addnote:hover svg{color:var(--ink)}
/* A brand-new note is a field, not a hairline. */
.note.fresh{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);min-width:190px}
.note.fresh .t{min-height:32px}

/* ---------- functionality, on the right ---------- */
.fn{border:1px solid var(--line);background:var(--panel);border-radius:6px;
  padding:4px 8px;font-size:11.5px;line-height:1.45;color:var(--ink);
  display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;max-width:100%}
.fn{cursor:pointer}
.fn:hover{border-color:var(--dim)}
.fn a.tgt:hover{text-decoration:underline}
.fn .l{display:flex;gap:6px;align-items:flex-start}
.fn .l svg{flex:none;color:var(--dim);margin-top:1px}
.fn .l b{font-weight:500}
.fn .tgt{color:var(--accent)}
.fn .tgt.dead{color:var(--flag)}
.fn .req{color:var(--act);font-weight:600}
.fn .caps{color:var(--dim);font-size:11px;letter-spacing:.01em}
.fn.empty{border-style:dashed;color:var(--faint);opacity:0;transition:opacity .12s var(--ease)}
.lane-r:hover .fn.empty,.rowsel .fn.empty{opacity:1}

/* ---------- functionality popover ---------- */
.pop{position:fixed;z-index:20;background:var(--panel);border:1px solid var(--line);
  border-radius:11px;box-shadow:0 8px 30px rgba(0,0,0,.14);padding:12px}
.fnpop{width:266px;display:grid;grid-template-columns:52px minmax(0,1fr);gap:7px 9px;
  align-items:center}
.pop label{font-size:10.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  color:var(--faint)}
.pop select,.pop input{width:100%;padding:4px 7px;border:1px solid var(--line);border-radius:7px;
  background:var(--panel);font-size:12.5px}
.pop .row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.pop .hint{grid-column:2;font-size:10.5px;color:var(--faint);line-height:1.35}
.pop .foot{grid-column:1/-1;display:flex;justify-content:flex-end;padding-top:2px}
.tog{padding:3px 8px;border-radius:7px;font-size:11px;font-weight:500;color:var(--dim);
  background:var(--hover)}
.tog:hover{color:var(--ink)}
.tog.on{background:var(--ink);color:var(--panel)}
.tog.act.on{background:var(--act)}

/* ---------- sections in the stack ---------- */
.sec-title{font-size:12.5px;font-weight:500;text-align:center;margin:0;padding:2px 6px;
  border-radius:5px}
.sec-title:hover{background:rgba(16,18,22,.06)}
.sec-title:focus{outline:none;background:var(--accent-soft)}
.sec-note{font-size:11px;color:var(--dim);text-align:center;font-style:italic;line-height:1.4;
  padding:2px 6px;border-radius:5px}
.blurb{font-size:12.5px;color:var(--dim);line-height:1.5;margin-top:3px}
.sec-note:hover{background:rgba(16,18,22,.06)}
.sec-note:focus{outline:none;background:var(--accent-soft);font-style:normal;color:var(--ink)}

<script type="module">
import {
  parseDocument, serializeDocument, verifyRoundTrip,
  guides, findGuide, tablesOf, rowsOf, allRows, countRows,
  openItems, links, backlinks, unreachable, sourceUsage, resolveSource,
  lintRow, addRow, touchRow, moveRow, moveSection, setField,
  addSection, addGuide, addSource, blankGuidesFile,
  parseContentCell, renderContentCell, parseCapabilities, renderCapabilities,
  parseLinkCell, renderLinkCell, parseFormCell, renderFormCell,
  parseNoteCell, renderNoteCell,
  parseUsers, renderUsers, userTypes, renameUserType, handleFor, isWebUrl, refsIn, hasAction,
  moveGuide, placeGuide, removeGuide, setKind, CHART_KINDS, BLOCK_KINDS,
  proseOf, setProse,
  LINK_TYPES, FORM_TYPES, CAPABILITIES, GUIDE_FIELDS
} from './parser.js';

const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
};
function esc(s) { const d = document.createElement('div'); d.textContent = String(s == null ? '' : s); return d.innerHTML; }

const FIELD_LABELS = {
  type: 'Type', userGoal: 'User goal', businessGoal: 'Business goal',
  primaryUsers: 'Primary users', notes: 'Notes', sources: 'Sources'
};
// A blank is not the same as ??. Blank means the question does not apply here;
// ?? means nobody has been asked. Neither is ever normalised into the other.
const FIELD_PLACEHOLDER = {
  type: 'Screen', userGoal: 'What is someone trying to get done here?',
  businessGoal: 'Why does the business want this screen to work?',
  primaryUsers: 'Who uses it, and who uses it most?',
  notes: 'Screen-wide context only', sources: 'Cite a source with [handle]'
};

const S = {
  dir: null, files: [], file: null, originalText: '', doc: null,
  readOnly: false, dirty: false,
  guide: null, sel: null, editing: null,
  view: 'guide', present: false, capture: false, captured: 0,
  userFilter: null, shownField: null
};

// ---------------------------------------------------------------- storage
const DB = 'priority-guide';
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
async function kvGet(k) {
  try {
    const db = await idb();
    return await new Promise((res) => {
      const t = db.transaction('kv').objectStore('kv').get(k);
      t.onsuccess = () => res(t.result);
      t.onerror = () => res(undefined);
    });
  } catch { return undefined; }
}
async function kvSet(k, v) {
  // Never let a storage failure break the thing the user actually asked for.
  // Remembering the folder is a convenience; opening it is the job.
  try {
    const db = await idb();
    await new Promise((res) => {
      const t = db.transaction('kv', 'readwrite').objectStore('kv').put(v, k);
      t.oncomplete = () => res(); t.onerror = () => res(); t.onsuccess = () => res();
    });
  } catch { /* not persistable in this context */ }
}
/** Ten-deep backup ring, so a bad save is always recoverable. */
async function backup(name, text) {
  const ring = (await kvGet('backups')) || [];
  ring.unshift({ name, text, at: new Date().toISOString() });
  await kvSet('backups', ring.slice(0, 10));
}

// ---------------------------------------------------------------- banners
function banner(kind, html, sticky) {
  const n = el('div', 'banner ' + kind);
  n.innerHTML = html;
  if (!sticky) {
    const x = el('button', null, 'dismiss');
    x.onclick = () => n.remove();
    n.appendChild(x);
  }
  $('banners').appendChild(n);
  return n;
}
const clearBanners = () => { $('banners').innerHTML = ''; };

// ---------------------------------------------------------------- file access
async function pickFolder() {
  try {
    const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
    S.dir = dir;
    await loadFolder();
    await kvSet('folder', dir);   // after, so a storage failure cannot block opening
  } catch (e) {
    if (e.name !== 'AbortError') banner('err', `<b>Could not open that folder.</b> ${esc(e.message)}`);
  }
}

async function ensureWritable(handle) {
  const opts = { mode: 'readwrite' };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return (await handle.requestPermission(opts)) === 'granted';
}

async function loadFolder() {
  clearBanners();
  S.files = [];
  for await (const [name, h] of S.dir.entries()) {
    if (h.kind === 'file' && name.toLowerCase().endsWith('.md')) S.files.push({ name, handle: h });
  }
  S.files.sort((a, b) => a.name.localeCompare(b.name));

  for (const f of S.files) {
    try {
      const text = await (await f.handle.getFile()).text();
      const d = parseDocument(text);
      f.blocks = countRows(d);
      f.guides = guides(d).length;
    } catch { f.blocks = 0; f.guides = 0; }
  }

  const real = S.files.filter((f) => f.blocks > 0);
  if (!S.files.length) {
    banner('warn', '<b>No markdown files here.</b> Point priority guide at a folder holding a guides file.', true);
    render(); return;
  }
  if (real.length === 1) return openFile(real[0]);
  if (!real.length) {
    banner('warn', '<b>No guides here.</b> These files read fine but hold no content blocks.', true);
  }
  render();
}

async function openFile(f) {
  clearBanners();
  const text = await (await f.handle.getFile()).text();
  const rt = verifyRoundTrip(text);
  S.file = f; S.originalText = text; S.doc = parseDocument(text);
  S.readOnly = !rt.ok; S.dirty = false; S.sel = null; S.editing = null;
  S.guide = guides(S.doc)[0] || null;
  S.captured = 0;

  if (!rt.ok) {
    banner('err', `<b>Read-only.</b> This file did not reproduce byte-for-byte on a test round-trip, `
      + `so priority guide will not write to it. First difference at line <code>${rt.line}</code>.<br>`
      + `in the file <code>${esc(rt.expected)}</code><br>parsed back <code>${esc(rt.produced)}</code>`, true);
  } else if (!S.guide) {
    banner('warn', '<b>No guides in this file.</b> It reads fine, but there are no <code>##</code> guide headings.', true);
  }
  // Two guides with the same name make every route to that name ambiguous.
  const seen = new Set();
  const dupes = [];
  for (const g of guides(S.doc)) {
    const k = g.name.toLowerCase();
    if (seen.has(k)) dupes.push(g.name); else seen.add(k);
  }
  if (dupes.length) {
    banner('warn', `<b>Two guides share a name.</b> Every route to `
      + dupes.map((d) => `<code>${esc(d)}</code>`).join(', ')
      + ' lands on the first one. Rename one of them.', true);
  }
  render();
}

// ---------------------------------------------------------------- save
async function save() {
  if (!S.file || S.readOnly) return;
  // Flush an inline edit that is still focused; leave any open picker alone.
  const a = document.activeElement;
  if (a && a.isContentEditable) a.blur();
  if (!(await ensureWritable(S.file.handle))) {
    banner('err', '<b>Write permission was declined.</b> Chrome needs <b>Edit files</b> for this folder.');
    return;
  }
  const onDisk = await (await S.file.handle.getFile()).text();
  if (onDisk !== S.originalText) {
    const keepMine = confirm('This file changed on disk since you opened it (Obsidian?).\n\n'
      + 'OK = overwrite with your version.\nCancel = discard yours and reload from disk.');
    if (!keepMine) return openFile(S.file);
  }
  const text = serializeDocument(S.doc);
  const rt = verifyRoundTrip(text);
  if (!rt.ok) {
    banner('err', `<b>Refusing to save.</b> The output does not round-trip (line ${rt.line}). Nothing was written.`);
    return;
  }
  await backup(S.file.name, S.originalText);
  const w = await S.file.handle.createWritable();
  await w.write(text); await w.close();

  // Re-parse our own bytes so the model can never drift from the file.
  const keepName = S.guide ? S.guide.name : null;
  const keepSel = S.sel ? renderContentCell(S.sel.content) : null;
  S.originalText = text;
  S.doc = parseDocument(text);
  S.guide = (keepName && findGuide(S.doc, keepName)) || guides(S.doc)[0] || null;
  S.sel = null;
  if (keepSel && S.guide) {
    const hit = rowsOf(S.guide).find((r) => renderContentCell(r.row.content) === keepSel);
    if (hit) S.sel = hit.row;
  }
  S.dirty = false; S.editing = null;
  render();
  const b = banner('info', '<b>Saved.</b>');
  setTimeout(() => b.remove(), 1500);
}

function mark() { S.dirty = true; }

// ---------------------------------------------------------------- helpers
/** Where a row lives, so an edit can mark exactly the right pieces dirty. */
function ctx(row) {
  if (!S.guide) return {};
  for (const { table, section } of tablesOf(S.guide)) {
    if (table.rows.includes(row)) return { table, section };
  }
  return {};
}
function guideOpenCount(g) {
  return openItems(S.doc).filter((i) => i.guide === g.name).length;
}
function isUnknown(v) { return String(v || '').trim() === '??'; }

// ---------------------------------------------------------------- render
function render() {
  document.body.classList.toggle('present', S.present);
  renderBar();
  renderUserBar();
  renderPageHead();
  if (!S.doc) { renderHello(); return; }
  renderRailLeft();
  $('stage').innerHTML = '';
  if (S.view === 'guide') renderGuide();
  else if (S.view === 'flow') renderFlow();
  else if (S.view === 'users') renderUsersView();
  else if (S.view === 'open') renderOpen();
  else renderSource();
  renderRailRight();
  $('cap').hidden = !S.capture;
  if (S.capture) {
    const t = tablesOf(S.guide || {}).slice(-1)[0];
    $('capWhere').textContent = t ? `${S.guide.name} · ${t.section.title}` : '';
    $('capTally').textContent = S.captured ? `${S.captured} added` : '';
  }
}

function renderUserBar() {
  const old = document.getElementById('userbar');
  if (old) old.remove();
  if (!S.userFilter) return;
  const b = el('div');
  b.id = 'userbar';
  b.innerHTML = `Showing only what <b>${esc(S.userFilter)}</b> needs.`;
  const clear = el('button', 'quiet', 'show every guide');
  clear.onclick = () => { S.userFilter = null; render(); };
  b.appendChild(clear);
  $('banners').after(b);
}

function renderBar() {
  $('save').style.display = S.doc ? '' : 'none';
  $('tabs').style.display = S.doc && !S.present ? '' : 'none';
  const f = $('file');
  f.innerHTML = '';
  f.appendChild(icon('folder', 13));
  f.appendChild(el('span', null, S.file ? S.file.name : (S.dir ? S.dir.name : '')));
  $('file').style.display = S.dir ? '' : 'none';
  $('save').disabled = !S.dirty || S.readOnly;
  $('save').className = 'btn' + (S.dirty && !S.readOnly ? ' primary' : '');
  $('save').textContent = S.readOnly ? 'Read-only' : (S.dirty ? 'Save' : 'Saved');
  $('present').classList.toggle('on', S.present);
  $('present').textContent = S.present ? 'Exit' : 'Present';
  $('present').title = S.present ? 'Leave present mode (Esc)' : 'Present (P)';
  $('present').style.display = S.doc ? '' : 'none';

  const tabs = $('tabs');
  tabs.innerHTML = '';
  if (!S.doc) return;
  // In a room, the only things worth showing are the guide and what is still open.
  tabs.style.display = S.present || !S.doc ? 'none' : '';
  $('save').style.display = S.present ? 'none' : '';
  $('file').style.display = S.present || !S.dir ? 'none' : '';
  for (const [k, label] of [['guide', 'Guide'], ['flow', 'Flow'], ['users', 'Users'], ['open', 'Open'], ['source', 'Source']]) {
    const b = el('button', S.view === k ? 'on' : '', label);
    b.onclick = () => { commitEditor(); S.view = k; render(); };
    tabs.appendChild(b);
  }
  const n = openItems(S.doc).length;
  const c = $('open');

  c.title = n ? 'Action items and unanswered questions across every guide' : 'Nothing left open';
}

// ---------------------------------------------------------------- the menu
/**
 * One overflow menu, used by the guides rail, a section and a row.
 *
 * The rule it enforces: a click on a thing does the obvious thing to that thing
 * — navigate to a guide, edit the text you clicked. Everything else it can do
 * lives behind ⋯, in the same place, on every kind of object. Nothing important
 * hides behind knowing which pixel is special.
 */
function menuButton(cls, title) {
  const b = el('button', 'more' + (cls ? ' ' + cls : ''));
  b.innerHTML = '<svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor">'
    + '<circle cx="3.2" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="12.8" cy="8" r="1.4"/></svg>';
  b.title = title || 'More';
  b.setAttribute('aria-label', title || 'More');
  return b;
}

function openMenu(anchor, items) {
  closePop();
  const m = el('div', 'pop menu');
  for (const it of items) {
    if (it.sep) { m.appendChild(el('div', 'msep')); continue; }
    const b = el('button', 'mitem' + (it.danger ? ' danger' : ''));
    b.appendChild(icon(it.glyph || 'other', 13));
    const t = el('div');
    t.appendChild(el('div', 'n', it.label));
    if (it.hint) t.appendChild(el('div', 'h', it.hint));
    b.appendChild(t);
    b.disabled = !!it.disabled;
    b.onclick = () => { closePop(); it.fn(); };
    m.appendChild(b);
  }
  document.body.appendChild(m);
  placePop(m, anchor);
  S.pop = m;
  anchor.classList.add('open');
  m.dataset.owner = '1';
  m.onkeydown = (e) => {
    if (e.metaKey || e.ctrlKey) return;
    e.stopPropagation();
    if (e.key === 'Escape') closePop();
  };
  setTimeout(() => { document.addEventListener('mousedown', popAway); m.querySelector('.mitem').focus(); }, 0);
  return m;
}

/** Everything a guide can do, in the one place a user will look for it. */
function guideMenu(anchor, g, i, total) {
  openMenu(anchor, [
    { glyph: 'edit', label: 'Rename', fn: () => {
      S.guide = g; S.renaming = g; render();
      focusSoon('#railL .g-item.on .n');
    } },
    { glyph: 'up', label: 'Move up', disabled: i === 0,
      fn: () => { if (moveGuide(S.doc, g, -1)) { mark(); render(); } } },
    { glyph: 'down', label: 'Move down', disabled: i === total - 1,
      fn: () => { if (moveGuide(S.doc, g, 1)) { mark(); render(); } } },
    { sep: true },
    { glyph: 'trash', label: 'Delete guide', danger: true, fn: () => {
      const blocks = rowsOf(g).length;
      if (!confirm(`Delete “${g.name}”${blocks ? ` and its ${blocks} block${blocks === 1 ? '' : 's'}` : ''}?`
        + '\n\nAnything routing to it will be reported as pointing nowhere.')) return;
      removeGuide(S.doc, g);
      if (S.guide === g) S.guide = guides(S.doc)[0] || null;
      S.sel = null; mark(); render();
    } }
  ]);
}

// ---------------------------------------------------------------- left rail
function renderRailLeft() {
  const r = $('railL');
  r.innerHTML = '';
  // Which guide you are reading is a Guide-view question. Beside the flow map
  // or the open list it is just a second navigation arguing with the first.
  if (S.view !== 'guide') { r.style.display = 'none'; return; }
  r.style.display = '';
  const filtered = S.userFilter
    ? (userTypes(S.doc).find((u) => u.name === S.userFilter) || { guides: [] }).guides.map((x) => x.guide)
    : null;
  r.appendChild(el('div', 'rail-h', filtered ? S.userFilter : 'Guides'));
  const all = guides(S.doc);
  (filtered || all).forEach((g, gi) => {
    const b = el('div', 'g-item' + (g === S.guide ? ' on' : ''));
    b.tabIndex = 0;
    const nm = el('div', 'n');
    nm.textContent = g.name;
    // Renaming happens on purpose, from the menu — never because a click for
    // navigation happened to land on the words.
    if (!S.readOnly && S.renaming === g) {
      editable(nm, g.name, (v) => { S.renaming = null; if (v) { g.name = v; g.dirtyHeading = true; } });
      nm.addEventListener('blur', () => { if (S.renaming === g) { S.renaming = null; render(); } });
    }
    b.appendChild(nm);
    const n = rowsOf(g).length;
    const o = guideOpenCount(g);
    const m = el('div', 'm');
    m.innerHTML = `${n} block${n === 1 ? '' : 's'}` + (o ? ` · <span class="o">${o} open</span>` : '');
    b.appendChild(m);
    const go = () => {
      if (S.renaming) return;
      commitEditor(); S.guide = g; S.sel = null; S.selSection = null;
      S.shownField = null; S.view = 'guide'; render();
    };
    b.onclick = (e) => { if (e.target.closest('.more,[contenteditable]')) return; go(); };
    b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };

    if (!S.readOnly && !filtered) {
      const more = menuButton('gmore', 'Rename, move or delete this guide');
      more.onclick = (e) => { e.stopPropagation(); guideMenu(more, g, gi, all.length); };
      b.appendChild(more);

      // Reordering is dragging, because that is what a list of things affords.
      b.draggable = true;
      b.ondragstart = (e) => {
        S.dragGuide = g; b.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', g.name);
      };
      b.ondragend = () => {
        S.dragGuide = null;
        document.querySelectorAll('.g-item').forEach((x) => x.classList.remove('dragging', 'dropat', 'dropafter'));
      };
      b.ondragover = (e) => {
        if (!S.dragGuide || S.dragGuide === g) return;
        e.preventDefault();
        const rect = b.getBoundingClientRect();
        const below = e.clientY > rect.top + rect.height / 2;
        b.classList.toggle('dropat', !below);
        b.classList.toggle('dropafter', below);
      };
      b.ondragleave = () => b.classList.remove('dropat', 'dropafter');
      b.ondrop = (e) => {
        e.preventDefault();
        const below = b.classList.contains('dropafter');
        b.classList.remove('dropat', 'dropafter');
        const moving = S.dragGuide;
        if (!moving || moving === g) return;
        const order = guides(S.doc);
        let to = order.indexOf(g) + (below ? 1 : 0);
        if (order.indexOf(moving) < to) to--;
        placeGuide(S.doc, moving, to);
        S.dragGuide = null; mark(); render();
      };
    }
    r.appendChild(b);
  });
  if (filtered) {
    const clear = el('button', 'rail-add', 'Show every guide');
    clear.onclick = () => { S.userFilter = null; render(); };
    r.appendChild(clear);
    return;
  }
  if (S.readOnly) return;
  const add = el('button', 'rail-add', '+  New guide');
  add.onclick = () => {
    const name = prompt('What is this screen called?\n\nUse the name the team uses, including the mode — "Bookings — Manager view".');
    if (!name) return;
    S.guide = addGuide(S.doc, name);
    S.view = 'guide'; mark(); render();
  };
  r.appendChild(add);
}

// ---------------------------------------------------------------- links out
/**
 * A local path cannot be opened from a page served over http, so offering it as
 * a link would hand over something that always fails. Show the path, and copy it
 * on click, which is the thing you actually wanted to do with it.
 */
function outLink(url, label, title) {
  if (isWebUrl(url)) {
    const a = el('a', null, label);
    a.href = url; a.target = '_blank'; a.rel = 'noopener';
    a.title = title || url;
    return a;
  }
  const b = el('button', 'pathlink', label);
  b.title = (title ? title + '\n' : '') + url + '\n\nClick to copy the path — a browser cannot open a local file.';
  b.onclick = (e) => {
    e.stopPropagation(); e.preventDefault();
    navigator.clipboard.writeText(url).then(
      () => { const was = b.textContent; b.textContent = 'path copied'; setTimeout(() => { b.textContent = was; }, 1200); },
      () => banner('warn', '<b>Could not copy.</b> The path is <code>' + esc(url) + '</code>')
    );
  };
  return b;
}

function guideLink(name) {
  return `<a href="#" data-goto="${esc(name)}">${esc(name)}</a>`;
}

/** Turn [handle] into a source link and [[Guide]] into a jump. */
function linkify(text, guide) {
  const frag = document.createDocumentFragment();
  const s = String(text == null ? '' : text);
  const re = /\[\[([^\]]+)\]\]|\[([^\[\]]+)\](?![(:])/g;
  let at = 0; let m;
  while ((m = re.exec(s)) !== null) {
    if (m.index > at) frag.appendChild(document.createTextNode(s.slice(at, m.index)));
    at = m.index + m[0].length;
    if (m[1] !== undefined) {
      const a = el('a', null, m[1]);
      a.href = '#'; a.dataset.goto = m[1];
      frag.appendChild(a);
      continue;
    }
    const h = m[2];
    const def = resolveSource(S.doc, guide, h);
    if (!def) {
      const b = el('span', 'pill dead', h + ' — no source by that name');
      frag.appendChild(b);
      continue;
    }
    frag.appendChild(outLink(def.url, def.title || h, def.title));
  }
  if (at < s.length) frag.appendChild(document.createTextNode(s.slice(at)));
  return frag;
}

function setLinked(node, text, guide) {
  node.textContent = '';
  node.appendChild(linkify(text, guide));
  return node;
}

// ---------------------------------------------------------------- inline editing
/**
 * Everything on a guide is edited where it sits. No forms, no Save — you click
 * the thing and type. Escape puts it back.
 */
function editable(node, current, commit, opts = {}) {
  if (S.readOnly) return node;
  node.contentEditable = 'plaintext-only';
  node.spellcheck = false;
  node.tabIndex = 0;
  node.onfocus = () => {
    if (node.dataset.blank === '1') { node.textContent = ''; node.classList.remove('none', 'empty'); }
  };
  node.onblur = () => {
    const v = node.textContent.trim();
    if (v === current) {
      if (node.dataset.ph && !v) {
        node.textContent = node.dataset.ph;
        node.classList.add(node.dataset.phcls || 'none');
        node.dataset.blank = '1';
      }
      return;
    }
    commit(v);
    mark();
    render();
  };
  node.onkeydown = (e) => {
    // Swallowing every keystroke meant Cmd-S did nothing while you were typing,
    // which is exactly when you want it. Only what this editor handles is
    // stopped; every command chord goes through to the app.
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Escape') {
      e.stopPropagation(); e.preventDefault();
      node.textContent = current; node.blur();
    } else if (e.key === 'Enter' && !opts.multiline) {
      e.stopPropagation(); e.preventDefault(); node.blur();
    } else if (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete'
      || e.key.startsWith('Arrow') || e.key === 'Tab') {
      e.stopPropagation();
    }
  };
  return node;
}

/** Text that reads as a prompt until someone types in it. */
function blankable(node, value, placeholder, cls) {
  node.dataset.ph = placeholder;
  node.dataset.phcls = cls || 'none';
  if (value) { node.textContent = value; return node; }
  node.dataset.blank = '1';
  node.classList.add(cls || 'none');
  node.textContent = S.readOnly || S.present ? '' : placeholder;
  return node;
}

const focusSoon = (sel) => setTimeout(() => {
  const n = typeof sel === 'string' ? document.querySelector(sel) : sel;
  if (!n) return;
  n.focus();
  const r = document.createRange();
  r.selectNodeContents(n);
  r.collapse(false);
  const s = getSelection();
  s.removeAllRanges(); s.addRange(r);
}, 0);

// ---------------------------------------------------------------- page header
/** Which guide you are on, always, without spending the guide's own width on it. */
/** The guides currently in play: a user's set when one is chosen, else all. */
function guidesInScope() {
  if (!S.userFilter) return guides(S.doc);
  const t = userTypes(S.doc).find((u) => u.name === S.userFilter);
  return t ? t.guides.map((x) => x.guide) : guides(S.doc);
}

function stepGuide(dir) {
  const scope = guidesInScope();
  const at = scope.indexOf(S.guide);
  const next = scope[at + dir];
  if (!next) return false;
  commitEditor();
  S.guide = next; S.sel = null; S.shownField = null;
  render();
  $('stage').scrollTop = 0;
  return true;
}

  b.style.transform = dir < 0 ? 'rotate(90deg)' : 'rotate(-90deg)';
  b.title = title;
  b.disabled = !enabled;
  b.onclick = () => stepGuide(dir);

}

  const at = scope.indexOf(g);

    line.appendChild(navBtn('up', -1, at > 0, 'Previous screen'));

  }

    sub.appendChild(el('span', cls || '', txt));
  };
  add(`${n} block${n === 1 ? '' : 's'}`);
