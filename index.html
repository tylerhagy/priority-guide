  if (!g) return;
  commitEditor();
  S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide';
  render();
  $('stage').scrollTop = 0;
}

// ---------------------------------------------------------------- sources
/**
 * A source is a title and a link. Nothing else.
 *
 * The handle the file cites it by is derived and never shown — nobody should
 * have to invent a key to attach a document. Attached here is what this guide
 * relies on; the rest of the file is one click from being attached too.
 */
function newSourceForm(host, onDone, guide) {
  const box = el('div', 'srcform');
  const t = el('input'); t.type = 'text'; t.placeholder = 'What is it? e.g. Deskline brief';
  const u = el('input'); u.type = 'text'; u.placeholder = 'Link or file path';
  const row = el('div', 'srcform-foot');
  const ok = el('button', 'btn primary', 'Add');
  const no = el('button', 'quiet', 'Cancel');
  row.append(ok, no);
  box.append(t, u, row);

  const done = () => {
    const title = t.value.trim();
    const url = u.value.trim();
    if (!url) { u.focus(); return; }
    const entry = addSource(S.doc, { handle: handleFor(title || url, S.doc), url, title });
    if (guide) attachToGuide(guide, entry.handle);
    mark();
    if (onDone) onDone(entry);
    render();
  };
  ok.onclick = done;
  no.onclick = () => { box.remove(); render(); };
  box.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); done(); }
    if (e.key === 'Escape') { e.preventDefault(); box.remove(); render(); }
  };
  host.appendChild(box);
  setTimeout(() => t.focus(), 0);
  return box;
}

function attachToGuide(guide, handle) {
  const cur = (guide.fields.sources || '').trim();
  const have = refsIn(cur);
  if (have.includes(handle)) return;
  setField(guide, 'sources', cur ? `${cur}, [${handle}]` : `[${handle}]`);
}

function detachFromGuide(guide, handle) {
  const left = refsIn(guide.fields.sources || '').filter((h) => h !== handle);
  setField(guide, 'sources', left.map((h) => `[${h}]`).join(', '));
  mark(); render();
}

/** Enough of an address to recognise it. The whole thing stays on the link. */
function shortUrl(u) {
  const raw = String(u || '');
  try {
    const url = new URL(raw);
    const tail = url.pathname.replace(/\/$/, '').split('/').filter(Boolean).pop() || '';
    return url.host.replace(/^www\./, '') + (tail ? '/' + (tail.length > 22 ? tail.slice(0, 21) + '…' : tail) : '');
  } catch {
    const base = raw.split('/').filter(Boolean).pop() || raw;
    return base.length > 32 ? base.slice(0, 31) + '…' : base;
  }
}

// ---------------------------------------------------------------- users
/**
 * Who each guide is for, read sideways.
 *
 * The point is a targeted session: pick the group you have in the room and see
 * exactly which screens apply to them, instead of walking everyone through
 * everything.
 */
function renderUsersView() {
  const stage = $('stage');
  const w = el('div', 'wrap listwrap');
  const types = userTypes(S.doc);

  if (!types.length) {
    const d = el('div', 'done');
    d.innerHTML = 'No user types yet.<span>Add one to a guide&rsquo;s Primary users and it will appear here.</span>';
    w.appendChild(d);
    stage.appendChild(w);
    return;
  }

  const head = el('div', 'listhead');
  head.appendChild(el('h1', 'g-title', types.length + ' user type' + (types.length === 1 ? '' : 's')));
  head.appendChild(el('div', 'blurb',
    'What each group actually needs to look at. Pick one to walk a session through only their screens.'));
  w.appendChild(head);

  // A guide's number is its place in the Open order, so the two views agree on what comes first.
  const rank = new Map();
  let r = 0;
  for (const t of openOrder(S.doc)) for (const g of t.guides) rank.set(g, t.unranked ? null : ++r);

  for (const t of types) {
    const sec = el('section', 'listsec');
    const card = el('div', 'listcard');
    const h = el('div', 'lc-h');
    h.appendChild(el('span', 'lc-name static', t.name));
    const n = t.guides.length;
    h.appendChild(el('span', 'lc-count', n + ' guide' + (n === 1 ? '' : 's')));
    const pres = el('button', 'btn', 'Show only these');
    pres.title = 'Narrow the whole app to this group’s screens. Present from there if you want to.';
    pres.onclick = () => {
      S.userFilter = t.name;
      S.guide = t.guides[0].guide;
      S.view = 'guide'; S.sel = null;
      render();
    };
    h.appendChild(pres);
    card.appendChild(h);

    for (const { guide, primary } of t.guides) {
      const b = el('div', 'lc-row user-row');
      b.setAttribute('role', 'button');
      b.tabIndex = 0;
      const k = rank.get(guide);
      b.appendChild(el('span', 'rk', k ? String(k).padStart(2, '0') : ''));
      const bd = el('span', 'bd');
      const nm = el('span', 'q');
      nm.appendChild(document.createTextNode(guide.name));
      if (primary) nm.appendChild(el('span', 'mainchip', 'Main screen'));
      bd.appendChild(nm);
      const goal = (guide.fields.userGoal || '').trim();
      if (goal && !isUnknown(goal)) bd.appendChild(el('span', 'goal', goal));
      b.appendChild(bd);
      const side = el('span', 'side');
      side.appendChild(el('span', 'bl', rowsOf(guide).length + ' blocks'));
      const open = guideOpenCount(guide);
      if (open) side.appendChild(el('span', 'tp tp-act', open + ' open'));
      b.appendChild(side);
      b.appendChild(el('span', 'go', '›'));
      const go = () => { S.guide = guide; S.view = 'guide'; S.sel = null; render(); };
      b.onclick = go;
      b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } };
      card.appendChild(b);
    }
    sec.appendChild(card);
    w.appendChild(sec);
  }
  stage.appendChild(w);
}

// ---------------------------------------------------------------- flow
/**
 * Every route in the file, drawn. Figma cannot do this: there a link is a node
 * id with no inverse, so nothing knows what points at it. Here the picture is
 * derived from the file on every read, which is why it is always true.
 */
function renderFlow() {
  const stage = $('stage');
  const gs = guides(S.doc);
  if (!gs.length) { stage.appendChild(el('div', 'rail-empty', 'No guides yet.')); return; }
  // Re-resolve by name, not identity: a save re-parses the document, so a
  // selection made before one would otherwise point at a guide object that
  // no longer exists even though the guide itself is still right there.
  if (S.flowSel) S.flowSel = gs.find((g) => g.name === S.flowSel.name) || null;
  else if (S.flowSel === undefined) S.flowSel = S.guide;
  const { routes, references } = links(S.doc);
  const resolved = routes.filter((r) => r.resolved);

  const incoming = new Map(gs.map((g) => [g.name, 0]));
  for (const r of resolved) if (r.from !== r.to) incoming.set(r.to, (incoming.get(r.to) || 0) + 1);

  // Layer by distance from the entry points, so reading left to right is
  // reading the order someone actually moves through the product.
  const depth = new Map();
  const roots = gs.filter((g) => !incoming.get(g.name));
  const queue = (roots.length ? roots : [gs[0]]).map((g) => { depth.set(g.name, 0); return g.name; });
  while (queue.length) {
    const n = queue.shift();
    for (const r of resolved) {
      if (r.from !== n || r.to === n) continue;
      const d = depth.get(n) + 1;
      if (depth.has(r.to) && depth.get(r.to) >= d) continue;
      depth.set(r.to, d);
      queue.push(r.to);
    }
  }
  let maxD = 0;
  for (const g of gs) { if (!depth.has(g.name)) depth.set(g.name, 0); maxD = Math.max(maxD, depth.get(g.name)); }

  const W = 196, H = 54, GX = 96, GY = 26, PAD = 30;
  const cols = [];
  for (let d = 0; d <= maxD; d++) cols[d] = gs.filter((g) => depth.get(g.name) === d);
  const pos = new Map();
  cols.forEach((col, d) => {
    col.forEach((g, i) => pos.set(g.name, { x: PAD + d * (W + GX), y: PAD + i * (H + GY) }));
  });
  const width = PAD * 2 + (maxD + 1) * W + maxD * GX;
  const height = PAD * 2 + Math.max(1, ...cols.map((c) => c.length)) * (H + GY);

  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);

  const defs = document.createElementNS(NS, 'defs');
  defs.innerHTML = '<marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" '
    + 'orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="rgba(16,18,22,.34)"/></marker>'
    + '<marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" '
    + 'orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2563eb"/></marker>';
  svg.appendChild(defs);
  svg.classList.toggle('has-sel', !!S.flowSel);
  svg.onclick = () => { S.flowSel = null; render(); };

  const drawEdge = (from, to, cls) => {
    const a = pos.get(from), b = pos.get(to);
    if (!a || !b) return;
    const hot = S.flowSel && (from === S.flowSel.name || to === S.flowSel.name);
    const p = document.createElementNS(NS, 'path');
    const forward = b.x > a.x;
    const x1 = forward ? a.x + W : a.x;
    const x2 = forward ? b.x : b.x + W;
    const y1 = a.y + H / 2, y2 = b.y + H / 2;
    const dx = Math.max(40, Math.abs(x2 - x1) * 0.5);
    p.setAttribute('d', `M${x1},${y1} C${x1 + (forward ? dx : -dx)},${y1} ${x2 - (forward ? dx : -dx)},${y2} ${x2},${y2}`);
    p.setAttribute('class', 'edge ' + cls + (hot ? ' hot' : ''));
    p.setAttribute('marker-end', hot ? 'url(#ah)' : 'url(#a)');
    p.dataset.from = from;
    p.dataset.to = to;
    svg.appendChild(p);
  };
  for (const r of resolved) if (r.from !== r.to) drawEdge(r.from, r.to, '');
  for (const r of references) if (r.resolved && r.from !== r.to) drawEdge(r.from, r.to, 'ref');

  for (const g of gs) {
    const p = pos.get(g.name);
    const grp = document.createElementNS(NS, 'g');
    grp.setAttribute('class', 'node' + (g === S.flowSel ? ' on' : ''));
    grp.setAttribute('transform', `translate(${p.x},${p.y})`);
    grp.style.cursor = 'pointer';
    const rect = document.createElementNS(NS, 'rect');
    rect.setAttribute('width', W); rect.setAttribute('height', H);
    rect.setAttribute('rx', 10);
    grp.appendChild(rect);
    const t1 = document.createElementNS(NS, 'text');
    t1.setAttribute('x', 13); t1.setAttribute('y', 22);
    t1.textContent = g.name.length > 24 ? g.name.slice(0, 23) + '…' : g.name;
    grp.appendChild(t1);
    const t2 = document.createElementNS(NS, 'text');
    t2.setAttribute('class', 'm');
    t2.setAttribute('x', 13); t2.setAttribute('y', 40);
    t2.textContent = rowsOf(g).length + ' blocks';
    grp.appendChild(t2);
    const open = guideOpenCount(g);
    if (open) {
      const t3 = document.createElementNS(NS, 'text');
      t3.setAttribute('class', 'o');
      t3.setAttribute('x', W - 13); t3.setAttribute('y', 40);
      t3.setAttribute('text-anchor', 'end');
      t3.textContent = open + ' open';
      grp.appendChild(t3);
    }
    // A click picks the card, so its connections light up — it does not
    // leave the map. Going to the guide is what the bar's button is for.
    grp.onclick = (e) => {
      e.stopPropagation();
      S.flowSel = S.flowSel === g ? null : g;
      render();
    };
    svg.appendChild(grp);
  }

  const w = el('div');
  w.style.maxWidth = 'none';
  const box = el('div');
  box.id = 'flow';
  box.appendChild(svg);
  w.appendChild(box);

  const notes = el('div');
  notes.style.cssText = 'margin-top:26px;max-width:620px';
  const dangling = routes.filter((r) => !r.resolved);
  const danglingRefs = references.filter((r) => !r.resolved);
  const un = unreachable(S.doc);
  const say = (label, list, fmt) => {
    if (!list.length) return;
    notes.appendChild(el('div', 'rail-h', label)).style.marginTop = '16px';
    for (const x of list) {
      const p = el('div', 'blk-note');
      p.innerHTML = fmt(x);
      notes.appendChild(p);
    }
  };
  say('Routes that point at no guide in this file', dangling,
    (r) => guideLink(r.from) + ' &rarr; <b>' + esc(r.to) + '</b> &mdash; from &ldquo;' + esc(r.via) + '&rdquo;');
  say('References that point at no guide in this file', danglingRefs,
    (r) => guideLink(r.from) + ' &rarr; <b>' + esc(r.to) + '</b>');
  say('Nothing routes to these', un, (n) => guideLink(n));
  const legend = el('div', 'rail-empty');
  legend.style.marginTop = '22px';
  legend.innerHTML = 'Solid is a route &mdash; the user can get there. '
    + 'Dashed is a reference &mdash; the detail is specified there.';
  notes.appendChild(legend);
  w.appendChild(notes);
  stage.appendChild(w);
}

/**
 * What a picked card is for. The map itself is for looking — a click there
 * only turns a card's connections on, so getting to the guide takes one
 * more, separate action: this bar's button. It sits outside the map's own
 * scroll, the way the palette sits outside the guide's, so it stays in the
 * same place no matter how far the diagram has been panned.
 */
function renderFlowBar() {
  const bar = $('flowbar');
  if (S.view !== 'flow' || !S.flowSel) { bar.hidden = true; bar.innerHTML = ''; return; }
  bar.hidden = false;
  bar.innerHTML = '';
  const g = S.flowSel;
  bar.appendChild(el('span', 'n', g.name));
  bar.appendChild(el('span', 'm', rowsOf(g).length + ' blocks'));
  const open = el('button', 'btn primary', 'Open guide');
  open.title = 'Go to this guide';
  open.onclick = () => { S.guide = g; S.sel = null; S.view = 'guide'; render(); };
  bar.appendChild(open);
  const x = el('button', 'x', '×');
  x.title = 'Clear selection';
  x.onclick = () => { S.flowSel = null; render(); };
  bar.appendChild(x);
}

// ---------------------------------------------------------------- open items
/**
 * The number that is supposed to reach zero. An action is a follow-up to
 * circle back on; a `??` is a question nobody has been asked yet. Both are open,
 * and both say where they came from so they can actually be chased.
 */
/**
 * Everything open, in the order a room should take it.
 *
 * Ranked: guides in the file's Open order (set with the arrows here, saved as a
 * line in the file's intro so everyone sees the same order), and inside each
 * guide decisions first, then answers to find, then what is unclear, then the
 * rest. By guide: the same, in file order. Every item is numbered once, from the
 * full list, so a filter never renumbers anything you have already talked about.
 */
function openList() {
  const tiers = S.openMode === 'ranked' ? openOrder(S.doc) : [{ name: '', guides: guides(S.doc), plain: true }];
  const items = openItems(S.doc).map((it, k) => ({ ...it, k }));
  const out = [];
  let n = 0;
  for (const tier of tiers) {
    const groups = tier.guides.map((g) => {
      const list = items.filter((it) => it.guide === g.name)
        .sort((a, b) => ACTION_ORDER.indexOf(a.type) - ACTION_ORDER.indexOf(b.type) || a.k - b.k);
      list.forEach((it) => { it.n = ++n; it.key = openKey(it); });
      return { guide: g, list };
    });
    out.push({ tier, groups });
  }
  return out;
}
const openKey = (it) => `${it.guide}␟${it.where}␟${it.text}`;
const shownInFilter = (it) => S.openType === 'all' || it.type === S.openType;

/** Split a question from the sources it cites, so the question reads on its own and the sources sit with the details. */
function questionParts(text) {
  const handles = refsIn(text);
  // Sources move to the details; a ^block-id (a task's anchor in the vault) is noise here.
  let q = String(text || '').replace(/(?<!\[)\[([^\[\]]+)\](?![\](:])/g, '').replace(/\s*\^[a-z0-9-]+\b/gi, '');
  q = q.replace(/\s*[—–-]\s*(?=[.,;]|$)/g, '').replace(/(\s*,)+\s*(?=[.;]|$)/g, '').replace(/\s+([.,;:?])/g, '$1').replace(/\s{2,}/g, ' ').trim();
  return { q: capFirst(q), handles };
}

function renderOpen() {
  const stage = $('stage');
  const w = el('div', 'wrap listwrap');
  const all = openItems(S.doc);
  if (!all.length) {
    const d = el('div', 'done');
    d.innerHTML = 'Nothing open.<span>Every action is closed and every question is answered.</span>';
    w.appendChild(d);
    stage.appendChild(w);
    return;
  }

  const head = el('div', 'listhead');
  head.appendChild(el('h1', 'g-title', all.length + ' open'));
  head.appendChild(el('div', 'blurb', S.openMode === 'ranked'
    ? 'In the order to work through them: the guides at the top first, and inside each guide, decisions first.'
    : 'Every open question, in the order the guides appear in the file.'));
  w.appendChild(head);

  const counts = {};
  for (const it of all) counts[it.type] = (counts[it.type] || 0) + 1;
  const bar = el('div', 'fbar');
  bar.appendChild(segmented([['ranked', 'Ranked'], ['guide', 'By guide']], S.openMode, (v) => { S.openMode = v; render(); }));
  bar.appendChild(el('span', 'grow'));
  for (const k of ['all', ...ACTION_ORDER]) {
    const c = k === 'all' ? all.length : counts[k];
    if (!c) continue;
    const b = el('button', 'fpill' + (S.openType === k ? ' on' : ''));
    b.appendChild(document.createTextNode(k === 'all' ? 'All ' : ACTION_LOOK[k].label + ' '));
    b.appendChild(el('b', null, String(c)));
    b.onclick = () => { S.openType = S.openType === k ? 'all' : k; render(); };
    bar.appendChild(b);
  }
  w.appendChild(bar);

  let gn = 0;
  for (const { tier, groups } of openList()) {
    const shown = groups.map((x) => ({ ...x, list: x.list.filter(shownInFilter) }));
    const total = shown.reduce((a, x) => a + x.list.length, 0);
    if (!total && S.openType !== 'all') { gn += groups.length; continue; }
    const sec = el('section', 'listsec');
    if (!tier.plain) {
      const th = el('div', 'listsec-h');
      th.appendChild(el('h2', null, tier.name));
      th.appendChild(el('span', 'n', `${total} question${total === 1 ? '' : 's'}`));
      if (tier.unranked && S.openMode === 'ranked') th.appendChild(el('span', 'hint', 'Use the arrows to put a guide in the order'));
      sec.appendChild(th);
    }
    const card = el('div', 'listcard');
    for (const { guide, list } of shown) {
      gn++;
      if (!list.length && S.openType !== 'all') continue;
      const gh = el('div', 'lc-h');
      gh.appendChild(el('span', 'rk', String(gn)));
      const name = el('button', 'lc-name', guide.name);
      name.title = 'Open this guide';
      name.onclick = () => { S.guide = guide; S.view = 'guide'; S.sel = null; render(); };
      gh.appendChild(name);
      gh.appendChild(el('span', 'lc-count', list.length ? `${list.length} open` : 'Nothing open'));
      if (S.openMode === 'ranked' && !S.readOnly) {
        for (const [dir, glyph, tip] of [[-1, '↑', 'Earlier in the order'], [1, '↓', 'Later in the order']]) {
          const b = el('button', 'lc-mv', glyph);
          b.title = tip;
          b.setAttribute('aria-label', `${tip}: ${guide.name}`);
          b.onclick = () => { if (moveInOrder(S.doc, guide, dir)) { mark(); render(); } };
          gh.appendChild(b);
        }
      }
      card.appendChild(gh);
      for (const it of list) card.appendChild(openRow(it, guide));
    }
    sec.appendChild(card);
    w.appendChild(sec);
  }
  stage.appendChild(w);
}

/** One open question: its number, its kind, the question, then where it lives, who it waits on and what it cites. */
function openRow(it, guide) {
  const b = el('div', 'lc-row open-row');
  b.setAttribute('role', 'button');
  b.tabIndex = 0;
  b.dataset.key = it.key;
  b.appendChild(el('span', 'rk', String(it.n).padStart(2, '0')));
  b.appendChild(actionLabel(it.type));
  const { q, handles } = questionParts(it.question);
  const bd = el('span', 'bd');
  const qq = el('span', 'q');
  qq.appendChild(linkify(q, guide));
  bd.appendChild(qq);
  const mt = el('span', 'mt');
  mt.appendChild(el('span', 'wh', it.where.replace(' · ', ' › ')));
  for (const who of ownersIn(S.doc, it.question)) mt.appendChild(el('span', 'who', who));
  if (handles.length) {
    const src = el('span', 'src');
    handles.forEach((h, k) => {
      if (k) src.appendChild(document.createTextNode(', '));
      const def = resolveSource(S.doc, guide, h);
      src.appendChild(def ? outLink(def.url, h, def.title) : document.createTextNode(h));
    });
    mt.appendChild(src);
  }
  bd.appendChild(mt);
  b.appendChild(bd);
  b.appendChild(el('span', 'go', '›'));
  b.onclick = (e) => { if (!e.target.closest('a,.pathlink')) landOn(it); };
  b.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); landOn(it); } };
  return b;
}

/** From an open question to where it lives: the guide, the block selected with its lanes open, the note itself ringed. */
function landOn(it) {
  S.guide = findGuide(S.doc, it.guide);
  S.view = 'guide';
  const row = it.target && it.target.kind === 'row' ? it.target : null;
  if (row) { S.sel = row; S.editing = null; S.openNotes.add(row); S.shownField = null; }
  else { S.sel = null; S.shownField = it.field || null; }
  render();
  if (row) {
    const item = [...document.querySelectorAll('#stage .guide .item')].find((n) => n._rw === row);
    if (!item) return;
    item.scrollIntoView({ block: 'center' });
    const cell = item.closest('.cell');
    const lane = cell && notesLaneOf(cell);
    const notes = lane ? lane.querySelectorAll('.note') : [];
    const k = it.note ? row.note.indexOf(it.note) : -1;
    pulse(item.querySelector('.box'), k > -1 ? notes[k] : null);
  } else if (it.field) {
    const dd = document.querySelector(`.g-fields dd[data-key="${it.field}"]`);
    if (dd) { dd.scrollIntoView({ block: 'center' }); pulse(dd); }
  }
}


// ---------------------------------------------------------------- fields view
/** Jump to a block in the guide view, selected and in sight. */
function gotoRow(guide, row) {
  S.guide = guide; S.view = 'guide'; S.sel = row; S.shownField = null;
  render();
  const on = $('stage').querySelector('.rowsel');
  if (on) on.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

/**
 * The data side of the guides: every object, every field it holds, and every
 * block on every guide that shows it. The question it answers is the one the
 * guide view cannot — where is this used, and does every screen agree on it.
 */
function renderFields() {
  const stage = $('stage');
  const w = el('div', 'wrap fwrap');
  const head = el('div');
  head.style.cssText = 'margin-bottom:18px';
  head.appendChild(el('h1', 'g-title', 'Fields'));
  w.appendChild(head);

  if (!S.fdoc) {
    const d = el('div', 'done');
    d.innerHTML = S.ffile
      ? `Could not read <b>${esc(S.ffile.name)}</b>.`
      : 'No fields file in this folder yet.<span>A fields file lists each object (Opportunity, Customer, Interaction), the fields it holds, '
        + 'their backend names and allowed values. Guide blocks can then point at a field, and this view shows where each one is used.</span>';
    w.appendChild(d);
    if (!S.ffile && !S.readOnly) {
      const b = el('button', 'btn primary', 'Start the fields file');
      b.style.marginTop = '14px';
      b.onclick = createFieldsFile;
      w.appendChild(b);
    }
    stage.appendChild(w);
    return;
  }

  const u = fieldUsage(S.doc, S.fdoc);
  const objects = guides(S.fdoc);
  const linked = [...u.used.values()].reduce((n, l) => n + l.length, 0);
  const unused = [...u.index.values()].filter((f) => !u.used.has(f.ref.toLowerCase()));
  const mism = [...u.used.values()].flat().filter((x) => x.mismatch.length);
  head.appendChild(el('div', 'blurb',
    `${objects.length} object${objects.length === 1 ? '' : 's'} · ${u.index.size} field${u.index.size === 1 ? '' : 's'} in ${S.ffile.name}. `
    + `${linked} block${linked === 1 ? '' : 's'} on this file's guides point at a field; ${u.unlinked.length} do not.`));

  // Filters: everything, only what no screen uses, only what disagrees.
  const bar = el('div', 'fbar');
  for (const [k, label, n] of [['all', 'All fields', u.index.size], ['unused', 'Not on any screen', unused.length],
    ['issues', 'Values disagree', mism.length]]) {
    const b = el('button', 'fpill' + (S.fieldFilter === k ? ' on' : ''), `${label} ${n}`);
    b.onclick = () => { S.fieldFilter = k; render(); };
    bar.appendChild(b);
  }
  if (fieldsEditable()) {
    const add = el('button', 'btn', '+ Object');
    add.onclick = async () => {
      const name = await askText({ title: 'New object', body: 'A thing the system holds: Opportunity, Customer, Interaction.', placeholder: 'Object name', action: 'Add' });
      if (!name) return;
      if (objects.some((g) => g.name.toLowerCase() === name.toLowerCase())) { toast(`${name} already exists`); return; }
      addObject(S.fdoc, name); markFields(); render();
    };
    bar.appendChild(add);
  }
  w.appendChild(bar);

  const edit = fieldsEditable();
  const cell = (cls, value, placeholder, commit) => {
    const c = el('div', 'fc ' + cls);
    if (isUnknown(value)) { c.textContent = value; c.classList.add('unk'); }
    else blankable(c, value, edit ? placeholder : '', 'none');
    if (edit) editable(c, value, (v) => { commit(v); markFields(); });
    return c;
  };

  for (const g of objects) {
    const rows = [...u.index.values()].filter((f) => f.guide === g);
    const shown = rows.filter((f) => {
      const uses = u.used.get(f.ref.toLowerCase()) || [];
      if (S.fieldFilter === 'unused') return !uses.length;
      if (S.fieldFilter === 'issues') return uses.some((x) => x.mismatch.length);
      return true;
    });
    if (S.fieldFilter !== 'all' && !shown.length) continue;
    const sec = el('div', 'sec fsec');
    const h = el('div', 'fobj');
    h.appendChild(el('h2', 'fobj-n', g.name));
    h.appendChild(el('span', 'fobj-c', `${rows.length} field${rows.length === 1 ? '' : 's'}`));
    if (edit) {
      const add = el('button', 'btn quiet', '+ Field');
      add.onclick = async () => {
        const label = await askText({ title: `New field on ${g.name}`, body: 'What the screen calls it.', placeholder: 'Label', action: 'Add' });
        if (!label) return;
        addFieldTo(S.fdoc, g.name, label, { backend: '??' }); markFields(); render();
      };
      h.appendChild(add);
    }
    sec.appendChild(h);

    const grid = el('div', 'fgrid');
    for (const t of ['Label', 'Backend', 'Kind', 'Values', 'Definition', 'Used in']) grid.appendChild(el('div', 'fh', t));
    if (!shown.length) {
      const e = el('div', 'fempty', edit ? 'No fields yet. Add one, or link one from a block on a guide.' : 'No fields yet.');
      grid.appendChild(e);
    }
    for (const f of shown) {
      const touch = () => { f.row.dirty = true; f.table.dirty = true; f.section.dirty = true; };
      grid.appendChild(cell('lbl', f.label, 'Label', (v) => {
        if (!v) return;
        const before = f.ref;
        f.row.content = { ...f.row.content, text: v }; touch();
        // Renaming a field renames it on every block in this guides file that points at it.
        const after = fieldRef(g.name, v);
        for (const x of u.used.get(before.toLowerCase()) || []) setRowField(x.row, x.table, x.section, after);
      }));
      grid.appendChild(cell('mono', f.row.backend, 'Backend name', (v) => { f.row.backend = v; touch(); }));
      const kind = el('div', 'fc kind');
      if (edit) {
        const sel = el('select');
        for (const k of ['', ...FIELD_KINDS]) {
          const o = el('option', null, k || '—'); o.value = k;
          if ((f.row.fkind || '') === k) o.selected = true;
          sel.appendChild(o);
        }
        sel.onchange = () => { f.row.fkind = sel.value; touch(); markFields(); render(); };
        kind.appendChild(sel);
      } else kind.textContent = f.row.fkind || '';
      grid.appendChild(kind);
      grid.appendChild(cell('vals', f.row.values, 'Values, comma-separated, or the format', (v) => { f.row.values = v; touch(); }));
      grid.appendChild(cell('def', f.row.definition, 'What it means', (v) => { f.row.definition = v; touch(); }));

      const used = el('div', 'fc used');
      const uses = u.used.get(f.ref.toLowerCase()) || [];
      if (!uses.length) used.appendChild(el('span', 'none', 'Not on any screen'));
      for (const x of uses) {
        const b = el('button', 'fuse' + (x.mismatch.length ? ' off' : ''));
        b.textContent = `${x.guide.name} › ${(x.row.content.text || '').trim() || '(unnamed)'}`;
        b.title = `${x.guide.name} · ${x.section.title}`
          + (x.row.realData ? `\nShows: ${x.row.realData}` : '')
          + (x.mismatch.length ? `\nNot allowed by this field: ${x.mismatch.join(', ')}` : '');
        b.onclick = () => gotoRow(x.guide, x.row);
        used.appendChild(b);
      }
      grid.appendChild(used);
    }
    sec.appendChild(grid);
    w.appendChild(sec);
  }

  // Blocks that name a field nobody has defined, then blocks with none at all.
  if (u.unresolved.length && S.fieldFilter === 'all') {
    const sec = el('div', 'sec fsec');
    sec.appendChild(el('h2', 'fobj-n', 'Blocks pointing at a field that does not exist'));
    for (const x of u.unresolved) {
      const b = el('button', 'oi unk');
      b.appendChild(el('div', 't', `${x.ref}`));
      b.appendChild(el('div', 'w', `${x.guide.name}  ·  ${x.section.title}  ·  ${(x.row.content.text || '').trim()}`));
      b.onclick = () => gotoRow(x.guide, x.row);
      sec.appendChild(b);
    }
    w.appendChild(sec);
  }
  if (u.unlinked.length && S.fieldFilter === 'all') {
    const sec = el('div', 'sec fsec');
    sec.appendChild(el('h2', 'fobj-n', `Blocks not linked to a field · ${u.unlinked.length}`));
    sec.appendChild(el('div', 'blurb', 'Fine while a block is still conceptual. Select one on its guide and press Link a field.'));
    const byGuide = new Map();
    for (const x of u.unlinked) {
      if (!byGuide.has(x.guide)) byGuide.set(x.guide, []);
      byGuide.get(x.guide).push(x);
    }
    for (const [gd, list] of byGuide) {
      const line = el('div', 'funl');
      line.appendChild(el('span', 'g', gd.name));
      for (const x of list) {
        const b = el('button', 'fuse quiet', (x.row.content.text || '').trim() || '(unnamed)');
        b.onclick = () => gotoRow(gd, x.row);
        line.appendChild(b);
      }
      sec.appendChild(line);
    }
    w.appendChild(sec);
  }
  stage.appendChild(w);
}

// ---------------------------------------------------------------- source
function renderSource() {
  const stage = $('stage');
  const w = el('div');
  w.style.maxWidth = '980px';
  const pre = el('div');
  pre.id = 'src';
  pre.textContent = S.doc ? serializeDocument(S.doc) : '';
  w.appendChild(pre);
  const note = el('div', 'rail-empty');
  note.style.marginTop = '14px';
  note.textContent = 'This is the file. It is the source of truth — the guide above is a render of it.';
  w.appendChild(note);
  stage.appendChild(w);
}

// ---------------------------------------------------------------- moving blocks
/** The table a row sits in, and where it sits, within the current guide. */
function whereIs(g, row) {
  const ts = tablesOf(g);
  for (let i = 0; i < ts.length; i++) {
    const j = ts[i].table.rows.indexOf(row);
    if (j !== -1) return { tables: ts, ti: i, ri: j };
  }
  return null;
}

/** Move a block one position, crossing into the next group when it runs out. */
function nudge(dir) {
  if (!S.guide || !S.sel || S.readOnly) return;
  commitEditor();
  if (moveRow(S.guide, S.sel, dir, true)) { mark(); render(); keepVisible(); }
}

/** Move a block straight into the group above or below. */
function jumpGroup(dir) {
  if (!S.guide || !S.sel || S.readOnly) return;
  commitEditor();
  const w = whereIs(S.guide, S.sel);
  if (!w) return;
  const next = w.tables[w.ti + dir];
  if (!next) return;
  const here = w.tables[w.ti];
  here.table.rows.splice(w.ri, 1);
  here.table.dirty = true; here.section.dirty = true;
  next.table.rows.splice(dir > 0 ? 0 : next.table.rows.length, 0, S.sel);
  next.table.dirty = true; next.section.dirty = true;
  if (JSON.stringify(next.table.cols.names) !== JSON.stringify(here.table.cols.names)) S.sel.dirty = true;
  mark(); render(); keepVisible();
}

/** Move the selection, not the block. */
function step(dir) {
  if (!S.guide) return;
  const rows = rowsOf(S.guide).map((r) => r.row);
  if (!rows.length) return;
  const i = rows.indexOf(S.sel);
  S.sel = rows[Math.max(0, Math.min(rows.length - 1, (i === -1 ? 0 : i + dir)))];
  render(); keepVisible();
}

function keepVisible() {
  const on = document.querySelector('.blk.on');
  if (on) on.scrollIntoView({ block: 'nearest' });
}

// ---------------------------------------------------------------- capture
/**
 * A stakeholder talks faster than a six-field form can be filled. So capture
 * takes one line at a time and nothing else; the fields get set afterwards,
 * alone, when there is time to think about them.
 */
function captureTarget() {
  if (!S.guide) return null;
  const ts = tablesOf(S.guide);
  if (!ts.length) return null;
  if (S.sel) {
    const w = whereIs(S.guide, S.sel);
    if (w) return w.tables[w.ti];
  }
  return ts[ts.length - 1];
}

function toggleCapture(on) {
  if (S.readOnly) return;
  S.capture = on === undefined ? !S.capture : on;
  if (!S.capture) S.captured = 0;
  render();
  if (S.capture) setTimeout(() => $('capIn').focus(), 0);
}

function captureLine(text) {
  const t = captureTarget();
  if (!t) {
    banner('warn', '<b>Nowhere to put it.</b> This guide has no section yet.');
    return;
  }
  const row = addRow(t.table, t.section, { content: text });
  S.sel = row;
  S.captured++;
  mark(); render();
  keepVisible();
}

// ---------------------------------------------------------------- keyboard
const typing = (e) => {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
};

document.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); return; }

  if (e.key === 'Escape') {
    if (S.scrim) { const f = S.scrim; S.scrim = null; f(); return; }
    if (S.pop) { closePop(); return; }
    // Reading mode has no edit controls, so there is nothing else Escape could
    // mean here. It used to queue behind a selection and a caret, which is why
    // leaving took several presses and people reloaded the page instead.
    if (S.present) { S.present = false; render(); return; }
    if (S.beside) { S.beside = null; render(); return; }
    if (document.activeElement && document.activeElement.isContentEditable) {
      document.activeElement.blur();
      return;
    }
    if (S.sel) { letGo(); return; }
    if (S.capture) { toggleCapture(false); return; }
    return;
  }

  if (typing(e)) return;

  if (S.present && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
    e.preventDefault();
    stepGuide(e.key === 'ArrowRight' ? 1 : -1);
    return;
  }
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    if (S.view !== 'guide') return;
    e.preventDefault();
    step(e.key === 'ArrowDown' ? 1 : -1);
    return;
  }


  const k = e.key.toLowerCase();
  const mod = e.metaKey || e.ctrlKey || e.altKey;
  if (!mod && k === 'p') { S.present = !S.present; S.editing = null; render(); }
  else if (!mod && k === 'c') { toggleCapture(); }
  else if (!mod && k === 's') { commitEditor(); S.view = 'source'; render(); }
  else if (!mod && k === 'g') { commitEditor(); S.view = 'guide'; render(); }
  else if (!mod && k === 'f') { commitEditor(); S.view = 'flow'; render(); }
  else if (!mod && k === 'u') { commitEditor(); S.view = 'users'; render(); }
  else if (!mod && k === 'o') { commitEditor(); S.view = 'open'; render(); }
  else if (!mod && k === 'd') { commitEditor(); S.view = 'fields'; render(); }
  else if ((e.metaKey || e.ctrlKey) && (k === '=' || k === '+')) { e.preventDefault(); stepZoom(1); }
  else if ((e.metaKey || e.ctrlKey) && k === '-') { e.preventDefault(); stepZoom(-1); }
  else if ((e.metaKey || e.ctrlKey) && k === '0') { e.preventDefault(); setZoom(1); renderPageHead(); }
  else if (!mod && k === 'k') {
    // Comments live on a guide, so K goes there — and shows the markers, since
    // asking for comments and not seeing them on the page is never the intent.
    if (S.view !== 'guide') S.view = 'guide';
    if (S.panel === 'comments' && S.comments) { S.comments = false; S.panel = 'context'; }
    else { S.panel = 'comments'; S.comments = true; }
    render();
  }
});

// ---------------------------------------------------------------- wiring
$('file').onclick = () => (S.dir ? fileMenu($('file')) : pickFolder());
$('save').onclick = save;
$('discard').onclick = discard;
$('present').onclick = () => { S.present = !S.present; S.editing = null; render(); };
$('theme').onclick = cycleTheme;
applyTheme();
$('capDone').onclick = () => toggleCapture(false);
$('capIn').onkeydown = (e) => {
  if (e.key === 'Enter') {
    const v = $('capIn').value.trim();
    if (!v) { toggleCapture(false); return; }
    captureLine(v);
    $('capIn').value = '';
    setTimeout(() => $('capIn').focus(), 0);
  } else if (e.key === 'Escape') {
    toggleCapture(false);
  }
};

/**
 * Letting go of a row, without re-rendering.
 *
 * Re-rendering on the way out is what made this fragile: it tore the element
 * out from under a click that was still in flight, so the old handler had to
 * exempt every button and field — and that left the row held whenever you
 * pressed anything else on the page. Taking the classes and the strip off by
 * hand is safe from anywhere, so nothing has to be exempt.
 */
function letGo() {
  S.newRowNote = null;
  if (!S.sel) return;
  S.sel = null;
  $('stage').querySelectorAll('.rowstrip').forEach((n) => n.remove());
  $('stage').querySelectorAll('.rowsel').forEach((n) => n.classList.remove('rowsel'));
}

/**
 * Pressing anywhere outside the row you are holding lets go of it, and takes
 * the caret out of whatever field you were in. Overlays are exempt because they
 * sit on top of the page and manage their own dismissal.
 */
document.addEventListener('mousedown', (e) => {
  if (!S.doc) return;
  const t = e.target;
  if (t.closest('.pop,.scrim,.toast')) return;
  if (t.closest('.rowsel')) return;

  const active = document.activeElement;
  if (active && active.isContentEditable && active !== t && !active.contains(t)) active.blur();
  letGo();
});

// A link to another guide, wherever it appears, goes there.
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-goto]');
  if (!a) return;
  e.preventDefault();
  const g = findGuide(S.doc, a.dataset.goto);
  if (!g) return;
  commitEditor();
  S.guide = g; S.sel = null; S.shownField = null; S.view = 'guide';
  render();
  $('stage').scrollTop = 0;
});

window.addEventListener('beforeunload', (e) => {
  if (!S.dirty) return;
  e.preventDefault();
  e.returnValue = '';
});

/**
 * Guide names and user types, so picking one is a pick rather than a spelling
 * test. A typed-again user type is how one group silently becomes two.
 */
function datalist(id, values) {
  let dl = document.getElementById(id);
  if (!dl) {
    dl = document.createElement('datalist');
    dl.id = id;
    document.body.appendChild(dl);
  }
  dl.innerHTML = '';
  for (const v of values) {
    const o = document.createElement('option');
    o.value = v;
    dl.appendChild(o);
  }
}

function syncNames() {
  if (!S.doc) { datalist('guidenames', []); datalist('usertypes', []); return; }
  datalist('guidenames', guides(S.doc).map((g) => g.name));
  datalist('usertypes', userTypes(S.doc).map((u) => u.name));
}
const baseRender = render;
render = function () { baseRender(); syncNames(); };

// ---------------------------------------------------------------- boot
(async function boot() {
  if (typeof window.showDirectoryPicker !== 'function') {
    banner('err', '<b>This browser cannot open local folders.</b> Use Chrome, Edge, Arc or Brave.');
    return;
  }
  if (location.protocol === 'file:') {
    banner('err', '<b>Opened as a file, not over http.</b> Run <code>./serve.sh</code> and open <code>http://localhost:8044</code>.');
    return;
  }
  const saved = await kvGet('folder');
  if (saved) {
    try {
      if ((await saved.queryPermission({ mode: 'readwrite' })) === 'granted') {
        S.dir = saved;
        await loadFolder();
        return;
      }
    } catch { /* the grant has lapsed; fall through to the picker */ }
  }
  render();
})();
</script>
